<!doctype html>
<html><head><meta charset="utf-8"><title>JS attr local (patch 310)</title>
<style>.hot{color:red}
  [data-flag]{color:green}</style>
</head><body>
<div id="big"></div>
<div id="res"></div><div id="sum"></div>
<script>
/* Patch 310 gate page (doc 20 stage 2). Non-class setAttribute on attributes
 * no stylesheet references must be answered locally; a setAttribute on an
 * attribute a stylesheet DOES reference must decline by kind.
 * Correctness is read back from the page's own DOM. */
function $(id){return document.getElementById(id);}
var N=10,i,h='';
for(i=0;i<N;i++)h+='<div><span id="s'+i+'" data-x="'+i+'">t'+i+'</span></div>';
var big=$('big'),T=[];
function t(n,ok,msg){T.push((ok?'PASS':'FAIL')+' '+n+' '+msg);}
document.addEventListener('DOMContentLoaded',function(){
  big.innerHTML=h;
  /* Priming burst absorbs the post-innerHTML settling window (see
   * JS-batch-burst.html). */
  setTimeout(function(){
    var k;
    for(k=0;k<3;k++){$('s'+k).setAttribute('data-p','prime');}
    setTimeout(function(){
      try {
      /* Phase A: 60 setAttributes on data-x, which no stylesheet rule
       * references. Must be answered locally: no full reconvert. */
      var M=5,j,ok=true;
      for(j=0;j<M;j++){$('s'+(3+j)).setAttribute('data-x','A'+j);}
      for(j=0;j<M;j++){
        var e=$('s'+(3+j));
        if(!e||e.getAttribute('data-x')!=='A'+j)ok=false;
      }
      t(1,ok,'phase A attrs landed');
      /* Phase B: set data-flag, which the static stylesheet references
       * via [data-flag]. The kind gate must decline: full reconvert,
       * kind=1. */
      $('s'+8).setAttribute('data-flag','1');
      var ok2=$('s'+8).getAttribute('data-flag')==='1';
      t(2,ok2,'phase B attr landed');
      t(3,ok&&ok2,'attrs intact');
      var np=T.filter(function(x){return x.indexOf('PASS')===0;}).length;
      $('sum').textContent='ATTRLCL: '+np+'/'+T.length+' passed';
      $('res').innerHTML='<p>'+T.join('</p><p>')+'</p>';
      } catch(ex){ $('sum').textContent='ATTRLCL ERR '+ex; }
    },1500);
  },2500);
});
</script></body></html>
