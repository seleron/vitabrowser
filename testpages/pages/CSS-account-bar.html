<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS account bar (script not run)</title>
<style>
body, html { margin: 0; padding: 0; }
body { font-family: sans-serif; font-size: 10pt; background: #fff; }
header { display: flex; height: 48px; width: 100%; background: #eef; }
.spacer { flex: 1 0 auto; }
#menu { padding: 12px 16px; }
/* google.com's account bar, reduced (og.css). Class names differ only in
   case: .ab_E must NOT match class="ab_e" in a standards-mode document. */
.ab_Ra { min-width: 160px; position: relative; }
.ab_Nd { height: 48px; }
.ab_E { position: absolute; top: 12px; right: 10px; display: flex; }
.ab_2d { height: 48px; align-items: center; display: flex; white-space: nowrap; }
.ab_be { box-sizing: border-box; padding: 0 4px; flex: 0 0 auto; justify-content: flex-end; }
.ab_Nd .ab_be { float: right; padding-left: 32px; }
.ab_Nd .ab_be.ab_ee { padding-left: 0; }
.ab_Md { position: relative; float: right; height: 64px; }
.apps { display: inline-block; width: 48px; height: 48px; background: #ccc; vertical-align: top; margin-top: 8px; }
.signin { display: inline-block; box-sizing: border-box; height: 40px; padding: 9px 23px; line-height: 22px; background: #0b57d0; color: #fff; margin: 12px 20px 0 10px; vertical-align: top; }
#made .ab_e { color: rgb(0, 128, 0); }
#made .ab_E { color: rgb(255, 0, 0); }
#res { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; font-size: 12px; }
#res p { margin: 1px 0; padding: 1px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
</style>
</head>
<body>
<!-- Patch 182 (libdom): google.com's Sign-in button sat below the header
     row and past its right edge. Google sets innerHTML while the page
     parses; libdom's fragment parser starts in the "initial" insertion
     mode, sees no doctype and set QUIRKS mode -- on the live document.
     Quirks mode matches class selectors case-insensitively, so og.css's
     .gb_E {position: absolute; top: 12px; right: 10px; display: flex}
     took the account bar (class gb_e): absolute, out of the header's flow,
     its container 0px wide. The bar's flex row then centres a 64px item
     in 48px: Chromium lets it overflow both ways (align-items: center is
     unsafe), we pinned it to the top. Each expected value is Chromium's.
     1: after innerHTML the page is still in standards mode: .ab_E does
        not match class="ab_e" (the bar stays position: relative, block).
     2: the same for elements innerHTML made (and .ab_E still matches
        class="ab_E").
     3: the bar is in flow: its container is as wide as the bar, at the
        header's right edge.
     4: a 64px item centred in a 48px flex row starts 8px above it.
     5: the Sign-in button is inside the header row: 4px from its top,
        24px from its right (4px row padding, 20px margin). -->
<div id="made"></div>
<script>
/* what google does before its header is parsed */
document.getElementById('made').innerHTML = '<span id="m1" class="ab_e">made e</span> <span id="m2" class="ab_E">made E</span>';
</script>
<header id="hdr">
  <div id="menu"><span style="display:inline-block;width:24px;height:24px;background:#888"></span></div>
  <div class="spacer"></div>
  <div id="acct"><div><div id="bar" class="ab_Ra ab_Nd ab_e"><div id="row" class="ab_be ab_2d ab_ee"><div id="md" class="ab_Md"><span class="apps"></span><a class="signin" id="si">Sign in</a></div></div></div></div></div>
</header>
<div id="res">
<p id="sum" class="wait">ACCTBAR: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
</div>
<script>
window.addEventListener('load', function () {
	function $(id) { return document.getElementById(id); }
	function R(id) { return $(id).getBoundingClientRect(); }
	function cs(id, p) { return String(getComputedStyle($(id))[p]).replace(/\s+/g, ''); }
	var h = R('hdr'), acct = R('acct'), bar = R('bar'), row = R('row'), md = R('md'), si = R('si');
	var res = [
		[cs('bar', 'position') === 'relative' && cs('bar', 'display') === 'block',
			'bar ' + cs('bar', 'position') + ' ' + cs('bar', 'display')],
		[cs('m1', 'color') === 'rgb(0,128,0)' && cs('m2', 'color') === 'rgb(255,0,0)',
			'made ab_e ' + cs('m1', 'color') + ', ab_E ' + cs('m2', 'color')],
		[Math.abs(acct.width - bar.width) <= 1 && bar.width >= 160 && Math.abs(bar.right - h.right) <= 1 && Math.abs(bar.top - h.top) <= 1,
			'container ' + Math.round(acct.width) + 'px, bar ' + Math.round(bar.left) + '-' + Math.round(bar.right) + ' top ' + Math.round(bar.top) + ' of header 0-' + Math.round(h.right)],
		[Math.abs(md.top - (row.top - 8)) <= 1 && Math.abs(md.height - 64) <= 1,
			'64px item in a ' + Math.round(row.height) + 'px row at ' + Math.round(md.top - row.top)],
		[Math.abs(si.right - (h.right - 24)) <= 1 && Math.abs(si.top - h.top - 4) <= 1 && si.bottom <= h.bottom,
			'sign-in ' + Math.round(si.left) + '-' + Math.round(si.right) + ', ' + Math.round(si.top - h.top) + '-' + Math.round(si.bottom - h.top) + ' in the row']
	], k = 0;
	for (var i = 0; i < res.length; i++) {
		var p = $('r' + (i + 1));
		p.textContent = (i + 1) + ' ' + res[i][1] + (res[i][0] ? '' : ' FAIL');
		if (res[i][0]) { p.className = 'pass'; k++; }
	}
	$('sum').textContent = 'ACCTBAR: ' + k + '/5 passed';
	document.title = 'CSS account bar (' + k + '/5)';
});
</script>
</body></html>
