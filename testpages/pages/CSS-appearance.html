<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS appearance (script not run)</title>
<style>
body, html { margin: 0; padding: 0; }
body { font-family: sans-serif; font-size: 10pt; background: #fff; }
/* fixes1184: -webkit-appearance is read as appearance; the legacy widget
   names (button/textfield/...) are read as auto. Each case below is what
   the scorecard's 13-20 webkit-flavoured sites actually declare. */
.ndef { }
.dnone { -webkit-appearance: none; background: #0b57d0; color: #fff; }
.dlegacy { -webkit-appearance: button; }
.dtextfield { -webkit-appearance: textfield; }
.dunpref { appearance: none; }
.dunknown { -webkit-appearance: nonsense-value; background: #0b57d0; }
.row { height: 20px; line-height: 20px; margin: 1px 0; }
#res { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; font-size: 12px; }
#res p { margin: 1px 0; padding: 1px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
</style>
</head>
<body>
<!-- Patch 184 (libcss): the single most-dropped CSS declaration in the
     scorecard was `-webkit-appearance: none` (13 of 20 sites); the legacy
     widget names (`button`, `textfield`, ...) dropped a further 4. libcss
     accepted neither the prefixed name nor the legacy values, so every
     webkit-flavoured form control's appearance declaration was dropped at
     parse. The prefixed name is now an alias for `appearance` and the
     legacy set reads as `auto`.
     1: default is auto.
     2: -webkit-appearance: none computes to none.
     3: -webkit-appearance: button (legacy) computes to auto.
     4: -webkit-appearance: textfield (legacy) computes to auto.
     5: unprefixed appearance: none still computes to none (no regression).
     6: an unrecognised value drops (the declaration is invalid), so the
        element stays at its initial auto. -->
<div id="a" class="row ndef">a</div>
<div id="b" class="row dnone">b</div>
<div id="c" class="row dlegacy">c</div>
<div id="d" class="row dtextfield">d</div>
<div id="e" class="row dunpref">e</div>
<div id="f" class="row dunknown">f</div>
<div id="res">
<p id="sum" class="wait">APPEAR: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p><p id="r6" class="wait">6 waiting</p>
</div>
<script>
window.addEventListener('load', function () {
	function $(id) { return document.getElementById(id); }
	function ap(id) { return String(getComputedStyle($(id)).appearance); }
	function mark(n, ok, msg) {
		var p = $('r' + n);
		p.className = ok ? 'pass' : 'wait';
		p.textContent = n + (ok ? ' ok' : ' FAIL ' + msg);
	}
	var got1 = ap('a'), got2 = ap('b'), got3 = ap('c'),
	    got4 = ap('d'), got5 = ap('e'), got6 = ap('f');
	var r = [
		[got1 === 'auto', 'a ' + got1 + ' (want auto)'],
		[got2 === 'none', 'b ' + got2 + ' (want none)'],
		[got3 === 'auto', 'c ' + got3 + ' (want auto)'],
		[got4 === 'auto', 'd ' + got4 + ' (want auto)'],
		[got5 === 'none', 'e ' + got5 + ' (want none)'],
		[got6 === 'auto', 'f ' + got6 + ' (want auto)']
	];
	var npass = 0;
	for (var i = 0; i < r.length; i++) {
		mark(i + 1, r[i][0], r[i][1]);
		if (r[i][0]) npass++;
	}
	var sum = $('sum');
	sum.className = npass === r.length ? 'pass' : 'wait';
	sum.textContent = 'APPEAR: ' + npass + '/' + r.length + ' passed';
	document.title = 'APPEAR: ' + npass + '/' + r.length + ' passed';
});
</script>
</body>
</html>
