<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS background-size percentage</title>
<!-- background-size percentages (patches 89 + 90): each box is 300x200 with a
     100x50 image. W is width %, H is height %; the expected tile is
     (W/100*300) x (H/100*200). A percent on one axis and auto on the
     other keeps the image's aspect ratio. The last box is a 320x200
     gradient at 50% 50%: four 160x100 tiles, drawn as 160-wide stripes. -->
<style>
body { margin: 0; font-family: sans-serif; font-size: 16px; }
.box { display: inline-block; width: 300px; height: 200px; vertical-align: top;
       background: url(bs-bmp50.png) no-repeat 0 0; margin: 0; border: 1px solid #888; }
p { margin: 4px 0; }
.grad { display: inline-block; width: 320px; height: 200px; vertical-align: top;
        background: linear-gradient(#08c, #046) 0 0; border: 1px solid #888; }
</style>
</head>
<body>
<p>100%x100% 50%x50% 150% 33%x25% auto auto, gradient 50%x50%</p>
<div class="box" style="background-size: 100% 100%;"></div>
<div class="box" style="background-size: 50% 50%;"></div>
<div class="box" style="background-size: 150%;"></div>
<div class="box" style="background-size: 33% 25%;"></div>
<div class="box"></div>
<div class="grad" style="background-size: 50% 50%;"></div>
</body>
</html>
