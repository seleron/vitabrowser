<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Layered backgrounds and SVG preserveAspectRatio (snapshot)</title>
<style>
/* Patch 352 (news.ycombinator.com vote arrows). A: HN's rule. A
 * comma-separated background list was dropped by libcss, and the
 * shorthand-gradient rewrite kept the transparent gradient layer instead
 * of the top url() layer, so nothing painted. Both boxes: the SVG is
 * 32x32 with viewBox 0 0 32 16. Its default preserveAspectRatio
 * (xMidYMid meet) scales uniformly and centres it; libsvgtiny stretched
 * it 1x2, so only the triangle's tip showed. Snapshot pixels (Chromium
 * agrees; the sim's bar covers y < 20): A (20,30) inside the triangle is
 * #999 and (4,30) beside it white; B (20,80) #999, (4,80) white, and
 * (20,54) above B's tip white (the 1x2 stretch put the tip there). */
body { margin: 0; background: #fff; }
#a, #b { width: 40px; height: 40px; }
#a { background: url("svg-aspect.svg"), linear-gradient(transparent, transparent) no-repeat;
	background-size: 40px; }
#b { margin-top: 10px; background-image: url("svg-aspect.svg"); background-size: 40px;
	background-repeat: no-repeat; }
</style>
</head>
<body>
<div id="a"></div>
<div id="b"></div>
</body>
</html>
