<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS bg objects ref</title>
<style>
/* Patch 374, objects. Every fetched object keeps the box it is for (an
 * <img>, and also a CSS background image, whose box->background is set
 * only when it arrives); its load callback and the full reconvert's
 * relink read that box. A local rebuild that freed such a box left the
 * entry dangling: rte's carousel (slides with background images) crashed
 * once 374 let its track take a local rebuild. Local rebuilds now decline
 * when an object entry points into what they would free. After its steps
 * (600 ms apart) JS-bg-objects.html must render row for row as
 * CSS-bg-objects-ref.html. Steps: a flex track whose slides have
 * background images, its style (full); a paragraph whose span has a
 * background image, its text (full); a block with a background image
 * removed from a list of blocks (full); a plain paragraph's text (local);
 * a plain track's style (local). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.track { display: flex; }
.track div { border: 1px solid #000; padding: 2px 4px; }
.bg { background-image: url(opimg-20.png); background-repeat: repeat-x; }
</style>
</head>
<body>
<div id="trk" class="track"><div class="bg">slide one</div><div class="bg">slide two</div></div>
<p id="p1">A paragraph with a <span class="bg" id="s1">backgrounded</span> span.</p>
<div id="lst"><p>First block.</p><p id="rm" class="bg">A block with a background, removed.</p><p>Last block.</p></div>
<p id="p2">A plain paragraph.</p>
<div id="plain" class="track"><div>plain one</div><div>plain two</div></div>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('trk').setAttribute('style', 'width:400px'); },
		function () { $('p1').firstChild.data = 'Changed: a paragraph with a '; },
		function () { $('rm').parentNode.removeChild($('rm')); },
		function () { $('p2').textContent = 'A plain paragraph, its text changed.'; },
		function () { $('plain').setAttribute('style', 'width:400px'); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
