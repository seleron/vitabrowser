<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS block blocks ref</title>
<script id="hs">var headScript = 1;</script>
<style>
/* Patch 440. "no inserted or removed block found" declined into the full
 * rebuild for a change in a block of blocks that left every child with its
 * box (google: innerHTML on a <div> holding one boxed <div>; a boxed child
 * moved), and for a change inside <head> (youtube: textContent), which the
 * walk climbed to <html> with. The block of blocks is built again whole
 * (434); a change inside a box-less <head> renders nothing. Steps (each
 * flushed alone by a layout read): the third block moved first, the
 * <title>'s text, the head <script>'s text, the first block moved last.
 * Row for row as CSS-block-blocks-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.bx { padding: 2px 6px; background: #dde; }
</style>
</head>
<body>
<div id="o"><div class="bx" id="a">Block A</div><div class="bx" id="b">Block B</div><div class="bx" id="c">Block C</div></div>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('o').insertBefore($('c'), $('a')); },
		function () { document.querySelector('title').textContent = 'block blocks, retitled'; },
		function () { $('hs').textContent = 'var headScript = 2;'; },
		function () { $('o').appendChild($('a')); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
