<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS block frame ref</title>
<style>
/* Patch 429. A new block holding an iframe -- the ad and embed slots
 * cnnlite, guardian and rte insert between blocks -- was the census's
 * largest "new element is not a plain block": every one took the full
 * rebuild. It is built alone now, like a block holding images (patch
 * 364): its frame gets its record and its load as in a full build. Steps:
 * a <div> holding an <iframe> inserted between two paragraphs; a <div>
 * holding a <div> holding an <iframe> (cnnlite's shape) inserted before the
 * last; a paragraph's text. After them JS-block-frame.html renders row for
 * row as CSS-block-frame-ref.html, the same steps run while the page
 * parses. The frames are named, with no src: a same-origin frame a
 * script makes gets no window of its own (patch 244), a named one an
 * empty one either way (patch 289) -- the two pages end alike. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.slot { margin: 4px 10px; background: #eee; }
.slot iframe { width: 220px; height: 40px; border: 2px solid #000; }
</style>
</head>
<body>
<p id="p1">First paragraph.</p>
<p id="p2">Second paragraph.</p>
<p id="p3">Third paragraph, its text changes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var nslot = 0;
	function slot(nested) {
		var d = document.createElement('div'), f = document.createElement('iframe'), h = d;
		d.className = 'slot';
		if (nested) { h = document.createElement('div'); d.appendChild(h); }
		f.name = 'slot' + (++nslot);
		h.appendChild(f);
		return d;
	}
	var ops = [
		function () { document.body.insertBefore(slot(false), $('p2')); },
		function () { document.body.insertBefore(slot(true), $('p3')); },
		function () { $('p3').textContent = 'Third paragraph, its text changed.'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
