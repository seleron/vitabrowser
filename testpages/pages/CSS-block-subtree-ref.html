<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS block subtree ref</title>
<style>
/* Patch 376. A class or style change on a block that holds more than
 * text -- child blocks, images -- took the full box-tree rebuild
 * ("restyled element is not a plain block of text"): the r100 census's
 * top cause on rte, whose slick slides (div.slick-slide, 2-17 nested
 * blocks, sometimes an image) sit in its flex track. Such a block is now
 * built again whole, as a flex container is (372), its objects carried
 * over (375), the page laid out whole. After its steps (600 ms apart)
 * JS-block-subtree.html must render row for row as
 * CSS-block-subtree-ref.html, the same steps run while the page parses.
 * Local: a slide's class and a slide's style in a flex track; a section
 * of a heading, paragraphs and an image, its style; a figure's class; a
 * container whose class shows a hidden panel through a descendant rule.
 * Full: a list (its markers); a block holding a float. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div, h3, section, figure, ul { margin: 4px 10px; }
h3 { font-size: 15px; }
.track { display: flex; }
.slide { border: 1px solid #000; padding: 2px 4px; }
.slide div { margin: 0; }
.slide.current { background: #ffd; border-color: #c00; }
.cap { color: #555; }
figure.big img { width: 40px; height: 40px; }
.panel { display: none; }
.open .panel { display: block; color: #060; }
.fl { float: left; width: 30px; height: 20px; background: #0a0; }
</style>
</head>
<body>
<div class="track"><div id="s1" class="slide"><div>slide one</div><div><img src="opimg-20.png" width="20" height="20"></div><div class="cap">caption</div></div><div id="s2" class="slide"><div>slide two</div><div class="cap">caption</div></div></div>
<section id="sec"><h3>A section</h3><p>Its first paragraph.</p><p>Its second <img src="opimg-20.png" width="20" height="20"> paragraph.</p></section>
<figure id="fig"><img src="opimg-20.png" width="20" height="20"><figcaption>A figure.</figcaption></figure>
<div id="box"><div>A container.</div><div class="panel">A hidden panel, shown by the container's class.</div></div>
<ul id="lst"><li>first item</li><li>second item</li></ul>
<div id="flt"><div class="fl"></div><div>A block holding a float.</div></div>
<p>Last paragraph.</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('s1').className = 'slide current'; },
		function () { $('s2').setAttribute('style', 'opacity:0.5;width:120px'); },
		function () { $('sec').style.marginLeft = '30px'; },
		function () { $('fig').className = 'big'; },
		function () { $('box').className = 'open'; },
		function () { $('lst').style.marginLeft = '40px'; },
		function () { $('flt').style.marginLeft = '40px'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
