<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rounded corners (snapshot)</title>
<style>
/* Patch 363. border-radius was one length for all four corners and was
 * never drawn: every box was square. libcss now keeps four corners (the
 * shorthand, the corner longhands, the logical and -webkit- names), and
 * a box's own solid background and a solid one-colour border draw
 * rounded (path filler, antialiased). A border of mixed colours or
 * styles keeps the square painter, and so does its background. Boxes
 * 100x60 from y 40, green on white, left to right:
 *   a x10:  border-radius:20px            (12,42) white  (60,70) green
 *   b x120: 20px 20px 0 0                 (122,42) white (122,97) green
 *   c x230: 4px solid #00f, radius 20px   (232,42) white (280,41) blue
 *                                         (280,70) green
 *   d x340: as c, left side red (square)  (342,42) blue  (346,46) green
 *   e x450: start-start + end-end 20px    (452,42) white (547,42) green
 *   f x560: 4px rgba(0,0,255,.5) ring     (562,42) white (610,41) 127,127,255
 * (Chromium agrees, except d, which it draws rounded.) */
body { margin: 0; padding-top: 40px; background: #fff; }
div { width: 100px; height: 60px; margin: 0 0 10px 10px; float: left;
	box-sizing: border-box; background: #0a0; }
#a { border-radius: 20px; }
#b { border-radius: 20px 20px 0 0; }
#c { border: 4px solid #00f; border-radius: 20px; }
#d { border: 4px solid #00f; border-left-color: #f00; border-radius: 20px; }
#e { border-start-start-radius: 20px; border-end-end-radius: 20px; }
#f { border: 4px solid rgba(0, 0, 255, 0.5); border-radius: 20px;
	background: #fff; }
</style>
</head>
<body>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div>
</body>
</html>
