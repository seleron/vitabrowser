<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS box-shadow and borders</title>
<!-- Patches 96, 97, 99, 100. Every box has a width no other box uses, so
     run-vita-sim.sh can find its shadow and border bands in the plot:
     r1 222  inset 0 0 0 1px ring: two 222x1 bands
     r2 233  outer 0 0 0 3px spread: two 239x3 bands
     r3 244  Tailwind-style list: two "0 0 #0000" placeholders, then an
             inset 2px ring in var(--c, #000) with --c: initial: two
             244x2 bands
     r4 255  inset 1px ring in hsl(from #000 h s l / 50%): 255x1 bands
             at the 50% opacity bucket (OPAQUE 2)
     r5 266  unsupported colour in the shadow: declaration invalid, no
             266-wide bands
     b1 277  border: 0.5px solid: snaps to 1px (277x1 top and bottom bands)
     b2 288  border-radius + 1px border at 50% alpha: 288x1 bands at
             OPAQUE 2 (MacSurf skipped the border painter for rounded
             boxes and drew a solid stroke instead)
     b3 299  border-radius with "border: 0 solid" (Tailwind preflight):
             no 1px frame. Not asserted: that frame was a stroke, and the
             plot stream records fills only. -->
<style>
body { margin: 0; font: 12px sans-serif; background: #fff; }
div { height: 20px; margin: 8px; background: #eee; }
.r1 { width: 222px; box-shadow: inset 0 0 0 1px #000; }
.r2 { width: 233px; box-shadow: 0 0 0 3px #000; }
.r3 { width: 244px; --c: initial; --s: 0 0 #0000;
      box-shadow: var(--s), var(--s), inset 0 0 0 2px var(--c, #000); }
.r4 { width: 255px; box-shadow: inset 0 0 0 1px hsl(from #000 h s l / 50%); }
.r5 { width: 266px; box-shadow: inset 0 0 0 1px nosuchcolour(1); }
.b1 { width: 277px; border: 0.5px solid #000; }
.b2 { width: 288px; border: 1px solid rgba(0, 0, 0, .5); border-radius: 8px; }
.b3 { width: 299px; border: 0 solid #000; border-radius: 8px; }
</style>
</head>
<body>
<div class="r1"></div><div class="r2"></div><div class="r3"></div>
<div class="r4"></div><div class="r5"></div>
<div class="b1"></div><div class="b2"></div><div class="b3"></div>
</body>
</html>
