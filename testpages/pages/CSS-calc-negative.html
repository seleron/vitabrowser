<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Negative calc() sums and padding (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.b { width: 100px; height: 4px; margin: 2px 0; background: #69c; }
:root { --pad: max(1rem, calc(50vw - 720px + 1rem)); }
#a { margin-left: calc(-30px + 1rem); position: relative; left: 50px; }
#b { padding-left: calc(-30px + 1rem); }
#c { padding-left: calc(-224px); }
#d { padding-inline: var(--pad); width: auto; }
#e { margin-left: calc(10px - 20px + 1rem); }
</style>
<script>
/* Patches 338/339 (developer.mozilla.org): 339 -- the saturating fixed-
 * point add/subtract (MacSurf fixes1309) computed 1 + INT_MAX, signed
 * overflow, and GCC turned ordinary mixed-sign sums into INT_MAX:
 * calc(-30px + 1rem) became 2097151px, so MDN's page padding
 * max(1rem, calc(50vw - 720px + 1rem)) was 21845px and its grid went 0px
 * wide. 338 -- negative padding (a calc() below zero) was used as-is; it
 * clamps to 0. Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CALCNEG339: ' + k + '/' + N + ' passed';
		document.title = 'Negative calc sums (' + k + '/' + N + ')';
	}
	function run() {
		var vw = document.documentElement.clientWidth || innerWidth;
		var pad = Math.max(16, vw / 2 - 720 + 16);
		t(1, Math.round(r('a').left) === 36, 'margin calc(-30px + 1rem) = -14 (' + Math.round(r('a').left - 50) + ')');
		t(2, Math.round(r('b').width) === 100, 'negative padding clamps to 0 (' + Math.round(r('b').width) + ')');
		t(3, Math.round(r('c').width) === 100, 'padding calc(-224px) clamps to 0 (' + Math.round(r('c').width) + ')');
		t(4, Math.abs(r('di').left - pad) <= 1, 'padding max(1rem, calc(50vw - 720px + 1rem)) (' + Math.round(r('di').left) + ' vs ' + pad + ')');
		t(5, Math.round(r('e').left) === 6, 'margin calc(10px - 20px + 1rem) = 6 (' + Math.round(r('e').left) + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">CALCNEG339: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<div class="b" id="a"></div>
<div class="b" id="b"></div>
<div class="b" id="c"></div>
<div id="d" style="background:#eee"><div class="b" id="di"></div></div>
<div class="b" id="e"></div>
</body>
</html>
