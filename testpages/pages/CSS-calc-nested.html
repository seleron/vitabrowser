<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS nested math functions and exact units (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.u { height: 4px; background: #69c; margin: 2px 0; }
:root { --edge: clamp( 24px, calc( 100vw / 18 ), 80px ); --wide: 1070px;
	--content: 680px; --meta: calc( var(--wide) - var(--content) ); }
#clampcalc { width: clamp(24px, calc(100vw / 18), 80px); }
#spaces { width: calc( 100vw / 18 ); }
#varedge { padding-left: var(--edge); }
#varedge > div { width: 10px; }
#edge2 { width: calc(var(--edge) * 2); }
#meta { width: calc(var(--meta) - 32px); }
#minmax { width: min(100px, max(10px, calc(50px + 5px))); }
#summin { width: calc(10px + min(20px, 30px)); }
#vw { width: 10vw; }
#vh { width: 10px; height: 10vh; }
#pt { width: 45pt; }
#cm { width: 2.54cm; }
</style>
<script>
/* Patches 326/327 (wordpress.org/news): 326 -- a math function nested in
 * another (clamp(24px, calc(100vw / 18), 80px)) was rejected whole, and
 * so was calc( 100vw / 18 ) with a space before its close paren;
 * WordPress's spacing preset is both, so every padding and margin built
 * on it dropped to 0. 327 -- vw/vh/pt/cm lengths were multiplied by a
 * px-per-unit rounded to a whole pixel (1vw = 10px on a 960px viewport,
 * 1vh = 5px on 544, 1pt = 1px). Expected widths come from innerWidth /
 * innerHeight, so the page is right at any viewport size;
 * Chromium-verified. */
(function () {
	var k = 0, N = 11;
	function $(id) { return document.getElementById(id); }
	function h(id) { return $(id).getBoundingClientRect().height; }
	function w(id) { return $(id).getBoundingClientRect().width; }
	function near(a, b) { return Math.abs(a - b) <= 1; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CALCNEST326: ' + k + '/' + N + ' passed';
		document.title = 'CSS nested math functions (' + k + '/' + N + ')';
	}
	function run() {
		var vw = document.documentElement.clientWidth || innerWidth;
		var vh = innerHeight;
		var edge = Math.min(80, Math.max(24, vw / 18));
		var inner = $('varedge').firstElementChild;
		t(1, near(w('clampcalc'), edge), 'clamp() with a nested calc() (' +
			w('clampcalc') + ' vs ' + edge.toFixed(1) + ')');
		t(2, near(w('spaces'), vw / 18), 'calc( 100vw / 18 ) (' +
			w('spaces') + ' vs ' + (vw / 18).toFixed(1) + ')');
		t(3, near(inner.getBoundingClientRect().left -
			$('varedge').getBoundingClientRect().left, edge),
			'padding: var() of the clamp (' + (inner.getBoundingClientRect().left -
			$('varedge').getBoundingClientRect().left) + ')');
		t(4, near(w('edge2'), edge * 2), 'calc(var() * 2) (' + w('edge2') + ')');
		t(5, near(w('meta'), 358), 'calc(var(calc(var - var)) - 32px) (' +
			w('meta') + ' vs 358)');
		t(6, near(w('minmax'), 55), 'min(max(calc())) (' + w('minmax') + ' vs 55)');
		t(7, near(w('summin'), 30), 'calc(10px + min()) (' + w('summin') + ' vs 30)');
		t(8, near(w('vw'), vw / 10), '10vw (' + w('vw') + ' vs ' +
			(vw / 10).toFixed(1) + ')');
		t(9, near(h('vh'), vh / 10), '10vh (' + h('vh') + ' vs ' +
			(vh / 10).toFixed(1) + ')');
		t(10, near(w('pt'), 60), '45pt (' + w('pt') + ' vs 60)');
		t(11, near(w('cm'), 96), '2.54cm (' + w('cm') + ' vs 96)');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">CALCNEST326: 0/11 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<p id="r8" class="wait">8 pending</p>
<p id="r9" class="wait">9 pending</p>
<p id="r10" class="wait">10 pending</p>
<p id="r11" class="wait">11 pending</p>
<div class="u" id="clampcalc"></div><div class="u" id="spaces"></div>
<div class="u" id="varedge"><div class="u"></div></div>
<div class="u" id="edge2"></div><div class="u" id="meta"></div>
<div class="u" id="minmax"></div><div class="u" id="summin"></div>
<div class="u" id="vw"></div><div class="u" id="vh"></div>
<div class="u" id="pt"></div><div class="u" id="cm"></div>
</body>
</html>
