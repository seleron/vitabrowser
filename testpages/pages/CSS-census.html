<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS census rewrites (script not run)</title>
<!-- Declarations libcss dropped, chosen by the scorecard's gap census
     (docs/scorecard-log.md) and rewritten in css_rewrite.c (patch 156).
     1: text-align: end puts the text at the right.
     2: justify-content: end puts a flex child at the right edge.
     3: align-items: end puts a flex child at the bottom.
     4: -webkit-box-sizing: border-box counts the padding in the width.
     5: display: -webkit-box makes a span a block (as wide as its parent). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p.r { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#ta { width: 400px; text-align: end; background: #eee; }
#jc { display: flex; justify-content: end; width: 400px; background: #eee; }
#ai { display: flex; align-items: end; height: 60px; width: 400px; background: #ddd; }
.kid { width: 40px; height: 20px; background: #36c; }
#bs { -webkit-box-sizing: border-box; width: 200px; padding: 0 20px; background: #9cf; }
#wb { display: -webkit-box; background: #fc9; }
</style>
</head>
<body>
<p id="sum" class="wait r">CENSUS: script did not run</p>
<div id="ta"><span id="tas">end</span></div>
<div id="jc"><div class="kid" id="jck"></div></div>
<div id="ai"><div class="kid" id="aik"></div></div>
<div id="bs">box</div>
<div id="wbp"><span id="wb">wbox</span></div>
<p id="r1" class="wait r">1 waiting</p><p id="r2" class="wait r">2 waiting</p>
<p id="r3" class="wait r">3 waiting</p><p id="r4" class="wait r">4 waiting</p>
<p id="r5" class="wait r">5 waiting</p>
<script>
window.addEventListener('load', function () {
	var N = 5, k = 0;
	function r(id) { return document.getElementById(id).getBoundingClientRect(); }
	function t(n, name, ok, got) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + name + ': ' + got + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass r';
		k++;
		document.getElementById('sum').textContent = 'CENSUS: ' + k + '/' + N + ' passed';
		document.title = 'CSS census rewrites (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'CENSUS: 0/' + N + ' passed';
	var ta = r('ta'), tas = r('tas');
	t(1, 'text-align: end', tas.left > ta.left + 300, Math.round(tas.left - ta.left));
	var jc = r('jc'), jck = r('jck');
	t(2, 'justify-content: end', Math.abs(jck.right - jc.right) < 2, Math.round(jck.left - jc.left));
	var ai = r('ai'), aik = r('aik');
	t(3, 'align-items: end', Math.abs(aik.bottom - ai.bottom) < 2, Math.round(aik.top - ai.top));
	var bs = r('bs');
	t(4, '-webkit-box-sizing', Math.abs(bs.width - 200) < 2, Math.round(bs.width));
	var wb = r('wb'), wbp = r('wbp');
	t(5, 'display: -webkit-box', Math.abs(wb.width - wbp.width) < 2, Math.round(wb.width) + '/' + Math.round(wbp.width));
});
</script>
</body>
</html>
