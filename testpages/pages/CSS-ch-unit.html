<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS ch unit (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#w10 { width: 10ch; height: 6px; background: #69c; }
#art { max-width: 65ch; background: #eef; }
</style>
<script>
/* Patch 210: 1ch falls back to 0.5em (CSS Values 4) instead of 0.4em, so
 * `max-width: 65ch` article columns come out near a browser's width
 * (Chromium measures the font's "0": ~0.55em for its sans). */
(function () {
	var k = 0, N = 2;
	function $(id) { return document.getElementById(id); }
	function w(id) { return $(id).getBoundingClientRect().width; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CHUNIT210: ' + k + '/' + N + ' passed';
		document.title = 'CSS ch unit (' + k + '/' + N + ')';
	}
	function run() {
		t(1, w('w10') >= 75 && w('w10') <= 95, '10ch at 16px: ' + w('w10'));
		t(2, w('art') >= 500 && w('art') <= 620, 'max-width 65ch: ' + w('art'));
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">CHUNIT210: 0/2 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<div id="w10"></div>
<div id="art">An article column limited to sixty-five characters per line, the usual comfortable reading measure that many blogs and documentation sites use.</div>
</body>
</html>
