<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS class sib parent ref</title>
<style>
/* Patch 448. A class change a + / ~ rule can see ("class change may move a
 * sibling selector": github, oldreddit) declined into the full rebuild;
 * the parent is built again whole now (a block: 440, a flex box: 438), as
 * 445 does for attributes. A class or sheet-visible attribute change on an
 * inline-block box ("class change on an element with a non-inline,
 * non-block box": oldreddit, google, youtube) goes up to its block's line,
 * as an inline does. Steps (each flushed alone by a layout read): .on on a
 * block before a paragraph; .on on a flex item before two others; a class
 * on an inline-block span; disabled on a button. Row for row as
 * CSS-class-sib-parent-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.on + p { color: #c00; background: #fee; }
.fx { display: flex; }
.fx > div { margin: 0 4px; padding: 2px 6px; }
.fx > .on ~ div { background: #def; }
.ib { display: inline-block; padding: 1px 4px; }
.ib.big { border: 2px solid #080; color: #080; }
button[disabled] { color: #999; border: 1px dashed #999; }
</style>
</head>
<body>
<div id="a" class="on">A block that gains .on.</div>
<p>The paragraph after it (red on pink).</p>
<div class="fx"><div id="f1" class="on">item one</div><div>item two</div><div>item three</div></div>
<p>A line with <span class="ib big" id="s">an inline-block span</span> that grows a border.</p>
<p>A line with <button id="b" disabled>a button</button> that is disabled.</p>
</body>
</html>
