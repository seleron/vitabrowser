<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS control inert ref</title>
<style>
/* Patch 433. An attribute no sheet can see (data-*, aria-*, role...) on a
 * box that is not a block is a no-op since patch 408 -- but not on a form
 * control's box: wordpress.org's navigation <button>s (flex boxes) toggle
 * aria-expanded, each a full rebuild ("nearest box is not a block"). The
 * forms code reads none of those attributes. Steps: aria-expanded and
 * data-state set on a flex <button>, aria-pressed on an inline-block one,
 * role on a text field. Each step is followed by a layout read, which
 * flushes it as a batch of its own: the gate's autotest runs timer steps
 * back to back, and a batch of several inert attribute marks is answered
 * whole (patch 383) -- the single mark's path, the one that declined, is
 * only reached alone. Nothing is rebuilt. Row for row as
 * CSS-control-inert-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.flexbtn { display: flex; gap: 6px; margin: 4px 10px; padding: 4px 8px; }
.ibbtn { display: inline-block; margin: 4px 10px; }
</style>
</head>
<body>
<p id="p1">Buttons whose aria and data attributes change.</p>
<div><button id="b1" class="flexbtn" aria-expanded="false"><span>Menu</span><span>&#9662;</span></button></div>
<div><button id="b2" class="ibbtn" aria-pressed="false">Toggle</button> <input id="t1" value="text field"></div>
<p id="p2">A paragraph after them.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('b1').setAttribute('aria-expanded', 'true'); $('b1').setAttribute('data-state', 'open'); },
		function () { $('b2').setAttribute('aria-pressed', 'true'); },
		function () { $('t1').setAttribute('role', 'searchbox'); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
