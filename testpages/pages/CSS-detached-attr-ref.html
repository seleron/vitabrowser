<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS detached attr ref</title>
<style>
/* Patch 461. An attribute a sheet selects on, or a class, changed on an
 * element that is not in the document -- a detached subtree, a template's
 * content (bbc sets data-hidden on nodes before inserting them) --
 * declined ("no block box above the change": the walk up found no box)
 * into the full rebuild. Nothing such a change does renders; the
 * insertion is a change of its own. Steps (each flushed alone by a
 * layout read): a <div>'s data-hidden and class changed and the <div>
 * removed in the same task (the marks are answered once it is detached);
 * a class on a paragraph still in the document. Row for row as
 * CSS-detached-attr-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
[data-hidden="no"] { background: #efe; }
.mark { font-weight: bold; color: #00c; }
</style>
</head>
<body>
<div id="w"><p>First paragraph.</p><p id="p2" class="mark">Second paragraph (gains .mark).</p><p>Last paragraph.</p></div>
</body>
</html>
