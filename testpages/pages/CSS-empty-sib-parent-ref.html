<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS empty sib parent ref</title>
<style>
/* Patch 450. A change that empties a block, or fills an empty one, flips
 * its :empty; where a + / ~ rule tests :empty ("a sibling rule tests
 * :empty": 4.0 a load on the 7 census sites) it declined into the full
 * rebuild. Such a rule reaches only the block's later siblings, all in its
 * parent, which holds the block and so cannot flip :empty itself: the
 * parent is built again whole (a block: 440, a flex box: 438). Steps (each
 * flushed alone by a layout read): a line emptied; an empty block filled;
 * a flex item emptied. Row for row as CSS-empty-sib-parent-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.x { min-height: 10px; background: #eef; }
.x:empty + p { color: #c00; background: #fee; }
.x:empty ~ .t { border-left: 4px solid #c00; }
.fx { display: flex; }
.fx > div { margin: 0 4px; padding: 2px 6px; min-width: 20px; min-height: 10px; background: #efe; }
.fx > div:empty ~ div { background: #def; }
</style>
</head>
<body>
<div id="w1"><div class="x" id="a"></div><p>The paragraph after it (red when the block before it is empty).</p><p class="t">A later sibling (red edge).</p></div>
<div id="w2"><div class="x" id="b">Now it holds text.</div><p>After an empty block that fills (plain at the end).</p></div>
<div class="fx"><div id="f"></div><div>two</div><div>three</div></div>
</body>
</html>
