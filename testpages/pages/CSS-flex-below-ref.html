<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flex below ref</title>
<style>
/* Patch 422. A change below a flex or grid box -- an element with no box
 * of its own, or text -- climbed to the container and declined ("nearest
 * box is not a block"). Now the container is built again whole: a hidden
 * flex item shown by a class, a hidden grid item shown by a class, and
 * the flex container's own text changed. A block made display:inline
 * in the same task as another block's restyle exercises the dropped
 * inline run (its INLINE_END once outlived its box: ASan, rte). Row for
 * row as
 * CSS-flex-below-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
.f { display: flex; gap: 6px; margin: 4px 10px; background: #eef; }
.g { display: grid; grid-template-columns: 1fr 1fr; margin: 4px 10px; background: #efe; }
.f > div, .g > div { background: #cde; padding: 2px; }
.hid { display: none; }
.hid.show { display: block; }
div.last { margin: 4px 10px; }
div.blk { margin: 4px 10px; }
.inl { display: inline; }
.hl2 { background: #ffd; }
</style>
</head>
<body>
<div class="f" id="f">Flex text.<div>Item one.</div><div class="hid" id="fh">Shown flex item.</div></div>
<div class="g" id="g"><div>Cell one.</div><div class="hid" id="gh">Shown grid item.</div></div>
<div class="blk" id="blk"><div>A block holding a block, made inline.</div></div>
<div class="blk" id="blk2">A block restyled in the same task.</div>
<div class="last">The last block.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('fh').className = 'hid show'; },
		function () { $('gh').className = 'hid show'; },
		function () { $('f').firstChild.data = 'Flex text, changed.'; },
		/* one task: #blk's restyle comes back inline and is dropped
		 * (its whole box run: 422's html_rl_drop_new fix), then
		 * #blk2's local restyle lays the page out */
		function () { $('blk').className = 'blk inl'; $('blk2').className = 'blk hl2'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
