<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flex items are blockified (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.f { display: flex; align-items: flex-start; margin: 4px 0; background: #eee; }
.f button { display: flex; padding: 0 12px; border: 0; background: none; }
.ic { display: inline-flex; width: 24px; height: 24px; flex-shrink: 0; }
.ic.full { width: 93px; height: 20px; }
.blk { display: block; width: 93px; height: 20px; background: #f03; }
#nav a { color: #000; }
#nav { gap: 20px; }
#w span { width: 100px; background: #69c; }
#m span { margin-top: 10px; background: #69c; }
#g { display: grid; grid-template-columns: auto auto; justify-content: start; }
#g x-cell { width: 70px; background: #69c; }
</style>
<script>
/* Patch 333 (m.youtube.com): a display:inline child of a flex (or grid)
 * container was not blockified, so an inline element holding block-level
 * content (YouTube's <ytm-home-logo> around its logo button) split around
 * its blocks and collapsed to 1px; the 93px logo drew 24px wide. Flex and
 * grid items now blockify display:inline as well (CSS Display 3 2.7).
 * Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FLEXBLOCKIFY333: ' + k + '/' + N + ' passed';
		document.title = 'Flex items are blockified (' + k + '/' + N + ')';
	}
	function run() {
		var a = Math.round(r('logo').width), c = Math.round(r('icon').width);
		t(1, a === 117 && c === 93, 'an inline item holding a flex button (' +
			a + ', icon ' + c + ')');
		t(2, Math.round(r('wrap').width) === 93, 'an inline item holding a block (' +
			Math.round(r('wrap').width) + ')');
		var g1 = Math.round(r('n2').left - r('n1').right),
			g2 = Math.round(r('n3').left - r('n2').right);
		t(3, g1 === 20 && g2 === 20, 'inline links are separate items: gap (' +
			g1 + ', ' + g2 + ')');
		t(4, Math.round(r('wspan').width) === 100, 'width applies to an inline ' +
			'item (' + Math.round(r('wspan').width) + ')');
		t(5, Math.round(r('mspan').top - r('m').top) === 10, 'vertical margin ' +
			'applies to an inline item (' + Math.round(r('mspan').top - r('m').top) + ')');
		t(6, Math.round(r('gc').width) === 70, 'width applies to an inline grid ' +
			'item (' + Math.round(r('gc').width) + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">FLEXBLOCKIFY333: 0/6 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<div class="f"><x-logo id="logo"><button><span class="ic full" id="icon"><span class="blk"></span></span></button></x-logo><div>rest</div></div>
<div class="f"><x-logo id="wrap"><span class="blk"></span></x-logo><div>rest</div></div>
<div class="f" id="nav"><a href="#" id="n1">one</a><a href="#" id="n2">two</a><a href="#" id="n3">three</a></div>
<div class="f" id="w"><span id="wspan">W</span><div>rest</div></div>
<div class="f" id="m"><span id="mspan">M</span><div>rest</div></div>
<div id="g"><x-cell id="gc">G</x-cell><div>rest</div></div>
</body>
</html>
