<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flex buttons ref</title>
<style>
/* Patch 382. A class or style change on a flex container (or a block
 * holding more than text) whose subtree held a form control took the full
 * box-tree rebuild ("holds controls or frames"): youtube's toolbars hold
 * <button>s and a submit. A button keeps no state but focus: the old ones
 * are released (368) and the build makes new ones (364). A control with
 * state (typed text, a checked box, a chosen option) still takes the full
 * rebuild, as does a frame. After its steps (600 ms apart)
 * JS-flex-buttons.html must render row for row as
 * CSS-flex-buttons-ref.html, the same steps run while the page parses.
 * Local: the toolbar's style, twice (its rebuilt buttons rebuilt again);
 * a click on its rebuilt <button> (its handler writes a line). Full: a flex holding a typed text field. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div, form { margin: 4px 10px; }
.bar { display: flex; }
.bar > * { margin: 0 4px; }
</style>
</head>
<body>
<form id="f" action="javascript:void 0">
<div id="bar" class="bar"><button type="button" id="b1">One</button><input type="submit" value="Go"><input type="reset" value="Clear"></div>
<div id="fld" class="bar"><span>Field:</span><input type="text" id="t1" value="typed text"></div>
</form>
<p id="out">The button was not clicked.</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	$('b1').onclick = function () { $('out').textContent = 'The rebuilt button was clicked.'; };
	var ops = [
		function () { $('bar').setAttribute('style', 'width:400px'); },
		function () { $('bar').style.justifyContent = 'space-between'; },
		function () { $('b1').click(); },
		function () { $('fld').style.justifyContent = 'flex-end'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
