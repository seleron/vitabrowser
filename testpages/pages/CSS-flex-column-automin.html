<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flex column automatic minimum (snapshot)</title>
<style>
/* Patch 360. An auto-height column flex container summed its items'
 * hypothetical sizes without the automatic minimum (min-height: auto),
 * so a `flex: 1` item (basis 0) counted as 0 and the column stayed as
 * tall as its header; the footer after it painted over the middle.
 * That was google.com's search form, under its footer. Rows, 200px
 * wide: blue head 40-60, green middle 60-160 (100px of content), red
 * footer 160-180, and a script row 180-200 that turns green when
 * getComputedStyle(el).flexGrow answers (it overflowed the stack: the
 * computed style's prototype accessors called getPropertyValue, which
 * read the accessor again). Snapshot pixels (Chromium agrees):
 *   (10,50) blue; (10,70) and (10,150) green; (10,170) red;
 *   (10,190) green */
body { margin: 0; padding-top: 40px; background: #fff; }
#col { display: flex; flex-direction: column; width: 200px; }
#head { height: 20px; background: #00f; }
#mid { flex: 1; background: #0a0; }
#foot { width: 200px; height: 20px; background: #f00; }
#js { width: 200px; height: 20px; background: #888; }
</style>
</head>
<body>
<div id="col"><div id="head"></div><div id="mid"><div style="height:100px"></div></div></div>
<div id="foot"></div>
<div id="js"></div>
<script>
var j = document.getElementById('js');
try {
	var g = getComputedStyle(document.getElementById('mid'));
	var v = g.flexGrow + g.getPropertyValue('flex-grow');
	j.style.background = (typeof v === 'string') ? '#0a0' : '#f00';
} catch (e) {
	j.style.background = '#f00';
}
</script>
</body>
</html>
