<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flex frame ref</title>
<style>
/* Patch 428. A flex or grid container whose class or style changed was
 * built again alone (patch 372) -- unless a frame was inside it: rte's
 * carousel holds its video frame, and each slide took the full rebuild.
 * The frame is carried over now: its window goes to the new box of its
 * <iframe>. Steps: the container's class (a gap and a background), its
 * class again (the frame hidden: its window has no box), its class back
 * (the frame shown again), a paragraph's text after it. After them
 * JS-flex-frame.html renders row for row as CSS-flex-frame-ref.html,
 * the same steps run while the page parses. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
#fx { display: flex; margin: 4px 10px; background: #eee; }
#fx > div { padding: 4px; }
#fx iframe { width: 220px; height: 40px; border: 2px solid #000; }
#fx.wide { gap: 30px; background: #efe; }
#fx.nof iframe { display: none; }
</style>
</head>
<body>
<p id="p1">A flex container with a frame in it.</p>
<div id="fx"><div>left</div><iframe src="JS-frames-local-child.html"></iframe><div>right</div></div>
<p id="p2">A paragraph after it.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('fx').className = 'wide'; },
		function () { $('fx').className = 'wide nof'; },
		function () { $('fx').className = 'wide'; },
		function () { $('p2').textContent = 'A paragraph after it, its text changed.'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
