<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flex gap axes (script not run)</title>
<!-- Patch 296: a column flex container laid its items out with the
     column-gap between them and the row-gap between its lines --
     the two were hardwired to the main and cross axes, which is
     only a row container's answer. The gap properties belong to
     the axis they separate: in a column container the items stack
     in rows, so row-gap is the gap between items and column-gap
     the gap between lines. The checks measure item offsets: a row
     container as the control (unchanged), a column container's
     item step, and a wrapped column container's second column. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
.fc { display: flex; position: relative; width: 220px; margin: 6px 0; background: #eef; }
.it { flex: none; width: 20px; height: 10px; background: #99c; }
#a { flex-direction: row; column-gap: 14px; row-gap: 4px; }
#b { flex-direction: column; row-gap: 14px; column-gap: 4px; }
#c { flex-direction: column; flex-wrap: wrap; row-gap: 14px; column-gap: 4px; height: 34px; width: 44px; }
</style>
</head>
<body>
<div id="sum">FLEXGAP: 0/5 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<div class="fc" id="a"><div class="it"></div><div class="it"></div><div class="it"></div></div>
<div class="fc" id="b"><div class="it"></div><div class="it"></div><div class="it"></div></div>
<div class="fc" id="c"><div class="it"></div><div class="it"></div><div class="it"></div></div>
<script>
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FLEXGAP: ' + k + '/' + N + ' passed';
		document.title = 'CSS flex gap axes (' + k + '/' + N + ')';
	}
	function kids(id) { return $(id).children; }
	function eq(n, got, want, text) {
		t(n, got === want, text + ': ' + got + (got === want ? '' : ' (want ' + want + ')'));
	}
	window.addEventListener('load', function () {
		setTimeout(function () {
			var a = kids('a'), b = kids('b'), c = kids('c');
			eq(1, a[1].offsetLeft - a[0].offsetLeft, 34,
				'row container: item step is width + column-gap');
			eq(2, b[1].offsetTop - b[0].offsetTop, 24,
				'column container: item step is height + row-gap');
			eq(3, b[2].offsetTop - b[0].offsetTop, 48,
				'column container: the third item is two steps down');
			eq(4, c[1].offsetTop, 24,
				'wrapped column: the second item stays in column one');
			eq(5, c[2].offsetLeft, 24,
				'wrapped column: column two starts at width + column-gap');
		}, 300);
	});
})();
</script>
</body>
</html>
