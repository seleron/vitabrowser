<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flex header (script not run)</title>
<style>
body, html { height: 100%; margin: 0; padding: 0; }
body { font-family: sans-serif; font-size: 10pt; background: #fff; }
#main { display: flex; flex-direction: column; min-height: 100%; }
header { display: flex; min-height: 48px; width: 100%; background: #eef; }
#menu { padding: 12px 16px; }
#tabs { display: flex; flex-wrap: wrap; padding-left: 16px; }
#tabs a { padding: 16px 12px 12px; color: #1a0dab; }
.spacer { flex: 1 0 auto; }
#right { flex: 0 0 auto; position: relative; z-index: 1; padding-top: calc(0*12px); }
#right .apps { display: inline-block; width: 40px; height: 40px; background: #ccc; vertical-align: middle; }
#right .signin { display: inline-block; padding: 9px 23px; background: #0b57d0; color: #fff; border-radius: 100px; vertical-align: middle; margin: 4px 8px; }
#tabs a.lh { display: block; line-height: calc(48px - 0*12px); padding: 0 8px; }
.bb { display: inline-block; box-sizing: border-box; min-height: 40px; padding: 10px 24px; line-height: 18px; background: #0b57d0; color: #fff; }
.cb { display: inline-block; min-height: 40px; padding: 10px 24px; line-height: 18px; background: #0b57d0; color: #fff; }
#res { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; font-size: 12px; }
#res p { margin: 1px 0; padding: 1px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
</style>
</head>
<body>
<!-- Patch 180 (layout): google.com's header, reduced. A flex row whose
     spacer has flex: 1 0 auto and whose last item has flex: 0 0 auto: the
     spacer took no width and the last item was 0px wide (its content
     spilled out: google's Sign-in drew as a tall block at the left), and
     a nested flex container did not stretch to the row's height. Each
     expected value is Chromium's.
     1: the spacer grows: the last item's right edge is the row's.
     2: the last item is as wide as its content.
     3: the tabs (a nested flex container) stretch to the row's 48px.
     4: the body starts at the top of the page (a flex container is not
        collapsed through: the margin of the block after it stays there).
     5: line-height: calc(48px - 0*12px) is 48px (google's tab links use
        it to centre their text in the 48px header).
     6: min-height with box-sizing: border-box bounds the border box
        (40px with 10px padding; content-box: 60px). -->
<div id="main">
<header id="hdr">
  <div id="menu"><span style="display:inline-block;width:24px;height:24px;background:#888"></span></div>
  <div id="tabs"><a id="all" class="lh">All</a><a id="img" class="lh">Images</a></div>
  <div class="spacer" id="sp"></div>
  <div id="right"><span class="apps"></span><a class="signin" id="si">Sign in</a></div>
</header>
<p>content <a class="bb" id="bb">border-box</a> <a class="cb" id="cb">content-box</a></p>
<div id="lhd" style="line-height: calc(48px - 0*12px)">a line whose height is calc()</div>
</div>
<div id="res">
<p id="sum" class="wait">FLEXHDR: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p><p id="r6" class="wait">6 waiting</p>
</div>
<script>
window.addEventListener('load', function () {
	function R(id) { return document.getElementById(id).getBoundingClientRect(); }
	var h = R('hdr'), right = R('right'), sp = R('sp'), tabs = R('tabs'), si = R('si'), b = document.body.getBoundingClientRect();
	var res = [
		[Math.abs(right.right - h.right) <= 1 && sp.width > 400, 'spacer ' + Math.round(sp.width) + 'px, last item right edge ' + Math.round(right.right) + ' of ' + Math.round(h.right)],
		[right.width >= si.width + 40 && si.left >= right.left - 1 && si.right <= right.right + 1, 'last item ' + Math.round(right.width) + 'px, sign-in at ' + Math.round(si.left) + '-' + Math.round(si.right)],
		[Math.abs(tabs.height - h.height) <= 1 && h.height >= 48, 'tabs ' + Math.round(tabs.height) + 'px tall in a ' + Math.round(h.height) + 'px row'],
		[Math.abs(b.top) <= 0.5 && Math.abs(h.top) <= 0.5, 'body top ' + b.top + ', header top ' + h.top],
		[Math.abs(R('lhd').height - 48) <= 1, 'calc() line-height: ' + Math.round(R('lhd').height) + 'px line'],
		[Math.abs(R('bb').height - 40) <= 1 && Math.abs(R('cb').height - 60) <= 1, 'border-box ' + Math.round(R('bb').height) + 'px, content-box ' + Math.round(R('cb').height) + 'px']
	], k = 0;
	for (var i = 0; i < res.length; i++) {
		var p = document.getElementById('r' + (i + 1));
		p.textContent = (i + 1) + ' ' + res[i][1] + (res[i][0] ? '' : ' FAIL');
		if (res[i][0]) { p.className = 'pass'; k++; }
	}
	document.getElementById('sum').textContent = 'FLEXHDR: ' + k + '/6 passed';
	document.title = 'CSS flex header (' + k + '/6)';
});
</script>
</body></html>
