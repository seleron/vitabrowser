<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flex item width as its max-content contribution (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.f { display: flex; align-items: flex-start; background: #eee; margin: 4px 0; }
.ic { display: inline-flex; width: 24px; height: 24px; flex-shrink: 0; background: #0c0; }
.ic.full { width: 93px; height: 20px; }
.blk { display: block; width: 93px; height: 20px; background: #f03; }
.f button { display: flex; padding: 0 12px; border: 0; background: none; }
.row { display: flex; }
.cell { width: 40px; height: 10px; flex-shrink: 0; background: #69c; }
.shrink { display: flex; width: 100px; }
.shrink > div { width: 80px; background: #c96; }
</style>
<script>
/* Patch 334 (m.youtube.com): a flex item's specified width did not count
 * toward its max-content contribution, so a shrink-to-fit box around a
 * flex row of fixed-width items sized to 0 or to its own padding --
 * YouTube's logo button (93px icon) laid out 24px wide. Leg 5 checks the
 * min side is untouched: fixed-width items with short text still shrink.
 * Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function w(id) { return Math.round($(id).getBoundingClientRect().width); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FLEXCONTRIB334: ' + k + '/' + N + ' passed';
		document.title = 'Flex item width contribution (' + k + '/' + N + ')';
	}
	function run() {
		t(1, w('a') === 117 && w('ai') === 93, 'a button holding a 93px icon (' +
			w('a') + ', ' + w('ai') + ')');
		t(2, w('b') === 117, 'the button as a flex item itself (' + w('b') + ')');
		t(3, w('c') === 93, 'a flex row of one fixed item, inside a flex item (' +
			w('c') + ')');
		t(4, w('d') === 120, 'a row of three 40px items (' + w('d') + ')');
		t(5, w('e1') === 50 && w('e2') === 50, 'fixed-width items still shrink (' +
			w('e1') + ', ' + w('e2') + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">FLEXCONTRIB334: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<div class="f"><div id="a"><button><span class="ic full" id="ai"><span class="blk"></span></span></button></div><div>rest</div></div>
<div class="f"><button id="b"><span class="ic full"></span></button><div>rest</div></div>
<div class="f"><div id="c"><div class="row"><span class="ic full"></span></div></div><div>rest</div></div>
<div class="f"><div id="d"><div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div></div></div><div>rest</div></div>
<div class="shrink"><div id="e1">a</div><div id="e2">b</div></div>
</body>
</html>
