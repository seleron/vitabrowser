<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flex items ref</title>
<style>
/* Patch 502. An element inserted into or removed from a block-level flex
 * box rebuilt the whole box (438/439: "a flex or grid box's child list
 * changed in elements with a box, the box built again whole") --
 * stackoverflow's flex containers, ~1,400 elements re-selected per
 * inserted item. Items are now placed alone, as blocks are, and the page
 * laid out whole, when every child box is an element's. After its steps
 * (250 ms apart) JS-flex-items.html must render row for row as
 * CSS-flex-items-ref.html, the same steps run while the page parses.
 * Steps: appends, inserts at the start / middle, removals (middle, last);
 * a column box with a gap; a :nth-child rule (structural: its siblings
 * restyled); a + sibling rule (the box built again whole); an inline
 * item, a moved item and a run of text (all three: the box built again
 * whole); a display:none item; a wrapping box; an order:-1 item; a
 * nested flex item; a box emptied to one item, then filled. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.f { display: flex; margin: 4px 10px; background: #eef; }
.f > div { border: 1px solid #000; padding: 2px 6px; margin-right: 4px; }
#c { flex-direction: column; gap: 3px; }
#n > :nth-child(odd) { background: #fc8; }
#s > .x + div { color: #c00; }
#w { flex-wrap: wrap; width: 400px; }
#w > div { width: 30%; }
.inner { display: flex; }
.inner span { padding: 0 5px; background: #cfc; }
</style>
</head>
<body>
<div id="a" class="f"><div>a1</div><div>a2</div><div>a3</div></div>
<div id="b" class="f"><div>b1</div><div>b2</div><div>b3</div><div>b4</div></div>
<div id="c" class="f"><div>c1</div><div>c2</div></div>
<div id="n" class="f"><div>n1</div><div>n2</div><div>n3</div></div>
<div id="s" class="f"><div class="x">s1</div><div>s2</div></div>
<div id="i" class="f"><div>i1</div></div>
<div id="m" class="f"><div id="m1">m1</div><div>m2</div><div>m3</div></div>
<div id="t" class="f"><div>t1</div>text run<div>t2</div></div>
<div id="h" class="f"><div>h1</div></div>
<div id="w" class="f"><div>w1</div><div>w2</div></div>
<div id="o" class="f"><div>o1</div><div>o2</div></div>
<div id="nest" class="f"><div>nest1</div></div>
<div id="e" class="f"><div>e1</div><div>e2</div><div>e3</div></div>
<p>After the flex boxes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function el(tag, text, attrs) {
		var d = document.createElement(tag);
		if (text) d.textContent = text;
		for (var k in attrs || {}) d.setAttribute(k, attrs[k]);
		return d;
	}
	var ops = [
		function () { $('a').appendChild(el('div', 'a4')); },
		function () { $('a').insertBefore(el('div', 'a1.5'), $('a').children[1]); },
		function () { $('a').insertBefore(el('div', 'a0'), $('a').firstChild); },
		function () { $('b').removeChild($('b').children[1]); },
		function () { $('b').removeChild($('b').lastChild); },
		function () { $('c').insertBefore(el('div', 'c1.5'), $('c').children[1]); },
		function () { $('n').insertBefore(el('div', 'n0'), $('n').firstChild); },
		function () { $('s').insertBefore(el('div', 's1.5'), $('s').children[1]); },
		function () { $('i').appendChild(el('span', 'inline i2')); },
		function () { $('m').appendChild($('m1')); },
		function () { $('t').appendChild(el('div', 't3')); },
		function () { $('h').appendChild(el('div', 'hidden', { style: 'display:none' })); },
		function () { $('w').appendChild(el('div', 'w3')); $('w').appendChild(el('div', 'w4')); },
		function () { $('o').appendChild(el('div', 'o-first', { style: 'order:-1' })); },
		function () { var d = el('div', '', { 'class': 'inner' }); d.appendChild(el('span', 'x')); d.appendChild(el('span', 'y')); $('nest').appendChild(d); },
		function () { $('e').removeChild($('e').children[2]); $('e').removeChild($('e').children[1]); $('e').appendChild(el('div', 'e-new')); }
	], k = 0;
	/* the reference: the same steps, run while the page parses */
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
