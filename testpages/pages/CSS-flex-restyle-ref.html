<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flex restyle ref</title>
<style>
/* Patch 372. A class or style change on a flex or grid container's own
 * box took the full box-tree rebuild ("class change on an element with a
 * non-inline, non-block box"): rte's carousel (slick) writes its track's
 * style -- a flex container of 75-335 boxes -- on every slide. The
 * container is now built again on its own, cascaded afresh, and the page
 * laid out whole. After its steps (250 ms apart) JS-flex-restyle.html
 * must render row for row as CSS-flex-restyle-ref.html, the same steps
 * run while the page parses. Steps: the track's style (width, transform,
 * as slick writes it); its class, which restyles its items through a
 * descendant selector; it hidden and shown by its style; its direction
 * by its style; a grid's class (its columns); a flex in a table cell; a
 * flex nested in a flex; a flex holding an image (still the full
 * rebuild); a flex made a block; a flex made inline-flex (the full
 * rebuild); a class a sibling rule can see (the full rebuild). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.track { display: flex; margin: 4px 10px; }
.track div { border: 1px solid #000; padding: 2px 4px; }
.track.wide div { padding: 2px 14px; color: #c00; }
#gr { display: grid; grid-template-columns: 1fr 1fr; margin: 4px 10px; }
#gr.three { grid-template-columns: 1fr 1fr 1fr; }
#gr div { border: 1px solid #888; }
td { border: 1px solid #000; padding: 2px; }
.fx { display: flex; }
.fx span { padding: 0 6px; }
#outer { display: flex; margin: 4px 10px; background: #eef; }
#inner { display: flex; }
#inner b { padding: 0 4px; }
.on + p { color: #00c; }
</style>
</head>
<body>
<div id="trk" class="track"><div>one</div><div>two <b>bold</b></div><div>three</div><div>four</div></div>
<p>After the track.</p>
<div id="gr"><div>g1</div><div>g2</div><div>g3</div><div>g4</div><div>g5</div><div>g6</div></div>
<table><tr><td><div id="tf" class="fx"><span>cell a</span><span>cell b</span></div></td><td>x</td></tr></table>
<div id="outer"><div id="inner"><b>in1</b><b>in2</b></div><div>outer two</div></div>
<div id="im" class="fx"><span>img</span><img src="opimg-20.png" width="20" height="20"><span>after</span></div>
<div id="tb" class="fx"><span>to block a</span><span>to block b</span></div>
<div id="ti" class="fx"><span>to inline a</span><span>to inline b</span></div>
<div id="sib" class="fx"><span>sibling rule</span></div>
<p>Coloured by the sibling rule.</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('trk').setAttribute('style', 'opacity:1;width:500px;transform:translate(0px, 0px)'); },
		function () { $('trk').className = 'track wide'; },
		function () { $('trk').style.display = 'none'; },
		function () { $('trk').style.display = ''; },
		function () { $('trk').style.flexDirection = 'column'; },
		function () { $('gr').className = 'three'; },
		function () { $('tf').style.justifyContent = 'flex-end'; },
		function () { $('inner').style.flexDirection = 'column'; },
		function () { $('im').style.justifyContent = 'center'; },
		function () { $('tb').style.display = 'block'; },
		function () { $('ti').style.display = 'inline-flex'; },
		function () { $('sib').className = 'fx on'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
