<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS flow-root (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.fr { display: flow-root; background: #eef; }
.fl { float: left; width: 80px; height: 60px; background: #f99; }
#outer { float: left; width: 100px; height: 50px; background: #9cf; }
#m { display: flow-root; background: #ffd; }
#mc { margin-top: 20px; height: 10px; background: #000; }
</style>
<script>
/* Patch 204: display: flow-root (the modern clearfix) is a block that
 * establishes a block formatting context: it contains its floats, stays
 * clear of floats outside it, and its children's margins do not
 * collapse through it. libcss dropped the declaration. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FLOWROOT204: ' + k + '/' + N + ' passed';
		document.title = 'CSS flow-root (' + k + '/' + N + ')';
	}
	function run() {
		var c = r('c1'), f = r('f1');
		t(1, c.bottom >= f.bottom - 0.5,
			'contains its float (box bottom ' + c.bottom + ', float bottom ' +
			f.bottom + ')');
		var cs = getComputedStyle($('c1')).display;
		t(2, cs === 'flow-root', 'computed display ' + cs);
		var b = r('beside'), o = r('outer');
		t(3, b.left >= o.right - 0.5, 'keeps clear of an outside float (' +
			b.left + ' >= ' + o.right + ')');
		var m = r('m'), mc = r('mc');
		t(4, Math.abs(mc.top - m.top - 20) <= 1,
			'child margin stays inside (' + (mc.top - m.top) + 'px)');
	}
	/* at load, not 300 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">FLOWROOT204: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div class="fr" id="c1"><div class="fl" id="f1"></div>short text</div>
<div id="outer"></div>
<div class="fr" id="beside">beside the float</div>
<div style="clear:both"></div>
<div id="m"><div id="mc"></div></div>
</body>
</html>
