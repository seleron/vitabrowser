<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS calc font-size that loses the cascade (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
:root { --m: clamp(26px, 2vw, 30px); }
h3, h4, h5, h6 { margin: 0; }
h3 { font-size: var(--m); }
body .s .v { font-size: clamp(40px, 10px + 3vw, 160px); }
.imp { font-size: min(44px, 50vw) !important; }
body .s #i { font-size: calc(10px + 2px); }
h5 { font-size: var(--m); }
body .s .p { font-size: 34px; }
</style>
<script>
/* Patch 330 (wordpress.org/news): a calc()/min()/max()/clamp() font-size
 * stored its expression in the style's calc slot before the cascade
 * decided whether it won, so a LOSING calc font-size replaced the
 * winner's expression and the winner rendered at the loser's size.
 * WordPress's "7.1.4" (clamp(60px, 20vw - 96px, 160px), 96px) drew at
 * 36px: h3's var() font-size, replayed after the cascade, lost on
 * specificity but kept its clamp in the slot. Chromium-verified. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function fs(id) { return parseFloat(getComputedStyle($(id)).fontSize); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FSCALC330: ' + k + '/' + N + ' passed';
		document.title = 'CSS calc font-size (' + k + '/' + N + ')';
	}
	function run() {
		var want = Math.min(160, Math.max(40, 10 + 0.03 *
			(document.documentElement.clientWidth || innerWidth)));
		t(1, Math.abs(fs('v') - want) <= 1, 'a specific clamp() beats a ' +
			'var() clamp() (' + fs('v') + ' vs ' + want.toFixed(1) + ')');
		t(2, Math.abs(fs('i') - 44) <= 1, '!important min() beats a later, ' +
			'more specific calc() (' + fs('i') + ' vs 44)');
		t(3, Math.abs(fs('p') - 34) <= 1, 'a specific length beats a var() ' +
			'clamp() (' + fs('p') + ' vs 34)');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">FSCALC330: 0/3 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<div class="s">
<h3 class="v" id="v">V</h3>
<h4 class="imp" id="i">I</h4>
<h5 class="p" id="p">P</h5>
</div>
</body>
</html>
