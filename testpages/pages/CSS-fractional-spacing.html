<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS fractional spacing (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.ib { display: inline-block; }
#em { letter-spacing: 0.1em; }
#half { letter-spacing: 0.5px; }
#ws { word-spacing: 2.5px; }
#grid { width: 400px; letter-spacing: -0.31em; }
#grid > div { display: inline-block; width: 25%; height: 10px; letter-spacing: normal; background: #fcc; }
</style>
<script>
/* Patch 227: fractional letter- and word-spacing are kept (patch 220
 * truncated each to whole pixels per character: 0.1em at 16px added 1px a
 * letter, not 1.6), and a run's width is rounded once. With it the
 * negative letter-spacing used to butt inline-block columns together
 * (Pure CSS grids: -0.31em) leaves no gap. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function w(id) { return $(id).getBoundingClientRect().width; }
	function near(a, b) { return Math.abs(a - b) <= 1; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FRACSP227: ' + k + '/' + N + ' passed';
		document.title = 'CSS fractional spacing (' + k + '/' + N + ')';
	}
	function run() {
		var d1 = w('em') - w('base'), d2 = w('half') - w('base'), d3 = w('ws') - w('wbase');
		t(1, near(d1, 16), 'letter-spacing 0.1em x 10 letters: +' + Math.round(d1));
		t(2, near(d2, 5), 'letter-spacing 0.5px x 10 letters: +' + Math.round(d2));
		t(3, near(d3, 10), 'word-spacing 2.5px x 4 spaces: +' + Math.round(d3));
		var g = $('grid').getBoundingClientRect(), c1 = $('g1').getBoundingClientRect(),
			c4 = $('g4').getBoundingClientRect();
		t(4, Math.round(c4.top) === Math.round(c1.top) && near(c4.left - g.left, 300),
			'-0.31em letter-spacing grid: four 25% columns on one row (' +
			Math.round(c4.top - c1.top) + ', ' + Math.round(c4.left - g.left) + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">FRACSP227: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div><span class="ib" id="base">abcdefghij</span></div>
<div><span class="ib" id="em">abcdefghij</span></div>
<div><span class="ib" id="half">abcdefghij</span></div>
<div><span class="ib" id="wbase">a b c d e</span></div>
<div><span class="ib" id="ws">a b c d e</span></div>
<div id="grid"><div id="g1"></div> <div></div> <div></div> <div id="g4"></div></div>
</body>
</html>
