<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS frames local ref</title>
<style>
/* Patch 371. Any change on a page holding an iframe took the full
 * box-tree rebuild: the local path refused "page has frames" outright
 * (rte, guardian). It now runs, keeping what a frame needs: no local
 * rebuild frees a frame's box (its record and its window point at it --
 * a box with a record but no window yet too), and none moves one
 * without the full layout that places its window. After its steps
 * (250 ms apart) JS-frames-local.html must render row for row as
 * CSS-frames-local-ref.html, the same steps run while the page parses.
 * Steps: a paragraph's text above the frame; a paragraph's class (its
 * margin); a paragraph hidden by its style; a block inserted into a div; a
 * block removed from it; a span's colour below the frame; a block holding a
 * script-made frame appended (full rebuild); a paragraph's text with
 * that frame present; the block with the script-made frame removed (a
 * removed frame: full rebuild); an inline-block holding a frame removed
 * from its line (a frame below the line's top level: full rebuild); the
 * paragraph's class back. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.big { margin-top: 40px; }
#fw { margin: 4px 10px; background: #eee; }
#fw iframe, #p6 iframe { width: 220px; height: 40px; border: 2px solid #000; }
#ib { display: inline-block; border: 1px solid #00c; }
</style>
</head>
<body>
<p id="p1">First paragraph.</p>
<p id="p2">Second paragraph, its class changes.</p>
<div id="blk">
<p id="p3">Third paragraph, hidden by its style.</p>
<p id="p4">Fourth paragraph, removed.</p>
</div>
<div id="fw">before <iframe src="JS-frames-local-child.html"></iframe> after</div>
<p id="p5">Fifth, with a <span id="s5">span</span> that turns red.</p>
<p id="p6">Sixth, with <span id="ib">an inline-block <iframe src="JS-frames-local-child.html"></iframe></span> removed.</p>
<p id="p7">Seventh paragraph, last.</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('p1').textContent = 'First paragraph, now with enough text in it to wrap onto a second line and a third line on the narrow screen of a Vita, which moves the frame below it down.'; },
		function () { $('p2').className = 'big'; },
		function () { $('p3').style.display = 'none'; },
		function () { var p = document.createElement('p'); p.textContent = 'A paragraph a script inserted.'; $('blk').insertBefore(p, $('p4')); },
		function () { $('p4').parentNode.removeChild($('p4')); },
		function () { $('s5').style.color = '#c00'; },
		function () { var d = document.createElement('div'); d.id = 'late'; var f = document.createElement('iframe'); f.src = 'JS-frames-local-child.html'; d.appendChild(f); document.body.appendChild(d); },
		function () { $('p1').textContent = 'First paragraph, shorter again.'; },
		function () { $('late').parentNode.removeChild($('late')); },
		function () { $('ib').parentNode.removeChild($('ib')); },
		function () { $('p2').className = ''; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
