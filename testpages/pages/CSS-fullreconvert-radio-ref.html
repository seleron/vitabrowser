<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS full reconvert radio ref</title>
<style>
/* Static reference of JS-fullreconvert-radio.html's final state: r1 gone,
 * the cell's class 'hl' applied, r3 checked (the gate's tap). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
table { border-collapse: collapse; margin: 4px 10px; }
td { border: 1px solid #000; padding: 2px 4px; }
.hl { background: #ff0; font-weight: bold; }
</style>
</head>
<body>
<form id="f" action="#">
<table><tr><td class="hl">
<input type="radio" name="g" id="r2"> <label for="r2">b</label>
<input type="radio" name="g" id="r3" checked> <label for="r3">c</label>
</td></tr></table>
</form>
<p id="out">elements=2</p>
</body>
</html>
