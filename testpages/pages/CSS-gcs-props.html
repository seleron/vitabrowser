<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS computed style properties (script not run)</title>
<!-- Patch 295: getComputedStyle never answered border-radius, the
     gaps, box-shadow, tab-size or aspect-ratio from the cascade --
     the polyfill's wrapper filled them from its initial-value table
     (or ''), so a stylesheet's values were invisible. The values
     below come from a style sheet, not inline style, on purpose:
     the wrapper answers an inline value when the native one is
     missing, which would mask the miss. Serializations are the
     reference browser's (colour first in a shadow, inset last). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
div.box { width: 40px; height: 10px; }
.r1 { border-radius: 12px; }
.r2 { border-radius: 50%; }
.g1 { row-gap: 7px; column-gap: 9px; }
.s1 { box-shadow: 2px 3px 4px 5px rgb(10, 20, 30); }
.s2 { box-shadow: inset 1px 1px 2px 0px rgba(0, 0, 0, 0.5), 0px 2px 3px 0px rgb(255, 0, 0); }
.t1 { tab-size: 4; }
.a1 { aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<div id="sum">GCSPROPS: 0/9 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<p id="r9" class="wait">9 waiting</p>
<div class="box r1" id="e1"></div>
<div class="box r2" id="e2"></div>
<div class="box g1" id="e3"></div>
<div class="box" id="e4"></div>
<div class="box s1" id="e5"></div>
<div class="box s2" id="e6"></div>
<div class="box t1" id="e7"></div>
<div class="box" id="e8"></div>
<div class="box a1" id="e9"></div>
<script>
(function () {
	var k = 0, N = 9;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GCSPROPS: ' + k + '/' + N + ' passed';
		document.title = 'CSS computed style properties (' + k + '/' + N + ')';
	}
	function eq(n, id, prop, want, text) {
		var got;
		try { got = getComputedStyle($(id))[prop]; } catch (e) { got = 'threw ' + e; }
		t(n, got === want, text + ': ' + got + (got === want ? '' : ' (want ' + want + ')'));
	}
	/* the checks run after load, when the elements have boxes: read
	 * at parse time, getComputedStyle has no cascade to answer from
	 * in this engine (the probe for this patch measured every one of
	 * these properties at its initial value then, colour included) */
	window.addEventListener('load', function () {
		setTimeout(function () {
	eq(1, 'e1', 'borderRadius', '12px', 'border-radius from the sheet');
	eq(2, 'e2', 'borderRadius', '50%', 'a percentage border-radius');
	eq(3, 'e3', 'rowGap', '7px', 'row-gap from the sheet');
	eq(4, 'e3', 'gap', '7px 9px', 'gap composes row then column');	(function () {
		var cs = getComputedStyle($('e4')), bad = [];
		if (cs.rowGap !== 'normal') bad.push('rowGap ' + cs.rowGap);
		if (cs.boxShadow !== 'none') bad.push('boxShadow ' + cs.boxShadow);
		if (cs.aspectRatio !== 'auto') bad.push('aspectRatio ' + cs.aspectRatio);
		if (cs.tabSize !== '8') bad.push('tabSize ' + cs.tabSize);
		t(5, bad.length === 0, 'unset: gap normal, shadow none, aspect auto, tab 8' +
			(bad.length ? ': ' + bad.join(', ') : ''));
	})();
	eq(6, 'e5', 'boxShadow', 'rgb(10, 20, 30) 2px 3px 4px 5px', 'one shadow, colour first');
	eq(7, 'e6', 'boxShadow', 'rgba(0, 0, 0, 0.5) 1px 1px 2px 0px inset, rgb(255, 0, 0) 0px 2px 3px 0px', 'two shadows, inset last');
	eq(8, 'e7', 'tabSize', '4', 'tab-size from the sheet');
	eq(9, 'e9', 'aspectRatio', '16 / 9', 'aspect-ratio from the sheet');
		}, 300);
	});
})();
</script>
</body>
</html>
