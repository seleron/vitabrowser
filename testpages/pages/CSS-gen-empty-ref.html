<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS gen empty ref</title>
<style>
/* Patch 373. A change in a block with generated content (::before /
 * ::after), or content arriving in an empty block, took the full box-tree
 * rebuild ("block is not one line container of plain content": the line
 * rebuild would lose the generated boxes, and an empty block has no
 * line). The block is now built again on its own, as a restyle of its own
 * box (patch 174). After its steps (250 ms apart) JS-gen-empty.html must
 * render row for row as CSS-gen-empty-ref.html, the same steps run while
 * the page parses. Steps: a paragraph's text under ::before; a div's text
 * under ::after; a span's class in a ::before block; content arriving in
 * an empty div; text arriving in an empty paragraph; an empty div styled
 * by :empty filled (its own :empty, cascaded again); a ::before block
 * emptied; text arriving in an emptied paragraph. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
#g1::before { content: "> "; color: #c00; font-weight: bold; }
#g2::after { content: " [end]"; color: #080; }
#g3::before { content: "* "; }
.hot { background: #ff0; }
#e3:empty { height: 12px; background: #ccc; }
#e3 { border: 1px solid #000; }
#g4::before { content: "before "; }
#g4::after { content: " after"; }
</style>
</head>
<body>
<p id="g1">A paragraph with generated content before it.</p>
<div id="g2">A div with generated content after it.</div>
<p id="g3">A <span id="s3">span</span> in a block with ::before.</p>
<div id="e1"></div>
<p id="e2"></p>
<div id="e3"></div>
<p id="g4">Emptied, its generated content stays.</p>
<p id="e4">Emptied, then filled.</p>
<p>Last paragraph.</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('g1').textContent = 'A paragraph whose text a script changed, long enough to wrap onto a second line on the screen of a Vita.'; },
		function () { $('g2').innerHTML = 'Its text <b>changed</b> too.'; },
		function () { $('s3').className = 'hot'; },
		function () { $('e1').innerHTML = 'Content that arrived in an <i>empty</i> div.'; },
		function () { $('e2').textContent = 'Text that arrived in an empty paragraph.'; },
		function () { $('e3').textContent = 'No longer :empty.'; },
		function () { $('g4').textContent = ''; },
		function () { $('e4').textContent = ''; },
		function () { $('e4').textContent = 'Filled again.'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
