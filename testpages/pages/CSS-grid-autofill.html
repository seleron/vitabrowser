<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS grid auto-fill (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.g { display: grid; gap: 10px; margin: 6px 0; background: #eee; }
.g div { height: 12px; background: #69c; }
#g1 { width: 350px; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
#g2 { width: 700px; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
#g3 { width: 700px; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
#g4 { width: 700px; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
#g5 { width: 350px; grid-template-columns: repeat(auto-fill, 150px); }
#g6 { width: 300px; grid-template-columns: 100px 1fr; grid-template-areas: "a b" "c c"; }
#fa { grid-area: a; } #fb { grid-area: b; } #fc { grid-area: c; }
#g7 { width: 300px; grid-template-columns: 100px 100px 100px; }
#n1 { grid-area: 1 / 2 / 2 / 4; }
#n2 { grid-column: 1 / 3; grid-row: 2; }
</style>
<script>
/* Patch 206: grid-template-columns: repeat(auto-fill|auto-fit, ...) makes
 * as many columns as fit the grid's own width. The CSS rewrite guessed
 * the count from a 900px viewport, so a 350px card grid got 8 columns of
 * 35px. Chromium-verified. */
(function () {
	var k = 0, N = 8;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function near(a, b, tol) { return Math.abs(a - b) <= tol; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDFILL206: ' + k + '/' + N + ' passed';
		document.title = 'CSS grid auto-fill (' + k + '/' + N + ')';
	}
	function run() {
		var a = r('a1'), c = r('a3'), d = r('a4');
		t(1, near(a.width, 110, 2) && near(c.top, a.top, 1) &&
			d.top > a.top + 5 && near(d.left, a.left, 1),
			'350px: 3 columns of ' + a.width + ', 4th item wraps');
		var b = r('b1');
		t(2, near(b.width, 108.3, 2), '700px: 6 columns of ' + b.width);
		var f = r('c1'), f2 = r('c2');
		t(3, near(f.width, 345, 2) && near(f2.left, f.right + 10, 2),
			'auto-fit stretches 2 items to ' + f.width);
		var e = r('d1');
		t(4, near(e.width, 108.3, 2),
			'auto-fill keeps empty tracks: ' + e.width);
		var p1 = r('e1'), p3 = r('e3');
		t(5, near(p1.width, 150, 1) && p3.top > p1.top + 5,
			'fixed 150px tracks: 2 per row (' + p1.width + ')');
		var fa = r('fa'), fb = r('fb'), fc = r('fc');
		t(6, near(fa.width, 100, 1) && near(fb.left, fa.right, 1) &&
			near(fc.width, 300, 1) && fc.top > fa.top + 5,
			'template areas: "c c" spans both columns (' + fc.width + ')');
		var g7 = r('g7'), n1 = r('n1');
		t(7, near(n1.left, g7.left + 100, 1) && near(n1.width, 200, 1),
			'grid-area: 1 / 2 / 2 / 4 (' + (n1.left - g7.left) + ', ' +
			n1.width + ')');
		var n2 = r('n2');
		t(8, near(n2.left, g7.left, 1) && near(n2.width, 200, 1) &&
			n2.top > n1.top + 5,
			'grid-column: 1 / 3 (' + n2.width + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">GRIDFILL206: 0/8 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<p id="r8" class="wait">8 pending</p>
<div class="g" id="g1"><div id="a1"></div><div id="a2"></div><div id="a3"></div><div id="a4"></div></div>
<div class="g" id="g2"><div id="b1"></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
<div class="g" id="g3"><div id="c1"></div><div id="c2"></div></div>
<div class="g" id="g4"><div id="d1"></div><div></div></div>
<div class="g" id="g5"><div id="e1"></div><div id="e2"></div><div id="e3"></div></div>
<div class="g" id="g6" style="gap:0"><div id="fa"></div><div id="fb"></div><div id="fc"></div></div>
<div class="g" id="g7" style="gap:0"><div id="n1"></div><div id="n2"></div></div>
</body>
</html>
