<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grid fr sizing with minmax floors and caps (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.g { display: grid; width: 600px; margin-bottom: 4px; }
.g > div { height: 6px; background: #69c; }
#g1 { grid-template-columns: minmax(100px, 1fr) 1fr; }
#g2 { grid-template-columns: minmax(400px, 1fr) 1fr; }
#g3 { grid-template-columns: minmax(0, 300px) 1fr; }
#g4 { width: 960px; grid-template-columns: minmax(240px, 1fr) 32px minmax(0, 768px) minmax(0, 1fr); }
#g5 { grid-template-columns: minmax(15rem, 1fr) 1fr; }
</style>
<script>
/* Patch 337 (developer.mozilla.org): fixes1214 sized a minmax(Npx, 1fr)
 * track as N PLUS its fr share (MDN's 240px sidebar took 469 of 960), and
 * minmax(0, <length>) was folded to 1fr. CSS Grid 12.7.1: a minmax(N, 1fr)
 * track is max(N, its share), re-shared until no floor exceeds its share;
 * 12.6: a minmax(0, N) track grows toward N with the free space before
 * the fr tracks share the rest. Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function w(g, n) { return Math.round($(g).children[n].getBoundingClientRect().width); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDFR337: ' + k + '/' + N + ' passed';
		document.title = 'Grid fr sizing (' + k + '/' + N + ')';
	}
	function run() {
		t(1, w('g1', 0) === 300 && w('g1', 1) === 300, 'minmax(100px, 1fr) 1fr (' + w('g1', 0) + ', ' + w('g1', 1) + ')');
		t(2, w('g2', 0) === 400 && w('g2', 1) === 200, 'minmax(400px, 1fr) 1fr (' + w('g2', 0) + ', ' + w('g2', 1) + ')');
		t(3, w('g3', 0) === 300 && w('g3', 1) === 300, 'minmax(0, 300px) 1fr (' + w('g3', 0) + ', ' + w('g3', 1) + ')');
		t(4, w('g4', 0) === 240 && w('g4', 2) === 688, 'MDN\'s 1-sidebar columns (' + w('g4', 0) + ', ' + w('g4', 2) + ')');
		t(5, w('g5', 0) === 300, 'minmax(15rem, 1fr) 1fr (' + w('g5', 0) + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">GRIDFR337: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<div class="g" id="g1"><div></div><div></div></div>
<div class="g" id="g2"><div></div><div></div></div>
<div class="g" id="g3"><div></div><div></div></div>
<div class="g" id="g4"><div></div><div></div><div></div><div></div></div>
<div class="g" id="g5"><div></div><div></div></div>
</body>
</html>
