<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grid placement in style attributes and element.style (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; width: 960px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.g { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 2px; }
.u { height: 4px; background: #69c; }
.one { grid-column: 1 / span 1; }
.c3 { grid-column: 3 / span 2; }
</style>
<script>
/* Patch 348: grid placement written in a style="" attribute was never
 * rewritten (the placement rewriter works per {} block and an inline
 * style has none), so `style="grid-column: 1 / span 2"` -- common in
 * React and other framework markup -- left the item in one column. And
 * `el.style.gridColumn = ...` was a plain JS property: the style object
 * defines setters only for a fixed list of names. Chromium-verified. */
(function () {
	var k = 0, N = 8;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function top(id) { return Math.round(r(id).top - $(id).parentNode.getBoundingClientRect().top); }
	function near(a, b) { return Math.abs(a - b) <= 1; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDINL348: ' + k + '/' + N + ' passed';
		document.title = 'Grid inline placement (' + k + '/' + N + ')';
	}
	function lw(id) { return 'L' + Math.round(r(id).left) + ' W' + Math.round(r(id).width); }
	function run() {
		t(1, near(r('a1').width, 480), 'grid-column: 1 / span 2 (' + lw('a1') + ')');
		t(2, near(r('a2').left, 240) && near(r('a2').width, 480),
			'grid-column: 2 / 4 (' + lw('a2') + ')');
		t(3, near(r('a3').left, 480) && top('a3') === 4,
			'grid-row: 2; grid-column: 3 (' + lw('a3') + ' T' + top('a3') + ')');
		t(4, near(r('a4').left, 240) && near(r('a4').width, 480),
			'grid-area: 1 / 2 / 2 / 4 (' + lw('a4') + ')');
		t(5, near(r('a5').width, 720), 'el.style.gridColumn = "1 / span 3" (' +
			lw('a5') + ')');
		t(6, near(r('a6').width, 480) && near(r('a6').height, 4),
			'beside other declarations (' + lw('a6') + ' H' +
			Math.round(r('a6').height) + ')');
		t(7, near(r('a7').width, 720), 'inline beats a class rule (' + lw('a7') + ')');
		t(8, near(r('a8').left, 480) && near(r('a8').width, 480),
			'inline grid-row keeps the class\'s grid-column (' + lw('a8') + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">GRIDINL348: 0/8 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<p id="r8" class="wait">8 pending</p>
<div class="g"><div class="u" id="a1" style="grid-column: 1 / span 2"></div></div>
<div class="g"><div class="u" id="a2" style="grid-column:2 / 4"></div></div>
<div class="g"><div class="u"></div><div class="u" id="a3" style="grid-row: 2; grid-column: 3"></div></div>
<div class="g"><div class="u" id="a4" style="grid-area: 1 / 2 / 2 / 4"></div></div>
<div class="g"><div class="u" id="a5"></div></div>
<div class="g"><div id="a6" style="height:4px; grid-column: span 2; background:#69c"></div></div>
<div class="g"><div class="u one" id="a7" style="grid-column: 1 / span 3"></div></div>
<div class="g"><div class="u c3" id="a8" style="grid-row: 1"></div></div>
<script>document.getElementById('a5').style.gridColumn = '1 / span 3';</script>
</body>
</html>
