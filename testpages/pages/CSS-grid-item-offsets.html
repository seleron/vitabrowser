<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grid items: margins, borders, alignment and the container height (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; width: 960px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.g { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 6px; background: #eee; }
.i { height: 10px; background: #69c; }
#a1 { margin-top: 12px; }
#a2 { border: 3px solid #000; }
#a3 { margin: 8px 0 0 5px; border-top: 4px solid #000; border-left: 2px solid #000; }
.c { align-items: center; height: 60px; }
.e { align-items: end; height: 60px; }
#a4 { margin-top: 10px; }
#a5 { margin-bottom: 10px; border-bottom: 4px solid #000; }
#g6 { height: 10px; }
#a6 { height: 30px; }
#g7 { height: 60px; grid-template-rows: 20px auto; }
</style>
<script>
/* Patch 349: a grid item's y and x are its padding edge, as everywhere in
 * NetSurf, but grid placement left out the item's top margin and its top
 * and left borders. An item with margin-top sat on the row's top edge,
 * and a bordered one pushed its border above and left of its cell. Also,
 * center/end alignment compared the content height, not the outer
 * height. And the grid's own definite `height` was replaced by its rows'
 * total: a `height: 60px` grid shrank to its content, and the default
 * align-content (normal/stretch) never grew auto rows into it.
 * Chromium-verified. */
(function () {
	var k = 0, N = 7;
	function $(id) { return document.getElementById(id); }
	function rel(i) {
		var g = $('g' + i).getBoundingClientRect(), a = $('a' + i).getBoundingClientRect();
		return { t: Math.round(a.top - g.top), l: Math.round(a.left - g.left),
			h: Math.round(a.height), gh: Math.round(g.height) };
	}
	function d(o) { return 'T' + o.t + ' L' + o.l + ' gH' + o.gh; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDOFS349: ' + k + '/' + N + ' passed';
		document.title = 'Grid item offsets (' + k + '/' + N + ')';
	}
	function run() {
		var o;
		o = rel(1); t(1, o.t === 12 && o.gh === 22, 'margin-top: 12px (' + d(o) + ')');
		o = rel(2); t(2, o.t === 0 && o.l === 0 && o.gh === 16,
			'3px border inside the cell (' + d(o) + ')');
		o = rel(3); t(3, o.t === 8 && o.l === 5, 'margin 8/5 + borders (' + d(o) + ')');
		o = rel(4); t(4, o.t === 30 && o.gh === 60,
			'align-items: center by outer height, height: 60px kept (' + d(o) + ')');
		o = rel(5); t(5, o.t === 36 && o.gh === 60,
			'align-items: end by outer height (' + d(o) + ')');
		o = rel(6); t(6, o.gh === 10 && o.h === 30,
			'height: 10px stands; the item overflows (' + d(o) + ' H' + o.h + ')');
		o = rel(7); t(7, o.t === 20 && o.gh === 60,
			'an auto row after a 20px row starts at 20 (' + d(o) + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">GRIDOFS349: 0/7 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<div class="g" id="g1"><div class="i" id="a1"></div></div>
<div class="g" id="g2"><div class="i" id="a2"></div></div>
<div class="g" id="g3"><div class="i" id="a3"></div></div>
<div class="g c" id="g4"><div class="i" id="a4"></div></div>
<div class="g e" id="g5"><div class="i" id="a5"></div></div>
<div class="g" id="g6"><div class="i" id="a6"></div></div>
<div class="g" id="g7"><div class="i"></div><div class="i"></div><div class="i"></div><div class="i"></div><div class="i" id="a7"></div></div>
</body>
</html>
