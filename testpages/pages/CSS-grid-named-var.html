<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grid columns with line names and var() (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
:root { --side: 15rem; --gap: 2rem;
	--cols: [full-start side-start] minmax(var(--side), 1fr) [side-end] var(--gap) [content-start] 1fr [content-end]; }
@media print { :root { --cols: 1fr; } }
.g { display: grid; margin-bottom: 4px; }
.g > div { height: 8px; background: #69c; }
#g1 { grid-template-columns: 240px 32px 1fr; }
#g2 { grid-template-columns: [a] 240px [b] 32px [c] 1fr [d]; }
#g3 { grid-template-columns: var(--cols); }
#g4 { grid-template-columns: var(--missing, 200px 1fr); }
</style>
<script>
/* Patch 336 (developer.mozilla.org): grid-template-columns is compiled to
 * -macsurf-grid text before libcss parses the sheet. A [line-name] list
 * counted as a track, and var(--layout) counted as ONE track, so MDN's
 * page grid collapsed to a single column with the table of contents over
 * the article. Line names are skipped; a var() is expanded from this
 * sheet's own definition (not the @media print one); rem minmax floors
 * are understood. Leg 3 checks placement, not Chromium's exact minmax
 * widths, which the -macsurf-grid tracks approximate. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDNAMES336: ' + k + '/' + N + ' passed';
		document.title = 'Grid line names and var() (' + k + '/' + N + ')';
	}
	function run() {
		t(1, Math.round(r('a1').width) === 240 && Math.round(r('c1').left) === 272,
			'plain tracks (' + Math.round(r('a1').width) + ', ' + Math.round(r('c1').left) + ')');
		t(2, Math.round(r('a2').width) === 240 && Math.round(r('c2').left) === 272,
			'line names are not tracks (' + Math.round(r('a2').width) + ', ' +
			Math.round(r('c2').left) + ')');
		t(3, Math.round(r('a3').left) === 0 && r('a3').width >= 240 &&
			Math.round(r('c3').left - r('a3').right) === 32 && r('c3').top === r('a3').top,
			'var() with names, minmax(rem) and a print override (' +
			Math.round(r('a3').width) + ', gap ' + Math.round(r('c3').left - r('a3').right) + ')');
		t(4, Math.round(r('a4').width) === 200 && r('b4').top === r('a4').top,
			'a var() fallback (' + Math.round(r('a4').width) + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">GRIDNAMES336: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div class="g" id="g1"><div id="a1"></div><div></div><div id="c1"></div></div>
<div class="g" id="g2"><div id="a2"></div><div></div><div id="c2"></div></div>
<div class="g" id="g3"><div id="a3"></div><div></div><div id="c3"></div></div>
<div class="g" id="g4"><div id="a4"></div><div id="b4"></div></div>
</body>
</html>
