<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nested grids and grid padding (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.outer { display: grid; grid-template-columns: 240px 32px 1fr; margin-bottom: 4px; }
ul { display: grid; list-style: none; margin: 0; padding: 0; }
li { background: #69c; height: 6px; margin: 1px 0; }
.g { display: grid; grid-template-columns: 100px 1fr; background: #eee; margin-bottom: 4px; }
.g > div { height: 6px; background: #69c; }
#p1 { padding: 10px 16px; }
#p2 { border-left: 4px solid #000; border-top: 3px solid #000; padding-inline: 16px; }
</style>
<script>
/* Patches 341/342 (developer.mozilla.org): 341 -- -macsurf-grid's NONE
 * and INHERIT share the value 0, so compose gave every element without
 * its own grid its parent's: a plain `display: grid` list inside a grid
 * laid out on the ancestor's tracks (MDN's table of contents spread
 * across the page columns). 342 -- grid items ignored the container's
 * padding (they sat on its border edge). Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDNEST341: ' + k + '/' + N + ' passed';
		document.title = 'Nested grids and grid padding (' + k + '/' + N + ')';
	}
	function run() {
		t(1, r('l2').left === r('l1').left && r('l2').top > r('l1').top &&
			Math.round(r('l1').width) === 240,
			'a grid list inside a grid stays one column (' + Math.round(r('l2').left) +
			', ' + Math.round(r('l1').width) + ')');
		t(2, Math.round(r('a1').left) === 16 && Math.round(r('a1').top - r('p1').top) === 10,
			'padding offsets the items (' + Math.round(r('a1').left) + ', ' +
			Math.round(r('a1').top - r('p1').top) + ')');
		t(3, Math.round(r('a2').left) === 116 && Math.round(r('a2').width) === 828,
			'the second track after the padding (' + Math.round(r('a2').left) + ', ' +
			Math.round(r('a2').width) + ')');
		t(4, Math.round(r('b1').left) === 20 && Math.round(r('b1').top - r('p2').top) === 3,
			'border and padding (' + Math.round(r('b1').left) + ', ' +
			Math.round(r('b1').top - r('p2').top) + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">GRIDNEST341: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div class="outer"><aside><ul><li id="l1"></li><li id="l2"></li><li></li></ul></aside><div></div><div></div></div>
<div class="g" id="p1"><div id="a1"></div><div id="a2"></div></div>
<div class="g" id="p2"><div id="b1"></div><div></div></div>
</body>
</html>
