<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grids: wide uniform repeats, calc max-width, item margins, per-axis placement (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; width: 960px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.u { height: 4px; background: #69c; margin-bottom: 2px; }
.g24 { display: grid; grid-template-columns: repeat(24, 1fr); column-gap: 16px; margin-bottom: 2px; }
.g12 { display: grid; grid-template-columns: repeat(12, 1fr); margin-bottom: 2px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 2px; }
.sec { display: grid; grid-template-columns: 960px; margin-bottom: 2px; }
#mw { max-width: calc(100% - 32px); }
#gmw { max-width: calc(100% - 32px); }
#s16 { grid-column: 1 / span 16; }
#s8 { grid-column: 1 / span 8; }
#lh { grid-column-start: 1; grid-column-end: span 2; }
#gi { width: 100%; margin-inline: 16px; max-width: calc(100% - 32px); }
#fc { min-width: fit-content; }
#fc > div { grid-column: 1 / span 8; white-space: nowrap; font-size: 8px; }
.x { grid-area: 1 / 19 / span 2 / span 6; }
@media screen and (max-width: 1007px) { .x { grid-column: 17 / span 8; } }
@media screen and (max-width: 1007px) { .x { grid-row: 1 / span 3; } }
.y { grid-column: 9 / span 16; }
.c16 { grid-column: 1 / span 16; }
.c8 { grid-column: 1 / span 8; }
@media screen and (max-width: 1279px) { .y { grid-row: 1 / span 1; } }
</style>
<script>
/* Patch 347 (bbc.com/news): the lead story was crushed to ~70px. Its
 * page grid is `repeat(24, 1fr)` -- cut to 5 tracks by the in-place
 * rewrite, so every span filled the row -- with `max-width: calc(100% -
 * 32px)`, which resolved to 0 (calc with % had no reference width).
 * Then: grid items dropped their min/max-width and left margin,
 * `min-width: fit-content` acted as max-content in the intrinsic pass, a
 * count-form grid's min-content took the widest spanning item, and a
 * `grid-row:` in its own @media block wiped an earlier `grid-column:`.
 * The viewport is 960 wide, so the max-width media blocks apply.
 * Chromium-verified (to 1px). */
(function () {
	var k = 0, N = 9;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function near(a, b) { return Math.abs(a - b) <= 1; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDUNI347: ' + k + '/' + N + ' passed';
		document.title = 'Grid uniform placement (' + k + '/' + N + ')';
	}
	function run() {
		t(1, near(r('mw').width, 928), 'block max-width: calc(100% - 32px) (' +
			r('mw').width + ' vs 928)');
		t(2, near(r('gmw').width, 928), 'grid max-width: calc(100% - 32px) (' +
			r('gmw').width + ' vs 928)');
		t(3, near(r('s16').width, 635), 'repeat(24, 1fr) gap 16, span 16 (' +
			r('s16').width + ' vs 635)');
		t(4, near(r('s8').width, 640), 'repeat(12, 1fr), span 8 (' +
			r('s8').width + ' vs 640)');
		t(5, near(r('lh').width, 480), 'grid-column-end: span 2 (' +
			r('lh').width + ' vs 480)');
		t(6, near(r('gi').left, 16) && near(r('gi').width, 928),
			'grid item margin-inline + max-width (L' + r('gi').left +
			' W' + r('gi').width + ' vs L16 W928)');
		t(7, near(r('fc').width, 635), 'min-width: fit-content grid of a ' +
			'spanning nowrap item (' + r('fc').width + ' vs 635)');
		t(8, near(r('x1').left, 651) && near(r('x1').width, 309),
			'grid-row in its own @media keeps grid-column (L' +
			r('x1').left + ' W' + r('x1').width + ' vs L651 W309)');
		t(9, near(r('y1').left, 325) && near(r('y1').width, 635),
			'row-only rule after a column rule (L' + r('y1').left + ' W' +
			r('y1').width + ' vs L325 W635)');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">GRIDUNI347: 0/9 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<p id="r8" class="wait">8 pending</p>
<p id="r9" class="wait">9 pending</p>
<div class="u" id="mw"></div>
<div class="g24" id="gmw"><div class="u"></div></div>
<div class="g24"><div class="u" id="s16"></div></div>
<div class="g12"><div class="u" id="s8"></div></div>
<div class="g4"><div class="u" id="lh"></div></div>
<div class="sec"><div class="g24" id="gi"><div class="u c16"></div></div></div>
<div class="g24"><div class="c16"><div class="g24" id="fc"><div>aaaa bbbb cccc dddd eeee ffff gggg hhhh iiii jjjj kkkk llll mmmm nnnn oooo pppp qqqq rrrr ssss tttt uuuu vvvv wwww xxxx yyyy zzzz aaaa bbbb cccc dddd eeee ffff gggg hhhh</div></div></div></div>
<div class="g24"><div class="u c8"></div><div class="u x" id="x1"></div></div>
<div class="g24"><div class="u c8"></div><div class="u y" id="y1"></div></div>
</body>
</html>
