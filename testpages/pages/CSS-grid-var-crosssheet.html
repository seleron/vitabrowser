<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grid columns: keyword tracks and a var() from another sheet (script not run)</title>
<style>
:root { --xcols: [a] 200px [b] 2rem [c] 1fr; }
</style>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.g { display: grid; width: 600px; margin-bottom: 4px; }
.g > div { height: 6px; background: #69c; }
#g1 { grid-template-columns: max-content 1fr; }
#g2 { grid-template-columns: min-content 100px 1fr; }
#g3 { grid-template-columns: var(--xcols); }
</style>
<script>
/* Patch 340: (1) a var() in a grid track list is expanded from a
 * definition in ANOTHER sheet (MDN defines --layout-* in its global sheet
 * and lays out the page in a chunk sheet; the grid kept one column); (2)
 * the fallback patch 336 dropped is restored -- min-content / max-content
 * and other keyword tracks are one 1fr track each (emitted verbatim they
 * ENDED the -macsurf-grid track list). Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'GRIDXSHEET340: ' + k + '/' + N + ' passed';
		document.title = 'Grid keyword tracks and cross-sheet var() (' + k + '/' + N + ')';
	}
	function run() {
		t(1, r('b1').top === r('a1').top && r('b1').left > r('a1').left,
			'max-content 1fr keeps two tracks (' + Math.round(r('b1').left) + ')');
		t(2, r('c2').top === r('a2').top && r('c2').left > r('b2').left,
			'min-content 100px 1fr keeps three tracks (' + Math.round(r('c2').left) + ')');
		t(3, Math.round(r('a3').width) === 200 && Math.round(r('c3').left) === 232,
			'var() defined in another sheet (' + Math.round(r('a3').width) + ', ' +
			Math.round(r('c3').left) + ')');
		t(4, Math.round(r('c3').width) === 368, 'the 1fr track takes the rest (' +
			Math.round(r('c3').width) + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">GRIDXSHEET340: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div class="g" id="g1"><div id="a1">x</div><div id="b1"></div></div>
<div class="g" id="g2"><div id="a2">x</div><div id="b2"></div><div id="c2"></div></div>
<div class="g" id="g3"><div id="a3"></div><div></div><div id="c3"></div></div>
</body>
</html>
