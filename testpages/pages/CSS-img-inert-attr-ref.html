<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS img inert attr ref</title>
<style>
/* Patch 468. An inert attribute no sheet can see (data-*, aria-*) on an
 * element whose box is an object: youtube's display:block <img> gains
 * data-atf and data-iml. The full rebuild would build the same box; 383's
 * and 408's no-ops left object boxes out, and the change declined ("block
 * is not one line container of plain content") into it. Now nothing to
 * rebuild. A span appended in the same task makes the batch structural
 * (a batch of unseen attributes alone is dropped before the local path,
 * 313), as youtube's was. Row for row as CSS-img-inert-attr-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
#pic { display: block; margin: 4px 10px; }
</style>
</head>
<body>
<p>A block image below.</p>
<img id="pic" src="lazyimg-01.png" width="64" height="64" alt="">
<p id="after">Text after the image.</p>
<script>
(function () {
	function op() {
		var p = document.getElementById('pic');
		p.setAttribute('data-atf', '1');
		p.setAttribute('data-iml', '1234');
		p.setAttribute('aria-hidden', 'true');
		var s = document.createElement('span');
		s.textContent = ' A span appended.';
		document.getElementById('after').appendChild(s);
	}
	op();
})();
</script>
</body>
</html>
