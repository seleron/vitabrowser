<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS !important operands (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
.g { display: grid; grid-template-columns: 50px; width: 50px; margin: 4px 0; }
.g span { display: block; height: 10px; background: #36c; }
#plain { row-gap: 8px; }
#imp { row-gap: 8px !important; }
/* Stack Overflow's OneTrust cookie banner: three shadows, !important */
#banner {
  max-height: 70%;
  height: 40px;
  width: 200px;
  background: #eee;
  border-radius: 10px !important;
  box-shadow:
    0 4px 13px rgba(0, 0, 0, 0.13),
    0 3px 8px rgba(0, 0, 0, 0.09),
    0 1px 4px rgba(0, 0, 0, 0.09) !important;
}
/* every property the walker had no case for, !important, then row-gap:
 * a wrong operand count anywhere shifts what follows */
#many {
  accent-color: #c00 !important;
  caret-color: #0c0 !important;
  text-decoration-color: #00c !important;
  text-decoration-thickness: 3px !important;
  aspect-ratio: 2 / 1 !important;
  background-size: 20px 10px !important;
  tab-size: 4 !important;
  border-radius: 6px !important;
  box-shadow: 0 1px 2px #000, 0 2px 4px #333, inset 0 0 0 1px #666 !important;
  text-shadow: 1px 1px 2px #000 !important;
  transform: translate(0, 0) !important;
  background-image: linear-gradient(#fff, #eee) !important;
  row-gap: 8px !important;
}
</style>
</head>
<body>
<div id="sum">IMPORTANT264: 0/3 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<div class="g" id="plain"><span></span><span></span></div>
<div class="g" id="imp"><span></span><span></span></div>
<div id="banner">banner</div>
<div class="g" id="many"><span></span><span></span></div>
<script>
/* Patch 264 (libcss): "!important" is applied by walking a declaration's
 * bytecode and flagging each opcode; the walk skipped operands only for
 * the properties it knew, and none of those MacSurf / VitaBrowser added.
 * Their operands were flagged as if opcodes: "row-gap: 8px !important"
 * laid out 9px (8.0 | 1.0 in libcss's fixed point), "border-radius: 10px
 * !important" drew 11px, and box-shadow's list derailed the walk -- Stack
 * Overflow's OneTrust banner crashed the browser in the cascade. The
 * build before this patch crashes on this page. Chromium-verified. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'IMPORTANT264: ' + k + '/' + N + ' passed';
		document.title = 'CSS !important operands (' + k + '/' + N + ')';
	}
	function gap(id) {
		var s = $(id).children;
		return s[1].getBoundingClientRect().top - s[0].getBoundingClientRect().top;
	}
	/* measured once the page is laid out: after load, retried while
	 * the boxes have no size yet (up to 5 s) */
	var tries = 0;
	function measure() {
		var p = gap('plain'), i = gap('imp'), m = gap('many'), b = $('banner').getBoundingClientRect();
		if ((p === 0 || b.height === 0) && ++tries < 50) { setTimeout(measure, 100); return; }
		t(1, p === 18 && i === p, 'row-gap: 8px !important is 8px (rows ' + p + ' / ' + i + ' apart)');
		t(2, b.height > 0, 'a rule with three !important shadows renders (' + b.height + ')');
		t(3, m === p, 'after twelve !important declarations, row-gap is still 8px (' + m + ')');
	}
	window.addEventListener('load', function () { setTimeout(measure, 100); });
})();
</script>
</body>
</html>
