<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS inline block inner ref</title>
<style>
/* Patch 456. A block (or flex box) built again whole whose parent is an
 * inline-block, inline-flex or inline-grid box ("restyled flex or grid box
 * is not in a block": google, wpblog, youtube) declined into the full
 * rebuild. That parent sits in a line of its enclosing block, so the
 * enclosing block is built again whole now. Steps (each flushed alone by a
 * layout read): a block inside an inline-block given new content that is
 * not plain inline (a nested <div>); a flex item inside an inline-flex
 * given a new child. Row for row as CSS-inline-block-inner-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, .line { margin: 4px 10px; }
.ib { display: inline-block; border: 1px solid #888; padding: 2px; vertical-align: top; }
.ib > div { background: #eef; }
.if { display: inline-flex; border: 1px solid #484; padding: 2px; }
.if > div { display: flex; background: #efe; margin: 0 2px; }
.if span { padding: 0 4px; }
</style>
</head>
<body>
<div class="line">A line with <div class="ib"><div id="a"><div>new block one</div><div>new block two</div></div></div> an inline-block holding a block.</div>
<div class="line">A line with <div class="if"><div id="f"><span>one</span><span>added</span></div><div><span>two</span></div></div> an inline-flex holding flex items.</div>
<p>Last paragraph.</p>
</body>
</html>
