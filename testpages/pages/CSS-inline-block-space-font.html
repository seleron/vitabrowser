<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS inline-block space font (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.ib { display: inline-block; font-size: 16px; background: #ccf; }
#cols { width: 400px; font-size: 0; }
#cols > div { display: inline-block; width: 25%; height: 10px; font-size: 16px; background: #fdb; }
#big { font-size: 32px; }
#zero { font-size: 0; }
</style>
<script>
/* Patch 226: the space between inline-blocks is set in the font of the
 * text around them, not their own (patch 221 measured it in the
 * inline-block's font). So font-size: 0 on the parent -- the common way to
 * butt inline-block columns together -- leaves no gap, and a larger parent
 * font a larger one. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function gap(a, b) { return Math.round(r(b).left - r(a).right); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'IBFONT226: ' + k + '/' + N + ' passed';
		document.title = 'CSS inline-block space font (' + k + '/' + N + ')';
	}
	function run() {
		t(1, Math.round(r('c4').top) === Math.round(r('c1').top) &&
			Math.round(r('c4').left - r('cols').left) === 300,
			'font-size: 0 parent: four 25% columns on one row (' +
			Math.round(r('c4').top - r('c1').top) + ', ' +
			Math.round(r('c4').left - r('cols').left) + ')');
		var sp32 = Math.round(r('w2').width - r('w1').width);
		t(2, sp32 >= 7 && gap('b1', 'b2') === sp32,
			'the gap is a space of the parent\'s 32px font (' + gap('b1', 'b2') +
			' vs ' + sp32 + ')');
		t(3, gap('z1', 'z2') === 0, 'inside a font-size: 0 span: no gap (' +
			gap('z1', 'z2') + ')');
		var sp16 = Math.round(r('v2').width - r('v1').width);
		t(4, gap('n1', 'n2') === sp16, 'a 16px parent: a 16px space (' +
			gap('n1', 'n2') + ' vs ' + sp16 + ')');
	}
	/* at load, not 300 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">IBFONT226: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div id="cols"><div id="c1"></div> <div></div> <div></div> <div id="c4"></div></div>
<div id="big"><span class="ib" id="b1">aa</span> <span class="ib" id="b2">bb</span></div>
<div id="big2" style="font-size: 32px"><span style="display: inline-block" id="w1">aa</span></div>
<div style="font-size: 32px"><span style="display: inline-block" id="w2">a a</span></div>
<div><span id="zero"><span class="ib" id="z1">aa</span> <span class="ib" id="z2">bb</span></span></div>
<div><span class="ib" id="n1">aa</span> <span class="ib" id="n2">bb</span></div>
<div><span class="ib" id="v1">aa</span></div>
<div><span class="ib" id="v2">a a</span></div>
</body>
</html>
