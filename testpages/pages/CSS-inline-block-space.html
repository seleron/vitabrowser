<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS inline-block space (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.ib { display: inline-block; background: #ccf; }
#menu { list-style: none; padding: 0; margin: 0; }
#menu li { display: inline-block; background: #fdb; }
#shrink { float: left; background: #efe; }
</style>
<script>
/* Patch 221: the collapsed space between atomic inlines -- inline-blocks,
 * images, buttons -- is kept, as in a browser. It was dropped (only
 * text and inline boxes carried it), so inline-block menus, image rows
 * and button pairs ran together. Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function m(id, side) { return parseFloat(getComputedStyle($(id))['margin' + side]) || 0; }
	/* the gap between border boxes, less the margins on either side */
	function gap(a, b) { return Math.round(r(b).left - r(a).right - m(a, 'Right') - m(b, 'Left')); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'IBSPACE221: ' + k + '/' + N + ' passed';
		document.title = 'CSS inline-block space (' + k + '/' + N + ')';
	}
	function run() {
		/* a space in this font: "a a" less "aa" */
		var sp = Math.round(r('t2').width - r('t1').width);
		t(1, sp >= 3 && sp <= 6 && gap('a1', 'a2') === sp,
			'space between inline-blocks is one space (' +
			gap('a1', 'a2') + ' vs ' + sp + ')');
		t(2, gap('c1', 'c2') === sp, 'newline between inline-blocks: ' +
			gap('c1', 'c2'));
		t(3, gap('m1', 'm2') === sp && gap('m2', 'm3') === sp,
			'inline-block menu items: ' + gap('m1', 'm2') + ', ' + gap('m2', 'm3'));
		t(4, gap('i1', 'i2') === sp && gap('b1', 'b2') === sp,
			'images and buttons: ' + gap('i1', 'i2') + ', ' + gap('b1', 'b2'));
		var w = Math.round(r('shrink').width),
			want = Math.round(r('s2').right - r('s1').left);
		var parts = Math.round(r('s1').width + r('s2').width) + sp;
		t(5, w === want && Math.abs(w - parts) <= 1,
			'shrink-to-fit width includes the space (' + w + ' = ' + want +
			', ' + parts + ')');
	}
	/* at load, not 300 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">IBSPACE221: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<div><span class="ib" id="t1">aa</span></div>
<div><span class="ib" id="t2">a a</span></div>
<div><span class="ib" id="a1">aa</span> <span class="ib" id="a2">bb</span></div>
<div><span class="ib" id="c1">aa</span>
<span class="ib" id="c2">bb</span></div>
<ul id="menu"><li id="m1">Home</li>
<li id="m2">News</li>
<li id="m3">About</li></ul>
<div><img id="i1" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACwAAAAAAQABAAACAkQBADs=" width="10" height="10"> <img id="i2" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACwAAAAAAQABAAACAkQBADs=" width="10" height="10"></div>
<div><button id="b1">OK</button> <button id="b2">Cancel</button></div>
<div style="overflow: hidden"><div id="shrink"><span class="ib" id="s1">one</span> <span class="ib" id="s2">two</span></div></div>
</body>
</html>
