<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS inline-grid (script not run)</title>
<!-- display: inline-grid is an inline-level box. Box construction put it
     straight into its block instead of an inline container (it knew
     inline-block and inline-flex only), and min/max sizing asserted:
     github.com crashed on its inline-grid buttons.
     1: two inline-grid spans share a line, side by side.
     2: an inline-grid <button> (GitHub's shape) sits on the text line.
     3: an inline-grid inside a flex container is blockified (a flex item).
     4: an inline-grid's grid still places its children in columns. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p.r { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.ig { display: inline-grid; grid-template-columns: 30px 30px; background: #9cf; }
.ig i { display: block; height: 10px; background: #36c; }
button.gh { display: inline-grid; grid-template-columns: auto auto; gap: 4px; padding: 2px 6px; }
.fx { display: flex; }
</style>
</head>
<body>
<p id="sum" class="wait r">INLINEGRID: script did not run</p>
<div id="line">text <span class="ig" id="a"><i></i><i></i></span> and <span class="ig" id="b"><i></i><i></i></span> more</div>
<div id="line2">before <button class="gh" id="btn"><span>Code</span><span>v</span></button> after</div>
<div class="fx" id="fx"><span class="ig" id="c"><i></i><i></i></span><span id="d">x</span></div>
<p id="r1" class="wait r">1 side by side: waiting</p>
<p id="r2" class="wait r">2 button on the line: waiting</p>
<p id="r3" class="wait r">3 flex item: waiting</p>
<p id="r4" class="wait r">4 grid columns: waiting</p>
<script>
window.addEventListener('load', function () {
	var N = 4, k = 0;
	function pass(n, ok, text) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + text;
		if (!ok) return;
		p.className = 'pass r';
		k++;
		document.getElementById('sum').textContent = 'INLINEGRID: ' + k + '/' + N + ' passed';
		document.title = 'CSS inline-grid (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'INLINEGRID: 0/' + N + ' passed';
	function r(id) { return document.getElementById(id).getBoundingClientRect(); }
	var a = r('a'), b = r('b'), line = r('line');
	pass(1, Math.abs(a.top - b.top) < 4 && b.left > a.right && a.width >= 55 && a.height < line.height + 1,
		'side by side: a ' + Math.round(a.left) + ',' + Math.round(a.top) + ' ' + Math.round(a.width) + 'w, b ' + Math.round(b.left) + ',' + Math.round(b.top));
	var btn = r('btn'), l2 = r('line2');
	pass(2, btn.width > 0 && btn.top >= l2.top - 2 && btn.bottom <= l2.bottom + 2 && btn.left > l2.left + 10,
		'button on the line: ' + Math.round(btn.left) + ',' + Math.round(btn.top) + ' ' + Math.round(btn.width) + 'x' + Math.round(btn.height));
	var c = r('c'), d = r('d');
	pass(3, Math.abs(c.top - d.top) < 4 && c.width >= 55 && d.left >= c.right - 1, 'flex item: c ' + Math.round(c.left) + '-' + Math.round(c.right) + ', d at ' + Math.round(d.left));
	var i0 = document.querySelector('#a i').getBoundingClientRect(), i1 = document.querySelectorAll('#a i')[1].getBoundingClientRect();
	pass(4, Math.abs(i0.top - i1.top) < 2 && i1.left >= i0.left + 28, 'grid columns: ' + Math.round(i0.left) + ' / ' + Math.round(i1.left));
});
</script>
</body>
</html>
