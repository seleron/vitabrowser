<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS inline mid ref</title>
<style>
/* Patch 416. A plain inline element (every descendant plain inline)
 * inserted between blocks -- google adds bare <span>s among its result
 * blocks -- took the full rebuild ("new element is not a plain block").
 * Now built alone, its boxes moved into a line of their own: a <span>
 * holding a <b>, an <a>, and a <span> appended after the last block. A
 * <span> holding an <img> is not plain inline: it still declines. The
 * sheet's :has() rules (never matched here) are no sibling risk. Row for
 * row as CSS-inline-mid-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div { margin: 4px 10px; background: #eef; }
span.s { color: #060; }
a { color: #00c; }
/* :has() never matches in this libcss: these rules carry no sibling
 * risk (416 drops them before the sibling parser; before, the first two
 * made the sheet conservative and every insert here declined) */
.zz:has(.q) + div { color: #c00; }
div:has(~ .zz) { color: #c00; }
div:not(.yy:has(.a + .b)) { border-left: 2px solid #888; }
/* last: a prelude whose parentheses never close (its scan once ran past
 * the end and never stopped -- google hung) */
.zz:has(.q, .r { color: #c00; }
</style>
</head>
<body>
<div id="w"><div id="b1">Block one.</div><div id="b2">Block two.</div><div id="b3">Block three.</div><div id="b4">Block four.</div></div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function sp(html) { var s = document.createElement('span'); s.className = 's'; s.innerHTML = html; return s; }
	var ops = [
		function () { $('w').insertBefore(sp('A span between blocks, with <b>bold</b> text.'), $('b2')); },
		function () { var a = document.createElement('a'); a.href = '#x'; a.textContent = 'A link between blocks.'; $('w').insertBefore(a, $('b3')); },
		function () { $('w').appendChild(sp('A span appended after the last block.')); },
		function () { $('w').insertBefore(sp('A span with an image <img width="8" height="8" alt="">.'), $('b4')); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
