<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS inline style outranks (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
#t1 { display: none; color: rgb(255, 0, 0); }
#t2 { color: rgb(255, 0, 0) !important; }
#t3 { color: rgb(255, 0, 0) !important; }
</style>
<style>
/* a LATER sheet whose rule matches the same elements, less specifically:
 * the inline styles were ranked with its specificity (patch 236) */
div { margin-left: 0; }
</style>
<script>
/* patch 236 (libcss): an element's style attribute outranks every normal
 * author rule, whatever was matched last. libcss cascaded it with the
 * specificity and origin the LAST matched rule of the LAST sheet had
 * left behind, so "#t1 { display: none }" beat style="display:block"
 * here (make.wordpress.org: o2's jQuery .show() wrote display:block and
 * the app stayed hidden). Author !important still beats a normal inline
 * value, and an inline !important beats that. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'INLINE236: ' + k + '/' + N + ' passed';
		document.title = 'CSS inline style outranks (' + k + '/' + N + ')';
	}
	function run() {
		var g = getComputedStyle($('t1'));
		t(1, g.display === 'block' && $('t1').offsetHeight > 0,
			'inline display beats an id rule: ' + g.display + ', ' + $('t1').offsetHeight);
		t(2, g.color === 'rgb(0, 128, 0)', 'inline color beats it too: ' + g.color);
		t(3, getComputedStyle($('t2')).color === 'rgb(255, 0, 0)',
			'author !important beats normal inline: ' + getComputedStyle($('t2')).color);
		t(4, getComputedStyle($('t3')).color === 'rgb(0, 128, 0)',
			'inline !important beats author !important: ' + getComputedStyle($('t3')).color);
	}
	window.addEventListener('load', function () { setTimeout(run, 100); });
})();
</script>
</head>
<body>
<div id="sum">INLINE236: 0/4 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<div id="t1" style="display: block; color: rgb(0, 128, 0)">shown by its style attribute</div>
<div id="t2" style="color: rgb(0, 128, 0)">red: the sheet's !important wins</div>
<div id="t3" style="color: rgb(0, 128, 0) !important">green: inline !important wins</div>
</body>
</html>
