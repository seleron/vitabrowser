<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS inline leading space</title>
<!-- A space leading an inline element's text (patch 57): Hacker News rows,
     "<a>Title</a><span> (site.com)</span>". Each pair must place its second
     word at the same x: the space inside the element counts like the space
     outside it. -->
<style>body { font-family: sans-serif; font-size: 20px; margin: 10px; }</style>
</head>
<body>
<p>Alpha <span>BRAVO1</span></p>
<p>Alpha<span> BRAVO2</span></p>
<p><a href="#">Alpha</a> <span>CHARLIE1</span></p>
<p><a href="#">Alpha</a><span> CHARLIE2</span></p>
</body>
</html>
