<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS intrinsic widths (script not run)</title>
<!-- width / min-width / max-width: min-content | max-content | fit-content.
     The cascade and layout (MacSurf's "intrinsic-sizing round 1") had them,
     but the parser never did: libcss dropped every such declaration
     (scorecard census: width: fit-content on 8 of 21 sites, max-content 7,
     min-width: fit-content 6). Patch 158 adds them to properties.gen.
     1: a block with width: fit-content is as wide as its text.
     2: width: max-content does not wrap in a 100px parent.
     3: width: min-content is as wide as its longest word.
     4: min-width: max-content makes a block wider than its 100px parent.
     5: max-width: fit-content stops a block at its text's width. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p.r { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.box { background: #9cf; margin: 2px 0; }
#fit { width: fit-content; }
.narrow { width: 100px; }
#maxc { width: max-content; }
#minc { width: min-content; }
#minw { min-width: max-content; }
#maxw { max-width: fit-content; }
</style>
</head>
<body>
<p id="sum" class="wait r">INTRINSIC: script did not run</p>
<div class="box" id="fit">short text</div>
<div class="narrow"><div class="box" id="maxc">one two three four five</div></div>
<div class="box" id="minc">tiny w0rds everywhere</div>
<div class="narrow"><div class="box" id="minw">wide line that does not wrap</div></div>
<div class="box" id="maxw">capped</div>
<p id="r1" class="wait r">1 waiting</p><p id="r2" class="wait r">2 waiting</p>
<p id="r3" class="wait r">3 waiting</p><p id="r4" class="wait r">4 waiting</p>
<p id="r5" class="wait r">5 waiting</p>
<script>
window.addEventListener('load', function () {
	var N = 5, k = 0;
	function w(id) { return document.getElementById(id).getBoundingClientRect(); }
	function t(n, name, ok, got) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + name + ': ' + got + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass r';
		k++;
		document.getElementById('sum').textContent = 'INTRINSIC: ' + k + '/' + N + ' passed';
		document.title = 'CSS intrinsic widths (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'INTRINSIC: 0/' + N + ' passed';
	var fit = w('fit');
	t(1, 'width: fit-content', fit.width > 40 && fit.width < 200, Math.round(fit.width));
	var maxc = w('maxc');
	t(2, 'width: max-content', maxc.width > 150 && maxc.height < 30, Math.round(maxc.width) + 'x' + Math.round(maxc.height));
	var minc = w('minc');
	t(3, 'width: min-content', minc.width > 40 && minc.width < 150 && minc.height > 30, Math.round(minc.width) + 'x' + Math.round(minc.height));
	var minw = w('minw');
	t(4, 'min-width: max-content', minw.width > 150, Math.round(minw.width));
	var maxw = w('maxw');
	t(5, 'max-width: fit-content', maxw.width > 20 && maxw.width < 150, Math.round(maxw.width));
});
</script>
</body>
</html>
