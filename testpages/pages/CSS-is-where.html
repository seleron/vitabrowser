<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS :is() and :where()</title>
<!-- :is() / :where() (patch 91). Every .t is display:none unless a rule
     below matches it; each matching case draws one 10px-high block of a
     width no other case uses. Expected blocks: 101 102 103 104 106 107
     108 109 (109: a :has(:not(...)) elsewhere in the list no longer
     invalidates the rule). Never: 105 (no argument matches), 198/199 (lose on specificity),
     197 (:where inside :not is rejected at parse, fixes360b). -->
<style>
body { margin: 0; font: 12px sans-serif; }
.t { display: none; height: 10px; margin: 2px 0; background: #000; }
:where(.w1) .t { display: block; width: 101px; }
:is(.i1, :host) .t { display: block; width: 102px; }
:where(:root) .r3 .t { display: block; width: 103px; }
.c4 :is(section > .k4) .t { display: block; width: 104px; }
:where(.nope, .never) .t { display: block; width: 105px; }
.s6 .t { display: block; width: 106px; }
:where(.s6) .t { display: block; width: 199px; }
:is(#s7) .t { display: block; width: 107px; }
.s7c .t { display: block; width: 198px; }
.n8:not(:where(.x)) .t { display: block; width: 197px; }
:is(:has(:not(.x)), .h8) .t { display: block; width: 108px; }
.h9 .t, .zz:has(:not(.x)) .t { display: block; width: 109px; }
</style>
</head>
<body>
<div class="w1"><div class="t"></div></div>
<div class="i1"><div class="t"></div></div>
<div class="r3"><div class="t"></div></div>
<div class="c4"><section><div class="k4"><div class="t"></div></div></section></div>
<div class="plain"><div class="t"></div></div>
<div class="s6"><div class="t"></div></div>
<div id="s7" class="s7c"><div class="t"></div></div>
<div class="n8"><div class="t"></div></div>
<div class="h8"><div class="t"></div></div>
<div class="h9"><div class="t"></div></div>
</body>
</html>
