<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS isolation: isolate</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; background: #fff; }
.card { background: #fff; border: 1px solid #888; padding: 16px; margin: 12px 0; width: 300px; }
.btn { position: relative; display: inline-block; width: 121px; height: 37px;
	color: #fff; text-align: center; line-height: 37px; }
.fill { position: absolute; left: 0; top: 0; width: 121px; height: 37px;
	z-index: -1; background: #000; }
#ctl .btn, #ctl .fill { width: 123px; height: 39px; line-height: 39px; }
.iso { isolation: isolate; }
.auto { isolation: auto; }
</style>
</head>
<body>
<!-- Patch 332 (claude.ai): isolation: isolate creates a stacking context.
     Tailwind's `isolate` keeps a button's `-z-[1]` fill span above the card
     the button sits on; unsupported, the span was hoisted to the root's
     negative z phase and painted UNDER the card (claude.ai's black
     "Download" button drew as white text on white). Checked in the
     snapshot: inside .iso the 121x37 fill is black; the 123x39 control
     (isolation: auto) is covered by its card, as in Chromium. -->
<div class="card"><span class="btn iso"><span class="fill"></span>ISOMARK</span></div>
<div class="card" id="ctl"><span class="btn auto"><span class="fill"></span>CTLMARK</span></div>
</body>
</html>
