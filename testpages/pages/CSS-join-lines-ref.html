<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS join lines ref</title>
<style>
/* Patch 444. Removing a block that stood between two runs of inline
 * content leaves them side by side: a full build makes one line container
 * of them, the local path would keep two, so it declined ("removal would
 * join two lines", bbc) into the full rebuild. The parent is built again
 * whole now (440). Steps (each flushed alone by a layout read): the block
 * between two runs of text removed, the block between a <span> run and
 * text removed. Row for row as CSS-join-lines-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.bx { padding: 2px 6px; background: #dde; }
</style>
</head>
<body>
<div id="o1">Text before, <div class="bx" id="m1">a block between</div> text after.</div>
<div id="o2"><span>A span run,</span> <div class="bx" id="m2">another block</div> and its tail.</div>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var m = $('m1'); m.parentNode.removeChild(m); },
		function () { var m = $('m2'); m.parentNode.removeChild(m); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
