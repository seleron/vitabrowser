<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS late link (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
<script>
/* patch 243: a stylesheet a script inserts after parsing, still loading
 * when the page is laid out (served 1 s late by the gate's httpd /slow/),
 * is the last thing the page waits for (a slow image keeps the laid-out
 * page from finishing before it): when it lands the page becomes
 * DONE and `load` fires (Chromium holds load for it the same way). The
 * engine left the page READY for good -- only an image finishing took it
 * to DONE -- so `load` never fired and the page never said "Done"
 * (github.com once React inserted its stylesheets). Needs the gate's
 * httpd; Chromium-verified. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'LATELINK: ' + k + '/' + N + ' passed';
		document.title = 'CSS late link (' + k + '/' + N + ')';
	}
	/* The page is laid out (READY) while its image is still coming
	 * (/slow/: 1 s); the sheet is inserted 400 ms in, so it lands last
	 * (~1.4 s) -- the last fetch the page waits for is the sheet. */
	document.addEventListener('DOMContentLoaded', function () {
		setTimeout(function () {
			var l = document.createElement('link');
			l.rel = 'stylesheet';
			l.href = '/slow/CSS-late-link.css';
			document.head.appendChild(l);
			t(1, true, 'sheet inserted after layout, image still loading');
		}, 400);
	});
	window.addEventListener('load', function () {
		t(2, true, 'load fired');
		t(3, getComputedStyle($('t')).color === 'rgb(0, 128, 0)',
			'...after the late sheet applied: ' + getComputedStyle($('t')).color);
	});
})();
</script>
</head>
<body>
<div id="sum">LATELINK: 0/3 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting (load never fired)</p>
<p id="r3" class="wait">3 waiting</p>
<p id="t">green once the late sheet applies</p>
<img src="/slow/lazyimg-01.png" width="40" height="40" alt="">
</body>
</html>
