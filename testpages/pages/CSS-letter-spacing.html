<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS letter spacing (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
span.t { display: inline-block; }
#ls { letter-spacing: 4px; }
#ws { word-spacing: 20px; }
#lsem { letter-spacing: 0.25em; font-size: 20px; }
#base20 { font-size: 20px; }
#jus { text-align: justify; width: 300px; background: #eef; }
</style>
<script>
/* Patch 220: letter-spacing and word-spacing reach the Vita's text
 * measuring and drawing (they were ignored: the spans measured as if
 * unspaced), and with them the gap redraw adds to justify a line.
 * Chromium-verified. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function w(id) { return $(id).getBoundingClientRect().width; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SPACING220: ' + k + '/' + N + ' passed';
		document.title = 'CSS letter spacing (' + k + '/' + N + ')';
	}
	function run() {
		var d1 = w('ls') - w('base');
		t(1, Math.abs(d1 - 28) <= 1.5, 'letter-spacing 4px x 7 letters: +' + d1);
		var d2 = w('ws') - w('wbase');
		t(2, Math.abs(d2 - 40) <= 1.5, 'word-spacing 20px x 2 spaces: +' + d2);
		var d3 = w('lsem') - w('base20');
		t(3, Math.abs(d3 - 35) <= 1.5, 'letter-spacing 0.25em at 20px x 7: +' + d3);
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">SPACING220: 0/3 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<div><span class="t" id="base">spacing</span> <span class="t" id="ls">spacing</span></div>
<div><span class="t" id="wbase">word spacing here</span> <span class="t" id="ws">word spacing here</span></div>
<div><span class="t" id="base20">spacing</span> <span class="t" id="lsem">spacing</span></div>
<p id="jus">Justified text spreads its words so that every line but the last reaches both edges of the box, which only works if the gaps are drawn.</p>
</body>
</html>
