<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS line-height normal (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; line-height: 1.2; }
.r { line-height: 1.2; }
#one, #three { width: 300px; background: #eef; margin: 4px 0; }
#bar { height: 40px; background: #ddd; overflow: hidden; }
#bar span { display: inline-block; padding: 10px 0; }
</style>
<script>
/* Patch 214: line-height: normal is the font's own (~1.16 for the DejaVu
 * faces here, ~1.15 for Chromium's sans), and the UA sheet no longer
 * forces body { line-height: 1.33 }: text was ~15% taller than in a
 * browser, and fixed-height bars clipped their labels. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function h(id) { return $(id).getBoundingClientRect().height; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'LINEH214: ' + k + '/' + N + ' passed';
		document.title = 'CSS line-height normal (' + k + '/' + N + ')';
	}
	function run() {
		t(1, h('one') >= 17.5 && h('one') <= 19.5, 'one 16px line: ' + h('one'));
		t(2, h('three') >= 52 && h('three') <= 58, 'three lines: ' + h('three'));
		var b = $('bar').getBoundingClientRect(), s = $('lab').getBoundingClientRect();
		t(3, s.bottom <= b.bottom + 0.5, 'label fits a 40px bar (' + s.bottom +
			' <= ' + b.bottom + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">LINEH214: 0/3 passed</div>
<p id="r1" class="wait r">1 pending</p>
<p id="r2" class="wait r">2 pending</p>
<p id="r3" class="wait r">3 pending</p>
<div id="one">one line</div>
<div id="three">first line of text<br>second line of text<br>third line</div>
<div id="bar"><span id="lab">Menu label</span></div>
</body>
</html>
