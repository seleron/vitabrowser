<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS mask icon</title>
<!-- mask-image icons (libcss aliases the mask properties to background
     ones, docs/phase-0/11): Wikipedia's Minerva/Vector icons are spans with
     a background-color shaped by an SVG mask. Without masking they drew as
     solid blocks; now each shows the icon's shape. -->
<style>
body { font-family: sans-serif; font-size: 20px; margin: 20px; }
.icon { display: inline-block; width: 24px; height: 24px; background-color: #202122; vertical-align: middle; }
.icon--star { -webkit-mask-image: url(svg-icon.svg); mask-image: url(svg-icon.svg); mask-size: 24px; mask-repeat: no-repeat; mask-position: center; }
.icon--var { --sz: 24px; mask-image: url(svg-icon.svg); mask-size: var(--sz); mask-repeat: no-repeat; }
.icon--short { -webkit-mask: url(svg-icon.svg) no-repeat center / 24px; }
/* Minerva's order: the mask rule first, the icon's base colour rule after
   it at the same specificity. The mask must still win. */
.late--mask { mask-image: url(svg-icon.svg); mask-size: 24px; mask-repeat: no-repeat; }
.late { display: inline-block; width: 24px; height: 24px; background-color: var(--c, #202122); vertical-align: middle; }
</style>
</head>
<body>
<p><span class="icon icon--star"></span> MASKED (the icon, no block)</p>
<p><span class="icon icon--var"></span> MASKED-VAR (mask-size from var())</p>
<p><span class="icon icon--short"></span> MASKED-SHORTHAND (-webkit-mask)</p>
<p><span class="late late--mask"></span> MASKED-LATE (base colour rule after the mask)</p>
<p><span class="icon" style="mask-image: none"></span> UNMASKED (a dark block: mask-image none)</p>
</body>
</html>
