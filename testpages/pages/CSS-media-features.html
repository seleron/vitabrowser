<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS media features (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.x { width: 10px; height: 10px; color: rgb(1, 1, 1); }
@media (prefers-reduced-motion: no-preference) { #rm { color: rgb(0, 128, 0); } }
@media (prefers-reduced-motion: reduce) { #rm2 { color: rgb(255, 0, 0); } }
@media (prefers-reduced-motion) { #rm3 { color: rgb(255, 0, 0); } }
@media (prefers-contrast: no-preference) and (forced-colors: none) { #pc { color: rgb(0, 128, 0); } }
@media (scripting: enabled) and (display-mode: browser) { #sc { color: rgb(0, 128, 0); } }
@media (hover: none) and (pointer: coarse) { #touch { color: rgb(0, 128, 0); } }
@media (hover: hover) { #hov { color: rgb(255, 0, 0); } }
@media (min-width: 1px) and (prefers-reduced-motion: no-preference) { #and { color: rgb(0, 128, 0); } }
</style>
<script>
/* Patch 213: discrete media features (prefers-reduced-motion,
 * prefers-contrast, forced-colors, scripting, display-mode, hover,
 * pointer, ...) answer for the Vita; all of them used to be false.
 * Checks 1-3 match Chromium; check 4 is the Vita's touchscreen answer
 * (hover: none, pointer: coarse), which desktop Chromium does not give. */
(function () {
	var k = 0, N = 4, G = 'rgb(0, 128, 0)', B = 'rgb(1, 1, 1)';
	function $(id) { return document.getElementById(id); }
	function c(id) { return getComputedStyle($(id)).color; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'MQFEAT213: ' + k + '/' + N + ' passed';
		document.title = 'CSS media features (' + k + '/' + N + ')';
	}
	function run() {
		t(1, c('rm') === G && c('rm2') === B && c('rm3') === B,
			'reduced motion: no-preference only (' + c('rm') + ', ' +
			c('rm2') + ', ' + c('rm3') + ')');
		t(2, c('pc') === G && c('sc') === G,
			'contrast/forced-colors, scripting/display-mode (' + c('pc') +
			', ' + c('sc') + ')');
		t(3, c('and') === G, 'combined with a range: ' + c('and'));
		t(4, c('touch') === G && c('hov') === B,
			'touchscreen: hover none, pointer coarse (' + c('touch') +
			', ' + c('hov') + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">MQFEAT213: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div class="x" id="rm"></div><div class="x" id="rm2"></div><div class="x" id="rm3"></div>
<div class="x" id="pc"></div><div class="x" id="sc"></div>
<div class="x" id="touch"></div><div class="x" id="hov"></div>
<div class="x" id="and"></div>
</body>
</html>
