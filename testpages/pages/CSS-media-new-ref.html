<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS media new ref</title>
<style>
/* Patch 439. "new element is not a plain block, list item or block of
 * blocks" declined into the full rebuild for a <div> holding a <video>
 * (youtube), a <div> holding a <dl> (wpblog) and a custom element put into
 * a flex box (youtube's <c3-icon>). Media tags are built alone and the page
 * laid out whole (as images are, 364); description lists are lists (176);
 * a flex box's child list the local path cannot place builds the box again
 * whole (438). Steps (each flushed alone by a layout read): the video
 * block inserted between two paragraphs, the list block inserted between
 * two paragraphs, a <c3-icon> inserted first in a flex row. Row for row as
 * CSS-media-new-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
video { display: block; width: 160px; height: 40px; background: #ccd; }
.row { display: flex; margin: 4px 10px; }
.row > * { margin: 0 6px 0 0; padding: 2px 6px; background: #dde; }
c3-icon { display: inline-block; width: 16px; height: 16px; background: #a55; }
</style>
</head>
<body>
<p id="p1">First paragraph.</p>
<p id="p2">Second paragraph.</p>
<p id="p3">Third paragraph.</p>
<div class="row" id="r"><div>a</div><div>b</div></div>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var d = document.createElement('div'); d.innerHTML = '<video><source src="none.mp4" type="video/mp4"></video>'; $('p1').parentNode.insertBefore(d, $('p2')); },
		function () { var d = document.createElement('div'); d.innerHTML = '<dl><dt>Term</dt><dd>Its description.</dd></dl>'; $('p2').parentNode.insertBefore(d, $('p3')); },
		function () { var i = document.createElement('c3-icon'); $('r').insertBefore(i, $('r').firstChild); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
