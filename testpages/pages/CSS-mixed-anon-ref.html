<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS mixed anon ref</title>
<style>
/* Patch 467. A child-list change in a parent whose children are blocks
 * and a display: table-cell element -- box normalisation wraps the cell in
 * an anonymous table (wpblog: a box of type 3, anonymous, among the
 * blocks). The block placement cannot track that box and declined
 * ("parent holds more than blocks") into the full rebuild; now the parent
 * is built again whole (440). A block is appended and another removed.
 * Row for row as CSS-mixed-anon-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
#wrap div { margin: 4px 10px; background: #eef; }
#wrap .cell { display: table-cell; padding: 2px 10px; background: #cfc; }
</style>
</head>
<body>
<div id="wrap">
<div id="a">Block a.</div>
<span class="cell">A table cell among the blocks.</span>
<div id="b">Block b, removed.</div>
<div id="c">Block c.</div>
</div>
<script>
(function () {
	function op() {
		var w = document.getElementById('wrap'), d = document.createElement('div');
		d.textContent = 'Block d, appended.';
		w.appendChild(d);
		w.removeChild(document.getElementById('b'));
	}
	op();
})();
</script>
</body>
</html>
