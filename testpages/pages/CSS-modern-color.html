<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS modern colours and at-rules</title>
<!-- Patches 94, 95, 98, 99. Each block is 10px high with its own width;
     run-vita-sim.sh checks it is drawn, and at which opacity bucket
     (4 = solid, no OPAQUE token):
     101 color-mix(in srgb, #000 50%, transparent)      OPAQUE 2
     102 rgb(from #000 r g b / 25%)                      OPAQUE 1
     103 color-mix(in oklab, #000, #fff)                 solid
     104 oklab(0% none none / .8)                        OPAQUE 3
     105 rgb(from #000 calc(r) g b): unsupported, the earlier solid
         background stays                                solid
     106 var(--c, #000) with --c: initial                solid
     107 inside @layer { @supports { } } (nested)        solid
     108 in an @supports after an escaped quote in a class name
                                                         solid
     109 in "*:not(*), .k109, ::backdrop" (::backdrop known)  solid
     (103 and 105 are solid either way: the plot has no colours, so their
     values were checked by hand, see doc 11 round 8.) -->
<style>
body { margin: 0; font: 12px sans-serif; background: #fff; }
div { height: 10px; margin: 3px 0; background: #000; }
.k101 { width: 101px; background: color-mix(in srgb, #000 50%, transparent); }
.k102 { width: 102px; background: rgb(from #000 r g b / 25%); }
.k103 { width: 103px; background: color-mix(in oklab, #000, #fff); }
.k104 { width: 104px; background: oklab(0% none none / .8); }
.k105 { width: 105px; background: rgb(from #000 calc(r) g b); }
.k106 { width: 106px; --c: initial; background: var(--c, #000); }
.k107 { display: none; }
@layer outer { @supports (display: block) { .k107 { display: block; width: 107px; } } }
.a\'b { color: red; }
.k108 { display: none; }
@supports (display: block) { .k108 { display: block; width: 108px; } }
.k109 { display: none; }
*:not(*), .k109, ::backdrop { display: block; width: 109px; }
</style>
</head>
<body>
<div class="k101"></div><div class="k102"></div><div class="k103"></div>
<div class="k104"></div><div class="k105"></div><div class="k106"></div>
<div class="k107"></div><div class="k108"></div><div class="k109"></div>
</body>
</html>
