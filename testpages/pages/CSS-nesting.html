<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS nesting (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.x { width: 10px; height: 10px; color: rgb(1, 1, 1); }
.card {
	color: rgb(0, 0, 255);
	& .t { color: rgb(0, 128, 0); }
	.b { color: rgb(0, 128, 0); }
	&.on { color: rgb(0, 128, 0); }
	> .kid { color: rgb(0, 128, 0); }
	@media (min-width: 1px) { .m { color: rgb(0, 128, 0); } }
	.deep { .er { color: rgb(0, 128, 0); } }
}
.one, .two { & .both { color: rgb(0, 128, 0); } }
.after { color: rgb(0, 128, 0); }
</style>
<script>
/* Patch 211: CSS nesting (CSS Nesting 1) is flattened by the CSS rewrite.
 * libcss read a nested rule's prelude as a broken declaration and lost
 * the rest of the block. Chromium-verified. */
(function () {
	var k = 0, N = 6, G = 'rgb(0, 128, 0)';
	function $(id) { return document.getElementById(id); }
	function c(id) { return getComputedStyle($(id)).color; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'NEST211: ' + k + '/' + N + ' passed';
		document.title = 'CSS nesting (' + k + '/' + N + ')';
	}
	function run() {
		t(1, c('card') === 'rgb(0, 0, 255)' && c('t') === G && c('b') === G,
			'parent declarations kept; & .t and bare .b nest (' + c('card') +
			', ' + c('t') + ', ' + c('b') + ')');
		t(2, c('on') === G, '&.on compounds: ' + c('on'));
		t(3, c('kid') === G && c('notkid') !== G,
			'> .kid is a child combinator (' + c('kid') + ', ' +
			c('notkid') + ')');
		t(4, c('m') === G, 'nested @media: ' + c('m'));
		t(5, c('er') === G && c('both') === G,
			'two levels; a parent selector list (' + c('er') + ', ' +
			c('both') + ')');
		t(6, c('after') === G, 'rule after a nested sheet: ' + c('after'));
	}
	/* at load, not 300 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">NEST211: 0/6 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<div class="card x" id="card">
	<div class="t x" id="t"></div><div class="b x" id="b"></div>
	<div class="kid x" id="kid"></div><div><div class="kid x" id="notkid"></div></div>
	<div class="m x" id="m"></div>
	<div class="deep"><div class="er x" id="er"></div></div>
</div>
<div class="card on x" id="on"></div>
<div class="two"><div class="both x" id="both"></div></div>
<div class="after x" id="after"></div>
</body>
</html>
