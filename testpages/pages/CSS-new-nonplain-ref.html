<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS new nonplain ref</title>
<style>
/* Patch 457. A new element the block placement cannot build alone -- not
 * a plain block, list item or block of blocks, and none of 364/407/416/
 * 378's shapes ("new element is not a plain block, list item or block of
 * blocks": 2.0 a load) -- declined into the full rebuild. The parent is
 * built again whole from the DOM now (440). Steps (each flushed alone by
 * a layout read), each inserted between two blocks: a <table>; an <a>
 * holding a <div>; a custom element holding text; an inline <svg>. Row
 * for row as CSS-new-nonplain-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
table { border-collapse: collapse; margin: 4px 10px; }
td { border: 1px solid #888; padding: 2px 6px; }
x-card { display: block; background: #eef; margin: 4px 10px; }
</style>
</head>
<body>
<div id="w">
<p id="p1">First paragraph.</p>
<table><tr><td>cell one</td><td>cell two</td></tr></table>
<p id="p2">Second paragraph.</p>
<a href="http://never-visited.invalid/"><div>a block in a link</div></a>
<p id="p3">Third paragraph.</p>
<x-card>a custom element</x-card>
<p id="p4">Fourth paragraph.</p>
<svg width="40" height="20"><rect width="40" height="20" fill="#c00"/></svg>
<p>Last paragraph.</p>
</div>
</body>
</html>
