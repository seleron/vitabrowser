<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS :not() with selector lists (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.t { height: 4px; width: 40px; margin: 2px 0; background: rgb(255, 0, 0); }
#cmp:not(.x.x) { background: rgb(0, 128, 0); }
.p:not(.p.q) { background: rgb(0, 128, 0); }
#lst:not(.x, .y) { background: rgb(0, 128, 0); }
#lsty:not(.x, .y) { background: rgb(0, 0, 255); }
.cx:not(.out .cx) { background: rgb(0, 128, 0); }
#typ:not(span.x) { background: rgb(0, 128, 0); }
.nav .wrap { background: rgb(9, 9, 9); }
.wrap:not(.open.open) { background: rgb(0, 128, 0) !important; }
#isn:not(:is(.x)) { background: rgb(0, 128, 0); }
[data-s]:not(#nope, .x) { background: rgb(0, 128, 0); }
.k.k.k { background: rgb(9, 9, 9); }
#bad:not(.x, ::before) { background: rgb(9, 9, 9); }
#dbl:not(:not(.d)) { background: rgb(0, 128, 0); }
</style>
<script>
/* Patch 328 (wordpress.org/news): :not() takes a selector list
 * (Selectors 4) -- a compound, a list, a complex selector. libcss took one
 * simple selector and dropped any other rule whole, so WordPress's
 * ':not(.is-menu-open.is-menu-open){background-color:inherit!important}'
 * never applied and the closed menu container painted the hover colour
 * over the whole navigation bar. Chromium-verified. */
(function () {
	var k = 0, N = 10;
	function $(id) { return document.getElementById(id); }
	function bg(id) { return getComputedStyle($(id)).backgroundColor; }
	var G = 'rgb(0, 128, 0)', R = 'rgb(255, 0, 0)';
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'NOTLIST328: ' + k + '/' + N + ' passed';
		document.title = 'CSS :not() lists (' + k + '/' + N + ')';
	}
	function run() {
		t(1, bg('cmp') === G, ':not(.x.x) (' + bg('cmp') + ')');
		t(2, bg('pq1') === G && bg('pq2') === R,
			':not(.p.q) on .p / .p.q (' + bg('pq1') + ', ' + bg('pq2') + ')');
		t(3, bg('lst') === G && bg('lsty') === R,
			':not(.x, .y) (' + bg('lst') + ', ' + bg('lsty') + ')');
		t(4, bg('cxin') === R && bg('cxout') === G,
			':not(.out .cx) inside / outside (' + bg('cxin') + ', ' +
			bg('cxout') + ')');
		t(5, bg('typ') === G, ':not(span.x) on a div (' + bg('typ') + ')');
		t(6, bg('wrap') === G && bg('wrapo') === 'rgb(9, 9, 9)',
			':not(.open.open) !important vs a higher-specificity rule (' +
			bg('wrap') + ', ' + bg('wrapo') + ')');
		t(7, bg('isn') === G, ':not(:is(.x)) (' + bg('isn') + ')');
		t(8, bg('spec') === G, ':not(#nope, .x) has id specificity (' +
			bg('spec') + ')');
		t(9, bg('bad') === R, 'a pseudo-element in the list drops the rule (' +
			bg('bad') + ')');
		t(10, bg('dbl') === G, ':not(:not(.d)) (' + bg('dbl') + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">NOTLIST328: 0/10 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<p id="r8" class="wait">8 pending</p>
<p id="r9" class="wait">9 pending</p>
<p id="r10" class="wait">10 pending</p>
<div class="t" id="cmp"></div>
<div class="t p" id="pq1"></div><div class="t p q" id="pq2"></div>
<div class="t" id="lst"></div><div class="t y" id="lsty"></div>
<div class="out"><div class="t cx" id="cxin"></div></div><div class="t cx" id="cxout"></div>
<div class="t" id="typ"></div>
<div class="nav"><div class="t wrap" id="wrap"></div><div class="t wrap open" id="wrapo"></div></div>
<div class="t" id="isn"></div>
<div class="t k" id="spec" data-s></div>
<div class="t" id="bad"></div>
<div class="t d" id="dbl"></div>
</body>
</html>
