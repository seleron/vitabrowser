<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS nth type ref</title>
<style>
/* Patch 507. A typeless :nth-of-type / :first-of-type / :last-of-type rule
 * counts each child among its own tag only, yet it counted every child in
 * the change's range: stackoverflow's scripts append to <html>, and a
 * "*:nth-of-type" rule counted <body> as moved, restyling all of it 4
 * times a load. On an insertion (nothing removed, so every moved tag is
 * known) only children of a tag that went in can flip. After its steps
 * (250 ms apart) JS-nth-type.html must render row for row as
 * CSS-nth-type-ref.html, the same steps at parse time. Steps: a <span>
 * at the start (no <p> or <div> moves); a <p> at the start (the <p>s
 * move); a <div> in the middle (the later <div>s move); a removal (the
 * old check, as before). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
.box { margin: 4px 10px; background: #eef; padding: 2px; }
.box > * { display: block; border: 1px solid #000; padding: 2px 6px; margin: 2px; }
.box > *:nth-of-type(2) { background: #fc8; }
.box > :first-of-type { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<div id="a" class="box"><p>a-p1</p><div>a-d1</div><p>a-p2</p><div>a-d2</div></div>
<div id="b" class="box"><p>b-p1</p><div>b-d1</div><p>b-p2</p><div>b-d2</div></div>
<div id="c" class="box"><p>c-p1</p><div>c-d1</div><p>c-p2</p><div>c-d2</div><div>c-d3</div></div>
<div id="d" class="box"><p>d-p1</p><div id="dd">d-d1</div><p>d-p2</p><div>d-d2</div></div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function el(tag, text) { var d = document.createElement(tag); d.textContent = text; return d; }
	var ops = [
		function () { $('a').insertBefore(el('span', 'a-span'), $('a').firstChild); },
		function () { $('b').insertBefore(el('p', 'b-p0'), $('b').firstChild); },
		function () { $('c').insertBefore(el('div', 'c-new'), $('c').children[2]); },
		function () { $('d').removeChild($('dd')); }
	], k = 0;
	/* the reference: the same steps, run while the page parses */
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
