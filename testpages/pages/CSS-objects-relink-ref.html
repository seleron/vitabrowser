<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS objects relink ref</title>
<style>
/* Patch 375. A local rebuild of a subtree holding images or CSS
 * background images declined (374: their object entries point at the
 * boxes it frees). It now keeps the old boxes alive across the build,
 * re-points each entry at the new box of the same element -- most are
 * moved by html_fetch_object's own adoption during the build -- retires
 * the ones whose element has no box any more, and frees the old boxes.
 * After its steps (600 ms apart) JS-objects-relink.html must render row
 * for row as CSS-objects-relink-ref.html, the same steps run while the
 * page parses: every image still drawn. Steps: a flex track of slides
 * with images and backgrounds, its style; a backgrounded paragraph's
 * class; a table cell's class in a table holding an image; a flex with an
 * image hidden, then shown. (An <object> is not tested: the full
 * reconvert's relink retires every non-image entry, so one is lost after
 * any full rebuild -- pre-existing, and the same on 374.) */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.track { display: flex; }
.track div { border: 1px solid #000; padding: 2px 4px; }
.bg { background-image: url(opimg-20.png); background-repeat: repeat-x; }
.wide { padding: 6px 20px; }
td { border: 1px solid #000; padding: 2px; }
.hot { background-color: #ff0; }
</style>
</head>
<body>
<div id="trk" class="track"><div class="bg">slide <img src="opimg-20.png" width="20" height="20"> one</div><div class="bg">slide <img src="opimg-20.png" width="20" height="20"> two</div></div>
<p id="bp" class="bg">A paragraph with a background image.</p>
<table id="tb"><tr><td id="c1">cell</td><td><img src="opimg-20.png" width="20" height="20"> image cell</td></tr></table>
<div id="hs" class="track"><div>hidden <img src="opimg-20.png" width="20" height="20"> then shown</div></div>
<p>Last paragraph.</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('trk').setAttribute('style', 'width:420px'); },
		function () { $('bp').className = 'bg wide'; },
		function () { $('c1').className = 'hot'; },
		function () { $('hs').style.display = 'none'; },
		function () { $('hs').style.display = ''; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
