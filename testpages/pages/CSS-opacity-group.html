<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS group opacity and light-dark()</title>
<!-- Checked in the plot dump by tools/run-vita-sim.sh (no script):
     opacity applies to an element and all it paints, multiplied down the
     tree. It reached background fills only, so opacity:0 hid nothing
     (example.com shows one language of six this way).
     - SHOWNMARK text must be plotted (solid: no OPAQUE token);
     - HIDDENSPANMARK (an inline span at opacity 0) must not;
     - HIDDENBLOCKMARK (text inside a block whose PARENT is at opacity 0)
       must not;
     - HALFMARK text (opacity .5) must carry OPAQUE 2 (35-60% bucket);
     - OUTERMARK text (opacity .7) must carry OPAQUE 3 (60-85%);
     - NESTEDMARK text (.35 inside .7 = .245) must carry OPAQUE 1 (5-35%);
     - the 200x30 box whose only background is light-dark(#3a6, #111)
       must be filled (the declaration was dropped as unknown).
     Patch 314 adds borders (they painted solid at partial opacity):
     - the 120-wide solid border inside .half: its 120x6 top/bottom
       RECTs and 6x32 side RECTs carry OPAQUE 2; the same box outside
       .half carries no token;
     - the 140-wide double border: 8 POLYGONs inside .half carry
       OPAQUE 2, 8 outside carry none;
     - the 110-wide dashed border: 4 LINEs inside .half carry
       OPAQUE 2, 4 outside carry none;
     - the 100-wide rgba(0,0,0,0.5) border: OPAQUE 2 standalone
       (colour alpha alone), OPAQUE 1 inside .half (colour alpha
       multiplied by the group).
     Patch 315 adds images and the disc/arc/path ops (doc 24 stage 1),
     in one flex row so all of them land inside the 544px viewport:
     - the 20x20 no-repeat background tile inside .half: its BITMAP
       carries OPAQUE 2 (drawn 1:1 through the tint entry);
     - the 16x16 tile repeated in both axes (with a blend mode set)
       inside .half: OPAQUE 2 on its BITMAP op -- the opacity byte
       composes with the REPEAT and blend bits; the same box outside
       .half carries no token;
     - a checked radio inside .half: 2 DISCs and 2 ARCs carry OPAQUE 2;
       the radio outside carries none;
     - an inline SVG rect inside .half: its PATH carries OPAQUE 2; the
       one outside carries none. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.gone { opacity: 0; }
.half { opacity: .5; }
.o7 { opacity: .7; }
.o35 { opacity: .35; }
#ld { width: 200px; height: 30px; background: light-dark(#3a6, #111); }
.brect { width: 120px; height: 20px; border: 6px solid #000; background: #fff; }
.bdbl { width: 140px; height: 20px; border: 9px double #000; background: #fff; }
.bdash { width: 110px; height: 20px; border: 3px dashed #000; background: #fff; }
.balpha { width: 100px; height: 24px; border: 6px solid rgba(0,0,0,0.5); background: #fff; }
.row { display: flex; gap: 8px; align-items: flex-start; }
.bgone { width: 60px; height: 30px; background: url(opimg-20.png) no-repeat 0 0; }
.bgrep { width: 64px; height: 32px; background: #fff url(opimg-16.png) repeat 0 0; background-blend-mode: multiply; }
</style>
</head>
<body>
<p>SHOWNMARK <span class="gone">HIDDENSPANMARK</span></p>
<div class="gone"><div><p>HIDDENBLOCKMARK</p></div></div>
<div class="half"><p>HALFMARK</p></div>
<div class="o7"><p>OUTERMARK</p><div class="o35"><p>NESTEDMARK</p></div></div>
<div id="ld"></div>
<div class="half"><div class="brect"></div></div>
<div class="brect"></div>
<div class="half"><div class="bdbl"></div></div>
<div class="bdbl"></div>
<div class="half"><div class="bdash"></div></div>
<div class="bdash"></div>
<div class="balpha"></div>
<div class="half"><div class="balpha"></div></div>
<div class="row">
<div class="half"><div class="bgone"></div></div>
<div class="half"><div class="bgrep"></div></div>
<div class="bgrep"></div>
<div class="half"><input type="radio" checked></div>
<div><input type="radio" checked></div>
<div class="half"><svg width="24" height="24"><rect width="24" height="24" fill="#00f"/></svg></div>
<div><svg width="22" height="22"><rect width="22" height="22" fill="#00f"/></svg></div>
</div>
</body>
</html>
