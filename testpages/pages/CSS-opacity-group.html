<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS group opacity and light-dark()</title>
<!-- Checked in the plot dump by tools/run-vita-sim.sh (no script):
     opacity applies to an element and all it paints, multiplied down the
     tree. It reached background fills only, so opacity:0 hid nothing
     (example.com shows one language of six this way).
     - SHOWNMARK text must be plotted (solid: no OPAQUE token);
     - HIDDENSPANMARK (an inline span at opacity 0) must not;
     - HIDDENBLOCKMARK (text inside a block whose PARENT is at opacity 0)
       must not;
     - HALFMARK text (opacity .5) must carry OPAQUE 2 (35-60% bucket);
     - OUTERMARK text (opacity .7) must carry OPAQUE 3 (60-85%);
     - NESTEDMARK text (.35 inside .7 = .245) must carry OPAQUE 1 (5-35%);
     - the 200x30 box whose only background is light-dark(#3a6, #111)
       must be filled (the declaration was dropped as unknown). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.gone { opacity: 0; }
.half { opacity: .5; }
.o7 { opacity: .7; }
.o35 { opacity: .35; }
#ld { width: 200px; height: 30px; background: light-dark(#3a6, #111); }
</style>
</head>
<body>
<p>SHOWNMARK <span class="gone">HIDDENSPANMARK</span></p>
<div class="gone"><div><p>HIDDENBLOCKMARK</p></div></div>
<div class="half"><p>HALFMARK</p></div>
<div class="o7"><p>OUTERMARK</p><div class="o35"><p>NESTEDMARK</p></div></div>
<div id="ld"></div>
</body>
</html>
