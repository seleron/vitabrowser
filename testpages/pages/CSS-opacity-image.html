<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS group opacity on images (OPIMG)</title>
<!-- Checked in the plot dump and snapshot by tools/run-vita-sim.sh (no
     script). Doc 24 stage 2 (patch 319): an <img> inside an opacity
     group fades with it, in every image format the build decodes. Every
     fixture is solid blue (0,0,255; the JPEG decodes near it) and has its
     own intrinsic size, so each trace line names its format:
       png 20, gif 22, svg 24, bmp 26, ico 28, jpeg 30.
     - row 1: each format at 1:1 inside .half -> BITMAP ... OPAQUE 2
       (drawn through the tint entry); the SVG's PATH OPAQUE 2;
     - row 2: each format at 2x inside .half -> OPAQUE 2 through the
       scaled path (a pre-multiplied copy); blue reads 127,127,255;
     - row 3: solid controls (png 1:1 and 2x, jpeg, svg): no token;
     - row 4: a png inside opacity:0 (34x34) is not plotted at all; a
       1x1 png stretched to 30x10 inside .half takes image.c's 1x1
       shortcut -> RECT 30x10 OPAQUE 2 (its control, 32x10, solid); a
       background scaled 20 -> 36 and a 16 -> 24 background repeated in
       x inside .half -> OPAQUE 2, both tiles faded (255,127,127). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; background: #fff; }
.row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 6px; }
.half { opacity: .5; }
.gone { opacity: 0; }
img { display: block; }
.bgscale { width: 36px; height: 36px; background: url(opimg-20.png) no-repeat 0 0; background-size: 36px 36px; }
.bgscalerep { width: 48px; height: 24px; background: url(opimg-16.png) repeat-x 0 0; background-size: 24px 24px; }
</style>
</head>
<body>
<div class="row half">
<img src="opimg-20.png" width="20" height="20">
<img src="opimg-22.gif" width="22" height="22">
<img src="opimg-24.svg" width="24" height="24">
<img src="opimg-26.bmp" width="26" height="26">
<img src="opimg-28.ico" width="28" height="28">
<img src="opimg-30.jpg" width="30" height="30">
</div>
<div class="row half">
<img src="opimg-20.png" width="40" height="40">
<img src="opimg-22.gif" width="44" height="44">
<img src="opimg-24.svg" width="48" height="48">
<img src="opimg-26.bmp" width="52" height="52">
<img src="opimg-28.ico" width="56" height="56">
<img src="opimg-30.jpg" width="60" height="60">
</div>
<div class="row">
<img src="opimg-20.png" width="20" height="20">
<img src="opimg-20.png" width="40" height="40">
<img src="opimg-30.jpg" width="30" height="30">
<img src="opimg-24.svg" width="24" height="24">
<img src="opimg-1x1.png" width="32" height="10">
</div>
<div class="row">
<div class="gone"><img src="opimg-20.png" width="34" height="34"></div>
<div class="half"><img src="opimg-1x1.png" width="30" height="10"></div>
<div class="half"><div class="bgscale"></div></div>
<div class="half"><div class="bgscalerep"></div></div>
</div>
</body>
</html>
