<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Outline colour alpha</title>
<style>
:root { --accent: 213 71% 47%; }
body { margin: 20px; }
.o { width: 200px; height: 20px; margin: 16px 4px; outline-width: 2px; outline-style: solid; }
#clear { outline-color: rgba(0, 0, 0, 0); }
#hsla { outline-color: hsla(var(--accent) / 0%); }
#half { outline-color: rgba(0, 0, 0, 0.5); }
#solid { outline-color: #000; }
.half { opacity: .5; }
</style>
</head>
<body>
<!-- Patch 335 (claude.ai): the outline painter dropped the colour's alpha,
     so a transparent outline drew opaque (claude.ai's links carry
     `outline: 2px solid hsla(var(--accent-100) / 0%)`; its header link
     drew a blue frame across the page). Checked in the trace: the 204x24
     outline rects -- the two transparent outlines draw nothing, the 50%
     one traces OPAQUE 2, the opaque one no token, and an opaque outline
     inside an opacity: .5 group traces OPAQUE 2 (group opacity folds in,
     as for borders since 314). -->
<div class="o" id="clear"></div>
<div class="o" id="hsla"></div>
<div class="o" id="half"></div>
<div class="o" id="solid"></div>
<div class="half"><div class="o" id="grp" style="outline-color:#000"></div></div>
</body>
</html>
