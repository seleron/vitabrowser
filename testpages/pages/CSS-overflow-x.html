<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS overflow x</title>
<!-- Two ways real pages ran wider than the screen (docs/phase-0/11,
     Wikipedia's article at 1011 px): an unbreakable URL in
     overflow-wrap: break-word text (patch 64), and Minerva's header -- an
     icon-only button with min-width: 44px in a flex nav whose last child
     has a -12px margin (patch 65). Fixed, the page is exactly 960 wide. -->
<style>
body { font-family: sans-serif; font-size: 18px; margin: 12px; }
/* 12px: the button's -12px margin reaches exactly the page edge, as in Minerva. */
.refs { width: 600px; overflow-wrap: break-word; }
.header { display: flex; align-items: center; }
.header .brand { flex-grow: 1; }
.nav { display: flex; justify-content: flex-end; }
.nav > *:last-child { margin-right: -12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 32px; padding: 0; }
.icon { display: inline-block; width: 20px; height: 20px; background: #333; }
</style>
</head>
<body>
<div class="header"><div class="brand">Header</div><nav class="nav"><div><label class="btn"><span class="icon"></span></label></div></nav></div>
<p class="refs">A citation: https://example.com/averyveryverylongpathsegmentwithnobreaksaveryveryverylongpathsegmentwithnobreaksaveryveryverylongpathsegmentwithnobreaksaveryveryverylongpathsegmentwithnobreaks</p>
</body>
</html>
