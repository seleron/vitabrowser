<!-- Patch 92. The inset expander used to give up on a sheet whose
     expansions outgrew its fixed headroom (24 insets here, then a long
     tail): every inset: stayed unexpanded, so .fill below was 0x0. Expect a
     333x44 PLOT RECT. And order: calc(1 * -1) must fold to the integer -1,
     so the 122-wide flex item is drawn left of the 111-wide one. -->

.box { position: relative; width: 333px; height: 44px; margin: 4px; }
.fill { position: absolute; inset: 0; background: #000; }
