<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS rm objects ref</title>
<style>
/* Patch 454. Removing a block that holds objects -- an <img>, or a box a
 * background image points into -- declined ("removed block holds objects
 * or frames": bbc, youtube, 3.0 a load) into the full rebuild. The parent
 * is built again whole now: 375's relink re-points the objects that stay
 * and retires the removed ones, as the full rebuild's relink does. A
 * removed frame keeps the full rebuild (371). Steps (each flushed alone by
 * a layout read): a block holding an <img> removed; a block with a
 * background image removed; a block of blocks holding an <img> removed.
 * Images that stay (above and below) still paint. Row for row as
 * CSS-rm-objects-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
img { width: 40px; height: 40px; vertical-align: middle; }
.bg { height: 30px; background: url(lazyimg-02.png) repeat-x; }
</style>
</head>
<body>
<div id="w">
<div>Stays: <img src="lazyimg-01.png" alt=""> an image above.</div>
<div>Stays: <img src="lazyimg-05.png" alt=""> an image below.</div>
<div class="bg"></div>
<p>Last paragraph.</p>
</div>
</body>
</html>
