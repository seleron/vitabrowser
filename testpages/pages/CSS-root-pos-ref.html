<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS root pos ref</title>
<style>
/* Patch 475. A sheet that makes <html> position: relative (rte: a late
 * sheet) changed the root's style in a way 459's in-place root restyle
 * refused -- it required the same position, but box construction reads
 * position only for absolute and fixed. Now static, relative and sticky
 * count as the same to construction: the root is restyled in place and
 * the page laid out whole (the absolutely positioned box now has the
 * relative root as its containing block). Row for row as
 * CSS-root-pos-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; }
p { margin: 4px 10px; }
#abs { position: absolute; top: 4px; right: 10px; background: #fcc; padding: 2px 4px; }
</style>
</head>
<body>
<p>A page whose root becomes position: relative.</p>
<p>Second paragraph.</p>
<div id="abs">absolute</div>
<script>
(function () {
	function op() {
		var st = document.createElement('style');
		st.textContent = 'html { position: relative; background: #eef; }';
		document.head.appendChild(st);
	}
	op();
})();
</script>
</body>
</html>
