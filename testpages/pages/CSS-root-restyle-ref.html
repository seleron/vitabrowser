<!DOCTYPE html>
<html class="wide">
<head>
<meta charset="utf-8">
<title>CSS root restyle ref</title>
<style>
/* Patch 459. A change whose re-cascade changed the root <html>'s own
 * style declined ("an element's style changes, HTML": bbc's sheet
 * removals, 1.0 a load), as everything inherits from the root. The walk
 * cascades the root's children against its NEW style, so every element
 * under it is still compared; the root's box takes its new style in place
 * (same display, float and position, no generated content, no counting),
 * the page laid out whole. Steps (each flushed alone by a layout read):
 * the <style id="r"> that gives <html> a background removed; a class on
 * <html> that changes its left padding. Row for row as
 * CSS-root-restyle-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
html.wide { padding-left: 24px; }
</style>
</head>
<body>
<p>A paragraph.</p>
<p>Another paragraph.</p>
</body>
</html>
