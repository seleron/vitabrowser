<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sheet pending ref</title>
<style>
/* Patch 458. A sheet change while another <style>'s text update is still
 * pending declined ("sheet change: a sheet is still loading or changing":
 * 2.0 a load). The full reconvert neither processes the update nor
 * refreshes the selection context then, so it cascades the live context
 * (the edited sheet's old version still in it); the change is walked
 * against that live context now, and the edited sheet's own batch applies
 * its new rules when it is done. Steps (one task each, then a layout
 * read): #s1's text changed and a new <style> added; then #s2's text
 * changed and a paragraph's class set. Row for row as
 * CSS-sheet-pending-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
</style>
<style id="s1">.a { color: #00c; }</style>
<style>.b { font-weight: bold; }</style>
<style id="s2">.c { background: #efe; }</style>
</head>
<body>
<p class="a">A paragraph red, then blue (#s1 edited).</p>
<p class="b">A paragraph bold (a new sheet).</p>
<p id="p3" class="c">A paragraph that gains .c (green background once #s2 is edited).</p>
</body>
</html>
