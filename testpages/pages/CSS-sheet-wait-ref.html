<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sheet wait ref</title>
<style>
/* Patch 442. A sheet change while another sheet is still loading declined
 * ("sheet change: a sheet is still loading or changing": 415's re-cascade
 * cannot be made from a sheet in flight) and took the full rebuild
 * (google, bbc, oldreddit). The batch now waits for the sheets to settle
 * (retried every 100 ms, at most 1.5 s); the slow sheet's own mark joins
 * it, and the re-cascade then finds no style changed. Steps (150 ms apart,
 * all inside the second the sheet takes): a <link> to a slow sheet added
 * (it stays), a <style> that styles nothing given new text, a paragraph's
 * text changed. Row for row as CSS-sheet-wait-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
</style>
<link rel="stylesheet" href="/wait-sheet-442.css">
</head>
<body>
<p id="p1">First paragraph.</p>
<style id="st">.vb442-unused { color: #0a0; }</style>
<p id="p2">Second paragraph, its text changed.</p>

</body>
</html>
