<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sib func ref</title>
<style>
/* Patch 427. A :not() / :is() / :where() in a sibling rule's left
 * compound made the whole sheet "conservative": every class change and
 * block insert on the page took the full rebuild (youtube, archwiki, rte,
 * the WordPress pages). An argument that is a list of single compounds is
 * read now: each is a left compound of its own. The block inserted into
 * .u and the class change on #m are answered locally; .off added to the
 * .x (the .y loses its red) and .w added before the .z (the .z turns
 * green; its :where() holds a descendant chain) still decline, precisely.
 * Row for row as CSS-sib-func-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div { margin: 4px 10px; }
.u > div { background: #eef; }
.x:not(.off) + .y { color: #c00; }
:where(#wz .w) ~ .z { color: #060; }
input:not(:checked) ~ .t, .s:is(.q, [data-k]) + .t { font-weight: bold; }
.m2 { background: #ffe; }
</style>
</head>
<body>
<div class="u" id="u"><div id="u1">Block one.</div><div id="u2">Block two.</div></div>
<div id="xy"><div class="x" id="x">An .x.</div><div class="y">A .y after it (red until .off).</div></div>
<div id="wz"><div id="w">Becomes .w.</div><div class="z">A .z (green once a .w comes before it).</div></div>
<div id="m">A block whose class changes (pale yellow).</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var d = document.createElement('div'); d.textContent = 'A block inserted into .u.'; $('u').insertBefore(d, $('u2')); },
		function () { $('m').className = 'm2'; },
		function () { $('x').className = 'x off'; },
		function () { $('w').className = 'w'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
