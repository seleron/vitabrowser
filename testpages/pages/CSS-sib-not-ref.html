<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sib not ref</title>
<style>
/* Patch 505. The sibling-rule scanner could not read a sibling combinator
 * inside :not() / :is() / :where(), and one such selector made its whole
 * sheet conservative: every insert on the page was then a sibling risk
 * (stackoverflow's Stacks ".s-btn:not(.s-btn--radio:checked+label)" made
 * its <body> be rebuilt whole on each <iframe> it inserts). The inner
 * "A + B" / "A ~ B" is now read as a rule of the sheet and the pseudo-class
 * ignored like a plain one. After its steps (250 ms apart) JS-sib-not.html
 * must render row for row as CSS-sib-not-ref.html, the same steps at parse
 * time. Steps: an .a inserted before a .b (the .b loses :not(.a + .b));
 * that .a removed (it gains it back); an .x inserted before two .y (both
 * gain :is(.x ~ .y)); a .p before a .q (nested :not(:is(.p + .q)));
 * unrelated <div>s inserted into each box (no rule can see them: placed
 * alone). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.box { margin: 4px 10px; background: #eef; padding: 2px; }
.box > div { border: 1px solid #000; padding: 2px 6px; margin: 2px; }
.b:not(.a + .b) { color: #c00; font-weight: bold; }
.y:is(.x ~ .y) { background: #cfc; }
.q:not(:is(.p + .q)) { text-decoration: underline; }
.s-btn:not(.s-btn--radio:checked+label):focus { outline: 2px solid #00c; }
</style>
</head>
<body>
<div id="m" class="box"><div class="z">m-z</div><div id="b1" class="b">b1</div><div class="b">b2</div></div>
<div id="n" class="box"><div class="w">n-w</div><div class="y">y1</div><div class="y">y2</div></div>
<div id="o" class="box"><div class="w">o-w</div><div id="q1" class="q">q1</div></div>
<div id="u" class="box"><div>u1</div><div>u2</div><div>u3</div></div>
<p>After the boxes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function el(cls, text) { var d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; return d; }
	var ops = [
		function () { $('m').insertBefore(el('a', 'a1'), $('b1')); },
		function () { $('m').removeChild($('m').querySelector('.a')); },
		function () { $('n').insertBefore(el('x', 'x1'), $('n').children[1]); },
		function () { $('o').insertBefore(el('p', 'p1'), $('q1')); },
		function () { $('u').insertBefore(el('', 'u1.5'), $('u').children[1]); },
		function () { $('m').appendChild(el('', 'm-tail')); }
	], k = 0;
	/* the reference: the same steps, run while the page parses */
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
