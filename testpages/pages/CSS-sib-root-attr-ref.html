<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sib root attr ref</title>
<style>
/* Patch 465. A sibling rule ([data-r] ~ p, [data-t] + p) reaches only
 * the element's later siblings. On the root (data-r on <html>: github's
 * data-turbo-loaded) and on a last child (data-t on #wrap's last div,
 * only a <script> after it) it reaches nothing that renders: the change
 * is answered as one no sibling rule can see, re-selecting the element
 * and its subtree (html[data-r] .box turns green, #last red). data-t on
 * #mid, which has a <p> after it, still builds the parent again whole
 * (445). Row for row as CSS-sib-root-attr-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
[data-r] ~ p { color: #00c; }
html[data-r] .box { background: #cfc; }
[data-t] + p { color: #00c; }
div[data-t] { color: #c00; }
</style>
</head>
<body>
<div class="box">A box, green once the root has data-r.</div>
<div id="wrap">
<div id="mid">A middle div that gains data-t (red).</div>
<p>The paragraph after it (blue once #mid has data-t).</p>
<div id="last">The last div, gains data-t (red).</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { document.documentElement.setAttribute('data-r', '1'); },
		function () { $('last').setAttribute('data-t', '1'); },
		function () { $('mid').setAttribute('data-t', '1'); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</div>
</body>
</html>
