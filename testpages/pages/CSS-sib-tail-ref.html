<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sib tail ref</title>
<style>
/* Patch 381. Patch 198's sibling-combinator check declined every block
 * insertion and removal on a sheet whose sibling rules it cannot analyse
 * (a pseudo-class in a left compound -- most real sheets, youtube's), and
 * youtube's <iframe>s appended to <body> met it. A + / ~ rule restyles
 * the element AFTER its left one: a change at the parent's tail -- an
 * element appended with only box-less tags after it, the last one
 * removed -- moves no existing sibling's match; the parent's :empty still
 * counts, and :has() never matches in this libcss. After its steps
 * (600 ms apart) JS-sib-tail.html must render row for row as
 * CSS-sib-tail-ref.html, the same steps run while the page parses. Local:
 * an <iframe> and a <script> appended to <body>; a .n appended to a list
 * with a .n + .n rule; its last .n removed. Full: a .n inserted first (not
 * the tail); content appended into an empty .slot (its :empty flips). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.a:hover + .b { color: #c00; }
.n + .n { margin-top: 12px; border-top: 1px solid #888; }
.slot:empty + p { color: #00c; }
div:has(> .x) { background: #fee; }
iframe { width: 80px; height: 20px; border: 2px solid #000; }
</style>
</head>
<body>
<div id="list"><div class="n" id="n1">first item</div><div class="n">second item</div></div>
<div id="slot" class="slot"></div>
<p>Blue while the slot before it is empty.</p>
<p>Last paragraph.</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var f = document.createElement('iframe'); f.name = 'tail381'; document.body.appendChild(f); },
		function () { var s = document.createElement('script'); s.text = 'window.vb381 = 1;'; document.body.appendChild(s); },
		function () { var d = document.createElement('div'); d.className = 'n'; d.textContent = 'appended item'; $('list').appendChild(d); },
		function () { var l = $('list'); l.removeChild(l.lastElementChild); },
		function () { var d = document.createElement('div'); d.className = 'n'; d.textContent = 'inserted first'; $('list').insertBefore(d, $('n1')); },
		function () { var d = document.createElement('div'); d.textContent = 'The slot is filled.'; $('slot').appendChild(d); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
