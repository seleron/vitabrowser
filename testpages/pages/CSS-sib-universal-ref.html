<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sib universal ref</title>
<style>
/* Patch 413. Three things made a whole sheet "conservative" for the
 * sibling checks (every block insert/remove on the page declined): a bare
 * universal selector (.u > *), a comment before an @font-face (Google
 * Fonts: its descriptors were parsed as a selector), a plain pseudo-class
 * in a sibling rule's left compound (.a:first-child + .b), and an
 * nth-*() of An+B only (rte's :nth-last-child(2) ~). This sheet has
 * all four and stays precise: the block inserted into .u is placed
 * locally. An .a inserted after the first-child .a, before the .b, must
 * still decline -- broad matches of both .a's cannot be compared -- and
 * the .b loses its red. And a .hx block inserted into .hb gives it the
 * green border of .hb:has(> .hx): that insert (ahead of .hb's child, not
 * at its tail -- the tail takes 381's own path) must decline too (before 413
 * a parsed :has() never reached 198's list -- placed locally, the border
 * never appeared). Row for row as CSS-sib-universal-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
/* latin */
@font-face { font-family: "Vb413"; src: local("Arial"); unicode-range: U+0000-00FF, U+0131; }
.u > * { margin: 4px 10px; background: #eef; }
.a:first-child + .b { color: #c00; }
.nq:nth-child(2n+1) ~ .nz { color: #060; }
.hb:has(> .hx) { border: 3px solid #0a0; padding: 4px; }
div { margin: 4px 10px; }
</style>
</head>
<body>
<div class="u" id="u"><div id="u1">Universal one.</div><div id="u2">Universal two.</div><div id="u3">Universal three.</div></div>
<div class="hb" id="hb"><div>A .hb box (no border until a .hx arrives).</div></div>
<div id="ab"><div class="a" id="a1">An .a, the first child.</div><div class="b">A .b after it (red).</div></div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var d = document.createElement('div'); d.textContent = 'A block inserted into .u.'; $('u').insertBefore(d, $('u3')); },
		function () { var d = document.createElement('div'); d.className = 'a'; d.textContent = 'A second .a, inserted (the .b loses red).'; $('ab').insertBefore(d, $('a1').nextSibling); },
		function () { var d = document.createElement('div'); d.className = 'hx'; d.textContent = 'A .hx block inserted (.hb turns green).'; $('hb').insertBefore(d, $('hb').firstChild); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
