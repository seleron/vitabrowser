<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sib unreadable ref</title>
<style>
/* Patch 412. One selector the sibling parser cannot read (an escaped
 * class in hex, .md\3a flex; a plain \: escape
 * parses) made the whole sheet "conservative", and every block
 * inserted or removed on the page took the full rebuild (cnnlite, rte,
 * google, oldreddit). A selector with no + ~ :empty :has() in it adds no
 * sibling risk: this page's inserts and a removal are placed locally, row
 * for row as CSS-sib-unreadable-ref.html (the same steps at parse time). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.md\3a flex { border-left: 4px solid #888; }
.b { background: #eef; padding: 2px; }
</style>
</head>
<body>
<div id="u"><div class="b" id="u1">Block one.</div><div class="b md:flex" id="u2">Block two (escaped class).</div><div class="b" id="u3">Block three.</div><div class="b" id="u4">Block four, removed.</div></div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var p = document.createElement('p'); p.textContent = 'A paragraph inserted between blocks.'; $('u').insertBefore(p, $('u3')); },
		function () { var d = document.createElement('div'); d.className = 'b'; d.textContent = 'A block appended.'; $('u').appendChild(d); },
		function () { $('u').removeChild($('u4')); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
