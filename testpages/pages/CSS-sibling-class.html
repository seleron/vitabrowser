<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS sibling class precise (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
/* Unrelated sibling rules: must NOT force a full rebuild */
.menu + .content { color: rgb(0, 128, 0); }
.sidebar ~ .widget { color: rgb(0, 0, 128); }
/* Genuine risk: these DO involve the mutated element */
#risk1.on + #risk1next { color: rgb(255, 0, 0); }
#risk2.on ~ .risk2tail { color: rgb(0, 0, 255); }
/* :has(+ ...) is a conservative decline */
#risk3:has(+ .risk3next) { color: rgb(128, 0, 128); }
/* Multiple sibling combinators in a chain */
.a + .b + .c { color: rgb(255, 128, 0); }
/* nth-child arithmetic plus is not a combinator */
#risk4:nth-child(2n+1) { font-weight: bold; }
</style>
</head>
<body>
<!-- Patch 186: precise sibling-combinator risk for class changes.
     1: Unrelated sibling CSS (.menu + .content): class change on #u1 stays
        local (no full rebuild needed).
     2: Genuine + risk: #risk1.on + #risk1next turns the next red.
     3: Genuine ~ risk: #risk2.on ~ .risk2tail turns the tail blue.
     4: :has(+ ...) conservative decline: #risk3 restyles (full rebuild).
     5: Multiple combinators: .a + .b + .c chain.
     6: nth-child(2n+1) is not a combinator: no false decline. -->
<p id="sum" class="wait">SIB186: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p><p id="r6" class="wait">6 waiting</p>
<div id="test">
<p id="u1">unrelated</p><p id="u1next">unrelated next</p>
<p id="risk1">risk1</p><p id="risk1next">risk1 next</p>
<p id="risk2">risk2</p><p class="risk2tail">risk2 tail</p>
<p id="risk3">risk3</p><p class="risk3next">risk3 next</p>
<p id="m1" class="a">m1</p><p id="m2" class="b">m2</p><p id="m3" class="c">m3</p>
<p id="risk4">risk4</p>
</div>
<script>
(function () {
	var N = 6, res = [];
	function $(id) { return document.getElementById(id); }
	function c(id) { return String(getComputedStyle($(id)).color).replace(/\s+/g, ''); }
	var RED = 'rgb(255,0,0)', BLUE = 'rgb(0,0,255)', PURPLE = 'rgb(128,0,128)',
	    ORANGE = 'rgb(255,128,0)', GREEN = 'rgb(0,128,0)';
	var steps = [
		[function () { $('u1').className = 'changed'; },
			function () { return c('u1next') !== GREEN; }, 'unrelated sibling CSS: stays local'],
		[function () { $('risk1').className = 'on'; },
			function () { return c('risk1next') === RED; }, 'genuine +: next turns red'],
		[function () { $('risk2').className = 'on'; },
			function () { return c('risk2') !== BLUE && document.querySelector('.risk2tail') &&
				String(getComputedStyle(document.querySelector('.risk2tail')).color).replace(/\s+/g, '') === BLUE; },
			'genuine ~: tail turns blue'],
		[function () { $('risk3').className = 'on'; },
			function () { return true; }, ':has(+ ...) decline: no crash'],
		[function () { /* chain already styled */ },
			function () { return c('m3') === ORANGE; }, 'multiple combinators: .c orange'],
		[function () { $('risk4').className = 'changed'; },
			function () { return true; }, 'nth-child(2n+1): no false decline']
	];
	function show() {
		var k = 0;
		for (var n = 0; n < N; n++) {
			var p = $('r' + (n + 1)), r = res[n];
			p.textContent = (n + 1) + ' ' + steps[n][2] + (r ? '' : ' FAIL');
			if (r) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'SIB186: ' + k + '/' + N + ' passed';
		document.title = 'CSS sibling class precise (' + k + '/' + N + ')';
	}
	function run(i) {
		if (i >= steps.length) { show(); return; }
		steps[i][0]();
		setTimeout(function () {
			res[i] = steps[i][1]();
			setTimeout(function () { run(i + 1); }, 100);
		}, 600);
	}
	window.addEventListener('load', function () { setTimeout(function () { run(0); }, 300); });
})();
</script>
</body></html>
