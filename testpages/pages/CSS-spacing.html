<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS spacing, calc and layout</title>
<!-- Patches 101-108 (Tailwind's calc(var(--spacing) * N) layer). Every
     block has its own width so run-vita-sim.sh can find it in the plot:
     101 gap: calc(4px * 5): the 32-wide item starts 51px after the 31-wide
     102 --sp set in ":root,:host": a calc(var(--sp) * 30) = 120x11 block
     103 @supports (-webkit-touch-callout:default) must not apply: 133x11,
         never 333
     104 inline style calc(Npx * 2) heights on 141..145-wide blocks:
         2 4 6 8 10
     105 inline-flex button 200x40 (1px border) centres its 37x10 child:
         +80|81 across and +15 down from its top border band (198x1)
     106 abs inset:0 child of a padded flex container: 170x50 (padding box)
     107 border-radius + bottom:2px on an abs child: 11x36 (the radius
         turned bottom's px into em)
     108 @media (min-width: 350px): 188x11, not 88x11
    Round 10: Tailwind v4 range-syntax media queries (width>=N / width<=N /
    double ranges). libcss parsed the form (mq_parse_range) and matched
    bare width (mq_match_feature), but mq_parse_range stored the feature
    *name* as its value when the name came first -- (width>=350px) got the
    IDENT "width" as value, which the matcher rejects (needs a dimension).
    Patch 109 fixes the value source in libcss. Before patch 108 the
    viewport was 0x0, so even the working value-first form behaved as if
    the page were 0px wide. Regression guards for both fixes: at the
    960-wide simulator viewport, (width>=350px) and
    (350px <= width <= 960px) must apply, (width>=961px) must not.
    251: (width>=350px)              -> 251x11 (applies at 960)
    252: (width>=961px)              -> 11x11  (does not apply at 960)
    253: (350px <= width <= 960px)   -> 253x11 (double range, applies) -->
<style>
:root, :host { --sp: 4px; }
body { margin: 0; font: 12px sans-serif; }
.x { background: #000; height: 11px; margin: 2px 0; }
.g { display: flex; gap: calc(4px * 5); margin: 2px 0; }
.g > .g1 { width: 31px; height: 10px; background: #000; }
.g > .g2 { width: 32px; height: 10px; background: #000; }
.v { width: calc(var(--sp) * 30); }
.k { width: 133px; }
@supports (-webkit-touch-callout: default) { .k { width: 333px; } }
.b { display: inline-flex; align-items: center; justify-content: center;
     width: 200px; height: 40px; padding: 0; border: 1px solid #000;
     background: #fff; box-sizing: border-box; }
.b > .bc { width: 37px; height: 10px; background: #000; display: block; }
.f { display: flex; position: relative; width: 150px; height: 30px;
     padding: 10px; margin: 2px 0; }
.f > .fa { position: absolute; inset: 0; background: #000; }
.r { position: relative; width: 160px; height: 40px; margin: 2px 0; }
.r > .ra { position: absolute; top: 2px; bottom: 2px; left: 0; width: 11px;
           border-radius: 4px; background: #000; }
.m { width: 88px; }
@media (min-width: 350px) { .m { width: 188px; } }
/* Round 10: range-syntax media queries (see the comment above). */
.mq  { width: 11px; }
@media (width>=350px)            { .mq1 { width: 251px; } }
@media (width>=961px)            { .mq2 { width: 252px; } }
@media (350px <= width <= 960px) { .mq3 { width: 253px; } }
</style>
</head>
<body>
<div class="g"><div class="g1"></div><div class="g2"></div></div>
<div class="x v"></div>
<div class="x k"></div>
<div class="x" style="width: 141px; height: calc(1px * 2)"></div>
<div class="x" style="width: 142px; height: calc(2px * 2)"></div>
<div class="x" style="width: 143px; height: calc(3px * 2)"></div>
<div class="x" style="width: 144px; height: calc(4px * 2)"></div>
<div class="x" style="width: 145px; height: calc(5px * 2)"></div>
<div><button class="b"><span class="bc"></span></button></div>
<div class="f"><div class="fa"></div></div>
<div class="r"><div class="ra"></div></div>
<div class="x m"></div>
<div class="x mq1"></div>
<div class="x mq2"></div>
<div class="x mq3"></div>
</body>
</html>
