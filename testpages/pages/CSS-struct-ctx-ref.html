<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS struct ctx ref</title>
<style>
/* Patch 506. The structural-rule check kept only the compound holding the
 * pseudo-class: Google's ".P1ekSe-ZMv3u>div:nth-child(2)" (its sign-in
 * widget's sheet, on stackoverflow) counted as div:nth-child(2) and hit
 * every second <div> of every parent -- stackoverflow's <body> among them.
 * The compound's parent (">") or ancestor (" ") context is kept now, and a
 * parent that cannot satisfy it has no hits. After its steps (250 ms
 * apart) JS-struct-ctx.html must render row for row as
 * CSS-struct-ctx-ref.html, the same steps at parse time. Steps: an insert
 * at the start of a .g box (its second <div> changes: restyled) and of a
 * plain box (the rule cannot match: no hit); the same for an ancestor
 * rule inside and outside .h; a removal from a .g box. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.box { margin: 4px 10px; background: #eef; padding: 2px; }
.box > div { border: 1px solid #000; padding: 2px 6px; margin: 2px; }
.g > div:nth-child(2) { background: #fc8; }
.h div:first-child { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<div id="g1" class="box g"><div>g1-a</div><div>g1-b</div><div>g1-c</div></div>
<div id="p1" class="box"><div>p1-a</div><div>p1-b</div><div>p1-c</div></div>
<div class="h"><div id="h1" class="box"><div>h1-a</div><div>h1-b</div></div></div>
<div id="q1" class="box"><div>q1-a</div><div>q1-b</div></div>
<div id="g2" class="box g"><div>g2-a</div><div id="g2b">g2-b</div><div>g2-c</div></div>
<p>After the boxes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function el(text) { var d = document.createElement('div'); d.textContent = text; return d; }
	var ops = [
		function () { $('g1').insertBefore(el('g1-new'), $('g1').firstChild); },
		function () { $('p1').insertBefore(el('p1-new'), $('p1').firstChild); },
		function () { $('h1').insertBefore(el('h1-new'), $('h1').firstChild); },
		function () { $('q1').insertBefore(el('q1-new'), $('q1').firstChild); },
		function () { $('g2').removeChild($('g2').firstChild); }
	], k = 0;
	/* the reference: the same steps, run while the page parses */
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
