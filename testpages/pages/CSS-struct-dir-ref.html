<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS struct dir ref</title>
<style>
/* Patch 380. A structural rule counts EARLIER siblings (:first-*,
 * :nth-child, :nth-of-type) or LATER ones (:last-*, :nth-last-*), or both
 * (:only-*): only children after a change can flip the first kind, only
 * children before it the second. youtube's real matches (379) were a bare
 * :first-child on <body>'s first child while <iframe>s were appended at
 * the end. After its steps (600 ms apart) JS-struct-dir.html must render
 * row for row as CSS-struct-dir-ref.html, the same steps run while the
 * page parses. Local: two <iframe>s appended to <body> (the second makes
 * the first no longer the last of its type, but the only *-of-type rule
 * is .tab:not(.x):not(:last-of-type), bounded by its outer .tab -- youtube's
 * shape); a <script> appended
 * (no rebuild); an <li> appended to a striped list; its last <li>
 * removed; a <script> removed (no rebuild). Full: a <div> inserted first in a box (the old first child
 * flips); two <script>s removed in one go (two places: the whole range;
 * one removed alone is placed by its next sibling, patch 380); a <p>
 * appended after a p:last-child (the old last one flips). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div, ul { margin: 4px 10px; }
:first-child { border-left: 4px solid #00c; }
p:last-child { color: #c00; }
#zebra li:nth-child(odd) { background: #ddd; }
.tab:not(.x):not(:last-of-type) { color: #050; }
iframe { width: 80px; height: 20px; border: 2px solid #000; }
</style>
</head>
<body>
<div id="box"><div id="bf">First block of the box.</div><div>Its second.</div></div>
<ul id="zebra"><li>one</li><li>two</li><li id="zl">three</li></ul>
<div id="ps"><p>First paragraph.</p><p>Last paragraph, red (last child).</p></div>
<script id="victim">window.vb380v = 1;</script>
<script id="victim2">window.vb380w = 1;</script>
<script id="victim3">window.vb380x = 1;</script>
<p>Body's last paragraph (not last child: scripts follow).</p>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var f = document.createElement('iframe'); f.name = 'tail'; document.body.appendChild(f); },
		function () { var f = document.createElement('iframe'); f.name = 'tail2'; document.body.appendChild(f); },
		function () { var s = document.createElement('script'); s.text = 'window.vb380a = 1;'; document.body.appendChild(s); },
		function () { var l = document.createElement('li'); l.textContent = 'four'; $('zebra').appendChild(l); },
		function () { var z = $('zebra'); z.removeChild(z.lastElementChild); },
		function () { var d = document.createElement('div'); d.textContent = 'A block inserted first.'; $('box').insertBefore(d, $('bf')); },
		function () { $('victim').parentNode.removeChild($('victim')); },
		function () { document.body.removeChild($('victim2')); document.body.removeChild($('victim3')); },
		function () { var p = document.createElement('p'); p.textContent = 'A paragraph appended, now the last child.'; $('ps').appendChild(p); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
