<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS struct hidden ref</title>
<style>
/* Patch 431. A structural rule matching a sibling after a child-list
 * change restyles the matching siblings alone (patch 405) -- but a
 * matching sibling with no box (a <script>, a <style>, a hidden <div>:
 * guardian's, wpnews', youtube's, cnnlite's) declined into the full
 * rebuild. One its new style still hides has nothing to restyle now. Each
 * container holds an <iframe> and a text field, so the whole-parent
 * rebuild would decline. Steps: a row inserted first in #h (every
 * sibling's parity flips: the <script>, <style> and hidden <div> stay
 * hidden); a row inserted first in #g, whose hidden .h2 is shown by
 * .h2:nth-child(odd) once its parity flips (the insert builds it, a
 * box-less element in the changed range, before the structural check);
 * a paragraph's text. Row for row as CSS-struct-hidden-ref.html,
 * the same steps run while the page parses. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
#h > :nth-child(odd), #g > :nth-child(odd) { color: #c00; }
.hid, .h2 { display: none; }
#g > .h2:nth-child(odd) { display: block; border-left: 4px solid #00c; }
iframe { width: 80px; height: 20px; border: 2px solid #000; }
input { width: 120px; }
</style>
</head>
<body>
<div id="h"><div><iframe name="fh"></iframe></div><div><input value="field"></div><div>Row one.</div><script>var vb431 = 1;</script><div>Row two.</div><style>.never { color: #000; }</style><div class="hid">Hidden row.</div><div>Row three.</div></div>
<div id="g"><div><iframe name="fg"></iframe></div><div><input value="field"></div><div>Row A.</div><div class="h2">Shown once its parity flips.</div><div>Row B.</div></div>
<p id="p1">A paragraph whose text changes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function row(t) { var d = document.createElement('div'); d.textContent = t; return d; }
	var ops = [
		function () { $('h').insertBefore(row('Row zero, inserted.'), $('h').firstChild); },
		function () { $('g').insertBefore(row('Row zero, inserted.'), $('g').firstChild); },
		function () { $('p1').textContent = 'A paragraph whose text changed.'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
