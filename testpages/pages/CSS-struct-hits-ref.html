<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS struct hits ref</title>
<style>
/* Patch 405. A structural rule that matches a sibling after a child-list
 * change used to rebuild the page (404: the parent's subtree, which
 * declines when the parent holds frames or controls -- youtube's <body>).
 * Now, when the matching compound is bounded and no sibling combinator
 * follows it, only the matching siblings are restyled. Each container here
 * holds an <iframe> and a text field (in their own blocks), so 404's
 * whole-parent rebuild would decline. After its steps (600 ms apart)
 * JS-struct-hits.html must render row for row as CSS-struct-hits-ref.html,
 * the same steps run while the page parses. Narrow: two rows appended to
 * #c (the old last row loses .row:last-child), the last removed (the new
 * last regains it), a <p> appended to #c3 (p:last-child, and its <b>
 * through a descendant rule), a .tab appended to #c4 (youtube's shape: the
 * structural pseudo inside :not(), .tab:not(.x):not(:last-child)). Full:
 * an .item inserted first in #c2, where
 * .item:first-child is followed by "+" (another element flips: no
 * narrowing). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.row { padding: 2px; }
.row:last-child { color: #c00; border-left: 4px solid #c00; }
.row:last-child b { text-decoration: underline; }
.item:first-child + .item { border-left: 4px solid #0a0; }
#c3 p:last-child { color: #00c; font-weight: bold; }
.tab:not(.x):not(:last-child) { color: #050; border-left: 4px solid #050; }
iframe { width: 80px; height: 20px; border: 2px solid #000; }
input { width: 120px; }
</style>
</head>
<body>
<div id="c"><div><iframe name="f1"></iframe></div><div><input type="text" value="kept"></div>
<div class="row">Row <b>one</b>.</div><div class="row">Row <b>two</b>.</div><div class="row" id="r3">Row <b>three</b>, the last.</div></div>
<div id="c2"><div class="item" id="i1">Item one, first child.</div><div class="item">Item two (green: after the first child).</div><div><iframe name="f2"></iframe></div></div>
<div id="c3"><div><iframe name="f3"></iframe></div><p>First paragraph.</p><p>Last paragraph, <b>blue</b>.</p></div>
<div id="c4"><div><iframe name="f4"></iframe></div><div class="tab">Tab one (green: not the last).</div><div class="tab">Tab two, the last (plain).</div></div>
<script>
/* the reference: the same steps, run while the page parses */
(function () {
	function $(id) { return document.getElementById(id); }
	function row(t) { var d = document.createElement('div'); d.className = 'row'; d.innerHTML = 'Row <b>' + t + '</b>.'; return d; }
	var ops = [
		function () { $('c').appendChild(row('four')); },
		function () { $('c').appendChild(row('five')); },
		function () { var c = $('c'); c.removeChild(c.lastElementChild); },
		function () { var d = document.createElement('div'); d.className = 'item'; d.textContent = 'Item zero, inserted first.'; $('c2').insertBefore(d, $('i1')); },
		function () { var p = document.createElement('p'); p.innerHTML = 'Appended paragraph, now <b>last</b>.'; $('c3').appendChild(p); },
		function () { var t = document.createElement('div'); t.className = 'tab'; t.textContent = 'Tab three, appended: the old last turns green.'; $('c4').appendChild(t); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
