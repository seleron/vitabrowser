<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS style detach ref</title>
<style>
/* Patch 388: static reference for JS-style-detach: its final state
 * with no script and no dynamic sheets -- both boxes back to blue,
 * the watched paragraph black, tick at step 6. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.box { width: 120px; height: 60px; background: #00c; }
.on + p { color: #c00; }
</style>
</head>
<body>
<div id="b1" class="box">b1: blue at rest, red while #sA lives</div>
<div id="b2" class="box">b2: blue at rest, red while #sB lives</div>
<p id="trig">A paragraph whose class a sibling rule watches.</p>
<p id="watch">Red while the paragraph before it is .on (it ends without).</p>
<p id="tick">step 6</p>
<p>Last paragraph.</p>
</body>
</html>
