<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS style edit (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
.box { height: 10px; background: #36c; margin: 2px 0; }
</style>
<style id="s1">.b1 { width: 50px; }</style>
<style id="s2">.b2 { width: 50px; }</style>
<style id="s3">.b3 { width: 50px; }</style>
<style id="s4">.b4 { width: 50px; }</style>
</head>
<body>
<div id="sum">STYLEEDIT: 0/4 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<div class="box b1" id="b1"></div>
<div class="box b2" id="b2"></div>
<div class="box b3" id="b3"></div>
<div class="box b4" id="b4"></div>
<canvas id="busy" width="40" height="8"></canvas>
<div id="many"></div>
<script>
/* Patch 266: a stylesheet that changes after the page is laid out --
 * a <style> a script edits, CSSOM insertRule, CSS-in-JS -- restyles the
 * elements already there. The re-cascade was asked for with an
 * "unknown change" mark that the rebuild scheduler declined, so the new
 * rules reached nothing (the Guardian's whole emotion sheet was dead after
 * hydration edited it); and a sheet that finished while a rebuild was
 * under way skipped the refresh. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'STYLEEDIT: ' + k + '/' + N + ' passed';
		document.title = 'CSS style edit (' + k + '/' + N + ')';
	}
	function w(id) { return Math.round($(id).getBoundingClientRect().width); }
	/* one change at a time, each measured 1.5 s later (a second change
	 * in the same window would rebuild the page for its own sake and hide
	 * a re-cascade that never came) */
	var steps = [
		function () { var s1 = $('s1'); s1.textContent = s1.textContent + ' .b1 { width: 77px; }'; },
		function () { t(1, w('b1') === 77, '<style> textContent edited after load (' + w('b1') + ')');
			$('s2').appendChild(document.createTextNode(' .b2 { width: 77px; }')); },
		function () { t(2, w('b2') === 77, 'a text node appended to a <style> (' + w('b2') + ')');
			$('s3').sheet.insertRule('.b3 { width: 77px; }', 1); },
		function () { t(3, w('b3') === 77, 'CSSOM insertRule (' + w('b3') + ')');
			/* the edit in the task that rebuilds the page */
			$('s4').textContent = '.b4 { width: 77px; }';
			var frag = document.createDocumentFragment();
			for (var i = 0; i < 1500; i++) {
				var d = document.createElement('div');
				d.textContent = 'row ' + i;
				frag.appendChild(d);
			}
			$('many').appendChild(frag); },
		function () { t(4, w('b4') === 77, 'edited as the page rebuilds (' + w('b4') + ')'); }
	];
	window.addEventListener('load', function () {
		var i = 0, x = 0, cv = $('busy'), g = cv.getContext && cv.getContext('2d');
		/* the page repaints (a canvas, no DOM change) until the last
		 * check, so a test harness waiting for it to go quiet waits */
		var busy = setInterval(function () {
			if (!g) return;
			g.fillStyle = (x++ % 2) ? '#36c' : '#c63';
			g.fillRect(0, 0, 40, 8);
		}, 100);
		(function next() {
			steps[i++]();
			if (i < steps.length) setTimeout(next, 1500);
			else clearInterval(busy);
		})();
	});
})();
</script>
</body>
</html>
