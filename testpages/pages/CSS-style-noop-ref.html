<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS style noop ref</title>
<style>
/* Patch 427. A style attribute change on an inline-block (claude's
 * sign-in re-set an inline-block <span>'s empty style every frame) took
 * the full rebuild each time, and the page never settled. One that leaves
 * the element's style as its box holds it changes nothing: style="" set
 * and removed, on two spans. A real change -- color -- still takes the
 * full rebuild. Row for row as CSS-style-noop-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 6px 10px; }
span.ib { display: inline-block; padding: 2px 6px; background: #eef; }
</style>
</head>
<body>
<p>Text with <span class="ib" id="a">an inline-block</span> and <span class="ib" id="b">another</span> in it.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('a').setAttribute('style', ''); },
		function () { $('a').removeAttribute('style'); },
		function () { $('b').setAttribute('style', ''); },
		function () { $('b').style.color = 'rgb(200, 0, 0)'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
