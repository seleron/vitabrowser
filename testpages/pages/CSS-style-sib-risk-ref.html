<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS style sib risk ref</title>
<style>
/* Patch 409, the risk kept. The same give-up sheet (.q:hover + .q) with
 * a real [style...] + p rule: hiding the div restyles the <p> after it, out
 * of the div's rebuild -- the change still takes the full rebuild, and the
 * <p> turns red, row for row as CSS-style-sib-risk-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.q:hover + .q { color: #00c; }
.md\:x + .y { color: #333; }
[style*="display: none"] + p { color: #c00; }
</style>
</head>
<body>
<div class="q">Hover pair one.</div><div class="q">Hover pair two.</div>
<div id="hd">A block that gets hidden.</div>
<p>The paragraph after it (red once the block is hidden).</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('hd').style.display = 'none'; },
		function () { var d = document.createElement('div'); d.textContent = 'A block inserted (412: the conservative sheet still declines it).'; document.body.insertBefore(d, $('hd')); }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
