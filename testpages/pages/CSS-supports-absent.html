<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS supports absent (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.x { width: 10px; height: 10px; color: rgb(1, 1, 1); }
@supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
	#fb { color: rgb(0, 128, 0); }
}
@supports (backdrop-filter: blur(2px)) { #pos { color: rgb(255, 0, 0); } }
@supports not (clip-path: circle(50%)) { #cp { color: rgb(0, 128, 0); } }
@supports (display: grid) { #grid { color: rgb(0, 128, 0); } }
@supports not (display: grid) { #nogrid { color: rgb(255, 0, 0); } }
</style>
<script>
/* Patch 216: @supports knows the properties this engine lacks
 * (backdrop-filter, clip-path, filter, container queries, ...), so the
 * fallbacks pages put in `@supports not (...)` apply and blocks that need
 * them do not. Vita-specific answers: Chromium implements these
 * properties and answers checks 1-2 the other way; 3 matches. */
(function () {
	var k = 0, N = 3, G = 'rgb(0, 128, 0)', B = 'rgb(1, 1, 1)';
	function $(id) { return document.getElementById(id); }
	function c(id) { return getComputedStyle($(id)).color; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SUPABS216: ' + k + '/' + N + ' passed';
		document.title = 'CSS supports absent (' + k + '/' + N + ')';
	}
	function run() {
		t(1, c('fb') === G && c('cp') === G,
			'fallbacks for missing backdrop-filter / clip-path apply (' +
			c('fb') + ', ' + c('cp') + ')');
		t(2, c('pos') === B, 'a block needing backdrop-filter does not: ' + c('pos'));
		t(3, c('grid') === G && c('nogrid') === B,
			'supported features unchanged (' + c('grid') + ', ' + c('nogrid') + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">SUPABS216: 0/3 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<div class="x" id="fb"></div><div class="x" id="pos"></div><div class="x" id="cp"></div>
<div class="x" id="grid"></div><div class="x" id="nogrid"></div>
</body>
</html>
