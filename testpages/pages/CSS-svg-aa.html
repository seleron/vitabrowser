<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Antialiased SVG path fills (snapshot)</title>
<style>
/* Patch 359. SVG path fills sampled pixel centres only: edges were
 * stair-stepped and a fill thinner than a pixel came out as crumbs (the
 * 1.5px ring of wordpress.org/news' search icon). Each row is the same
 * 80x40 SVG (svg-aa.svg) in black on white: a triangle under the diagonal
 * y = x, and a 1px bar from x = 60.5 to 61.5. Row A paints it as a CSS
 * background image, row B inline. Snapshot pixels (Chromium agrees):
 *   (5,75) inside the triangle -> black; (35,45) above it -> white
 *   (10,50) on the diagonal, half covered -> 127 grey
 *   (60,60) and (61,60) each half of the bar -> 127 grey both
 *   row B the same 48px lower: (10,98), (60,108), (61,108) */
body { margin: 0; padding-top: 40px; background: #fff; }
#a { width: 80px; height: 40px; background: url("svg-aa.svg") no-repeat;
	background-size: 80px 40px; }
svg { display: block; width: 80px; height: 40px; margin-top: 8px; }
</style>
</head>
<body>
<div id="a"></div>
<svg viewBox="0 0 80 40"><path d="M0 0L40 40H0Z"/><path d="M60.5 0h1v40h-1z"/></svg>
</body>
</html>
