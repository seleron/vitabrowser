<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG arc flags without separators (snapshot)</title>
<style>
/* Patch 354 (m.youtube.com icons). An arc's large-arc and sweep flags are
 * single characters and need no separator: `a8 8 0 1016 0` is flags 1, 0
 * then x 16. libsvgtiny read "1016" as one number, the group misaligned
 * and the whole path was dropped, so every YouTube icon was blank. The
 * circle below is drawn that way. Snapshot pixels (Chromium agrees):
 * (24,64) the centre and (24,51) near the top edge are red, (4,44) the
 * corner is white. */
body { margin: 0; padding-top: 40px; background: #fff; }
svg { display: block; width: 48px; height: 48px; }
</style>
</head>
<body>
<svg viewBox="0 0 24 24"><path fill="#f00" d="M4 12a8 8 0 1016 0 8 8 0 10-16 0Z"/></svg>
</body>
</html>
