<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Page CSS reaches inline SVG children (snapshot)</title>
<style>
/* Patch 357. Page CSS never reached the children of an inline <svg>
 * (they have no boxes), so class rules on <path>/<g> were ignored:
 * MDN's logo letters take their colour from `.logo__letter`. The text
 * colour is blue. Snapshot pixels (Chromium agrees), one 24px square
 * per row:
 *   (20,60)  .a { fill: #f80 } on the path            -> orange
 *   (20,92)  .c { fill: currentColor }, wrapper green  -> green
 *   (20,124) .h { display: none }                      -> white
 *   (20,156) .a beats the path's fill="#0a0"            -> orange
 *   (20,188) .g { fill: #f0f } on a <g>, path inherits -> magenta
 *   (20,220) fill="#0a0", no rule                      -> green (attribute)
 *   (20,252) style="fill:#f0f" on the path             -> magenta */
body { margin: 0; padding-top: 40px; color: #00f; background: #fff; }
.w { width: 24px; height: 24px; margin: 8px; }
svg { display: block; width: 24px; height: 24px; }
.a { fill: #f80; }
.c { fill: currentColor; }
.h { display: none; }
.g { fill: #f0f; }
</style>
</head>
<body>
<div class="w"><svg viewBox="0 0 24 24"><path class="a" d="M2 2h20v20H2z"/></svg></div>
<div class="w" style="color:#0a0"><svg viewBox="0 0 24 24"><path class="c" d="M2 2h20v20H2z"/></svg></div>
<div class="w"><svg viewBox="0 0 24 24"><path class="h" d="M2 2h20v20H2z"/></svg></div>
<div class="w"><svg viewBox="0 0 24 24"><path class="a" fill="#0a0" d="M2 2h20v20H2z"/></svg></div>
<div class="w"><svg viewBox="0 0 24 24"><g class="g"><path d="M2 2h20v20H2z"/></g></svg></div>
<div class="w"><svg viewBox="0 0 24 24"><path fill="#0a0" d="M2 2h20v20H2z"/></svg></div>
<div class="w"><svg viewBox="0 0 24 24"><path style="fill:#f0f" d="M2 2h20v20H2z"/></svg></div>
</body>
</html>
