<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Inline SVG takes the CSS fill it inherits (snapshot)</title>
<style>
/* Patch 356. An inline <svg> with no fill attribute was filled with the
 * CSS `color`, so a wrapper's `fill: red` drew the icon in the text
 * colour. It now takes its computed CSS fill (an unset fill -- opaque
 * black, the initial -- keeps the text colour; see the patch). The text
 * colour is blue. Snapshot pixels (Chromium agrees), one 24px square per
 * row:
 *   (20,60)  wrapper fill: red              -> red
 *   (20,92)  wrapper fill: currentColor     -> blue
 *   (20,124) wrapper fill: rgb(255,128,0)   -> orange
 *   (20,156) fill: red, svg fill="#0a0"     -> green (the attribute wins)
 *   (20,188) fill: none                     -> white (nothing drawn)
 *   (20,220) fill: red, path currentColor   -> blue */
body { margin: 0; padding-top: 40px; color: #00f; background: #fff; }
.w { width: 24px; height: 24px; margin: 8px; }
svg { display: block; width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="w" style="fill:red"><svg viewBox="0 0 24 24"><path d="M2 2h20v20H2z"/></svg></div>
<div class="w" style="fill:currentColor"><svg viewBox="0 0 24 24"><path d="M2 2h20v20H2z"/></svg></div>
<div class="w" style="fill:rgb(255,128,0)"><svg viewBox="0 0 24 24"><path d="M2 2h20v20H2z"/></svg></div>
<div class="w" style="fill:red"><svg viewBox="0 0 24 24" fill="#0a0"><path d="M2 2h20v20H2z"/></svg></div>
<div class="w" style="fill:none"><svg viewBox="0 0 24 24"><path d="M2 2h20v20H2z"/></svg></div>
<div class="w" style="fill:red"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 2h20v20H2z"/></svg></div>
</body>
</html>
