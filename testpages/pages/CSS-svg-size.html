<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS svg size (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.w32 { width: 32px; }
.h40 { height: 40px; }
</style>
<script>
/* Patch 217: an inline <svg> with an auto width or height is sized like
 * browsers size it: the other dimension through the viewBox ratio, the
 * container's width when neither is given, 300 x 150 without a viewBox.
 * The auto dimension was 0, so icons sized by one dimension vanished.
 * Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function sz(id) { var r = $(id).getBoundingClientRect(); return [Math.round(r.width), Math.round(r.height)]; }
	function is(id, w, h) { var s = sz(id); return s[0] === w && s[1] === h; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SVGSIZE217: ' + k + '/' + N + ' passed';
		document.title = 'CSS svg size (' + k + '/' + N + ')';
	}
	function run() {
		t(1, is('c', 200, 100) && is('d', 32, 16), 'width given: height from viewBox (' +
			sz('c') + ' / ' + sz('d') + ')');
		t(2, is('e', 80, 40), 'height given: width from viewBox (' + sz('e') + ')');
		t(3, is('f', 400, 400) && is('j', 300, 169),
			'neither given: container width (' + sz('f') + ' / ' + sz('j') + ')');
		t(4, is('g', 300, 150) && is('h', 50, 150), 'no viewBox: 300 x 150 (' +
			sz('g') + ' / ' + sz('h') + ')');
		t(5, is('a', 24, 24), 'both attributes unchanged (' + sz('a') + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">SVGSIZE217: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<div><svg id="a" width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24"/></svg></div>
<div><svg id="c" viewBox="0 0 100 50" width="200"><rect width="100" height="50"/></svg></div>
<div><svg id="d" viewBox="0 0 100 50" class="w32"><rect width="100" height="50"/></svg></div>
<div><svg id="e" viewBox="0 0 100 50" class="h40"><rect width="100" height="50"/></svg></div>
<div style="width:400px"><svg id="f" viewBox="0 0 10 10"><rect width="10" height="10"/></svg></div>
<div><svg id="g"><rect width="10" height="10"/></svg></div>
<div><svg id="h" width="50"><rect width="10" height="10"/></svg></div>
<div style="width:300px"><svg id="j" viewBox="0 0 16 9" style="width:100%"><rect width="16" height="9"/></svg></div>
</body>
</html>
