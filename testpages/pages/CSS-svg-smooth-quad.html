<!-- Patch 344: libsvgtiny adds the current point to a relative `t`'s
     reflected control point, which is already absolute, so the curve
     overshoots (Material icons drew as scribbles). The 96x48 box draws
     M0 24 q24 -24 48 0 t48 0 V48 H0 Z: a hump over x 0-48, a dip over
     48-96, filled below. Snapshot pixels (box at y 30): inside the dip
     (72,72) red and above it (72,46) the #eee background; inside the
     hump (24,50) red. With the bug the dip's fill misses (72,72).
     Chromium-verified. -->
<svg width="96" height="48" viewBox="0 0 96 48"><path d="M0 24q24 -24 48 0t48 0V48H0Z" fill="#f00"/></svg>
