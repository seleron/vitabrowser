<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS stroke on inline SVG (snapshot)</title>
<style>
/* Patch 358. libcss had no `stroke` / `stroke-width`, so CSS strokes on
 * inline SVG -- outline icon kits (stroke: currentColor on the <svg>),
 * class rules on paths -- were dropped. Each row is a 48px SVG (viewBox
 * 24, so 2x) holding an unfilled square whose edge is at x=8. Snapshot
 * pixels (Chromium agrees):
 *   (8,72)  .s { stroke: #f00; stroke-width: 4 } -> red; (24,72) white
 *   (8,128) svg.k { stroke: currentColor }, green wrapper -> green
 *   (12,184) .w { stroke-width: 6px } beats stroke-width="1" -> blue
 *   (8,240) .n { stroke: none } beats stroke="#00f" -> white */
body { margin: 0; padding-top: 40px; background: #fff; }
.w48 { width: 48px; height: 48px; margin: 8px 0; }
svg { display: block; width: 48px; height: 48px; }
.s { stroke: #f00; stroke-width: 4; }
svg.k { stroke: currentColor; }
.w { stroke-width: 6px; }
.n { stroke: none; }
</style>
</head>
<body>
<div class="w48"><svg viewBox="0 0 24 24"><path class="s" fill="none" d="M4 4h16v16H4z"/></svg></div>
<div class="w48" style="color:#0a0"><svg class="k" viewBox="0 0 24 24"><path fill="none" stroke-width="4" d="M4 4h16v16H4z"/></svg></div>
<div class="w48"><svg viewBox="0 0 24 24"><path class="w" fill="none" stroke="#00f" stroke-width="1" d="M4 4h16v16H4z"/></svg></div>
<div class="w48"><svg viewBox="0 0 24 24"><path class="n" fill="none" stroke="#00f" stroke-width="4" d="M4 4h16v16H4z"/></svg></div>
</body>
</html>
