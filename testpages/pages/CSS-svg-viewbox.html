<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Inline SVG viewBox</title>
<style>
body { margin: 0; padding-top: 30px; }
svg { display: block; background: #eee; margin-bottom: 4px; }
</style>
</head>
<body>
<!-- Patch 343: the inline-SVG serializer copied the page DOM's HTML
     spellings (upper-case element names, lower-case "viewbox"), and
     libsvgtiny matches viewBox case-sensitively, so no inline SVG's
     viewBox applied: a 24-unit icon on a 48px box drew 24px in its corner
     and Material icons (viewBox="0 -960 960 960") drew off-canvas
     (Google's search bar, the trending arrows). Checked in the snapshot
     (fixed layout, 48x48 boxes at y = 30 / 82 / 134): 1 the scaled rect's
     corner (36,66) red and (12,42) the #eee background; 2 a negative
     min-y (24,106) red; 3 Material's 960-unit box, bottom half red:
     (24,170) red, (24,140) background. Chromium-verified. -->
<svg width="48" height="48" viewBox="0 0 24 24"><rect x="12" y="12" width="12" height="12" fill="#f00"/></svg>
<svg width="48" height="48" viewBox="0 -48 48 48"><rect x="0" y="-48" width="48" height="48" fill="#f00"/></svg>
<svg width="48" height="48" viewBox="0 -960 960 960"><path d="M0 -480H960V0H0Z" fill="#f00"/></svg>
</body>
</html>
