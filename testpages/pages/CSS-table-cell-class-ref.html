<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS table cell class</title>
<style>
/* Patch 369: JS-table-cell-class.html's nine steps run while the page
 * parses -- the full build its after-load steps must match row for row. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
table { border-collapse: collapse; margin: 4px 10px; }
td, th { border: 1px solid #000; padding: 2px 4px; }
#t2 { border-collapse: separate; border-spacing: 4px; }
.wide { width: 150px; }
.thick { border: 4px solid #f00; }
.big { font-size: 20px; }
.pad { padding: 10px; background: #eef; }
.hl { background: #ff0; }
td.hl + td { background: #0ff; }
.mark::before { content: "* "; color: #f00; }
</style>
</head>
<body>
<table id="t1">
<tr><th id="h1">Head</th><th>Two</th><th>Three</th></tr>
<tr><td id="c11">a</td><td id="c12">b</td><td>c</td></tr>
<tr><td id="c21">d</td><td id="c22">e</td><td>f</td></tr>
<tr><td id="cs" colspan="2">span</td><td>g</td></tr>
<tr><td>nested <table id="tn"><tr><td id="n1">n1</td><td>n2</td></tr></table></td><td>h</td><td>i</td></tr>
</table>
<table id="t2"><tr><td id="s1">sep 1</td><td>sep 2</td></tr></table>
<p>After the tables.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('c11').className = 'wide'; },
		function () { $('c12').className = 'thick'; },
		function () { $('h1').className = 'big'; },
		function () { $('cs').className = 'pad'; },
		function () { $('c11').className = ''; },
		function () { $('n1').className = 'hl'; },
		function () { $('c21').className = 'hl'; },
		function () { $('c22').className = 'mark'; },
		function () { $('s1').className = 'pad'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
