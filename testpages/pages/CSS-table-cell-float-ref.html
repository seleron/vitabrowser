<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS table cell float</title>
<style>
/* Patch 367: JS-table-cell-float.html's eight steps run while the page
 * parses -- the full build its after-load steps must match row for row. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
table { border-collapse: collapse; margin: 4px 10px; }
td { border: 1px solid #000; padding: 2px 4px; vertical-align: top; }
.fr { float: right; display: block; width: 20px; height: 20px; background: #0a0; margin-left: 4px; }
.fl { float: left; width: 16px; height: 30px; background: #00f; margin-right: 4px; }
.big { font-size: 20px; }
</style>
</head>
<body>
<table>
<tr><td id="c1"><span class="fr"></span>text</td><td>plain</td></tr>
<tr><td id="c2">no float yet</td><td id="c3" style="width:160px"><div class="fl"></div>beside a floated div</td></tr>
<tr><td id="c4"><span class="fr"></span><div class="fl"></div>two floats</td><td id="c5"><img class="fr" src="opimg-20.png">image float</td></tr>
<tr><td id="c6"><span class="fr"></span>a <span id="s6">span</span> here</td><td>end</td></tr>
</table>
<p>A paragraph after the table.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('c1').lastChild.data = 'longer text beside the float'; },
		function () { $('c2').innerHTML = '<span class="fr"></span>now with a float'; },
		function () { $('c3').lastChild.data = 'text that is long enough to wrap beside a floated div in a fixed-width cell'; },
		function () { $('c1').innerHTML = '<div class="fl"></div>a floated div arrives'; },
		function () { $('c4').lastChild.data = 'two floats, one left, one right, and text between'; },
		function () { $('c5').lastChild.data = 'image float, text changed'; },
		function () { $('s6').className = 'big'; },
		function () { $('c2').lastChild.data = 'float stays, text shrinks'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
