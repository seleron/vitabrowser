<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS table cell text</title>
<style>
/* Patch 366: JS-table-cell-text.html's ten steps run while the page
 * parses, before its boxes are built -- the full build its after-load
 * steps must match row for row. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
table { border-collapse: collapse; margin: 4px 10px; }
td, th { border: 1px solid #000; padding: 2px 4px; }
th { background: #ddd; }
p { margin: 2px 0; }
.big { font-size: 20px; }
</style>
</head>
<body>
<table id="t1">
<tr><th id="h1">Name</th><th>Qty</th><th>Notes</th></tr>
<tr><td id="a1">Apple</td><td id="q1">3</td><td id="n1">short</td></tr>
<tr><td>Banana</td><td>12</td><td id="n2">a longer note here</td></tr>
<tr><td id="sp" colspan="2">spanning</td><td>x</td></tr>
</table>
<table id="t2">
<tr><td id="bl"><p id="bp1">one</p><p>two</p></td><td>side <span id="s1">span text</span></td></tr>
</table>
<table id="t3">
<tr><td id="fc"><span style="float:right;display:block;width:20px;height:20px;background:#0a0"></span>text</td><td>other cell</td></tr>
</table>
<p id="after">A paragraph after the tables.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('q1').textContent = '3000'; },
		function () { $('n2').textContent = 'tiny'; },
		function () { $('h1').textContent = 'Fruit name'; },
		function () { $('sp').textContent = 'spanning cell, now much longer than both columns'; },
		function () { $('n1').innerHTML = 'with <b>bold</b> and <i>italic</i>'; },
		function () { $('a1').firstChild.data = 'Apricot'; },
		function () { var p = document.createElement('p'); p.textContent = 'three, appended'; $('bl').appendChild(p); },
		function () { $('bl').removeChild($('bp1')); },
		function () { $('s1').className = 'big'; },
		function () { $('fc').lastChild.data = 'changed text beside a float'; }
	], k = 0;
	for (k = 0; k < ops.length; k++) ops[k]();
})();
</script>
</body>
</html>
