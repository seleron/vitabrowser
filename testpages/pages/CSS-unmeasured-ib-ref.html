<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS unmeasured ib ref</title>
<style>
/* Patch 473. 441's guard (an inline-block that reaches line layout with
 * no min/max widths is measured there; it asserted in pass 2 before) has
 * a live trigger (wpblog) that has not recurred, so no page ran it and it
 * was never run under ASan. In the simulator a fresh inline-block that
 * carries data-vb-unmeasured is left unmeasured by layout_minmax_line
 * (patch 473's test hook, never built for the device): the guard measures
 * it in line layout. Here one such inline-block is in the page at load
 * and a second is appended later (a local rebuild of its line). Row for
 * row as CSS-unmeasured-ib-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.ib { display: inline-block; border: 1px solid #888; padding: 2px 6px; background: #eef; }
</style>
</head>
<body>
<p id="p1">A line with <span class="ib" data-vb-unmeasured="1">an unmeasured inline-block</span> in it.</p>
<p id="p2">A second line, which gains one:</p>
<script>
(function () {
	function op() {
		var s = document.createElement('span');
		s.className = 'ib';
		s.setAttribute('data-vb-unmeasured', '1');
		s.textContent = 'appended, unmeasured';
		document.getElementById('p2').appendChild(s);
	}
	op();
})();
</script>
</body>
</html>
