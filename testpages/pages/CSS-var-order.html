<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS var() declarations in cascade order (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
:root { --v: 30px; --c: rgb(0, 0, 255); }
.u { width: 40px; height: 4px; background: #69c; margin: 2px 0; }
#later { padding: 0 0 var(--v) 0; }
#later { padding-bottom: 0; }
#media { padding: 0 0 var(--v) 0; }
@media (min-width: 100px) { #media { padding-bottom: 0; } }
#calc { margin-bottom: calc(var(--v) / 4); }
#calc { margin: 0; }
#same { padding: 0 0 var(--v) 0; padding-bottom: 0; }
#same2 { padding-bottom: 0; padding: 0 0 var(--v) 0; }
#wrap #spec { padding-bottom: var(--v); }
#spec { padding-bottom: 0; }
#imp { padding-bottom: var(--v) !important; }
#imp { padding-bottom: 0; }
#col { background: var(--c); }
#col { background: rgb(0, 128, 0); }
#lastvar { padding-bottom: 0; }
#lastvar { padding-bottom: var(--v); }
</style>
<script>
/* Patch 329 (wordpress.org/news): a declaration whose value uses var() is
 * queued and replayed after the whole cascade (fixes1268d), and the replay
 * won every specificity tie, so it beat declarations that came after it.
 * WordPress's header sets `padding: 0 0 var(--wp--custom--margin--
 * vertical) 0` and zeroes padding-bottom in a later @media rule; the
 * navigation list kept 30px of bottom padding and grew past the header.
 * Chromium-verified. */
(function () {
	var k = 0, N = 9;
	function $(id) { return document.getElementById(id); }
	function cs(id, p) { return getComputedStyle($(id))[p]; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'VARORDER329: ' + k + '/' + N + ' passed';
		document.title = 'CSS var() cascade order (' + k + '/' + N + ')';
	}
	function run() {
		t(1, cs('later', 'paddingBottom') === '0px',
			'a later rule beats a var() shorthand (' + cs('later', 'paddingBottom') + ')');
		t(2, cs('media', 'paddingBottom') === '0px',
			'a later @media rule beats it (' + cs('media', 'paddingBottom') + ')');
		t(3, cs('calc', 'marginBottom') === '0px',
			'a later shorthand beats calc(var()) (' + cs('calc', 'marginBottom') + ')');
		t(4, cs('same', 'paddingBottom') === '0px',
			'later in the same rule (' + cs('same', 'paddingBottom') + ')');
		t(5, cs('same2', 'paddingBottom') === '30px',
			'the var() one later in the same rule (' + cs('same2', 'paddingBottom') + ')');
		t(6, cs('spec', 'paddingBottom') === '30px',
			'a more specific var() rule still wins (' + cs('spec', 'paddingBottom') + ')');
		t(7, cs('imp', 'paddingBottom') === '30px',
			'!important var() wins (' + cs('imp', 'paddingBottom') + ')');
		t(8, cs('col', 'backgroundColor') === 'rgb(0, 128, 0)',
			'background: var() then a later colour (' + cs('col', 'backgroundColor') + ')');
		t(9, cs('lastvar', 'paddingBottom') === '30px',
			'the var() rule last wins (' + cs('lastvar', 'paddingBottom') + ')');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">VARORDER329: 0/9 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<p id="r8" class="wait">8 pending</p>
<p id="r9" class="wait">9 pending</p>
<div class="u" id="later"></div><div class="u" id="media"></div>
<div class="u" id="calc"></div><div class="u" id="same"></div>
<div class="u" id="same2"></div>
<div id="wrap"><div class="u" id="spec"></div></div>
<div class="u" id="imp"></div><div class="u" id="col"></div>
<div class="u" id="lastvar"></div>
</body>
</html>
