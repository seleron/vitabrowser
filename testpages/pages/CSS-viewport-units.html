<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS viewport units (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.u { width: 10px; background: #69c; margin: 2px 0; }
#vh { height: 10vh; } #svh { height: 10svh; } #lvh { height: 10lvh; } #dvh { height: 10dvh; }
#vw { height: 4px; width: 10vw; } #dvw { height: 4px; width: 10dvw; }
#vmin { height: 4px; width: 10vmin; } #svmin { height: 4px; width: 10svmin; }
#cvh { height: calc(20vh - 10px); } #cdvh { height: calc(20dvh - 10px); }
</style>
<script>
/* Patch 207: the small/large/dynamic viewport units (svh, lvh, dvh, the
 * vw/vmin/... forms) equal the plain v* units on the Vita, which has no
 * UI that slides over the viewport. They were unknown, so the whole
 * declaration (height: 100dvh) was dropped. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function h(id) { return $(id).getBoundingClientRect().height; }
	function w(id) { return $(id).getBoundingClientRect().width; }
	function near(a, b) { return Math.abs(a - b) <= 1; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'VUNITS207: ' + k + '/' + N + ' passed';
		document.title = 'CSS viewport units (' + k + '/' + N + ')';
	}
	function run() {
		var v = h('vh');
		t(1, v > 20 && near(h('svh'), v) && near(h('lvh'), v) &&
			near(h('dvh'), v), 'svh/lvh/dvh = vh (' + h('svh') + ', ' +
			h('lvh') + ', ' + h('dvh') + ' vs ' + v + ')');
		t(2, w('vw') > 50 && near(w('dvw'), w('vw')),
			'dvw = vw (' + w('dvw') + ' vs ' + w('vw') + ')');
		t(3, w('vmin') > 20 && near(w('svmin'), w('vmin')),
			'svmin = vmin (' + w('svmin') + ' vs ' + w('vmin') + ')');
		t(4, h('cvh') > 50 && near(h('cdvh'), h('cvh')),
			'calc() with dvh (' + h('cdvh') + ' vs ' + h('cvh') + ')');
	}
	/* at load, not 300 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">VUNITS207: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div class="u" id="vh"></div><div class="u" id="svh"></div><div class="u" id="lvh"></div><div class="u" id="dvh"></div>
<div class="u" id="vw"></div><div class="u" id="dvw"></div>
<div class="u" id="vmin"></div><div class="u" id="svmin"></div>
<div class="u" id="cvh"></div><div class="u" id="cdvh"></div>
</body>
</html>
