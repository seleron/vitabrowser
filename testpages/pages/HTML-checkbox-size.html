<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML checkbox size (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#big { width: 20px; height: 20px; }
</style>
<script>
/* Patch 224: checkboxes and radio buttons are 13 x 13 with browsers'
 * margins (checkbox 3 3 3 4, radio 3 3 0 5); a CSS width / height still
 * wins. They were 1em square plus 0.1em side padding (18 x 16 at 16px),
 * so option lists and form rows sat wider and taller than in a browser.
 * Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function sz(id) { var r = $(id).getBoundingClientRect(); return Math.round(r.width) + 'x' + Math.round(r.height); }
	function mg(id) { var c = getComputedStyle($(id)); return [c.marginTop, c.marginRight, c.marginBottom, c.marginLeft].join(' '); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CHECKBOX224: ' + k + '/' + N + ' passed';
		document.title = 'HTML checkbox size (' + k + '/' + N + ')';
	}
	function run() {
		t(1, sz('cb') === '13x13' && sz('rb') === '13x13',
			'sizes: ' + sz('cb') + ', ' + sz('rb'));
		t(2, mg('cb') === '3px 3px 3px 4px' && mg('rb') === '3px 3px 0px 5px',
			'margins: ' + mg('cb') + ' / ' + mg('rb'));
		t(3, sz('big') === '20x20', 'CSS size wins: ' + sz('big'));
		var r = $('row').getBoundingClientRect();
		t(4, Math.round(r.height) <= 20, 'a row of options stays one text line high (' +
			Math.round(r.height) + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">CHECKBOX224: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div><input type="checkbox" id="cb"> <input type="radio" id="rb"> <input type="checkbox" id="big"></div>
<div id="row"><label><input type="checkbox"> one</label> <label><input type="radio" name="x"> two</label></div>
</body>
</html>
