<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML control margins (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.row { width: 400px; }
</style>
<script>
/* Patch 225: text inputs, buttons, selects and textareas have no margin,
 * as in browsers (Chromium's UA sheet: margin 0); they had 1px, so each
 * control sat 1px in from its container and rows of them drifted.
 * Chromium-verified. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function m(id) { var c = getComputedStyle($(id)); return [c.marginTop, c.marginRight, c.marginBottom, c.marginLeft].join(' '); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CTLMARGIN225: ' + k + '/' + N + ' passed';
		document.title = 'HTML control margins (' + k + '/' + N + ')';
	}
	function run() {
		var z = '0px 0px 0px 0px', ids = ['in', 'bt', 'sb', 'se', 'ta'], bad = [];
		for (var i = 0; i < ids.length; i++)
			if (m(ids[i]) !== z) bad.push(ids[i] + ':' + m(ids[i]));
		t(1, bad.length === 0, 'no margins (' + (bad.join('; ') || 'all 0') + ')');
		var L = $('w1').getBoundingClientRect().left;
		t(2, $('in').getBoundingClientRect().left === L &&
			$('ta').getBoundingClientRect().left === L,
			'controls start at the container edge (' +
			($('in').getBoundingClientRect().left - L) + ')');
		var h = $('w2').getBoundingClientRect().height, b = $('bt2').getBoundingClientRect().height;
		t(3, Math.abs(h - b) <= 1, 'a block of one button is the button high (' +
			Math.round(h) + ' / ' + Math.round(b) + ')');
	}
	/* at load, not 300 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">CTLMARGIN225: 0/3 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<div class="row" id="w1"><input id="in"><br><button id="bt">Go</button> <input type="submit" id="sb"> <select id="se"><option>One</option></select><br><textarea id="ta"></textarea></div>
<div id="w2" style="display: flow-root; line-height: 0"><button id="bt2" style="display: block">Block button</button></div>
</body>
</html>
