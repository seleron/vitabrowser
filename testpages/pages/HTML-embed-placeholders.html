<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML embed placeholders (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
<script>
/* Patch 219: an iframe that is not loaded (no src; a YouTube / Vimeo
 * embed) keeps its size, as in a browser (300 x 150 plus a 2px border,
 * or its width / height attributes); <video> is 300 x 150 or its
 * attributes; <audio> without controls takes no space. They collapsed,
 * moving the content after them up. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function sz(id) { var r = $(id).getBoundingClientRect(); return Math.round(r.width) + 'x' + Math.round(r.height); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'EMBED219: ' + k + '/' + N + ' passed';
		document.title = 'HTML embed placeholders (' + k + '/' + N + ')';
	}
	function run() {
		t(1, sz('f0') === '304x154', 'iframe without src: ' + sz('f0'));
		t(2, sz('yt') === '564x319', 'skipped YouTube embed keeps its size: ' + sz('yt'));
		t(3, sz('v0') === '300x150' && sz('v1') === '320x180',
			'video default / attributes: ' + sz('v0') + ', ' + sz('v1'));
		var a = $('after').getBoundingClientRect(), y = $('yt').getBoundingClientRect();
		t(4, $('au').getBoundingClientRect().height === 0 && a.top >= y.bottom,
			'silent audio takes no space; text follows the embed (' +
			Math.round(a.top) + ' >= ' + Math.round(y.bottom) + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">EMBED219: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div><iframe id="f0"></iframe></div>
<div><iframe id="yt" width="560" height="315" src="https://www.youtube.com/embed/xyz" title="video"></iframe></div>
<p id="after">After the embed.</p>
<div><video id="v0">fallback text</video> <video id="v1" width="320" height="180"><source src="a.mp4"></video></div>
<div><audio id="au" src="a.mp3">audio fallback</audio></div>
</body>
</html>
