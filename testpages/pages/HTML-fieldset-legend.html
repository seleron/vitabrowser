<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML fieldset legend (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#body1 { height: 30px; background: #eef; }
#top { height: 10px; background: #fdb; }
</style>
<script>
/* Patch 222: a fieldset is laid out as in a browser: its legend is a
 * shrink-to-fit block on the top border (which is drawn through the
 * legend's middle), the content starts 0.35em below the legend, and the
 * box has browsers' 2px groove border, 0.35em / 0.75em / 0.625em padding
 * and 2px side margins with no vertical margin. The legend was an inline
 * beside the first control. Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function near(a, b, tol) { return Math.abs(a - b) <= tol; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FIELDSET222: ' + k + '/' + N + ' passed';
		document.title = 'HTML fieldset legend (' + k + '/' + N + ')';
	}
	function run() {
		var f = r('fs'), l = r('lg'), b = r('body1'), tp = r('top'), w = r('wrap');
		t(1, near(l.top, f.top, 1), 'legend sits on the top border (' +
			Math.round(l.top - f.top) + ')');
		t(2, near(b.top - l.bottom, 5.6, 1.5), 'content 0.35em below the legend (' +
			Math.round(b.top - l.bottom) + ')');
		t(3, l.width < 150 && near(l.width, r('lgt').width + 4, 1.5),
			'legend shrinks to its text (' + Math.round(l.width) + ')');
		t(4, near(f.bottom - b.bottom, 12, 1.5) &&
			near(b.left - f.left, 14, 1.5),
			'padding and border (' + Math.round(f.bottom - b.bottom) + ', ' +
			Math.round(b.left - f.left) + ')');
		t(5, near(f.top, tp.bottom, 0.5) && near(f.left - w.left, 2, 0.5) &&
			near(w.right - f.right, 2, 0.5),
			'2px side margins, none above (' + Math.round(f.top - tp.bottom) +
			', ' + Math.round(f.left - w.left) + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">FIELDSET222: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<div id="wrap" style="width: 400px">
<div id="top"></div>
<fieldset id="fs">
	<legend id="lg"><span id="lgt">Shipping</span></legend>
	<div id="body1"></div>
</fieldset>
</div>
</body>
</html>
