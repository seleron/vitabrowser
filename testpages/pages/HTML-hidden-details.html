<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML hidden details (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
<script>
/* Patch 203: the HTML rendering rules hide [hidden], closed <dialog>,
 * <template> and closed <details> bodies; a summary click toggles its
 * details; dialog show()/close(). All were shown / missing.
 * Chromium-verified. */
(function () {
	var k = 0, N = 9, toggles = 0, closes = 0;
	function $(id) { return document.getElementById(id); }
	function h(id) { return $(id).getBoundingClientRect().height; }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'HIDDEN203: ' + k + '/' + N + ' passed';
		document.title = 'HTML hidden details (' + k + '/' + N + ')';
	}
	function step1() {
		t(1, h('hid') === 0 && h('shown') > 0,
			'[hidden] hidden (' + h('hid') + '), display override shown (' +
			h('shown') + ')');
		t(2, h('dlgp') === 0 && $('dlg').open === false,
			'closed dialog hidden, open=' + $('dlg').open);
		t(3, h('dsum') > 0 && Math.abs(h('det') - h('dsum')) <= 1 &&
			$('det').open === false,
			'closed details only as tall as its summary (' + h('det') +
			' vs ' + h('dsum') + ')');
		t(4, h('tpl') === 0, 'template not rendered (' + h('tpl') + ')');
		$('det').addEventListener('toggle', function () { toggles++; });
		$('dlg').addEventListener('close', function () { closes++; });
		$('det2').addEventListener('click', function (e) { e.preventDefault(); });
		$('dsum').click();
		$('dsum2').click();
		$('dlg').show();
		setTimeout(step2, 400);
	}
	function step2() {
		t(5, $('det').open === true && h('det') > h('dsum') + 10 &&
			toggles === 1,
			'summary click opens: open=' + $('det').open + ', body ' +
			h('detp') + ', toggle events ' + toggles);
		t(6, $('det2').open === false &&
			Math.abs(h('det2') - h('dsum2')) <= 1,
			'preventDefault keeps it closed: open=' + $('det2').open);
		t(7, $('dlg').open === true && h('dlgp') > 0,
			'dialog.show(): open=' + $('dlg').open + ', ' + h('dlgp'));
		$('dlg').close('done');
		$('det3').open = true;
		setTimeout(step3, 400);
	}
	function step3() {
		t(8, $('dlg').open === false && h('dlgp') === 0 &&
			$('dlg').returnValue === 'done',
			'dialog.close(v): open=' + $('dlg').open + ', returnValue ' +
			$('dlg').returnValue + ', close events ' + closes);
		t(9, $('det3').hasAttribute('open') && h('detp3') > 0,
			'details.open = true opens it (' + h('detp3') + ')');
	}
	window.addEventListener('load', function () { setTimeout(step1, 300); });
})();
</script>
</head>
<body>
<div id="sum">HIDDEN203: 0/9 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<p id="r8" class="wait">8 pending</p>
<p id="r9" class="wait">9 pending</p>
<p id="hid" hidden>hidden paragraph</p>
<div id="shown" hidden style="display:block">hidden, but the author says block</div>
<dialog id="dlg"><p id="dlgp">dialog text</p></dialog>
<details id="det"><summary id="dsum">More</summary><p id="detp">details body</p></details>
<details id="det2"><summary id="dsum2">Cancelled</summary><p id="detp2">stays shut</p></details>
<details id="det3"><summary>By property</summary><p id="detp3">opened by script</p></details>
<template id="tpl"><p>template content</p></template>
</body>
</html>
