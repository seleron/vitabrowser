<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML legend reset (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.pre { height: 10px; background: #fdb; }
.bs fieldset { min-width: 0; padding: 0; margin: 0; border: 0; }
.bs legend { float: left; width: 100%; padding: 0; margin-bottom: .5rem; font-size: 20px; line-height: inherit; }
#plain { border: 0; padding: 0; margin: 0; }
#custom { border: 4px solid #888; padding: 10px; margin: 0; }
#wrap { width: 300px; }
</style>
<script>
/* Patch 228: a fieldset's legend is lifted onto its top border from the
 * fieldset's own border and padding, and only the rendered legend (first
 * <legend> child, in flow). Patch 222 lifted every legend by the default
 * border + padding, so Bootstrap's reset fieldset and a legend outside a
 * fieldset overlapped the content above them by 8-9px. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'LEGEND228: ' + k + '/' + N + ' passed';
		document.title = 'HTML legend reset (' + k + '/' + N + ')';
	}
	function d(a, b) { return Math.round(r(a).top - r(b).bottom); }
	function run() {
		t(1, d('bl', 'p1') === 0, 'Bootstrap fieldset: floated legend stays below the content above (' +
			d('bl', 'p1') + ')');
		t(2, d('pl', 'p2') === 0 && Math.round(r('pd').top - r('pl').bottom) === 0,
			'no border, no padding: legend in place, content right after (' +
			d('pl', 'p2') + ', ' + Math.round(r('pd').top - r('pl').bottom) + ')');
		t(3, d('lo', 'p3') === 0 && Math.round(r('lo').width) === 300,
			'a legend outside a fieldset is a plain block (' + d('lo', 'p3') + ', ' +
			Math.round(r('lo').width) + ')');
		t(4, Math.round(r('cl').top - r('custom').top) === 0 &&
			Math.round(r('cd').top - r('cl').bottom) === 10,
			'4px border, 10px padding: on the border, content 10px below (' +
			Math.round(r('cl').top - r('custom').top) + ', ' +
			Math.round(r('cd').top - r('cl').bottom) + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">LEGEND228: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div id="wrap">
<div class="pre" id="p1"></div>
<div class="bs"><fieldset><legend id="bl">Bootstrap</legend><div>x</div></fieldset></div>
<div class="pre" id="p2"></div>
<fieldset id="plain"><legend id="pl">Plain</legend><div id="pd">x</div></fieldset>
<div class="pre" id="p3"></div>
<legend id="lo">Loose legend</legend>
<div class="pre"></div>
<fieldset id="custom"><legend id="cl">Custom</legend><div id="cd">x</div></fieldset>
</div>
</body>
</html>
