<!DOCTYPE html>
<html>
<head>
<meta charset="windows-1252">
<title>HTML multipart windows-1252</title>
<style>
body { font-family: sans-serif; margin: 0; }
#send { position: absolute; left: 10px; top: 30px; width: 300px; height: 40px; font-size: 18px; }
</style>
</head>
<body>
<!-- Patch 283: a form in a windows-1252 page submits in windows-1252:
 the euro sign is byte 0x80, a character the encoding lacks is sent as
 a character reference (&#128512;), _charset_ says "windows-1252". Tap
 Send (the gate server answers FORMCHECK). -->
<form action="form-check?case=w1252" method="post" enctype="multipart/form-data">
<button id="send" type="submit" name="go" value="1252">Send</button>
<input type="hidden" name="café" value="é € Ž œ">
<input type="hidden" name="beyond" value="&#x1F600; &#x416; &#x20AC;">
<input type="hidden" name="_charset_">
</form>
</body>
</html>
