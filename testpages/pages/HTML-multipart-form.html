<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML multipart form</title>
<style>
body { font-family: sans-serif; font-size: 14px; margin: 0; padding-top: 160px; }
.send { position: absolute; left: 10px; width: 300px; height: 40px; font-size: 18px; }
#send-mp { top: 30px; }
#send-ue { top: 100px; }
</style>
</head>
<body>
<!-- Patch 283: a form submitted without script -- the engine's own form
 path. Tap a Send button; the gate server's /form-check answers with
 "FORMCHECK <case> ok <digest>" when the body is well formed, the digest
 covering every entry byte for byte (not the boundary). Chromium, sending
 the same forms: "FORMCHECK multipart ok fcd2da030618" and "FORMCHECK
 urlencoded ok 7e9ed1917f53" (tools/run-vita-sim.sh, "scriptless form
 submissions"). Over file:// (the bundled copy) there is no server, so
 Send leads to an error page. -->
<form id="mpf" action="form-check?case=multipart" method="post"
      enctype="multipart/form-data">
<input type="submit" name="other" value="not me">
<button class="send" id="send-mp" type="submit" name="go" value="multipart">Send multipart</button>
<div id="rest">
<input type="hidden" name="plain" value="hello world">
<input type="hidden" name="crlf" value="a&#13;&#10;b&#13;c">
<input type="text" name="q&quot;uote" value="a&quot;b &amp; c">
<input type="hidden" name="new&#10;line" value="name with a line break">
<input type="hidden" name="uni" value="café 😀 Ж">
<textarea name="ta">line1
line2
line3</textarea>
<input type="hidden" name="empty" value="">
<input type="checkbox" name="cb" value="yes" checked>
<input type="checkbox" name="cb2" value="no">
<input type="radio" name="r" value="r1"><input type="radio" name="r" value="r2" checked>
<select name="m" multiple size="4">
<option selected>o1</option>
<option selected disabled>o2</option>
<optgroup label="g" disabled><option selected>o3</option></optgroup>
<option selected value="o4v">o4</option>
</select>
<fieldset disabled><legend><input name="inlegend" value="kept"></legend>
<input name="infieldset" value="dropped"></fieldset>
<div dir="rtl"><input type="text" name="t" dirname="t.dir" value="dir"></div>
<input type="search" name="s" dirname="s.dir" value="abc">
<input type="hidden" name="_charset_" value="replaced">
<input type="text" value="nameless">
<input type="text" name="" value="empty name">
<input type="file" name="nofile">
<input type="text" name="dis" value="x" disabled>
<input type="hidden" name="elsewhere" value="names another form" form="nosuchform">
<input type="image" name="pic" alt="not the submitter">
<input type="reset" name="rs" value="r"><input type="button" name="bt" value="b">
</div>
</form>
<input type="hidden" name="outside" value="assoc" form="mpf">

<form id="uef" action="form-check?case=urlencoded" method="post">
<button class="send" id="send-ue" type="submit" name="go" value="urlencoded">Send urlencoded</button>
<input type="hidden" name="plain" value="hello world &amp; more">
<input type="hidden" name="new&#10;line" value="v">
<input type="hidden" name="uni" value="café 😀 Ж">
<textarea name="ta">line1
line2</textarea>
<input type="hidden" name="_charset_" value="replaced">
<fieldset disabled><input name="infieldset" value="dropped"></fieldset>
</form>
</body>
</html>
