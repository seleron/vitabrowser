<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML multipart upload</title>
<style>
body { font-family: sans-serif; margin: 0; }
#upload, #send { position: absolute; left: 10px; width: 300px; height: 40px; font-size: 18px; }
#upload { top: 30px; }
#send { top: 100px; }
#second { position: absolute; top: 170px; left: 10px; }
</style>
</head>
<body>
<!-- Patch 283: a file part. Tap the file input, then Send. The Vita has
 no file chooser, so on the device the file stays empty (an empty file
 part: filename "", application/octet-stream); the simulator takes the
 file VITA_SIM_UPLOAD names. The part carries the file's name (a quote
 escaped %22), its type by extension (application/octet-stream when
 unknown) and its bytes. -->
<form action="form-check?case=upload" method="post" enctype="multipart/form-data">
<input type="hidden" name="before" value="b">
<input type="file" id="upload" name="upload">
<input type="file" id="second" name="second">
<button id="send" type="submit" name="go" value="upload">Send</button>
</form>
</body>
</html>
