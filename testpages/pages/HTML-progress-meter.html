<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML progress meter (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#wide { width: 300px; }
</style>
<script>
/* Patch 218: <progress> and <meter> are bars of a browser's size (160 x 16
 * and 80 x 16 at 16px) with their fill painted from value / max; their
 * value, max and position properties reflect the attributes (and do not
 * leak onto other elements). They took no space and drew nothing.
 * Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function sz(id) { var r = $(id).getBoundingClientRect(); return Math.round(r.width) + 'x' + Math.round(r.height); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'PROGRESS218: ' + k + '/' + N + ' passed';
		document.title = 'HTML progress meter (' + k + '/' + N + ')';
	}
	function run() {
		t(1, sz('p') === '160x16' && sz('m') === '80x16',
			'default sizes: progress ' + sz('p') + ', meter ' + sz('m'));
		t(2, sz('wide') === '300x16' && sz('fb') === '160x16',
			'CSS width honoured; fallback text does not grow it (' + sz('wide') +
			', ' + sz('fb') + ')');
		var p = $('p');
		p.value = 75;
		t(3, p.getAttribute('value') === '75' && p.max === 100 &&
			Math.abs(p.position - 0.75) < 1e-9 && $('ind').position === -1,
			'progress value/max/position reflect (' + p.getAttribute('value') +
			', ' + p.max + ', ' + p.position + ', ' + $('ind').position + ')');
		var ind = $('ind');
		ind.value = 2;
		t(4, ind.getAttribute('value') === '2' && ind.position === 1 &&
			$('wide').position === 0.5,
			'setting value makes it determinate; position clamps (' +
			ind.position + ', ' + $('wide').position + ')');
		var dv = document.createElement('div'), sp = document.createElement('section');
		t(5, dv.max === undefined && dv.open === undefined &&
			sp.position === undefined && dv.returnValue === undefined,
			'other elements get none of these properties (' + [
			typeof dv.max, typeof dv.open, typeof sp.position,
			typeof dv.returnValue].join(',') + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">PROGRESS218: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<div><progress id="p" value="30" max="100"></progress></div>
<div><meter id="m" value="0.6"></meter></div>
<div><progress id="wide" value="1" max="2"></progress></div>
<div><progress id="fb" value="5" max="10">fallback text: five of ten, which is long</progress></div>
<div><progress id="ind"></progress></div>
</body>
</html>
