<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML range color (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
<script>
/* Patch 223: <input type=range> is a slider and <input type=color> a
 * colour well, of browsers' sizes (129 x 16 with 2px margins; 50 x 27),
 * not text fields; their value, type and form submission are unchanged.
 * Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function sz(id) { var r = $(id).getBoundingClientRect(); return Math.round(r.width) + 'x' + Math.round(r.height); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'RANGECOL223: ' + k + '/' + N + ' passed';
		document.title = 'HTML range color (' + k + '/' + N + ')';
	}
	function run() {
		t(1, sz('rg') === '129x16' && sz('rg2') === '200x16',
			'range sizes: ' + sz('rg') + ', ' + sz('rg2'));
		var cs = getComputedStyle($('rg'));
		t(2, cs.marginLeft === '2px' && cs.marginRight === '2px' &&
			Math.round($('rg').getBoundingClientRect().left -
				$('rg2').getBoundingClientRect().left) === 0,
			'range has 2px side margins (' + cs.marginLeft + ', ' +
			cs.marginRight + ')');
		t(3, sz('col') === '50x27', 'color well: ' + sz('col'));
		t(4, $('rg').value === '30' && $('rg').type === 'range' &&
			$('col').value === '#ff0000' && $('col').type === 'color' &&
			$('rg3').value === '50',
			'values and types (' + $('rg').value + ', ' + $('col').value +
			', ' + $('rg3').value + ')');
	}
	/* at load, not 300 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">RANGECOL223: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<form action="#">
<div><input id="rg" type="range" name="vol" value="30"></div>
<div><input id="rg2" type="range" style="width: 200px" min="0" max="10" value="7"></div>
<div><input id="rg3" type="range"></div>
<div><input id="col" type="color" name="c" value="#ff0000"></div>
</form>
</body>
</html>
