<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IMG svg</title>
<!-- SVG images (libsvgtiny, docs/phase-0/11): an <img> logo like Hacker
     News's, and a CSS background icon like Wikipedia's external-link mark.
     Refused before SVG was enabled: the img drew nothing. -->
<style>
body { font-family: sans-serif; font-size: 20px; margin: 20px; }
a.external { padding-right: 16px; background: url(svg-icon.svg) no-repeat right center; }
/* background-size on an SVG (patch 59: every length read as auto, so the
   12 px icon stayed 12 px): drawn 48 px, filling its box. */
.big { display: inline-block; width: 48px; height: 48px; background: url(svg-icon.svg) no-repeat; background-size: 48px; }
</style>
</head>
<body>
<p><img src="svg-logo.svg" width="240" height="80" alt="LOGO-NOT-DRAWN"></p>
<p><a class="external" href="#">external link</a></p>
<p><span class="big"></span> SIZED-48</p>
</body>
</html>
