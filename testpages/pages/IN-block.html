<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN block</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">IN block: script did not run</p>
<p id="r1" class="wait">1 fetch() to an ad host is refused: waiting</p>
<p id="r2" class="wait">2 XHR to a tracker is refused: waiting</p>
<img src="https://pagead2.googlesyndication.com/pagead/show_ads.js" alt="">
<script>
/* Content blocking (frontends/vita/resolve.c): the hosts below are on the
 * bundled blocklist, so the requests must fail at once, without a lookup
 * or a connection -- this works with no network at all. The times are
 * logged, not shown, so the dump is the same on every run. */
var passed = 0, total = 2, t0 = Date.now();
function row(n, what, ok, detail) {
  var p = document.getElementById('r' + n);
  p.textContent = n + ' ' + what + ': ' + (ok ? 'PASS' : 'FAIL');
  p.className = ok ? 'pass' : 'wait';
  if (ok) passed++;
  var s = document.getElementById('sum');
  s.textContent = 'IN block: ' + passed + '/' + total + ' passed';
  s.className = passed === total ? 'pass' : 'wait';
  console.log('IN-block row ' + n + (ok ? ' passed ' : ' failed ') + detail);
}
fetch('https://doubleclick.net/pixel.gif').then(function () {
  row(1, 'fetch() to an ad host is refused', false, 'it loaded');
}).catch(function () {
  var ms = Date.now() - t0;
  row(1, 'fetch() to an ad host is refused', ms < 3000, 'rejected after ' + ms + ' ms');
});
var x = new XMLHttpRequest();
x.open('GET', 'https://www.google-analytics.com/collect');
x.onload = function () { row(2, 'XHR to a tracker is refused', false, 'status ' + x.status); };
x.onerror = function () {
  var ms = Date.now() - t0;
  row(2, 'XHR to a tracker is refused', ms < 3000, 'error after ' + ms + ' ms');
};
x.send();
</script>
</body>
</html>
