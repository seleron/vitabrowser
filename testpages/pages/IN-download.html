<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN download</title>
<style>
/* The autotest's interaction pass (frontends/vita/interact.c) taps these
 * boxes by screen position: keep them where they are. The tap must land
 * on the box (the LINK_DOWNLOAD flag is on the anchor's box). */
body { margin: 0; font-family: sans-serif; font-size: 18px; }
a.box { position: absolute; display: block; background: #cde; color: #013;
        text-decoration: none; text-align: center; }
#dl { left: 100px; top: 100px; width: 300px; height: 80px; }
</style>
</head>
<body>
<!-- download="name" (fixes1063/1064): the tap must save, not navigate.
 * Relative href -> file:///app0:/testpages/IN-download-target.bin. -->
<a class="box" id="dl" download="vita-test.bin"
   href="IN-download-target.bin">download this file</a>
</body>
</html>
