<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN events</title>
<!-- Patch 130: the interaction pass taps the field, types, taps the
     label and then the button, by position. The button's click handler
     checks the event model a browser gives a page and navigates to
     IN-target.html?via=events&r=ok, or r=<the checks that failed>:
     1 a tap fires pointerdown, mousedown, focus, pointerup, mouseup,
       click, in that order, as MouseEvent / PointerEvent / FocusEvent
     2 document.activeElement follows focus
     3 the field's focus handler rebuilds the layout and the typed text
       still reaches the field
     4 change fires when the field loses focus, not per key
     5 a tap on a <label> toggles its checkbox
     6 readystatechange fired for interactive and complete
     7 two {once: true} document listeners both run, once each
     8 element.focus() / blur() move focus and fire focus / blur -->
<style>
body { margin: 0; font-family: sans-serif; font-size: 18px; }
#q { position: absolute; left: 100px; top: 100px; width: 400px; height: 40px;
     font-size: 20px; }
#q.focused { padding-left: 12px; }
#lab { position: absolute; left: 100px; top: 180px; width: 300px; height: 40px;
       line-height: 40px; }
#go { position: absolute; left: 100px; top: 260px; width: 200px; height: 50px;
      font-size: 20px; }
#note { position: absolute; left: 100px; top: 340px; }
</style>
</head>
<body>
<input type="text" id="q" value="">
<label id="lab" for="cb">Tick me <input type="checkbox" id="cb"></label>
<button id="go" type="button">Check</button>
<p id="note">waiting for the taps</p>
<script>
(function () {
	var d = document, q = d.getElementById('q'), go = d.getElementById('go');
	var cb = d.getElementById('cb'), seq = [], rs = [], once = 0;
	var changes = 0, changeVal = '', qfocus = 0, qblur = 0, keys = 0;
	d.addEventListener('readystatechange', function () { rs.push(d.readyState); });
	q.addEventListener('focus', function () {
		qfocus++;
		/* rebuild the layout under the caret, as Google's fields do */
		q.className = 'focused';
		var s = d.createElement('span');
		s.textContent = ' ';
		d.body.appendChild(s);
	});
	q.addEventListener('blur', function () { qblur++; });
	q.addEventListener('keydown', function () { keys++; });
	q.addEventListener('change', function () { changes++; changeVal = q.value; });
	['pointerdown', 'mousedown', 'focus', 'pointerup', 'mouseup', 'click'].forEach(function (t) {
		go.addEventListener(t, function (e) {
			var k = e instanceof MouseEvent ? 'M' : e instanceof FocusEvent ? 'F' : 'E';
			seq.push(t + ':' + k);
		});
	});
	go.addEventListener('click', function () {
		var bad = [];
		var want = 'pointerdown:M,mousedown:M,focus:F,pointerup:M,mouseup:M,click:M';
		if (seq.join(',') !== want) bad.push('1');
		if (d.activeElement !== go) bad.push('2');
		if (q.value !== 'hello' || !qfocus || !keys) bad.push('3');
		if (changes !== 1 || changeVal !== 'hello' || !qblur) bad.push('4');
		if (!cb.checked) bad.push('5');
		if (rs.join(',') !== 'interactive,complete') bad.push('6' + rs.join('.'));
		d.addEventListener('vbonce', function () { once++; }, { once: true });
		d.addEventListener('vbonce', function () { once += 10; }, { once: true });
		d.dispatchEvent(new Event('vbonce'));
		var once1 = once;
		d.dispatchEvent(new Event('vbonce'));
		if (once1 !== 11 || once !== 11) bad.push('7');
		var f8 = 0;
		cb.addEventListener('focus', function () { f8++; });
		go.addEventListener('blur', function () { f8++; });
		cb.focus();
		if (d.activeElement !== cb || f8 !== 2) bad.push('8');
		cb.blur();
		if (d.activeElement !== d.body) bad.push('8b');
		d.getElementById('note').textContent = seq.join(',') + ' / ' + bad.join(' ');
		location.href = 'IN-target.html?via=events&r=' + (bad.length ? bad.join('-') : 'ok');
	});
})();
</script>
</body>
</html>
