<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN find</title>
<style>
/* The autotest's interaction pass (frontends/vita/interact.c) finds
 * "needle" here: three matches, the first on the first screen, the others
 * far below it, one in capitals (the find ignores case). Keep the
 * positions: the steps check the scroll offset. */
body { margin: 0; font-family: sans-serif; font-size: 18px; }
p { margin: 0 40px; }
#a { padding-top: 120px; }
.gap { height: 1360px; }
#end { height: 600px; }
</style>
</head>
<body>
<p id="a">The first needle is on the first screen.</p>
<div class="gap"></div>
<p id="b">A NEEDLE in capitals, far below.</p>
<div class="gap"></div>
<p id="c">The last needle, near the bottom of IN-find.</p>
<div id="end"></div>
</body>
</html>
