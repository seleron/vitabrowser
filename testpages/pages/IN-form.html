<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN form</title>
<style>
/* The interaction pass taps the field and the button by position. */
body { margin: 0; font-family: sans-serif; font-size: 18px; }
#q { position: absolute; left: 100px; top: 100px; width: 400px; height: 40px;
     font-size: 20px; }
#go { position: absolute; left: 100px; top: 200px; width: 200px; height: 50px;
      font-size: 20px; }
</style>
</head>
<body>
<form action="IN-target.html" method="get">
<input type="hidden" name="via" value="form">
<input type="text" id="q" name="q" value="">
<input type="submit" id="go" value="Send">
</form>
</body>
</html>
