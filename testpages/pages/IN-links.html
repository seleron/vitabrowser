<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN links</title>
<style>
/* The autotest's interaction pass (frontends/vita/interact.c) taps and
 * points at these boxes by screen position: keep them where they are. */
body { margin: 0; font-family: sans-serif; font-size: 18px; }
a.box { position: absolute; display: block; background: #cde; color: #013;
        text-decoration: none; text-align: center; }
#tap { left: 100px; top: 100px; width: 300px; height: 80px; }
#point { left: 580px; top: 232px; width: 80px; height: 80px; }
#tall { height: 2000px; }
#bottom { position: absolute; left: 10px; top: 1900px; }
</style>
</head>
<body>
<a class="box" id="tap" href="IN-target.html?via=tap">tap here</a>
<a class="box" id="point" href="IN-target.html?via=pointer">point</a>
<div id="tall"></div>
<p id="bottom">bottom of IN-links</p>
</body>
</html>
