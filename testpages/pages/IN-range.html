<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN range</title>
<style>
/* The interaction pass taps the slider by position (patch 229): the
 * track runs from x 108 to 392 (thumb centres), so a tap at x 335 is
 * 80% along: value 8 of 0..10. */
body { margin: 0; font-family: sans-serif; font-size: 18px; }
#s { position: absolute; left: 100px; top: 100px; width: 300px; height: 16px; margin: 0; }
</style>
<script>
var inputs = 0;
window.addEventListener('load', function () {
	var s = document.getElementById('s');
	s.addEventListener('input', function () { inputs++; });
	s.addEventListener('change', function () {
		location.href = 'IN-target.html?via=range&v=' + s.value + '&i=' + inputs;
	});
});
</script>
</head>
<body>
<input type="range" id="s" min="0" max="10" step="1" value="2">
</body>
</html>
