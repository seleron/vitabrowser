<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN rebuild</title>
<!-- Patch 144: a submit button whose click handler rebuilds the page and
     reads layout, the way React re-renders claude.ai's login form. The
     layout (and the form controls it holds) is rebuilt DURING the click,
     and the submit that follows read the old control from freed memory
     (a crash on "Continue with email"). The interaction pass taps the
     button; the form's submit handler then opens IN-target.html. -->
<style>
body { font-family: sans-serif; font-size: 20px; margin: 0; }
#go { position: absolute; left: 100px; top: 100px; width: 300px; height: 80px; font-size: 24px; }
#junk p { margin: 2px 20px; }
#junk { position: absolute; left: 0; top: 200px; }
</style>
</head>
<body>
<form id="f" action="IN-target.html" method="get">
<input type="hidden" name="via" value="rebuild-native">
<button id="go" type="submit">Continue</button>
</form>
<div id="junk"><p>before</p></div>
<script>
var n = 0;
document.getElementById('go').addEventListener('click', function () {
	var j = document.getElementById('junk'), html = '', i;
	for (i = 0; i < 40; i++)
		html += '<p>rebuilt line ' + i + ' of click ' + (++n) + '</p>';
	j.innerHTML = html;
	/* reading layout makes the engine rebuild it now */
	document.title = 'IN rebuild ' + document.body.offsetHeight + ' ' +
		j.getBoundingClientRect().height;
});
document.getElementById('f').addEventListener('submit', function (e) {
	e.preventDefault();
	location.href = 'IN-target.html?via=rebuild&r=ok';
});
</script>
</body>
</html>
