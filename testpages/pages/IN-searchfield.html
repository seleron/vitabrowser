<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN search field</title>
<style>
/* Patch 479: google.com's search field, as its CSS builds it. The field is
 * a one-row textarea whose height is its line (24px) plus TRANSPARENT 12px
 * top and bottom borders, box-sizing: border-box, in a grid wrapper:
 * 48px tall in a browser, the text area its middle 24px.
 *
 * The interaction pass (vita/interact.c) taps at y 143 -- the field's
 * bottom border (136-148). Before 479 the engine made rows=1 an author
 * height of 1em, which border-box shrank to no content: the field was
 * 24px tall (100-124), the tap landed on the wrapper and no caret was
 * placed (device run 43: seven taps on google.com's search box, no
 * keyboard). And a tap on the border itself placed none either: the
 * textarea widget ignored a point past its text area. */
body { margin: 0; font-family: sans-serif; font-size: 18px; }
.pill { position: absolute; left: 100px; top: 100px; width: 400px;
        display: flex; background: #eee; border-radius: 24px; }
.wrap { display: grid; flex: 1; }
.field { line-height: 24px; margin: 0; padding: 0 16px;
         border-color: transparent; border-style: solid;
         border-width: 12px 0; font-size: 16px; display: flex; flex: 1;
         width: 100%; background: none; outline: none;
         max-height: 312px; white-space: nowrap; resize: none;
         overflow: hidden; grid-area: 1/1/2/2; box-sizing: border-box; }
#note { position: absolute; left: 100px; top: 180px; font-size: 14px; }
</style>
</head>
<body>
<div class="pill"><div class="wrap">
<textarea class="field" name="q" rows="1" placeholder="Search"></textarea>
</div></div>
<p id="note">The pass taps the bottom of the field (its transparent
border): the caret must land in the field.</p>
</body>
</html>
