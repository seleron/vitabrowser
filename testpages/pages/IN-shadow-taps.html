<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN shadow taps</title>
<style>
/* Patch 481: a web component as old.reddit.com's login options build one
 * (<auth-flow-link>): the visible text is the host's light child, slotted
 * into an <a> in the shadow root, and the <a> holds the click handler.
 * The interaction pass (vita/interact.c) taps the text at (300,125); the
 * handler goes to IN-target.html?via=shadow. Before 481 the tap's click
 * never entered the shadow tree: nothing happened (device run 43). */
body { margin: 0; font-family: sans-serif; font-size: 18px; }
x-option { position: absolute; left: 100px; top: 100px; width: 400px;
           height: 50px; display: block; background: #eee; }
x-option span { display: block; line-height: 50px; text-align: center; }
</style>
</head>
<body>
<x-option><span>Continue with the shadow link</span></x-option>
<script>
customElements.define('x-option', class extends HTMLElement {
	constructor() {
		super();
		this.attachShadow({ mode: 'open' }).innerHTML = '<a><slot></slot></a>';
	}
	connectedCallback() {
		this.shadowRoot.querySelector('a').addEventListener('click', function () {
			location.href = 'IN-target.html?via=shadow';
		});
	}
});
</script>
</body>
</html>
