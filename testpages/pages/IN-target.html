<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IN target</title>
<style>body { font-family: sans-serif; font-size: 20px; margin: 20px; }</style>
</head>
<body>
<p id="via">arrived</p>
<script>
/* Shows how the interaction pass got here (?via=tap, pointer, remote,
 * typed, form); the pass itself checks the URL. */
var q = location.search.replace(/^\?/, '').split('&'), via = '', text = '';
q.forEach(function (kv) {
  var p = kv.split('=');
  if (p[0] === 'via') via = decodeURIComponent(p[1] || '');
  if (p[0] === 'q') text = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
});
document.getElementById('via').textContent = 'arrived via ' + via +
  (text ? ', text "' + text + '"' : '');
</script>
</body>
</html>
