<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS abspos earlier (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#container { position: relative; border: 1px solid #000; }
#earlier { background: #eef; }
#abs { position: absolute; bottom: 0; left: 0; right: 0; height: 20px; background: #cfc; }
#grower { background: #fee; }
#grower p { margin: 2px 0; }
</style>
<script>
/* Patch 191: bottom-anchored abspos in an earlier sibling must move when
 * the containing block grows via the local relayout path. */
(function () {
	var k = 0, N = 2;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'ABSPOS191: ' + k + '/' + N + ' passed';
		document.title = 'JS abspos earlier (' + k + '/' + N + ')';
	}
	document.addEventListener('DOMContentLoaded', function () {
		var abs = $('abs'), grower = $('grower');
		/* Wait for initial layout to complete before measuring. */
		setTimeout(function () {
			var before = abs.getBoundingClientRect().top;

			/* Step 1: grow the container by inserting a block into #grower.
			 * This takes the 166 local block-insert path (the block must
			 * stay "plain": height auto, no inline style); #container grows,
			 * and #abs (bottom:0, CB=#container) must move down. */
			var p = document.createElement('p');
			p.textContent = 'inserted block to grow the container';
			grower.appendChild(p);

			/* Let layout settle, then check. */
			setTimeout(function () {
				var after = abs.getBoundingClientRect().top;
				var delta = after - before;
				/* The inserted p is one 16px line (~20px) + 2px margins;
				 * abs must move down by about that. */
				t(1, delta >= 15 && delta <= 35,
					'abs moved down by ' + delta + 'px on grow');

				/* Step 2: shrink by removing the block; abs must move up. */
				var before2 = abs.getBoundingClientRect().top;
				grower.removeChild(p);
				setTimeout(function () {
					var after2 = abs.getBoundingClientRect().top;
					var delta2 = before2 - after2;
					t(2, delta2 >= 15 && delta2 <= 35,
						'abs moved up by ' + delta2 + 'px on shrink');
				}, 100);
			}, 100);
		}, 100);
	});
})();
</script>
</head>
<body>
<div id="sum">ABSPOS191: 0/2 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<div id="container">
	<div id="earlier">
		<div id="abs">bottom-anchored</div>
		<p>Earlier sibling content.</p>
	</div>
	<div id="grower">
		<p>Grower initial content.</p>
	</div>
</div>
</body>
</html>
