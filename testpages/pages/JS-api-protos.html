<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS API prototypes (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">APIPROTO: 0/7 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<script>
/* patch 276: navigator, screen, performance, crypto, history and
 * screen.orientation keep their members on their interface prototypes and
 * have no own properties, as in browsers (navigator had 29, internals among
 * them); Crypto.prototype.randomUUID; the engine's marks and listener maps
 * are out of sight. Chromium-verified. */
(function () {
	var k = 0, N = 7;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'APIPROTO: ' + k + '/' + N + ' passed';
		document.title = 'JS API prototypes (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var own = Object.prototype.hasOwnProperty;
	check(1, function () {
		var o = { navigator: navigator, screen: screen, performance: performance, crypto: crypto, history: history,
			'screen.orientation': screen.orientation }, bad = [];
		Object.keys(o).forEach(function (k) { var n = o[k] ? Reflect.ownKeys(o[k]).length : -1; if (n !== 0) bad.push(k + ' ' + n); });
		return bad.length === 0 || 'own properties: ' + bad.join(', ');
	}, 'navigator, screen, performance, crypto, history have no own properties');
	check(2, function () {
		var d = Object.getOwnPropertyDescriptor(Navigator.prototype, 'userAgent'), threw = 'no';
		try { Navigator.prototype.userAgent; } catch (e) { threw = e.name; }
		return (d && d.get && d.get.name === 'get userAgent' && !d.set && threw === 'TypeError') ||
			(d ? 'get ' + (d.get && d.get.name) + ', read on the prototype: ' + threw : 'no accessor');
	}, 'userAgent is Navigator.prototype\'s accessor (illegal on the prototype)');
	check(3, function () {
		return (typeof Crypto.prototype.randomUUID === 'function' &&
			/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(crypto.randomUUID())) || typeof Crypto.prototype.randomUUID;
	}, 'Crypto.prototype.randomUUID');
	check(4, function () {
		return (typeof navigator.userAgent === 'string' && navigator.userAgent.length > 0 && screen.width > 0 &&
			typeof performance.now() === 'number' && history.length >= 1 && crypto.getRandomValues(new Uint8Array(4)).length === 4) ||
			'a value went missing';
	}, 'the values still read through the prototypes');
	check(5, function () {
		var was = history.scrollRestoration; history.scrollRestoration = 'manual';
		var got = history.scrollRestoration; history.scrollRestoration = was;
		return got === 'manual' || got;
	}, 'history.scrollRestoration can be set');
	check(6, function () {
		var t = new EventTarget(), hit = 0;
		t.addEventListener('q', function () { hit++; }); t.dispatchEvent(new Event('q'));
		return (hit === 1 && Reflect.ownKeys(t).length === 0) || 'hits ' + hit + ', own ' + Reflect.ownKeys(t).length;
	}, 'an EventTarget keeps its listeners out of sight');
	check(7, function () {
		var d = Object.getOwnPropertyDescriptor(CharacterData.prototype, 'data');
		var fns = [Element.prototype.matches, Document.prototype.querySelector, d && d.set], bad = [];
		fns.forEach(function (f, i) { var n = f ? Object.getOwnPropertyNames(f).sort().join(',') : 'none'; if (n !== 'length,name') bad.push(i + ':' + n); });
		return bad.length === 0 || bad.join(' ');
	}, 'functions have only length and name');
})();
</script>
</body>
</html>
