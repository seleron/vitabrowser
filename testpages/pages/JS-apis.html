<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS apis (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 15px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.miss { font-family: monospace; font-size: 13px; background: #fee; }
</style>
</head>
<body>
<p id="sum" class="wait">APIS: script did not run</p>
<p id="behave" class="wait">behaviour checks: waiting</p>
<p id="missing" class="miss"></p>
<p id="wrong" class="miss"></p>
<script>
/* The web platform a modern single-page app (claude.ai's React bundle,
 * docs/phase-0/11) reaches for, as expressions that must be truthy. The
 * summary line counts them; every one missing is listed by name, so one
 * screenshot or plot dump tells the whole story. */
var apis = [
  /* language / ES built-ins the engine should have */
  'Array.prototype.at', 'Array.prototype.flat', 'Array.prototype.findLast',
  'Array.prototype.toSorted', 'Object.hasOwn', 'Object.fromEntries',
  'String.prototype.replaceAll', 'String.prototype.at', 'Promise.allSettled',
  'Promise.any', 'Promise.withResolvers', 'globalThis', 'WeakRef',
  'FinalizationRegistry', 'BigInt', 'structuredClone', 'queueMicrotask',
  'AggregateError', 'Intl', 'Intl.DateTimeFormat', 'Intl.NumberFormat',
  'Intl.Collator', 'Intl.PluralRules', 'Intl.RelativeTimeFormat',
  'Intl.Locale', 'Intl.Segmenter', 'Intl.ListFormat',
  'Date.prototype.toLocaleDateString', 'String.prototype.localeCompare',
  /* URLs, text, binary */
  'URL', 'URLSearchParams', 'URLSearchParams.prototype.entries',
  'URL.canParse', 'URL.createObjectURL', 'TextEncoder', 'TextDecoder',
  'Blob', 'File', 'FileReader', 'FormData', 'ArrayBuffer',
  'atob', 'btoa', 'crypto', 'crypto.getRandomValues', 'crypto.randomUUID',
  'crypto.subtle',
  /* fetch & friends */
  'fetch', 'Request', 'Response', 'Headers', 'AbortController', 'AbortSignal',
  'AbortSignal.timeout', 'XMLHttpRequest', 'WebSocket', 'EventSource',
  'ReadableStream', 'WritableStream', 'TransformStream',
  'navigator.sendBeacon',
  /* events and timing */
  'EventTarget', 'Event', 'CustomEvent', 'MessageChannel', 'MessagePort',
  'BroadcastChannel', 'postMessage', 'requestAnimationFrame',
  'cancelAnimationFrame', 'requestIdleCallback', 'performance',
  'performance.now', 'performance.mark', 'performance.measure',
  'PerformanceObserver', 'setTimeout', 'setInterval',
  /* DOM */
  'document.createElement', 'document.createElementNS',
  'document.createTextNode', 'document.createDocumentFragment',
  'document.createComment', 'document.createRange', 'document.createTreeWalker',
  'document.querySelector', 'document.getElementById', 'document.activeElement',
  'document.head', 'document.body', 'document.documentElement',
  'document.readyState', 'document.visibilityState', 'document.cookie !== undefined',
  'Node', 'Element', 'HTMLElement', 'HTMLInputElement', 'HTMLFormElement',
  'HTMLIFrameElement', 'SVGElement', 'Text', 'DocumentFragment',
  'Element.prototype.closest', 'Element.prototype.matches',
  'Element.prototype.getBoundingClientRect', 'Element.prototype.attachShadow',
  'Element.prototype.append', 'Element.prototype.prepend',
  'Element.prototype.replaceWith', 'Element.prototype.remove',
  'Element.prototype.setAttribute', 'Element.prototype.toggleAttribute',
  'Element.prototype.scrollIntoView', 'Element.prototype.animate',
  'Node.prototype.contains', 'Node.prototype.isConnected !== undefined || true',
  'MutationObserver', 'ResizeObserver', 'IntersectionObserver',
  'CSS', 'CSS.supports', 'CSS.escape', 'getComputedStyle', 'matchMedia',
  'customElements', 'customElements.define', 'ShadowRoot',
  'DOMParser', 'XMLSerializer', 'DOMRect', 'DOMException',
  'Image', 'HTMLCanvasElement', 'history.pushState', 'history.replaceState',
  'location.origin', 'scrollTo', 'innerWidth', 'devicePixelRatio',
  /* storage */
  'localStorage', 'sessionStorage', 'indexedDB', 'caches',
  /* navigator */
  'navigator.userAgent', 'navigator.language', 'navigator.languages',
  'navigator.onLine !== undefined', 'navigator.cookieEnabled',
  'navigator.hardwareConcurrency', 'navigator.clipboard',
  'navigator.serviceWorker', 'navigator.permissions', 'navigator.userAgentData',
  'navigator.storage', 'navigator.locks', 'navigator.mediaDevices',
  /* misc */
  'Worker', 'Notification', 'console.assert', 'console.table',
  'console.group', 'console.groupEnd', 'console.time', 'console.timeEnd',
  'console.count', 'console.trace', 'reportError', 'Symbol.asyncIterator',
  'Reflect', 'Proxy', 'Atomics', 'SharedArrayBuffer',
  'visualViewport', 'screen', 'screen.width'
];
var ok = 0, missing = [];
for (var i = 0; i < apis.length; i++) {
  var v;
  try { v = (0, eval)(apis[i]); } catch (e) { v = undefined; }
  if (v) ok++; else missing.push(apis[i]);
}

/* A few behaviours the presence checks cannot see. */
var wrong = [];
function check(name, f) {
  try { if (!f()) wrong.push(name); } catch (e) { wrong.push(name + ' (' + e + ')'); }
}
check('URLSearchParams spread', function () {
  return [...new URLSearchParams('a=1&a=2')].length === 2; });
check('URL relative', function () {
  return new URL('../x.js', 'https://h/a/b/c.js').href === 'https://h/a/x.js'; });
check('URL origin', function () {
  return new URL('https://h:8443/p').origin === 'https://h:8443'; });
check('TextEncoder utf8', function () {
  return new TextEncoder().encode('é').length === 2; });
check('structuredClone', function () {
  var o = { a: [1, { b: 2 }] }, c = structuredClone(o);
  return c !== o && c.a[1].b === 2; });
check('CSS.supports', function () {
  return CSS.supports('display', 'flex') === true; });
check('matchMedia().matches boolean', function () {
  return typeof matchMedia('(min-width: 1px)').matches === 'boolean'; });
check('Intl.DateTimeFormat format', function () {
  return typeof new Intl.DateTimeFormat('en-US').format(new Date()) === 'string'; });
check('Headers iterate', function () {
  var h = new Headers({ 'X-A': '1' }); return [...h].length === 1; });
check('AbortController abort', function () {
  var a = new AbortController(); a.abort(); return a.signal.aborted === true; });

var s = document.getElementById('sum');
s.textContent = 'APIS: ' + ok + '/' + apis.length + ' present';
s.className = missing.length ? 'wait' : 'pass';
document.getElementById('missing').textContent =
  missing.length ? 'missing: ' + missing.join(', ') : 'missing: none';
var b = document.getElementById('behave');
b.textContent = 'behaviour: ' + (10 - wrong.length) + '/10 right';
b.className = wrong.length ? 'wait' : 'pass';
document.getElementById('wrong').textContent =
  wrong.length ? 'wrong: ' + wrong.join(', ') : 'wrong: none';
document.title = 'JS apis ' + ok + '/' + apis.length;
console.log('APIS ' + ok + '/' + apis.length + ' missing: ' + missing.join(', '));
console.log('APIS wrong: ' + wrong.join(', '));
</script>
</body>
</html>
