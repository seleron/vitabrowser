<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JS-appearance196</title>
<style>
#t1 { -webkit-appearance: button; }
#t2 { -webkit-appearance: textarea; }
#t3 { -webkit-appearance: sliderthumb-horizontal; }
#t4 { -webkit-appearance: searchfield-decoration; }
#t5 { -webkit-appearance: inner-spin-button; }
#t6 { -webkit-appearance: none; }
</style></head>
<body>
<div id="t1"></div><div id="t2"></div><div id="t3"></div>
<div id="t4"></div><div id="t5"></div><div id="t6"></div>
<div id="t7"></div>
<script>
var R = [];
function eq(a, b, name) { R.push((a === b ? "PASS" : "FAIL") + " " + name + " [" + a + "]"); }
function done() {
document.title = R.join("\n");
var pass = R.filter(function(x) { return x.indexOf("PASS") === 0; }).length;
var summary = "APPEAR196: " + pass + "/" + R.length + " passed";
R.push("STR " + summary);
var pre = document.createElement("pre"); pre.id = "result";
pre.textContent = R.join("\n"); document.body.appendChild(pre);
}
// Read computed styles only after the window load event (the pattern
// CSS-appearance.html, patch 184's own gate, uses): the conversion pass
// that runs around load is what populates box styles, and this engine's
// getComputedStyle() reads the box's selected style without forcing that
// pass -- read at +100ms, the stylesheet cases below still answer "" /
// initial values. The offsetWidth read forces the layout synchronously
// too (the JS-cssom.html pattern), covering a load/layout race.
window.addEventListener("load", function() {
void document.body.offsetWidth;
// 1. CSS -webkit-appearance with canonical legacy keywords parses (all -> auto)
["t1","t2","t3","t4","t5"].forEach(function(id) {
  var g = getComputedStyle(document.getElementById(id));
  eq(g.appearance, "auto", id + " appearance=auto");
  eq(g.webkitAppearance, "auto", id + " webkitAppearance=auto");
  eq(g.getPropertyValue("-webkit-appearance"), "auto", id + " gpv(-webkit-appearance)=auto");
});
// 2. -webkit-appearance: none -> none on both names
var g6 = getComputedStyle(document.getElementById("t6"));
eq(g6.appearance, "none", "t6 appearance=none");
eq(g6.webkitAppearance, "none", "t6 webkitAppearance=none");
eq(g6.getPropertyValue("-webkit-appearance"), "none", "t6 gpv=none");
// 3. el.style.webkitAppearance get/set round-trip
var t7 = document.getElementById("t7");
t7.style.webkitAppearance = "none";
eq(t7.style.webkitAppearance, "none", "style.webkitAppearance set/get");
eq(t7.style.getPropertyValue("-webkit-appearance"), "none", "style gpv(-webkit-appearance)");
eq(t7.getAttribute("style").indexOf("-webkit-appearance:none") >= 0, true, "style attr has -webkit-appearance");
// 4. getComputedStyle reflects the inline -webkit-appearance set above.
// The mutation re-selects the box style on the engine's async relayout
// pass, so poll for the settled value with a deadline; a dropped update
// still records a failure rather than hanging the page.
(function poll(n) {
	if (getComputedStyle(t7).webkitAppearance === "none" || n <= 0) {
		eq(getComputedStyle(t7).webkitAppearance, "none", "gcs webkitAppearance=none after inline set");
		done();
		return;
	}
	setTimeout(function() { poll(n - 1); }, 50);
})(60);
});
</script>
</body></html>
