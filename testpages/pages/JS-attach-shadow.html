<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS attachShadow (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">SHADOW: 0/7 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<div id="h1"></div><div id="h2"></div><div id="h3"></div>
<script>
/* patch 242: a minimal Shadow DOM API -- attachShadow / shadowRoot /
 * ShadowRoot with innerHTML and queries. The engine had none, and
 * github.com's invoker-commands polyfill wraps
 * HTMLElement.prototype.attachShadow unconditionally (n.call(this, e) on
 * an undefined n), so every component calling attachShadow in its
 * constructor threw ("cannot read property 'call' of undefined":
 * <relative-time>, <tool-tip>). The shadow tree is not drawn (light DOM
 * stays visible); the API works. Chromium-verified. */
(function () {
	var k = 0, N = 7;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SHADOW: ' + k + '/' + N + ' passed';
		document.title = 'JS attachShadow (' + k + '/' + N + ')';
	}
	function run() {
		t(1, typeof Element.prototype.attachShadow === 'function' &&
			typeof HTMLElement.prototype.attachShadow === 'function',
			'attachShadow exists');
		var h = $('h1'), r = h.attachShadow({ mode: 'open' });
		t(2, h.shadowRoot === r && r.host === h && r.mode === 'open' &&
			r instanceof ShadowRoot && r instanceof DocumentFragment,
			'open root: host, mode, shadowRoot');
		r.innerHTML = '<span id="in">inside</span>';
		t(3, r.querySelector('#in') !== null && r.getElementById('in') !== null &&
			r.innerHTML.indexOf('inside') >= 0 && r.childNodes.length === 1,
			'innerHTML and queries in the root');
		var c = $('h2').attachShadow({ mode: 'closed' });
		t(4, $('h2').shadowRoot === null && c.mode === 'closed', 'closed root is not exposed');
		var threw = false;
		try { h.attachShadow({ mode: 'open' }); } catch (e) { threw = e.name === 'NotSupportedError'; }
		t(5, threw, 'a second attachShadow throws NotSupportedError');
		/* github.com's invoker-commands polyfill wraps it like this */
		var n = HTMLElement.prototype.attachShadow;
		HTMLElement.prototype.attachShadow = function (e) { var o = n.call(this, e); return o; };
		class XShadow extends HTMLElement {
			constructor() { super(); this.root = this.attachShadow({ mode: 'open' }); this.root.textContent = 'shadow text'; }
		}
		customElements.define('x-shadow', XShadow);
		var x = document.createElement('x-shadow');
		HTMLElement.prototype.attachShadow = n;
		t(6, x.shadowRoot === x.root && x.root.textContent === 'shadow text',
			'a wrapped attachShadow in a constructor');
		/* <relative-time> renders into its root this way */
		var sp = document.createElement('span');
		sp.textContent = 'replaced';
		r.replaceChildren(sp);
		t(7, r.childNodes.length === 1 && r.firstElementChild === sp &&
			r.textContent === 'replaced', 'replaceChildren on a root');
	}
	/* at load, not 100 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</body>
</html>
