<!DOCTYPE html><html><head><meta charset="utf-8"><title>JS Attr Local</title>
<style>
[data-flag] { color: rgb(200, 0, 0); }
</style>
</head><body>
<div id="host"></div>
<div style="height: 7000px"></div>
<script>
/* Patch 313 gate page (doc 20 stage 2). The load innerHTML batch takes
 * a full reconvert (cause=local in the flush log). The timer's batch --
 * 9 setAttribute('data-x') (no used sheet references data-x: answered
 * locally by html_reconvert_local) and 1 setAttribute('data-flag') (a
 * used sheet has a [data-flag] rule: html_rl_attr_local_ok declines,
 * try_local's kind gate sends the batch to a full reconvert,
 * cause=kind). The tall spacer keeps the page in the bottom-settle
 * window long enough for the timer and the flush to run. */
(function () {
  function $(id){return document.getElementById(id);}
  var host=$('host'),i,h='';
  for(i=0;i<10;i++)h+='<div id="t'+i+'">x</div>';
  host.innerHTML=h;
  setTimeout(function(){
    for(i=0;i<9;i++)$('t'+i).setAttribute('data-x','v');
    $('t9').setAttribute('data-flag','v');
  },2500);
})();
</script></body></html>
