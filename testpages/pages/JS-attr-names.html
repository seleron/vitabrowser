<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS attribute names (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">ATTRNAME: 0/7 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<div id="parsed" one="1" two$x="2" three="3"></div>
<template id="tpl"><p one="1" two="2" three$lit$="x" four="4"></p></template>
<script>
/* patch 485: attribute names are HTML's, not XML Name's. libdom rejected
 * '$' (XML Name), so the HTML parser dropped such attributes -- lit marks
 * every bound attribute in its templates as `name$lit$`, and with those
 * gone its parts no longer lined up: classMap() threw ("can only be used
 * in the class attribute") and templates rendered without their bound
 * parts (old.reddit.com's login components). The DOM's rule for an
 * attribute name: non-empty, no ASCII whitespace, NUL, '/', '=' or '>'.
 * Chromium-verified. */
(function () {
	var k = 0, N = 7;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'ATTRNAME: ' + k + '/' + N + ' passed';
		document.title = 'JS attribute names (' + k + '/' + N + ')';
	}
	var pd = $('parsed');
	t(1, pd.getAttribute('two$x') === '2' && pd.getAttributeNames().join(',') === 'id,one,two$x,three',
		'a parsed attribute named with $ is kept, in order: ' + pd.getAttributeNames().join(','));
	var tp = $('tpl').content.querySelector('p');
	t(2, tp && tp.getAttributeNames().join(',') === 'one,two,three$lit$,four',
		'so is one in a template\'s content: ' + (tp ? tp.getAttributeNames().join(',') : 'none'));
	var w = document.createElement('template');
	w.innerHTML = '<b a1="1" class$lit$="x" a3="3"></b>';
	var b = w.content.querySelector('b');
	t(3, b && b.getAttributeNames().join(',') === 'a1,class$lit$,a3',
		'and one made by innerHTML: ' + (b ? b.getAttributeNames().join(',') : 'none'));
	var e = document.createElement('div');
	var ok4 = true;
	try { e.setAttribute('data$v', 'y'); } catch (x) { ok4 = false; }
	t(4, ok4 && e.getAttribute('data$v') === 'y', 'setAttribute takes a name with $');
	var bad = ['a b', 'a=b', 'a/b', 'a>b', ''], thrown = 0;
	bad.forEach(function (n) {
		try { e.setAttribute(n, '1'); } catch (x) { if (x && x.name === 'InvalidCharacterError') thrown++; }
	});
	t(5, thrown === bad.length, 'and still refuses whitespace, =, /, > and the empty name: ' + thrown + '/' + bad.length);
	/* lit's template preparation, in miniature: the bound attributes are
	 * found by their $lit$ suffix, in source order */
	var lt = document.createElement('template');
	lt.innerHTML = '<div title$lit$="m" class$lit$="m" id="x"></div>';
	var ld = lt.content.firstChild, found = [];
	ld.getAttributeNames().forEach(function (n) { if (/\$lit\$$/.test(n)) found.push(n); });
	t(6, found.join(',') === 'title$lit$,class$lit$', 'lit finds its bound attributes in order: ' + found.join(','));
	ld.removeAttribute('class$lit$');
	t(7, !ld.hasAttribute('class$lit$') && ld.hasAttribute('title$lit$'),
		'and removes them by name');
})();
</script>
</body>
</html>
