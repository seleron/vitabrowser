<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS attr restyle</title>
<style id="st">
/* Patch 417. An attribute a sheet can select on took the full rebuild
 * (310's kind gate). Now it is re-selected as a class change is: a
 * wrapper's data-state opens the panel inside it, a span's aria-pressed,
 * a div's data-x -- all local; an attribute on a <style> renders nothing.
 * data-y, which a sibling rule ([data-y] + p) can see, and id (not
 * scannable) still take the full rebuild. Row for row as
 * CSS-attr-restyle-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.panel { display: none; background: #eef; }
[data-state="open"] .panel { display: block; }
span[aria-pressed="true"] { background: #cfc; }
div[data-x] { color: #c00; }
[data-y] + p { color: #00c; }
#idnew { border-left: 3px solid #888; }
[data-ng-app-id] { outline: 0; }
</style>
</head>
<body>
<div id="w">A wrapper.<div class="panel">The panel, shown when the wrapper is open.</div></div>
<p>Text with a <span id="sp">pressable span</span> in it.</p>
<div id="dx">A div that gains data-x (red).</div>
<div id="dy">A div that gains data-y.</div>
<p>The paragraph after it (blue once data-y is set).</p>
<div id="di">A div that gains an id.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('w').setAttribute('data-state', 'open'); },
		function () { $('sp').setAttribute('aria-pressed', 'true'); },
		function () { $('dx').setAttribute('data-x', '1'); },
		function () { $('st').setAttribute('data-ng-app-id', 'ng'); },
		function () { $('dy').setAttribute('data-y', '1'); },
		function () { $('di').id = 'idnew'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
