<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS attr scan</title>
<style>
/* Patch 510. An attribute change is answered without a restyle when no
 * sheet can select on the attribute -- a scan of each sheet's text. Three
 * refinements: an escape outside a string is read as CSS reads it (any
 * escape used to make the whole sheet "might reference anything", and
 * utility-class sheets are full of them: .md\:flex, .w-\[20px\]); a sheet
 * done with no text (an empty <style>) references nothing; and an
 * attribute whose compound also holds :hover, :active or :focus cannot
 * change a box's style (box selection never matches those). An escape in
 * an attribute selector's own name ([data-\65 sc]) still counts as a
 * reference. After its steps (250 ms apart) JS-attr-scan.html must render
 * row for row as CSS-attr-scan-ref.html, the same steps at parse time. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; padding: 2px 6px; border: 1px solid #888; }
.md\:flex { font-weight: bold; }
.w-\[20px\] { padding-left: 20px; }
.focus-within\:bg-x:focus-within { background: #eee; }
[data-quiet]:hover { background: #f00; }
a[data-quiet]:focus, p:focus[data-quiet] { outline: 3px solid #f00; }
[data-live="1"] { background: #fc8; }
[data-\65 sc="1"] { color: #c00; }
</style>
<style></style>
</head>
<body>
<p id="a" class="md:flex">a: data-quiet set (only beside :hover / :focus)</p>
<p id="b" class="w-[20px]">b: data-live set (a live rule)</p>
<p id="c">c: data-esc set (a rule spelled with an escape)</p>
<p id="d">d: data-other set (no rule at all)</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('a').setAttribute('data-quiet', '1'); },
		function () { $('b').setAttribute('data-live', '1'); },
		function () { $('c').setAttribute('data-esc', '1'); },
		function () { $('d').setAttribute('data-other', '1'); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 250); } })(); });
})();
</script>
</body>
</html>
