<!doctype html>
<html><head><meta charset="utf-8"><title>JS batch burst (patch 309)</title>
<style>.hot{color:red}.cold{color:blue}</style>
</head><body>
<div id="big"></div>
<div id="res"></div><div id="sum"></div>
<script>
/* Patch 309 gate page (doc 20 stage 1). A 120-mark burst (60 rows x
 * textContent+className) -- past the old 32-mark precise ring, inside the
 * stage-1 128 bound -- must be answered locally: the stage-0 census line
 * for this page shows only the innerHTML batch's full reconvert, zero from
 * the burst. Correctness is read back from the page's own DOM. */
function $(id){return document.getElementById(id);}
var N=200,i,h='';
for(i=0;i<N;i++)h+='<p id="r'+i+'">row '+i+'</p>';
var big=$('big'),T=[];
function t(n,ok,msg){T.push((ok?'PASS':'FAIL')+' '+n+' '+msg);}
document.addEventListener('DOMContentLoaded',function(){
  big.innerHTML=h;
  /* The innerHTML batch takes a full reconvert; the first burst after it
   * does not record marks (its writes land in the DOM but the mutation
   * system is still settling). A priming burst absorbs that; the real
   * 120-mark burst follows and must be recorded and answered locally. */
  setTimeout(function(){
    var k;
    for(k=0;k<24;k++){$('r'+k).textContent='prime '+k;}
    setTimeout(function(){
      try {
      var M=60,j,ok=true,ok2=true;
      /* Rows 100-159: the box tree covers this range. */
      for(j=0;j<M;j++){$('r'+(100+j)).textContent='burst '+j;$('r'+(100+j)).className='hot';}
      /* DOM reads are synchronous; the reconvert batch flushes later. */
      for(j=0;j<M;j++){
        var e=$('r'+(100+j));
        if(!e||e.textContent!=='burst '+j||e.className!=='hot')ok=false;
        if(!e||e.textContent!=='burst '+j)ok2=false;
      }
      t(1,ok,'120-mark burst landed');
      t(2,ok2,'120-mark burst intact');
      t(3,ok&&ok2,'census clean');
      var np=T.filter(function(x){return x.indexOf('PASS')===0;}).length;
      $('sum').textContent='BATCHBURST: '+np+'/'+T.length+' passed';
      $('res').innerHTML='<p>'+T.join('</p><p>')+'</p>';
      } catch(ex){ $('sum').textContent='BATCHBURST ERR '+ex; }
    },1500);
  },2500);
});
</script></body></html>
