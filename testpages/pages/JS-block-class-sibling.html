<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS block class sibling (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#list p.open { font-weight: bold; }
#list p.open + p { color: rgb(255, 0, 0); }
#list p.open ~ p.tail { color: rgb(0, 0, 255); }
</style>
</head>
<body>
<!-- Patch 174 (WS-C): a block's class change is rebuilt locally only when
     no author stylesheet has a sibling combinator (+ or ~) in a selector:
     with one, the class can restyle the FOLLOWING siblings too, which a
     rebuild of the one block would leave stale. This page has both, so
     each change must still reach the siblings (the full rebuild does it).
     1: class on: the next paragraph turns red (+) and a later .tail blue (~).
     2: class off: both back.
     3: class on another paragraph: its next sibling turns red. -->
<p id="sum" class="wait">BLOCKSIB: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<div id="list"></div>
<script>
(function () {
	var h = [], i, N = 3, res = [];
	for (i = 0; i < 30; i++)
		h.push('<p id="q' + i + '"' + (i === 20 ? ' class="tail"' : '') + '>Item ' + i + ' of the list</p>');
	document.getElementById('list').innerHTML = h.join('');
	function $(id) { return document.getElementById(id); }
	function c(id) { return String(getComputedStyle($(id)).color).replace(/\s+/g, ''); }
	var RED = 'rgb(255,0,0)', BLUE = 'rgb(0,0,255)';
	var steps = [
		[function () { $('q5').className = 'open'; },
			function () { return c('q6') === RED && c('q20') === BLUE && c('q7') !== RED; }, 'class on: next red, .tail blue'],
		[function () { $('q5').className = ''; },
			function () { return c('q6') !== RED && c('q20') !== BLUE; }, 'class off: both back'],
		[function () { $('q10').className = 'open'; },
			function () { return c('q11') === RED && c('q6') !== RED; }, 'another paragraph: its next red']
	];
	function show() {
		var k = 0;
		for (var n = 0; n < N; n++) {
			var p = $('r' + (n + 1)), r = res[n];
			p.textContent = (n + 1) + ' ' + steps[n][2] + (r ? '' : ' FAIL');
			if (r) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'BLOCKSIB: ' + k + '/' + N + ' passed';
		document.title = 'JS block class sibling (' + k + '/' + N + ')';
	}
	function run(i) {
		if (i >= steps.length) { show(); return; }
		steps[i][0]();
		setTimeout(function () {
			res[i] = steps[i][1]();
			setTimeout(function () { run(i + 1); }, 100);
		}, 600);
	}
	window.addEventListener('load', function () { setTimeout(function () { run(0); }, 300); });
})();
</script>
</body></html>
