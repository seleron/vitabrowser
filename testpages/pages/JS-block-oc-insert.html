<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS block with image / form controls insert (script not run)</title>
<style>
/* Patch 364. A block a script inserts that holds an image or form
 * controls was a full box-tree rebuild (228-287 ms on a 2500-paragraph
 * page in the host sim); it is now built alone and the page laid out
 * once (22 ms). This page checks the result is the full rebuild's: the
 * image loads and moves what follows, the controls work and belong to
 * their form. The engine log must show the local path
 * ("full layout (new block holds images or form controls)"). */
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
<script>
(function () {
	var N = 7, k = 0, res = [];
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) { res.push([n, ok, text]); }
	function show() {
		var i, r, p;
		for (i = 0; i < res.length; i++) {
			r = res[i]; p = $('r' + r[0]);
			p.textContent = r[0] + ' ' + r[2] + (r[1] ? '' : ' FAIL');
			if (r[1]) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'OCINS: ' + k + '/' + N + ' passed';
		document.title = 'JS block oc insert (' + k + '/' + N + ')';
	}
	function at(ms, f) { setTimeout(f, ms); }
	window.addEventListener('load', function () {
		at(300, function () {		/* a paragraph with an image */
			var p = document.createElement('p');
			p.id = 'pi';
			p.innerHTML = 'Image <img id="im" src="opimg-20.png"> inserted';
			$('body').insertBefore(p, $('p5'));
		});
		at(800, function () {		/* a block holding a form */
			var d = document.createElement('div');
			d.id = 'fm';
			d.innerHTML = '<form id="f1" action="#"><input id="in" ' +
				'value="abc"> <button id="bt" type="button">Go' +
				'</button> <select id="sl"><option>one</option>' +
				'<option selected>two</option></select></form>';
			$('body').insertBefore(d, $('p10'));
		});
		at(1300, function () { $('in').value = 'xyz'; });
		at(1800, function () {
			var im = $('im'), r = im.getBoundingClientRect();
			t(1, im.complete && im.naturalWidth === 20 &&
				Math.round(r.height) === 20,
				'image loaded, 20px tall (' + im.naturalWidth + ', ' +
				Math.round(r.height) + ')');
			t(2, $('p5').getBoundingClientRect().top >= r.bottom - 1,
				'the next paragraph is below the image');
			t(3, $('in').value === 'xyz' &&
				$('in').getBoundingClientRect().width > 0,
				'the input is laid out and takes a value (' +
				$('in').value + ')');
			/* (by id: .form answers a fresh wrapper, so === fails,
			 * and a button has no .form -- separate gaps, the same
			 * on any build) */
			t(4, $('in').form && $('in').form.id === 'f1' &&
				$('f1').elements.length === 3,
				'the controls belong to the new form (' +
				$('f1').elements.length + ' elements)');
			t(5, $('sl').value === 'two', 'the select reads its selected ' +
				'option (' + $('sl').value + ')');
			t(6, $('bt').getBoundingClientRect().width > 0,
				'the button is laid out');
			t(7, $('p10').getBoundingClientRect().top >=
				$('fm').getBoundingClientRect().bottom - 1 &&
				$('fm').getBoundingClientRect().top >=
				$('p9').getBoundingClientRect().bottom - 1,
				'the form block sits between its neighbours');
			show();
		});
	});
})();
</script>
</head>
<body>
<p id="sum" class="wait">OCINS: script not run</p>
<p id="r1" class="wait">1</p><p id="r2" class="wait">2</p>
<p id="r3" class="wait">3</p><p id="r4" class="wait">4</p>
<p id="r5" class="wait">5</p><p id="r6" class="wait">6</p>
<p id="r7" class="wait">7</p>
<div id="body">
<p id="p0">Paragraph 0</p><p id="p1">Paragraph 1</p><p id="p2">Paragraph 2</p>
<p id="p3">Paragraph 3</p><p id="p4">Paragraph 4</p><p id="p5">Paragraph 5</p>
<p id="p6">Paragraph 6</p><p id="p7">Paragraph 7</p><p id="p8">Paragraph 8</p>
<p id="p9">Paragraph 9</p><p id="p10">Paragraph 10</p><p id="p11">Paragraph 11</p>
</div>
</body>
</html>
