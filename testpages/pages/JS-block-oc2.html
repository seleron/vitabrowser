<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS block oc2</title>
<style>
/* Patch 430. A new block holding a <fieldset> (cnnlite's and rte's
 * consent dialogs) or a custom element (google's <g-dropdown-menu>) was
 * "new element is not a plain block": the full rebuild. Both are built
 * alone now, as a block holding images or controls (patch 364), the page
 * laid out whole: the legend sits on the fieldset's border, the custom
 * elements take the boxes the page's CSS gives them. Steps: a block
 * holding a fieldset (legend, label, checkbox) inserted; a block holding a
 * <x-menu> (display: block) of <x-item>s (inline) inserted; a paragraph's
 * text. Row for row as CSS-block-oc2-ref.html, the same steps run while
 * the page parses. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.dlg { margin: 4px 10px; background: #f4f4f4; }
fieldset { border: 2px solid #446; margin: 4px; padding: 4px 8px; }
x-menu { display: block; border: 1px solid #090; padding: 2px; }
x-item { color: #036; padding: 0 6px; }
</style>
</head>
<body>
<p id="p1">First paragraph.</p>
<p id="p2">Second paragraph.</p>
<p id="p3">Third paragraph, its text changes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function dlg() {
		var d = document.createElement('div');
		d.className = 'dlg';
		d.innerHTML = '<fieldset><legend>Your choices</legend><label><input type="checkbox" checked> Accept the defaults</label></fieldset>';
		return d;
	}
	function menu() {
		var d = document.createElement('div');
		d.className = 'dlg';
		d.innerHTML = '<x-menu><x-item>One</x-item><x-item>Two</x-item><x-item>Three</x-item></x-menu>';
		return d;
	}
	var ops = [
		function () { document.body.insertBefore(dlg(), $('p2')); },
		function () { document.body.insertBefore(menu(), $('p3')); },
		function () { $('p3').textContent = 'Third paragraph, its text changed.'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 400); } })(); });
})();
</script>
</body>
</html>
