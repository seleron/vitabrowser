<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS block sibling insert (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#wrap p.a + p { color: rgb(255, 0, 0); }
#wrap div.b ~ p.z { color: rgb(0, 0, 255); }
</style>
</head>
<body>
<!-- Patch 198 (queue item 2: what remained of the patch-166 stale-styles
     issue after 192 + 197): inserting or removing a block can change a
     FOLLOWING sibling's style through a sibling combinator (+ / ~), and the
     local block path never reselects following siblings, so those styles
     would go stale. The engine now checks each inserted/removed element
     against the page's sibling rules and declines to the full reconversion
     only when the element can actually move a sibling's match (patch 189's
     blanket decline stayed shelved for over-declining).
     1: insert p.a before the target p: the target turns red (+) -- only the
        full reconversion restyles it; on the local path it would stay stale.
     2: remove p.a: the target loses the red again.
     3: insert div.b before the target: a later p.z turns blue (~).
     4: remove div.b: the p.z loses the blue again. -->
<p id="sum" class="wait">SIBINS: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<div id="wrap">
<p id="t0">lead paragraph</p>
<p id="tgt">target paragraph</p>
<p id="tz" class="z">later tail paragraph</p>
</div>
<script>
(function () {
	var N = 4, res = [];
	function $(id) { return document.getElementById(id); }
	function c(id) { return String(getComputedStyle($(id)).color).replace(/\s+/g, ''); }
	var RED = 'rgb(255,0,0)', BLUE = 'rgb(0,0,255)';
	var wrap = $('wrap'), tgt = $('tgt'), tz = $('tz');
	var ins_a = document.createElement('p'); ins_a.className = 'a'; ins_a.textContent = 'inserted a';
	var ins_b = document.createElement('div'); ins_b.className = 'b'; ins_b.textContent = 'inserted b';
	var steps = [
		[function () { wrap.insertBefore(ins_a, tgt); },
			function () { return c('tgt') === RED; }, 'insert a: next sibling turns red (+)'],
		[function () { wrap.removeChild(ins_a); },
			function () { return c('tgt') !== RED; }, 'remove a: red gone again'],
		[function () { wrap.insertBefore(ins_b, tgt); },
			function () { return c('tz') === BLUE; }, 'insert b: later .z turns blue (~)'],
		[function () { wrap.removeChild(ins_b); },
			function () { return c('tz') !== BLUE; }, 'remove b: blue gone again']
	];
	function show() {
		var k = 0;
		for (var n = 0; n < N; n++) {
			var p = $('r' + (n + 1)), r = res[n];
			p.textContent = (n + 1) + ' ' + steps[n][2] + (r ? '' : ' FAIL');
			if (r) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'SIBINS: ' + k + '/' + N + ' passed';
		document.title = 'JS block sibling insert (' + k + '/' + N + ')';
	}
	function run(i) {
		if (i >= steps.length) { show(); return; }
		steps[i][0]();
		setTimeout(function () {
			res[i] = steps[i][1]();
			setTimeout(function () { run(i + 1); }, 100);
		}, 600);
	}
	window.addEventListener('load', function () { setTimeout(function () { run(0); }, 300); });
})();
</script>
</body></html>
