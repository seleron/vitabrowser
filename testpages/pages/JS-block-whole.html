<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS block whole</title>
<style>
/* Patch 434. A change inside a block box that is not one line of plain
 * content -- a display:block <button> (guardian), an <li> with its marker
 * (python), a block holding a float, a <code> of several lines (wpblog) --
 * was "block is not one line container of plain content": the full
 * rebuild. The block is built again whole now, as below a flex box (422),
 * the page laid out whole. Steps (each flushed alone by a layout read):
 * the button's label, the second item's text (the list stays numbered), the
 * floated block's text. Row for row as CSS-block-whole-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.bb { display: block; margin: 4px 10px; padding: 4px 10px; }
.fl { float: left; width: 60px; height: 30px; background: #cde; margin-right: 6px; }
</style>
</head>
<body>
<button id="btn" class="bb"><span>Sign</span> in</button>
<ol><li>First item.</li><li id="li2">Second item.</li><li>Third item.</li></ol>
<div id="fb"><div class="fl"></div>Text beside a float, which changes.</div>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('btn').lastChild.textContent = ' in to your account'; },
		function () { $('li2').textContent = 'Second item, its text changed.'; },
		function () { $('fb').lastChild.textContent = 'Text beside a float, which changed.'; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { for (k = 0; k < ops.length; k++) { ops[k](); void document.body.offsetHeight; } }, 300); });
})();
</script>
</body>
</html>
