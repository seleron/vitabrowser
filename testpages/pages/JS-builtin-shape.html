<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS built-in shape (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">BSHAPE: 0/8 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<script>
/* patch 275: built-ins are shaped as built-ins: operations and accessors
 * have no prototype property and are not constructors, accessors are named
 * "get x", WebIDL attributes are configurable and enumerable, and
 * Function.prototype has none of QuickJS's fileName / lineNumber /
 * columnNumber; every interface prototype carries its own @@toStringTag
 * (document.body said [object EventTarget]). Chromium-verified. */
(function () {
	var k = 0, N = 8;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'BSHAPE: ' + k + '/' + N + ' passed';
		document.title = 'JS built-in shape (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var own = Object.prototype.hasOwnProperty;
	var OPS = [[HTMLCanvasElement.prototype, 'toDataURL'], [Element.prototype, 'closest'],
		[Document.prototype, 'querySelector'], [Node.prototype, 'appendChild'],
		[URLSearchParams.prototype, 'get'], [Response.prototype, 'json'], [window, 'fetch'],
		[window, 'getComputedStyle'], [window, 'matchMedia'], [Event.prototype, 'preventDefault']];
	/* where an object finds the accessor: Node.prototype in Chromium */
	function holder(o, k) { while (o && !own.call(o, k)) o = Object.getPrototypeOf(o); return o; }
	var tn = document.createTextNode('x');
	var ATTRS = [[holder(document.body, 'textContent'), 'textContent'], [Response.prototype, 'status'],
		[TextDecoder.prototype, 'encoding'], [ReadableStream.prototype, 'locked'], [holder(tn, 'nodeValue'), 'nodeValue']];
	function getter(a) { var d = a[0] && Object.getOwnPropertyDescriptor(a[0], a[1]); return d && d.get; }
	check(1, function () {
		var bad = OPS.filter(function (o) { var f = o[0][o[1]]; return typeof f !== 'function' || own.call(f, 'prototype'); }).map(function (o) { return o[1]; });
		return bad.length === 0 || 'have a prototype: ' + bad.join(' ');
	}, 'operations have no prototype property');
	check(2, function () {
		var bad = OPS.filter(function (o) { try { new o[0][o[1]](); return true; } catch (e) { return !(e instanceof TypeError); } }).map(function (o) { return o[1]; });
		return bad.length === 0 || 'constructible: ' + bad.join(' ');
	}, 'operations are not constructors');
	check(3, function () {
		var bad = ATTRS.filter(function (a) { var g = getter(a); return !g || g.name !== 'get ' + a[1] || own.call(g, 'prototype'); })
			.map(function (a) { var g = getter(a); return a[1] + '=' + (g ? JSON.stringify(g.name) : 'none'); });
		return bad.length === 0 || bad.join(' ');
	}, 'accessors are named get x and have no prototype');
	check(4, function () {
		var bad = [[Response.prototype, 'status'], [TextDecoder.prototype, 'encoding'], [ReadableStream.prototype, 'locked']].filter(function (a) {
			var d = Object.getOwnPropertyDescriptor(a[0], a[1]); return !d || !d.configurable || !d.enumerable; }).map(function (a) { return a[1]; });
		return bad.length === 0 || 'not configurable+enumerable: ' + bad.join(' ');
	}, 'WebIDL attributes are configurable and enumerable');
	check(5, function () {
		var k = ['fileName', 'lineNumber', 'columnNumber'].filter(function (n) { return n in Function.prototype; });
		return k.length === 0 || k.join(' ');
	}, 'Function.prototype has no fileName / lineNumber / columnNumber');
	check(6, function () {
		var c = document.createElement('canvas'); c.width = c.height = 2;
		var ok = new URLSearchParams('a=1&b=2').get('b') === '2' && document.querySelector('body') === document.body &&
			/^data:image\/png/.test(c.toDataURL()) && /^rgb/.test(getComputedStyle(document.body).color) &&
			document.body.closest('html') === document.documentElement && document.body.firstChild.textContent !== undefined;
		return ok || 'a method stopped working';
	}, 'the methods still work');
	check(7, function () {
		function mine() { return 1; }
		return (own.call(mine, 'prototype') && /return 1/.test(String(mine))) || String(mine);
	}, 'a page\'s own function keeps its prototype and source');
	check(8, function () {
		var ts = Object.prototype.toString, got = [document, document.body, document.createElement('a'), document.createTextNode('')]
			.map(function (o) { return ts.call(o); }).join(' ');
		return got === '[object HTMLDocument] [object HTMLBodyElement] [object HTMLAnchorElement] [object Text]' || got;
	}, 'nodes name their interface (String(document.body))');
})();
</script>
</body>
</html>
