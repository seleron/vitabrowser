<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS built-ins (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">BUILTIN: 0/8 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<script>
/* patch 269: the browser's own functions are built-ins. toString gives
 * "function name() { [native code] }" (it gave the bridge's and the
 * polyfill's source), each is named for its property (matchMedia was
 * anonymous, getComputedStyle "vgcs") with WebIDL's length, operations
 * are enumerable and interface objects not, interface prototypes carry
 * their @@toStringTag, window.close / focus / blur exist; a page's own
 * functions keep their source. Chromium-verified. */
(function () {
	var k = 0, N = 8;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'BUILTIN: ' + k + '/' + N + ' passed';
		document.title = 'JS built-ins (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	function later(n, p, text) {
		Promise.resolve().then(p).then(function (r) { t(n, r === true, text + (r === true ? '' : ': ' + r)); },
			function (e) { t(n, false, text + ': ' + e); });
	}
	var NAT = /^function (\w+)\(\) \{\s*\[native code\]\s*\}$/;
	check(1, function () {
		var bad = ['fetch', 'matchMedia', 'getComputedStyle', 'structuredClone', 'requestAnimationFrame',
			'postMessage', 'scrollTo', 'atob', 'queueMicrotask', 'getSelection'].filter(function (k) {
			var m = NAT.exec(Function.prototype.toString.call(window[k])); return !m || m[1] !== k; });
		return bad.length === 0 || 'not native: ' + bad.join(' ');
	}, 'window functions are [native code], named for themselves');
	check(2, function () {
		var bad = ['Event', 'CustomEvent', 'Request', 'Headers', 'URL', 'MutationObserver', 'XMLHttpRequest', 'Blob']
			.filter(function (k) { var m = NAT.exec(Function.prototype.toString.call(window[k])); return !m || m[1] !== k; });
		return bad.length === 0 || 'not native: ' + bad.join(' ');
	}, 'interface objects are [native code]');
	check(3, function () {
		var want = { setTimeout: 1, clearTimeout: 0, fetch: 1, getComputedStyle: 1, postMessage: 1, alert: 0,
			scrollTo: 0, matchMedia: 1, structuredClone: 1, addEventListener: 2, Event: 1, Request: 1, URL: 1 };
		var bad = Object.keys(want).filter(function (k) { return window[k].length !== want[k]; })
			.map(function (k) { return k + '=' + window[k].length; });
		return bad.length === 0 || bad.join(' ');
	}, 'WebIDL lengths');
	check(4, function () {
		var d1 = Object.getOwnPropertyDescriptor(window, 'getComputedStyle'), d2 = Object.getOwnPropertyDescriptor(window, 'Event');
		var d3 = Object.getOwnPropertyDescriptor(window, 'atob');
		return (d1 && d1.enumerable && d1.writable && !d2.enumerable && d2.writable && d3.enumerable) ||
			'getComputedStyle ' + JSON.stringify(d1 && [d1.enumerable, d1.writable]) + ' Event ' + d2.enumerable + ' atob ' + d3.enumerable;
	}, 'operations enumerable, interfaces not');
	check(5, function () {
		var ts = Object.prototype.toString;
		var r = [ts.call(new Request('/x')), ts.call(new Headers()), ts.call(new URLSearchParams('a=1'))];
		return r.join() === '[object Request],[object Headers],[object URLSearchParams]' || r.join();
	}, 'interface prototypes carry @@toStringTag');
	check(6, function () {
		return ['close', 'focus', 'blur'].every(function (k) { return typeof window[k] === 'function' && window[k].length === 0; }) &&
			window.scroll !== window.scrollTo || 'close ' + typeof window.close + ' focus ' + typeof window.focus;
	}, 'close / focus / blur; scroll and scrollTo are two');
	check(7, function () {
		function pageFn(a) { return a + 41; }
		var s = String(pageFn), arrow = String(function (x) { return x * 2; });
		return (s.indexOf('return a + 41') > 0 && arrow.indexOf('x * 2') > 0) || s;
	}, "a page's functions keep their source");
	check(8, function () {
		var leaks = Object.keys(window).filter(function (k) { return k.charAt(0) === '_'; });
		return leaks.length === 0 || 'enumerable: ' + leaks.slice(0, 6).join(' ');
	}, 'no _-prefixed globals enumerate');
})();
</script>
</body>
</html>
