<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS canvas 2D (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 14px; margin: 8px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 18px; font-weight: bold; }
p { margin: 1px 0; }
canvas { vertical-align: top; }
</style>
</head>
<body>
<div id="sum">CANVAS251: 0/22 passed</div>
<canvas id="show" width="240" height="80" style="border: 1px solid #888"></canvas>
<img id="pic" src="lazyimg-01.png" alt="" style="display: none">
<div id="rows"></div>
<script>
/* patch 251: the canvas 2D context drew nothing (every method was a
 * no-op) and getImageData / toDataURL answered zeros. Every check reads
 * the pixels back; tolerances cover anti-aliasing and rounding only.
 * Chromium-verified (22/22, served over http). Runs at window load, so the
 * <img> it draws has loaded; nothing waits on a timer. */
var N = 22, k = 0, rows = document.getElementById('rows');
for (var i = 1; i <= N; i++) {
	var p = document.createElement('p');
	p.id = 'r' + i; p.className = 'wait';
	p.textContent = i + ' waiting (the script never ran)';
	rows.appendChild(p);
}
function t(n, ok, text) {
	var p = document.getElementById('r' + n);
	p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
	if (!ok) return;
	p.className = 'pass';
	k++;
	document.getElementById('sum').textContent = 'CANVAS251: ' + k + '/' + N + ' passed';
	document.title = 'JS canvas 2D (' + k + '/' + N + ')';
}
function mk(w, h) {
	var c = document.createElement('canvas');
	c.width = w; c.height = h;
	return c.getContext('2d');
}
function px(ctx, x, y) { return Array.prototype.slice.call(ctx.getImageData(x, y, 1, 1).data); }
function near(a, b, tol) {
	for (var i = 0; i < 4; i++) if (Math.abs(a[i] - b[i]) > tol) return false;
	return true;
}
function s(a) { return '[' + a.join(',') + ']'; }
function run(n, name, fn) {
	try { var r = fn(); t(n, r[0], name + ': ' + r[1]); }
	catch (e) { t(n, false, name + ': threw ' + e); }
}
function checks() {
	run(1, 'fillRect paints its pixels, and only those', function () {
		var c = mk(20, 20);
		c.fillStyle = '#ff0000'; c.fillRect(5, 5, 10, 10);
		var a = px(c, 10, 10), b = px(c, 2, 2), e = px(c, 15, 10);
		return [s(a) === '[255,0,0,255]' && s(b) === '[0,0,0,0]' && s(e) === '[0,0,0,0]', s(a) + s(b) + s(e)];
	});
	run(2, 'an arc fills a disc with an anti-aliased edge', function () {
		var c = mk(40, 40);
		c.fillStyle = 'rgb(0, 128, 255)'; c.beginPath(); c.arc(20, 20, 15, 0, Math.PI * 2); c.fill();
		var mid = px(c, 20, 20), corner = px(c, 6, 6), edge = 0, x;
		for (x = 0; x < 40; x++) { var a = px(c, x, 20)[3]; if (a > 0 && a < 255) edge++; }
		return [s(mid) === '[0,128,255,255]' && corner[3] === 0 && edge >= 1 && edge <= 4,
			s(mid) + ' corner ' + corner[3] + ', ' + edge + ' partial edge pixels'];
	});
	run(3, 'even-odd leaves the hole, nonzero fills it', function () {
		var c = mk(40, 20);
		function ring(x) { c.rect(x, 0, 20, 20); c.rect(x + 5, 5, 10, 10); }
		c.fillStyle = '#000'; c.beginPath(); ring(0); c.fill('evenodd');
		c.beginPath(); ring(20); c.fill();
		return [px(c, 10, 10)[3] === 0 && px(c, 2, 10)[3] === 255 && px(c, 30, 10)[3] === 255,
			'evenodd hole ' + px(c, 10, 10)[3] + ', nonzero ' + px(c, 30, 10)[3]];
	});
	run(4, 'a stroke has its width and square caps', function () {
		var c = mk(100, 20);
		c.strokeStyle = '#00ff00'; c.lineWidth = 4; c.lineCap = 'square';
		c.beginPath(); c.moveTo(10, 10); c.lineTo(80, 10); c.stroke();
		var on = px(c, 50, 9), off = px(c, 50, 13), cap = px(c, 81, 10), past = px(c, 83, 10);
		return [s(on) === '[0,255,0,255]' && off[3] === 0 && cap[3] === 255 && past[3] === 0,
			s(on) + ' off ' + off[3] + ' cap ' + cap[3] + ' past ' + past[3]];
	});
	run(5, 'a miter join fills the corner, a bevel cuts it', function () {
		var c = mk(60, 30);
		c.lineWidth = 8; c.strokeStyle = '#000';
		c.lineJoin = 'miter'; c.beginPath(); c.moveTo(5, 25); c.lineTo(20, 10); c.lineTo(35, 25); c.stroke();
		var miter = px(c, 20, 5)[3];
		c.clearRect(0, 0, 60, 30);
		c.lineJoin = 'bevel'; c.beginPath(); c.moveTo(5, 25); c.lineTo(20, 10); c.lineTo(35, 25); c.stroke();
		var bevel = px(c, 20, 5)[3];
		return [miter > 200 && bevel === 0, 'tip alpha miter ' + miter + ', bevel ' + bevel];
	});
	run(6, 'translate, scale and rotate move what is drawn', function () {
		var c = mk(40, 40);
		c.translate(10, 10); c.scale(2, 2); c.fillStyle = '#000'; c.fillRect(0, 0, 5, 5);
		var a = px(c, 15, 15)[3], b = px(c, 21, 21)[3];
		c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 40, 40);
		c.translate(20, 20); c.rotate(Math.PI / 2); c.fillRect(0, 0, 10, 2);
		var r = px(c, 19, 25)[3], nr = px(c, 25, 21)[3];
		return [a === 255 && b === 0 && r === 255 && nr === 0, 'scaled ' + a + '/' + b + ', rotated ' + r + '/' + nr];
	});
	run(7, 'globalAlpha blends half over white', function () {
		var c = mk(10, 10);
		c.fillStyle = '#fff'; c.fillRect(0, 0, 10, 10);
		c.globalAlpha = 0.5; c.fillStyle = '#000'; c.fillRect(0, 0, 10, 10);
		var a = px(c, 5, 5);
		return [near(a, [128, 128, 128, 255], 1), s(a)];
	});
	run(8, 'a linear gradient runs from its first stop to its last', function () {
		var c = mk(100, 4), gr = c.createLinearGradient(0, 0, 100, 0);
		gr.addColorStop(0, '#ff0000'); gr.addColorStop(1, '#0000ff');
		c.fillStyle = gr; c.fillRect(0, 0, 100, 4);
		var l = px(c, 0, 1), m = px(c, 50, 1), r = px(c, 99, 1);
		return [near(l, [253, 0, 2, 255], 3) && near(m, [127, 0, 128, 255], 3) && near(r, [2, 0, 253, 255], 3),
			s(l) + s(m) + s(r)];
	});
	run(9, 'a radial gradient is centred', function () {
		var c = mk(40, 40), gr = c.createRadialGradient(20, 20, 0, 20, 20, 20);
		gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#000');
		c.fillStyle = gr; c.fillRect(0, 0, 40, 40);
		var mid = px(c, 20, 20), out = px(c, 20, 39);
		return [mid[0] > 240 && out[0] < 15 && mid[3] === 255, s(mid) + s(out)];
	});
	run(10, 'clip limits drawing; restore lifts it', function () {
		var c = mk(40, 20);
		c.save(); c.beginPath(); c.rect(0, 0, 20, 20); c.clip();
		c.fillStyle = '#000'; c.fillRect(0, 0, 40, 20);
		var inside = px(c, 10, 10)[3], outside = px(c, 30, 10)[3];
		c.restore(); c.fillRect(30, 0, 10, 20);
		return [inside === 255 && outside === 0 && px(c, 35, 10)[3] === 255,
			'inside ' + inside + ', outside ' + outside + ', after restore ' + px(c, 35, 10)[3]];
	});
	run(11, 'putImageData and getImageData round-trip exactly', function () {
		var c = mk(4, 4), id = c.createImageData(2, 2), i;
		for (i = 0; i < 16; i++) id.data[i] = [10, 20, 30, 255][i % 4] + (i >> 2);
		c.putImageData(id, 1, 1);
		var back = c.getImageData(1, 1, 2, 2), same = true;
		for (i = 0; i < 16; i++) if (back.data[i] !== id.data[i]) same = false;
		return [same && back.width === 2 && px(c, 0, 0)[3] === 0, 'width ' + back.width + ', same ' + same];
	});
	run(12, 'drawImage copies another canvas, scaled', function () {
		var src = mk(2, 1), c = mk(8, 4);
		src.fillStyle = '#f00'; src.fillRect(0, 0, 1, 1); src.fillStyle = '#00f'; src.fillRect(1, 0, 1, 1);
		c.imageSmoothingEnabled = false;
		c.drawImage(src.canvas, 0, 0, 8, 4);
		var l = px(c, 1, 2), r = px(c, 6, 2);
		return [s(l) === '[255,0,0,255]' && s(r) === '[0,0,255,255]', s(l) + s(r)];
	});
	run(13, 'drawImage draws a loaded <img>', function () {
		var img = document.getElementById('pic'), c = mk(120, 80);
		c.drawImage(img, 0, 0);
		var a = px(c, 60, 40), b = px(c, 5, 5);
		return [a[3] === 255 && b[3] === 255 && near(a, [255, 255, 0, 255], 4) && near(b, [0, 0, 0, 255], 4),
			s(a) + s(b) + ' (' + img.naturalWidth + 'x' + img.naturalHeight + ')'];
	});
	run(14, 'fillText inks the text box and nothing outside it', function () {
		var c = mk(100, 40);
		c.font = '20px sans-serif'; c.fillStyle = '#000'; c.fillText('Hello', 5, 25);
		var w = c.measureText('Hello').width, d = c.getImageData(0, 0, 100, 40).data, ink = 0, stray = 0, x, y;
		for (y = 0; y < 40; y++) for (x = 0; x < 100; x++) {
			if (d[(y * 100 + x) * 4 + 3] === 0) continue;
			if (x >= 4 && x <= 6 + w && y >= 5 && y <= 31) ink++; else stray++;
		}
		return [ink > 40 && stray === 0 && w > 30 && w < 70, 'width ' + w + ', ' + ink + ' inked, ' + stray + ' stray'];
	});
	run(15, 'measureText: wider text measures wider; font parses', function () {
		var c = mk(10, 10);
		c.font = 'bold 12pt serif';
		var f = c.font;
		c.font = 'not a font';
		var a = c.measureText('iiii').width, b = c.measureText('WWWW').width;
		return [b > a && a > 0 && c.font === f && /16px/.test(f), 'iiii ' + a + ', WWWW ' + b + ', font ' + f];
	});
	run(16, 'clearRect and destination-out erase', function () {
		var c = mk(20, 10);
		c.fillStyle = '#000'; c.fillRect(0, 0, 20, 10);
		c.clearRect(0, 0, 5, 10);
		c.globalCompositeOperation = 'destination-out'; c.fillRect(10, 0, 5, 10);
		return [px(c, 2, 5)[3] === 0 && px(c, 12, 5)[3] === 0 && px(c, 7, 5)[3] === 255 && c.globalCompositeOperation === 'destination-out',
			'cleared ' + px(c, 2, 5)[3] + ', out ' + px(c, 12, 5)[3] + ', kept ' + px(c, 7, 5)[3]];
	});
	run(17, 'Path2D from SVG path data fills, and isPointInPath sees it', function () {
		var c = mk(40, 40), p = new Path2D('M10 10 h20 v20 h-20 Z');
		c.fillStyle = '#000'; c.fill(p);
		return [px(c, 20, 20)[3] === 255 && px(c, 35, 35)[3] === 0 && c.isPointInPath(p, 15, 15) && !c.isPointInPath(p, 35, 35),
			'inside ' + px(c, 20, 20)[3] + ', outside ' + px(c, 35, 35)[3]];
	});
	run(18, 'setting width clears the canvas and its state', function () {
		var c = mk(10, 10);
		c.fillStyle = '#f00'; c.fillRect(0, 0, 10, 10); c.translate(5, 5);
		c.canvas.width = 10;
		var t2 = c.getTransform();
		return [px(c, 5, 5)[3] === 0 && c.fillStyle === '#000000' && t2.e === 0,
			'alpha ' + px(c, 5, 5)[3] + ', fillStyle ' + c.fillStyle + ', e ' + t2.e];
	});
	run(19, 'setLineDash leaves gaps', function () {
		var c = mk(40, 4);
		c.setLineDash([5, 5]); c.lineWidth = 2; c.strokeStyle = '#000';
		c.beginPath(); c.moveTo(0, 2); c.lineTo(40, 2); c.stroke();
		return [px(c, 2, 2)[3] === 255 && px(c, 7, 2)[3] === 0 && px(c, 12, 2)[3] === 255 && c.getLineDash().join() === '5,5',
			'dash ' + px(c, 2, 2)[3] + ' gap ' + px(c, 7, 2)[3] + ' dash ' + px(c, 12, 2)[3]];
	});
	run(20, 'toDataURL is a PNG of what was drawn', function () {
		var c = mk(8, 8), blank = c.canvas.toDataURL();
		c.fillStyle = '#123456'; c.fillRect(0, 0, 8, 8);
		var u = c.canvas.toDataURL();
		return [/^data:image\/png;base64,iVBORw0KGgo/.test(u) && u !== blank && atob(u.slice(22)).length > 50,
			u.length + ' chars, differs from blank ' + (u !== blank)];
	});
	run(21, 'colours serialize as browsers do', function () {
		var c = mk(1, 1);
		c.fillStyle = 'rgba(255, 0, 0, 0.5)'; var a = c.fillStyle;
		c.fillStyle = 'hsl(120, 100%, 50%)'; var b = c.fillStyle;
		c.fillStyle = 'nonsense'; var e = c.fillStyle;
		c.strokeStyle = 'RebeccaPurple'; var f = c.strokeStyle;
		return [a === 'rgba(255, 0, 0, 0.5)' && b === '#00ff00' && e === '#00ff00' && f === '#663399',
			a + ' ' + b + ' ' + e + ' ' + f];
	});
	run(22, 'the canvas on the page shows its drawing', function () {
		var c = document.getElementById('show').getContext('2d');
		c.fillStyle = '#ffcc00'; c.fillRect(0, 0, 240, 80);
		c.fillStyle = '#0055aa'; c.beginPath(); c.arc(40, 40, 30, 0, Math.PI * 2); c.fill();
		c.strokeStyle = '#aa0000'; c.lineWidth = 6; c.beginPath(); c.moveTo(90, 70); c.lineTo(130, 10); c.lineTo(170, 70); c.stroke();
		c.fillStyle = '#000'; c.font = 'bold 18px sans-serif'; c.fillText('canvas', 175, 45);
		var a = px(c, 40, 40), b = px(c, 230, 5);
		return [s(a) === '[0,85,170,255]' && s(b) === '[255,204,0,255]' && c instanceof CanvasRenderingContext2D,
			s(a) + s(b)];
	});
}
window.addEventListener('load', checks);
</script>
</body>
</html>
