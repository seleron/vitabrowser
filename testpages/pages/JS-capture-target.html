<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS capture listener at target (script not run)</title>
<!-- A capture listener registered on the event's own target must fire
     exactly once, in the at-target phase, alongside the target's bubble
     listeners -- not once per libdom registration. The bridge registers
     one libdom entry per (node, type, capture) and fires the node's whole
     JS list from the callback, so with both a capture and a non-capture
     registration on the target the list ran twice (run 38 hand-off).
     1: capture only on the target, bubbling event: fires once, phase 2.
     2: bubble only on the target: fires once, phase 2.
     3: capture + bubble (different functions): each once, phase 2.
     4: the same function under both flags: fires twice (two
        registrations), not four times.
     5: two capture listeners on the target: each once.
     6: capture only, non-bubbling event: fires once.
     7: el.onclick on the target: fires once. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">CAPTGT: script did not run</p>
<div id="t">target</div>
<p id="r1" class="wait">1 capture only: waiting</p>
<p id="r2" class="wait">2 bubble only: waiting</p>
<p id="r3" class="wait">3 capture+bubble: waiting</p>
<p id="r4" class="wait">4 same fn both flags: waiting</p>
<p id="r5" class="wait">5 two captures: waiting</p>
<p id="r6" class="wait">6 capture non-bubbling: waiting</p>
<p id="r7" class="wait">7 onclick: waiting</p>
<script>
(function () {
	var N = 7, done = {};
	function pass(n, ok, text) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + text;
		if (!ok) return;
		done[n] = true;
		p.className = 'pass';
		var k = 0, i;
		for (i = 1; i <= N; i++) if (done[i]) k++;
		document.getElementById('sum').textContent =
			'CAPTGT: ' + k + '/' + N + ' passed';
		document.title = 'JS capture at target (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'CAPTGT: 0/' + N + ' passed';
	var t = document.getElementById('t');
	function join(a) { return '[' + a.join(' ') + ']'; }

	/* 1: capture only on the target. */
	var a = [];
	t.addEventListener('ct-a', function (e) {
		a.push('cap' + e.eventPhase);
	}, true);
	t.dispatchEvent(new Event('ct-a', { bubbles: true }));
	pass(1, join(a) === '[cap2]',
		'capture only: ' + join(a) + ' (want [cap2])');

	/* 2: bubble only on the target. */
	var b = [];
	t.addEventListener('ct-b', function (e) {
		b.push('bub' + e.eventPhase);
	});
	t.dispatchEvent(new Event('ct-b', { bubbles: true }));
	pass(2, join(b) === '[bub2]',
		'bubble only: ' + join(b) + ' (want [bub2])');

	/* 3: capture + bubble, different functions. */
	var c = [];
	t.addEventListener('ct-c', function (e) {
		c.push('cap' + e.eventPhase);
	}, true);
	t.addEventListener('ct-c', function (e) {
		c.push('bub' + e.eventPhase);
	});
	t.dispatchEvent(new Event('ct-c', { bubbles: true }));
	pass(3, join(c) === '[cap2 bub2]',
		'capture+bubble: ' + join(c) + ' (want [cap2 bub2])');

	/* 4: same function under both flags: two registrations. */
	var d = [];
	function dfn(e) { d.push('f' + e.eventPhase); }
	t.addEventListener('ct-d', dfn, true);
	t.addEventListener('ct-d', dfn);
	t.dispatchEvent(new Event('ct-d', { bubbles: true }));
	pass(4, join(d) === '[f2 f2]',
		'same fn both flags: ' + join(d) + ' (want [f2 f2])');

	/* 5: two capture listeners. */
	var e5 = [];
	t.addEventListener('ct-e', function (e) {
		e5.push('c1/' + e.eventPhase);
	}, true);
	t.addEventListener('ct-e', function (e) {
		e5.push('c2/' + e.eventPhase);
	}, true);
	t.dispatchEvent(new Event('ct-e', { bubbles: true }));
	pass(5, join(e5) === '[c1/2 c2/2]',
		'two captures: ' + join(e5) + ' (want [c1/2 c2/2])');

	/* 6: capture only, non-bubbling event. */
	var f = [];
	t.addEventListener('ct-f', function (e) {
		f.push('cap' + e.eventPhase);
	}, true);
	t.dispatchEvent(new Event('ct-f'));
	pass(6, join(f) === '[cap2]',
		'capture non-bubbling: ' + join(f) + ' (want [cap2])');

	/* 7: onclick property handler. */
	var g = 0;
	t.onclick = function () { g++; };
	t.dispatchEvent(new Event('click', { bubbles: true }));
	pass(7, g === 1, 'onclick count: ' + g + ' (want 1)');
})();
</script>
</body>
</html>
