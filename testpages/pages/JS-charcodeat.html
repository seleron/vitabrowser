<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS charCodeAt (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">CHARCODE: 0/8 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<script>
/* patch 493: "str".charCodeAt(i) is read in place by the interpreter when
 * the receiver is a string, the index an int and charCodeAt the built-in
 * one (styled-components' djb2 hash: 17% of bbc.com's JS). Every other case
 * takes the normal call. These are the answers either way. Chromium-
 * verified. */
(function () {
	var k = 0, N = 8;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CHARCODE: ' + k + '/' + N + ' passed';
		document.title = 'JS charCodeAt (' + k + '/' + N + ')';
	}
	var s = 'abc';
	t(1, s.charCodeAt(0) === 97 && s.charCodeAt(2) === 99, 'in range: ' + s.charCodeAt(0) + ',' + s.charCodeAt(2));
	t(2, isNaN(s.charCodeAt(3)) && isNaN(s.charCodeAt(-1)), 'out of range and negative are NaN');
	t(3, s.charCodeAt(1.7) === 98 && s.charCodeAt() === 97 && s.charCodeAt('2') === 99,
		'a non-int, missing or string index converts: ' + s.charCodeAt(1.7) + ',' + s.charCodeAt() + ',' + s.charCodeAt('2'));
	var u = String.fromCharCode(0xd83d, 0xde00);
	t(4, u.charCodeAt(0) === 0xd83d && u.charCodeAt(1) === 0xde00, 'surrogate halves: ' + u.charCodeAt(0).toString(16));
	var r = ''; for (var i = 0; i < 200; i++) r += String.fromCharCode(65 + i % 26);
	var sum = 0; for (i = 0; i < r.length; i++) sum += r.charCodeAt(i);
	t(5, sum === 15428, 'a string built by += (a rope): ' + sum);
	var o = new String('xyz');
	t(6, o.charCodeAt(1) === 121, 'a String object receiver: ' + o.charCodeAt(1));
	var ec = function (e, x) { for (var j = x.length; j;) e = 33 * e ^ x.charCodeAt(--j); return e; };
	var txt = '.sc-a{color:red}.sc-b{margin:0 auto}'.repeat(20);
	var ref = 5381; for (i = txt.length; i;) { --i; ref = 33 * ref ^ txt.codePointAt(i); }
	t(7, ec(5381, txt) === ref, 'the djb2 loop matches a reference: ' + ec(5381, txt));
	var orig = String.prototype.charCodeAt;
	String.prototype.charCodeAt = function () { return -7; };
	var replaced = 'q'.charCodeAt(0);
	String.prototype.charCodeAt = orig;
	t(8, replaced === -7 && 'q'.charCodeAt(0) === 113, 'a replaced charCodeAt is called: ' + replaced);
})();
</script>
</body>
</html>
