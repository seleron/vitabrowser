<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS character data (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<!-- Patch 179 (libdom + vita_polyfill.js). Setting .data on a text node
     with no parent -- the node a microtask shim toggles (core-js, Vue 2's
     nextTick: a detached text node under a MutationObserver) -- crashed
     the browser: libdom dispatched DOMSubtreeModified at the NULL parent
     (rte.ie crashed 4 s in). And CharacterData's editing methods were
     missing. Each expected string is what Chromium gives.
     1: a detached text node's data set, twice: no crash, data kept.
     2: the same node under a MutationObserver (characterData): the
        records arrive.
     3: appendData / insertData / deleteData / replaceData / substringData.
     4: an offset past the end throws IndexSizeError.
     5: the same edits on a text node in the page show there. -->
<p id="sum" class="wait">CHARDATA: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="live">abc</p>
<script>
var N = 5, res = [];
function t(n, ok, txt) { res[n] = [ok, txt]; }
function show() {
	var k = 0;
	for (var n = 1; n <= N; n++) {
		var p = document.getElementById('r' + n), r = res[n] || [false, 'not reached'];
		p.textContent = n + ' ' + r[1] + (r[0] ? '' : ' FAIL');
		if (r[0]) { p.className = 'pass'; k++; }
	}
	document.getElementById('sum').textContent = 'CHARDATA: ' + k + '/' + N + ' passed';
	document.title = 'JS character data (' + k + '/' + N + ')';
}
function run(n, f) { try { f(); } catch (e) { t(n, false, 'threw ' + e); } }
run(1, function () {
	var x = document.createTextNode('0');
	x.data = '1'; x.data = '2';
	t(1, x.data === '2', 'detached data set: ' + x.data);
});
var recs = 0, node = document.createTextNode('a');
if (typeof MutationObserver === 'function')
	new MutationObserver(function (l) { recs += l.length; }).observe(node, { characterData: true });
run(2, function () { node.data = 'b'; node.data = 'c'; });
run(3, function () {
	var x = document.createTextNode('hello');
	x.appendData(' world'); x.insertData(0, '> '); x.deleteData(2, 1); x.replaceData(0, 2, '<<');
	var sub = x.substringData(2, 4);
	t(3, x.data === '<<ello world' && sub === 'ello', 'edits: "' + x.data + '", substring "' + sub + '"');
});
run(4, function () {
	var x = document.createTextNode('ab'), name = 'none';
	try { x.insertData(5, 'z'); } catch (e) { name = e.name; }
	t(4, name === 'IndexSizeError', 'offset past the end: ' + name);
});
run(5, function () {
	var x = document.getElementById('live').firstChild;
	x.appendData('d'); x.replaceData(0, 1, 'A');
	t(5, document.getElementById('live').textContent === 'Abcd', 'in the page: ' + document.getElementById('live').textContent);
});
setTimeout(function () {
	t(2, recs === 2 && node.data === 'c', 'observed detached node: ' + recs + ' records, data ' + node.data);
	show();
}, 50);
</script>
</body></html>
