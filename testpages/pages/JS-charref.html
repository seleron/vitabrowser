<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS character references (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
#refs { display: none; }
</style>
</head>
<body>
<div id="sum">CHARREF: 0/6 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="t" hidden>a&#13;b&#x0D;&#10;c</p>
<p id="u" hidden title="x&#13;y&#x0D;z">u</p>
<textarea id="ta" hidden>1&#13;2</textarea>
<div id="refs"><span>&#1;</span><span>&#11;</span><span>&#x7F;</span><span>&#x1F;</span><span>&#x81;</span><span>&#x9D;</span><span>&#xFDD0;</span><span>&#xFFFE;</span><span>&#x10FFFF;</span><span>&#0;</span><span>&#xD800;</span><span>&#x110000;</span><span>&#x80;</span><span>&#x9F;</span><span>&#9;</span><span>&#10;</span></div>
<script>
/* patch 290: numeric character references decoded as HTML has them now
 * (and Chromium): &#13; is CR (it was LF: a value written
 * "a&#13;&#10;b" held two line breaks); controls and noncharacters are
 * the code points they name (they were U+FFFD), U+10FFFF is one; only
 * NUL, a surrogate or a number beyond U+10FFFF is U+FFFD; 0x80-0x9F are
 * windows-1252's characters where it has one. Chromium-verified. */
(function () {
	var k = 0, N = 6, d = document;
	function $(id) { return d.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CHARREF: ' + k + '/' + N + ' passed';
		d.title = 'JS character references (' + k + '/' + N + ')';
	}
	function codes(s) { return [].map.call(s, function (c) { return c.charCodeAt(0).toString(16); }).join(' '); }
	function check(n, got, want, text) { t(n, got === want, text + ': ' + got + (got === want ? '' : ' (want ' + want + ')')); }
	var r = [].map.call(d.querySelectorAll('#refs span'), function (s) { return codes(s.textContent); });
	check(1, codes($('t').textContent), '61 d 62 d a 63', '&#13; in text is CR');
	check(2, codes($('u').getAttribute('title')), '78 d 79 d 7a', '&#13; in an attribute is CR');
	check(3, codes($('ta').textContent) + ' / ' + codes($('ta').value), '31 d 32 / 31 a 32', 'a textarea keeps CR in its text, its value has LF');
	check(4, r.slice(0, 6).join(','), '1,b,7f,1f,81,9d', 'controls are what they name');
	check(5, r.slice(6, 9).join(','), 'fdd0,fffe,dbff dfff', 'noncharacters and U+10FFFF are what they name');
	check(6, r.slice(9).join(','), 'fffd,fffd,fffd,20ac,178,9,a', 'NUL, a surrogate, beyond U+10FFFF: U+FFFD; 0x80-0x9F windows-1252');
})();
</script>
</body>
</html>
