<!DOCTYPE html>
<!--
 * Patch 385: class churn past fixes1135's cap is deferred, not dropped.
 * Four class changes 600 ms apart, as a carousel's timer makes them:
 * the span's class is answered locally; the paragraph's three are
 * full rebuilds (a sibling rule watches it), and the third of those is
 * past the cap (2 in a row). Before 385 it was dropped: the second
 * paragraph stayed black though #a ends .on. Now it waits for its
 * window (6.4 s after the last full rebuild) and the page converges.
 * The reference runs the same four changes at parse time.
-->
<html><head><meta charset="utf-8"><title>JS class churn</title><style>
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.on + p { color: #c00; }
.hot { background: #ff0; font-weight: bold; }
</style></head><body>
<p id="a">A paragraph whose class a sibling rule watches.</p>
<p>Red while the paragraph before it is .on (it ends .on).</p>
<p>Some text with a <span id="b">span</span> whose class changes first.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('b').className = 'hot'; },
		function () { $('a').className = 'on'; },
		function () { $('a').className = ''; },
		function () { $('a').className = 'on'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script></body></html>
