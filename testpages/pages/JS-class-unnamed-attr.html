<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS class unnamed attr</title>
<style>
/* Patch 414, the negative. A sheet with an attribute selector on class
 * ([class*="zz-"]) may match any class token: no class change on this
 * page is answered as a no-op -- the div turns red. Row for row as
 * CSS-class-unnamed-attr-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div { margin: 4px 10px; }
[class*="zz-"] { color: #c00; }
</style>
</head>
<body>
<div class="b" id="d3">A div that gains zz-red (red through [class*=]).</div>
<div class="b">The last div.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('d3').className = 'b zz-red'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
