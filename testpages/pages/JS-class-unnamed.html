<!DOCTYPE html>
<html class="start">
<head>
<meta charset="utf-8">
<title>JS class unnamed</title>
<style>
/* Patch 414. A class change whose added and removed names no selector
 * names restyles nothing: on <html> (no parent box -- cnnlite, archwiki,
 * wikipedia, jquery, wpnews took a full rebuild for consent and feature
 * classes), on <body> and on a div. The named ones still restyle: .dark
 * on <html>, .md\3a hide (a hex escape: "md:hide") on a div (a sheet with
 * [class...] is JS-class-unnamed-attr.html). Row for row as
 * CSS-class-unnamed-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div { margin: 4px 10px; }
html.dark body { background: #ddd; }
.md\3a hide { display: none; }
.start .b { padding: 2px; }
</style>
</head>
<body class="pg">
<div class="b" id="d1">A div whose class gains unnamed tokens.</div>
<div class="b" id="d2">A div that gains md:hide (it disappears).</div>
<div class="b">The last div.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var R = document.documentElement;
	var ops = [
		function () { R.className = 'start consent-ie js-ready'; },
		function () { document.body.className = 'pg is-loaded'; },
		function () { $('d1').className = 'b fade-in visible-1'; },
		function () { R.className = 'start js-ready'; },
		function () { R.className = 'start js-ready dark'; },
		function () { $('d2').className = 'b md:hide'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
