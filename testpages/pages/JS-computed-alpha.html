<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS computed alpha (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#half { color: rgb(0 128 0 / 50%); }
#hex { color: #0808; }
#opaque { color: rgb(0, 128, 0); }
#tenth { background-color: rgba(255, 0, 0, 0.1); }
</style>
<script>
/* Patch 212: getComputedStyle keeps a colour's alpha. Every colour was
 * "rgb(r, g, b)", so a transparent background read as black and scripts
 * testing for "rgba(0, 0, 0, 0)" never saw transparency.
 * Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function cs(id) { return getComputedStyle($(id)); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'ALPHA212: ' + k + '/' + N + ' passed';
		document.title = 'JS computed alpha (' + k + '/' + N + ')';
	}
	function run() {
		var bg = cs('plain').backgroundColor;
		t(1, bg === 'rgba(0, 0, 0, 0)', 'transparent background: ' + bg);
		var h = cs('half').color;
		t(2, h === 'rgba(0, 128, 0, 0.5)', '50% alpha: ' + h);
		var x = cs('hex').color, te = cs('tenth').backgroundColor;
		t(3, x === 'rgba(0, 136, 0, 0.533)' && te === 'rgba(255, 0, 0, 0.1)',
			'#0808 and 0.1: ' + x + ', ' + te);
		var o = cs('opaque').color;
		t(4, o === 'rgb(0, 128, 0)', 'opaque stays rgb(): ' + o);
	}
	window.addEventListener('load', function () { setTimeout(run, 300); });
})();
</script>
</head>
<body>
<div id="sum">ALPHA212: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<div id="plain">plain</div>
<div id="half">half</div>
<div id="hex">hex</div>
<div id="opaque">opaque</div>
<div id="tenth">tenth</div>
</body>
</html>
