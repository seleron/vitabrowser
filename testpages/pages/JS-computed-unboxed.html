<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS computed style without a box (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
.gone { display: none; color: rgb(255, 0, 0); }
#app, #app2 { display: none; }
#inner { display: block; }
</style>
<script>
/* patch 235: getComputedStyle for an element with no box -- display:none
 * itself, or under a display:none ancestor -- answers from the cascade.
 * It answered nothing (display ""), so jQuery's .show(), which writes an
 * inline display only when the computed one is "none", left
 * stylesheet-hidden containers hidden: make.wordpress.org's o2 app shows
 * #content that way, and its ten posts never got a box. Chromium-verified. */
(function () {
	var k = 0, N = 7;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'UNBOXED: ' + k + '/' + N + ' passed';
		document.title = 'JS computed style without a box (' + k + '/' + N + ')';
	}
	function d(el) { return getComputedStyle(el).display; }
	function run() {
		t(1, d($('g')) === 'none', 'hidden by a class rule: "' + d($('g')) + '"');
		t(2, d($('h')) === 'none', 'hidden attribute: "' + d($('h')) + '"');
		t(3, d($('inner')) === 'block' && d($('sp')) === 'inline',
			'under a hidden parent: "' + d($('inner')) + '" / "' + d($('sp')) + '"');
		t(4, getComputedStyle($('g')).color === 'rgb(255, 0, 0)' &&
			getComputedStyle($('g')).getPropertyValue('display') === 'none',
			'other properties: ' + getComputedStyle($('g')).color);
		/* jQuery's show(): clear the inline value, and if the cascade
		 * still hides it, write the element's default display */
		var app = $('app');
		app.style.display = '';
		if (d(app) === 'none') app.style.display = 'block';
		t(5, app.style.display === 'block', 'show() writes display:block: "' +
			app.style.display + '"');
		/* o2's order: empty the hidden container, show it, then append
		 * the rendered views */
		var app2 = $('app2');
		app2.innerHTML = '';
		app2.style.display = '';
		if (d(app2) === 'none') app2.style.display = 'block';
		var hd = document.createElement('header');
		hd.textContent = 'header view';
		app2.appendChild(hd);
		var ps = document.createElement('div');
		ps.innerHTML = '<article id="art">a rendered post</article>';
		app2.appendChild(ps);
		setTimeout(function () {
			t(6, app.offsetHeight > 0 && $('post').offsetHeight > 0,
				'and the shown app is laid out: ' + app.offsetHeight + ' / ' +
				$('post').offsetHeight);
			t(7, d(app2) === 'block' && $('art').offsetHeight > 0,
				'emptied, shown, refilled: "' + d(app2) + '", post ' +
				$('art').offsetHeight);
		}, 300);
	}
	/* at load, not 100 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">UNBOXED: 0/7 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<div id="g" class="gone">gone</div>
<div id="h" hidden>hidden</div>
<div class="gone"><div id="inner">inner</div><span id="sp">span</span></div>
<div id="app"><div id="post">a post, shown by script</div></div>
<div id="app2"><p>server-rendered posts, replaced by script</p></div>
</body>
</html>
