<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS content whole</title>
<style>
/* Patch 425. A block given content that is more than plain inline -- an
 * image (bbc), child blocks, custom elements (oldreddit) -- declined the
 * line rebuild ("new content is not plain inline elements") into the full
 * rebuild. Now it is built again whole (376's path): its objects carried,
 * the page laid out whole. Row for row as CSS-content-whole-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.box { background: #eef; }
x-widget { display: block; background: #efe; }
</style>
</head>
<body>
<div class="box" id="a">Plain text, to be given an image.</div>
<div class="box" id="b">Plain text, to be given child blocks.</div>
<div class="box" id="c">Plain text, to be given a custom element.</div>
<div>The last block.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('a').innerHTML = 'Text with an image <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFklEQVR4nGOQmxZFEmIY1TCqYfhqAABPQw4Q8Yaj3wAAAABJRU5ErkJggg==" width="16" height="16" alt=""> in it.'; },
		function () { $('b').innerHTML = '<div>A child block.</div><p>A paragraph.</p>'; },
		function () { $('c').innerHTML = '<x-widget>A custom element.</x-widget>'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
