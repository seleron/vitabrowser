<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS control js</title>
<style>
/* Patch 424. A script's .checked / .value after the page is laid out
 * reached the DOM only: the control kept painting its old state (the
 * attribute marks are render declines, nothing rebuilt). Now the control
 * takes its state from the element at the mark: a checkbox checked, a
 * radio of a pair switched, a text field given a value -- row for row as
 * CSS-control-js-ref.html, where the same script runs at parse time. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 6px 10px; }
</style>
</head>
<body>
<form action="#">
<p><input type="checkbox" id="cb"> A checkbox, checked by script.</p>
<p><input type="radio" name="r" id="r1" checked> One <input type="radio" name="r" id="r2"> Two (chosen by script)</p>
<p><input type="text" id="tx" size="20" value="initial"></p>
</form>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function set() {
		$('cb').checked = true;
		$('r2').checked = true;
		$('tx').value = 'set by script';
	}
	window.addEventListener('load', function () { setTimeout(set, 600); });
})();
</script>
</body>
</html>
