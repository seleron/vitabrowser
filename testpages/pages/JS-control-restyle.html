<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS control restyle</title>
<style>
/* Patch 423. A container restyled whole (372/376) declined when it held a
 * stateful control -- typed text, a checked box -- or was a control
 * itself. Their state is in the DOM and the build reads it back: a form's
 * text input, checkbox and textarea keep their values through their flex
 * container's restyle; so do the same controls outside any form (made
 * new, the old ones freed with their boxes); a flex submit button
 * restyles itself. Row for row as CSS-control-restyle-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
.row { display: flex; gap: 6px; margin: 4px 10px; padding: 2px; background: #eef; }
.row.on { background: #efe; padding: 6px; }
button.b { display: flex; margin: 4px 10px; }
button.b.on { padding: 6px; background: #ffd; }
</style>
</head>
<body>
<form action="#"><div class="row" id="r1"><input id="t1" type="text" size="10"><input id="c1" type="checkbox"><textarea id="a1" rows="1" cols="10"></textarea></div></form>
<div class="row" id="r2"><input id="t2" type="text" size="10"><input id="c2" type="checkbox"></div>
<button class="b" id="bt" type="submit">A flex button</button>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		/* the values first, in a step of their own (a value change on
		 * an input is its own mark: it may take the one full rebuild) */
		function () {
			$('t1').value = 'typed one'; $('c1').checked = true; $('a1').value = 'area text';
			$('t2').value = 'typed two'; $('c2').checked = true;
		},
		function () { $('r1').className = 'row on'; },
		function () { $('r2').className = 'row on'; },
		function () { $('bt').className = 'b on'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
