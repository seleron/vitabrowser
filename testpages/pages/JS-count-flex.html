<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS count flex</title>
<style>
/* Patch 471. A flex box whose subtree counts (counter-reset on it,
 * counter-increment on its items) declined any restyle ("the restyled
 * flex or grid box takes part in counting", wikipedia and archwiki 3.0 a
 * load): a rebuild alone restarts its counters from zero. Now it is
 * rebuilt alone when every counter it uses enters it at 0 (its items
 * show n, which its own counter-reset starts) and its counting (resets
 * and increments, in order) comes out the same -- the counter shown
 * after it keeps its value. Step one only recolours the box
 * (counting unchanged: local); step two doubles the increments (counting
 * changed: the full rebuild, and the counter after it reads 6). Row for
 * row as CSS-count-flex-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
#list { display: flex; margin: 4px 10px; counter-reset: n; }
#list .it { counter-increment: n; padding: 2px 8px; margin-right: 6px; background: #eef; }
#list .it::before { content: counter(n) ". "; color: #c00; }
#list.hot { background: #ffc; }
#list.more .it { counter-increment: n 2; }
#after::after { content: " (counter: " counter(n) ")"; }
</style>
</head>
<body>
<div id="list"><span class="it">one</span><span class="it">two</span><span class="it">three</span></div>
<p id="after">After the list</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('list').className = 'hot'; },
		function () { $('list').className = 'hot more'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
