<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS counters local</title>
<style>
/* Patch 374. Box construction numbers counters in one flat table per
 * build pass, so 369, 372 and 373 declined their local builds on any page
 * whose CSS mentions counters (rte, wpblog, github), and the line path
 * never checked at all. A local build now declines only when the rebuilt
 * subtree takes part in counting: an element in it reset, incremented or
 * showed a counter when the tree was built, or
 * the new build does. After its steps (600 ms apart, so each full
 * rebuild runs alone and every step gets its own local attempt) JS-counters-local.html
 * must render row for row as CSS-counters-local-ref.html, the same steps
 * run while the page parses. Local: a plain paragraph's text; a flex
 * track's style; a ::before block's text; content in an empty div; a
 * table cell's class. Full: a flex holding an item that increments the
 * counter (first, alone in its batch); a numbered heading's text; a paragraph whose
 * span shows a counter; a paragraph holding a span that increments it.
 * (A display:none element
 * counts nothing in this engine.) */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; counter-reset: sec; }
p, div, h2 { margin: 4px 10px; }
h2 { font-size: 15px; }
h2::before { counter-increment: sec; content: counter(sec) ". "; }
.n::before { content: "[" counter(sec) "] "; color: #c00; }
.cnt { counter-increment: sec; font-style: italic; }
.track { display: flex; }
.track div { border: 1px solid #000; padding: 2px 4px; }
#g1::before { content: "> "; color: #080; }
td { border: 1px solid #000; padding: 2px; }
.hot { background: #ff0; }
</style>
</head>
<body>
<h2 id="h1">First section</h2>
<p id="p1">A plain paragraph.</p>
<div id="trk" class="track"><div>one</div><div>two</div><div>three</div></div>
<p id="g1">A paragraph with generated content, no counter.</p>
<div id="e1"></div>
<table><tr><td id="c1">cell</td><td>other</td></tr></table>
<h2 id="h2">Second section</h2>
<p id="p2">A paragraph whose <span class="n">span</span> shows the counter.</p>
<p id="p3">A paragraph with a <span class="cnt">counting</span> span.</p>
<div id="fx" class="track"><div>flex</div><span class="cnt">counting item</span></div>
<h2 id="h3">Third section</h2>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('p1').textContent = 'A plain paragraph whose text a script changed.'; },
		function () { $('trk').setAttribute('style', 'width:400px'); },
		function () { $('g1').textContent = 'Generated content, its text changed.'; },
		function () { $('e1').innerHTML = 'Content that <b>arrived</b>.'; },
		function () { $('c1').className = 'hot'; },
		function () { $('fx').style.justifyContent = 'flex-end'; },
		function () { $('h2').textContent = 'Second section, renamed'; },
		function () { $('p2').firstChild.data = 'Changed: a paragraph whose '; },
		function () { $('p3').firstChild.data = 'Changed: a paragraph with a '; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
