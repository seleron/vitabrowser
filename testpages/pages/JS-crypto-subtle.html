<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS crypto subtle (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
<script>
/* Patch 215: crypto.subtle digest (SHA-1/256/384/512) and HMAC
 * importKey/sign/verify, as OAuth PKCE sign-in and hashing libraries use
 * it. It was absent. Known-answer vectors (FIPS 180, RFC 4231);
 * Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function hex(b) {
		var u = new Uint8Array(b), s = '', i;
		for (i = 0; i < u.length; i++) s += (u[i] < 16 ? '0' : '') + u[i].toString(16);
		return s;
	}
	function utf8(s) { return new TextEncoder().encode(s); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SUBTLE215: ' + k + '/' + N + ' passed';
		document.title = 'JS crypto subtle (' + k + '/' + N + ')';
	}
	async function run() {
		var S = window.crypto && crypto.subtle;
		t(1, !!S && typeof S.digest === 'function', 'crypto.subtle present');
		if (!S) return;
		var h = hex(await S.digest('SHA-256', utf8('abc')));
		t(2, h === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad',
			'SHA-256("abc") ' + h.slice(0, 16));
		var h1 = hex(await S.digest({ name: 'SHA-1' }, utf8('abc')));
		var h5 = hex(await S.digest('SHA-512', utf8('abc')));
		t(3, h1 === 'a9993e364706816aba3e25717850c26c9cd0d89d' &&
			h5.slice(0, 16) === 'ddaf35a193617aba',
			'SHA-1 and SHA-512 of "abc"');
		var key = await S.importKey('raw', utf8('Jefe'), { name: 'HMAC', hash: 'SHA-256' },
			false, ['sign', 'verify']);
		var mac = await S.sign('HMAC', key, utf8('what do ya want for nothing?'));
		var ok = await S.verify('HMAC', key, mac, utf8('what do ya want for nothing?'));
		t(4, hex(mac) === '5bdcc146bf60754e6a042426089575c75a003f089d2739839dec58b964ec3843' && ok,
			'HMAC-SHA-256 (RFC 4231 case 2), verify ' + ok);
		/* PKCE: base64url(SHA-256(verifier)) */
		var v = 'dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk';
		var d = new Uint8Array(await S.digest('SHA-256', utf8(v)));
		var b = btoa(String.fromCharCode.apply(null, d)).replace(/\+/g, '-')
			.replace(/\//g, '_').replace(/=+$/, '');
		t(5, b === 'E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM',
			'PKCE challenge (RFC 7636 appendix B): ' + b.slice(0, 12));
	}
	window.addEventListener('load', function () {
		setTimeout(function () {
			run().catch(function (e) { $('sum').textContent = 'SUBTLE215 error: ' + e; });
		}, 200);
	});
})();
</script>
</head>
<body>
<div id="sum">SUBTLE215: 0/5 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
</body>
</html>
