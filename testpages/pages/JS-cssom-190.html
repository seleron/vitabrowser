<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CSSOM190</title>
<style>.base{color:black}</style>
</head><body>
<p id="r9" class="wait">9 waiting</p><p id="r10" class="wait">10 waiting</p>
<script>
/* Patch 190 gate cases: CSSOM lost-update race and read-only cssRules.
 * Separate page to avoid interfering with the layout-sensitive checks
 * in JS-cssom.html (the simulator's CSS engine is fragile when new
 * <style> elements are added to the document). */
var N = 2, res = {}, ok = 0;
function t(n, cond, why) {
	res[n] = !!cond;
	if (cond) ok++;
	var el = document.getElementById('r' + n);
	el.className = cond ? 'pass' : 'fail';
	el.textContent = n + (cond ? ' pass' : ' FAIL') + (why ? ' ' + why : '');
}
function show() {
	document.title = 'CSSOM190: ' + ok + '/' + N + ' passed';
	var h = [];
	for (var i = 9; i <= 10; i++) h.push(i + ':' + (res[i] ? 'pass' : 'FAIL'));
	var d = document.createElement('div');
	d.textContent = 'CSSOM190: ' + ok + '/' + N + ' passed (' + h.join(', ') + ')';
	document.body.appendChild(d);
}
/* Check 9: lost-update race. insertRule() schedules a microtask write-back;
 * a direct textContent set in the same task must survive it. */
var st9 = document.createElement('style');
st9.textContent = '.a9{color:red}';
document.getElementsByTagName('head')[0].appendChild(st9);
var st9sheet = st9.sheet;
st9sheet.insertRule('.b9{color:blue}', 0);
st9.textContent = '.c9{color:green}';
/* Check 10: cssRules must be read-only. push() must throw (strict) or be
 * ignored (sloppy), never corrupt the sheet. */
var st10 = document.createElement('style');
st10.textContent = '.a10{color:red}';
document.getElementsByTagName('head')[0].appendChild(st10);
var rules10 = st10.sheet.cssRules, threw10 = false;
try { rules10.push({ fake: true }); } catch (e) { threw10 = true; }
try { rules10.length = 0; } catch (e) { threw10 = true; }
var ok10 = st10.sheet.cssRules.length === 1 &&
	st10.sheet.cssRules[0].selectorText === '.a10';
t(10, ok10, 'length ' + st10.sheet.cssRules.length + ', threw ' + threw10);
setTimeout(function () {
	/* Microtask has run; the direct edit must have survived. */
	var st9ok = st9.textContent === '.c9{color:green}';
	t(9, st9ok, 'textContent "' + st9.textContent + '"');
	show();
}, 100);
</script>
</body></html>
