<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS CSSOM (styleSheets, cssRules, insertRule)</title>
<style id="s1">
.a { color: red; }
@media screen { .b { color: blue } }
@keyframes k { from { opacity: 0 } to { opacity: 1 } }
@font-face { font-family: x; src: url(x.woff) }
.c ,  .d > e { margin: 0 /* } */; content: "}" }
</style>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.t { display: block; }
#t6 { background-color: rgb(255, 0, 0); }
</style>
<style id="dyn"></style>
</head>
<body>
<!-- Patch 168 (vita_polyfill.js, CSSOM): document.styleSheets gave fresh
     objects whose cssRules were always [] and whose insertRule did
     nothing. Google installs each module's CSS in a <style> and checks the
     sheet's last rule is its "sentinel" rule (error "oc", reported for
     every module on hardware run 27); CSS-in-JS libraries that add rules
     with insertRule got no styling.
     1: styleSheets holds one stable sheet per <style>/<link>, the same
        object as el.sheet, an instance of CSSStyleSheet.
     2: cssRules parses the sheet's text: style, @media, @keyframes,
        @font-face rules, selectors, declarations (comments, strings).
     3: Google's _F_installCss check: a <style> appended with CSS ending
        in `sentinel{}` is found by ownerNode, last rule CSSStyleRule
        with selectorText "sentinel".
     4: insertRule into an empty <style> styles an element (width 123px).
     5: deleteRule takes that rule out of the rendering again.
     6: rule.style.setProperty on an existing rule restyles (green).
     7: CSS-in-JS: rules appended one at a time to a new <style> all apply.
     8: errors: IndexSizeError for a bad index, SyntaxError for junk. -->
<p id="sum" class="wait">CSSOM: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p><p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p><p id="r8" class="wait">8 waiting</p>


<div class="t" id="t4">t4</div>
<div class="t" id="t6">t6</div>
<div class="t" id="t7">t7</div>
<script>
var N = 8, res = [];
function t(n, ok, x) { res[n] = [ok, x]; }
function show() {
	var k = 0;
	for (var n = 1; n <= N; n++) {
		var p = document.getElementById('r' + n), r = res[n] || [false, 'not reached'];
		p.textContent = n + ' ' + r[1] + (r[0] ? '' : ' FAIL');
		if (r[0]) { p.className = 'pass'; k++; }
	}
	document.getElementById('sum').textContent = 'CSSOM: ' + k + '/' + N + ' passed';
}
function run(n, f) { try { f(); } catch (e) { t(n, false, 'threw ' + e); } }
var s1 = document.getElementById('s1'), dyn = document.getElementById('dyn');
run(1, function () {
	var ss = document.styleSheets, i, at = -1;
	for (i = 0; i < ss.length; i++) if (ss[i].ownerNode === s1) at = i;
	var ok = ss.length === 3 && at === 0 && ss[0] === s1.sheet &&
		document.styleSheets[0] === ss[0] && s1.sheet instanceof CSSStyleSheet &&
		dyn.sheet.cssRules.length === 0;
	t(1, ok, 'sheets ' + ss.length + ', s1 at ' + at + ', stable ' + (document.styleSheets[0] === s1.sheet));
});
run(2, function () {
	var r = s1.sheet.cssRules, types = [];
	for (var i = 0; i < r.length; i++) types.push(r[i].type);
	var ok = types.join() === '1,4,7,5,1' && r[0].selectorText === '.a' &&
		r[0].style.getPropertyValue('color') === 'red' && r[0] instanceof CSSStyleRule &&
		r[1] instanceof CSSMediaRule && r[1].media.mediaText === 'screen' &&
		r[1].cssRules[0].selectorText === '.b' && r[2].name === 'k' &&
		r[2].cssRules.length === 2 && r[2].cssRules[1].keyText === '100%' &&
		r[3].style.getPropertyValue('font-family') === 'x' &&
		r[4].selectorText === '.c, .d > e' && r[4].style.getPropertyValue('content') === '"}"' &&
		r.item(0) === r[0];
	t(2, ok, 'types ' + types.join() + ', sel4 "' + (r[4] && r[4].selectorText) + '"');
});
run(3, function () {
	var b = document.styleSheets.length, st = document.createElement('style');
	document.getElementsByTagName('head')[0].appendChild(st);
	st.appendChild(document.createTextNode('.gx{color:#123}.gy{margin:0}sentinel{}'));
	var grew = document.styleSheets.length > b, sh = null, ss = document.styleSheets;
	for (var i = 0; i < ss.length; i++) if (ss[i].ownerNode === st) sh = ss[i];
	var r = sh && sh.cssRules, last = r && r[r.length - 1];
	t(3, grew && r && r.length === 3 && last instanceof CSSStyleRule && last.selectorText === 'sentinel',
		'grew ' + grew + ', rules ' + (r && r.length) + ', last "' + (last && last.selectorText) + '"');
});
var i4 = -1;
run(4, function () { i4 = dyn.sheet.insertRule('#t4 { width: 123px }', 0); });
run(6, function () {
	var r = s1.nextElementSibling.sheet.cssRules, rule = null;
	for (var i = 0; i < r.length; i++) if (r[i].selectorText === '#t6') rule = r[i];
	rule.style.setProperty('background-color', 'rgb(0, 128, 0)');
});
var st7 = document.createElement('style');
document.getElementsByTagName('head')[0].appendChild(st7);
run(7, function () {
	var sh = st7.sheet;
	['#t7 { width: 77px }', '#t7 { height: 33px }', '#t7 { color: rgb(0, 0, 255) }'].forEach(function (x) {
		sh.insertRule(x, sh.cssRules.length);
	});
});
run(8, function () {
	var e1 = '', e2 = '', e3 = '';
	try { dyn.sheet.insertRule('.z{}', 99); } catch (e) { e1 = e.name; }
	try { dyn.sheet.insertRule('garbage'); } catch (e) { e2 = e.name; }
	try { dyn.sheet.deleteRule(99); } catch (e) { e3 = e.name; }
	t(8, e1 === 'IndexSizeError' && e2 === 'SyntaxError' && e3 === 'IndexSizeError', e1 + ' ' + e2 + ' ' + e3);
});
setTimeout(function () {
	var t4 = document.getElementById('t4');
	var w4 = t4.offsetWidth;
	t(4, i4 === 0 && w4 === 123 && dyn.sheet.cssRules.length === 1, 'insertRule -> ' + i4 + ', width ' + w4);
	var bg = getComputedStyle(document.getElementById('t6')).backgroundColor;
	t(6, /rgb\(0, *128, *0\)/.test(bg), 'background ' + bg);
	var t7 = document.getElementById('t7'), c7 = getComputedStyle(t7).color;
	t(7, t7.offsetWidth === 77 && t7.offsetHeight === 33 && /rgb\(0, *0, *255\)/.test(c7),
		'size ' + t7.offsetWidth + 'x' + t7.offsetHeight + ', color ' + c7);
	run(5, function () { dyn.sheet.deleteRule(0); });
	setTimeout(function () {
		var w = t4.offsetWidth;
		if (!res[5]) t(5, w !== 123 && w > 123 && dyn.sheet.cssRules.length === 0, 'width after deleteRule ' + w);
		show();
	}, 250);
}, 250);
</script>
</body></html>
