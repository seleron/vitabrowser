<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS custom elements (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">CUSTOMEL: 0/7 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<x-ctor id="parsed">parsed before define</x-ctor>
<div id="host"></div>
<script>
/* patch 240: custom element constructors run -- for createElement(), for
 * `new`, and when parsed elements are upgraded -- and connectedCallback
 * runs when an element is connected. The polyfill only swapped the
 * prototype, so a constructor's own state was missing: github.com's
 * Turbo does Object.getPrototypeOf(createElement("turbo-frame").delegate)
 * and its behaviors bundle died. Also document.firstElementChild /
 * lastElementChild / childElementCount / children (undefined; the same
 * bundle read document.firstElementChild.classList). Chromium-verified. */
(function () {
	var k = 0, N = 7, log = [];
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'CUSTOMEL: ' + k + '/' + N + ' passed';
		document.title = 'JS custom elements (' + k + '/' + N + ')';
	}
	var d = document, de = d.documentElement;
	t(1, d.firstElementChild === de && d.lastElementChild === de &&
		d.childElementCount === 1 && d.children.length === 1 &&
		d.children[0] === de, 'document.firstElementChild: ' +
		(d.firstElementChild && d.firstElementChild.tagName));
	class XCtor extends HTMLElement {
		constructor() {
			super();
			this.delegate = { owner: this };
			log.push('ctor');
		}
		connectedCallback() { log.push('connected:' + this.id); }
	}
	customElements.define('x-ctor', XCtor);
	var p = $('parsed');
	t(2, p instanceof XCtor && p.delegate && p.delegate.owner === p &&
		log.indexOf('connected:parsed') >= 0,
		'a parsed element is upgraded: ' + log.join(','));
	var c = d.createElement('x-ctor');
	t(3, c instanceof XCtor && c.delegate && c.delegate.owner === c &&
		Object.getPrototypeOf(c.delegate) === Object.prototype &&
		c.localName === 'x-ctor', 'createElement runs the constructor');
	var n = new XCtor();
	t(4, n.localName === 'x-ctor' && n.delegate && n instanceof HTMLElement,
		'new runs it too: ' + n.localName);
	var before = log.length;
	c.id = 'made';
	$('host').appendChild(c);
	setTimeout(function () {
		t(5, log.slice(before).indexOf('connected:made') >= 0 &&
			log.filter(function (x) { return x === 'connected:made'; }).length === 1,
			'connectedCallback once on insertion: ' + log.slice(before).join(','));
		$('host').innerHTML = '<x-ctor id="ih"></x-ctor>';
		setTimeout(function () {
			var ih = $('ih');
			t(6, ih instanceof XCtor && ih.delegate && ih.delegate.owner === ih,
				'innerHTML-made element is constructed');
			t(7, customElements.get('x-ctor') === XCtor &&
				customElements.getName(XCtor) === 'x-ctor',
				'registry get/getName');
		}, 50);
	}, 50);
})();
</script>
</body>
</html>
