<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS descriptors (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">DESCRIPTORS: 0/7 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<script>
/* patch 280: descriptors as WebIDL and ECMAScript define them -- what
 * hCaptcha's collector reads: enumerable, named operations; window's
 * attributes as accessors; Intl tags; document.location; iframe / img
 * interfaces; CSSStyleDeclaration and Storage. Chromium-verified. */
(function () {
	var k = 0, N = 7;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'DESCRIPTORS: ' + k + '/' + N + ' passed';
		document.title = 'JS descriptors (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var ts = Object.prototype.toString, G = Object.getOwnPropertyDescriptor;
	check(1, function () {
		var a = G(HTMLCanvasElement.prototype, 'getContext'), b = G(Node.prototype, 'appendChild'), c = G(CanvasRenderingContext2D.prototype, 'measureText');
		return (a && a.enumerable && b && b.enumerable && b.value.name === 'appendChild' && c && c.enumerable) ||
			'getContext ' + (a && a.enumerable) + ', appendChild ' + (b && b.value.name) + ', measureText ' + (c && c.enumerable);
	}, 'WebIDL operations are enumerable and named');
	check(2, function () {
		var n = G(window, 'navigator'), s = G(window, 'screen'), c = G(window, 'console');
		return (n && n.get && n.get.name === 'get navigator' && !n.set && s && s.get && s.set && c && !c.enumerable) ||
			'navigator ' + (n && ('value' in n ? 'data' : n.get.name)) + ', screen set ' + !!(s && s.set) + ', console enumerable ' + (c && c.enumerable);
	}, 'window\'s attributes are accessors; console does not enumerate');
	check(3, function () {
		var d = G(Intl.DateTimeFormat.prototype, 'resolvedOptions');
		return (ts.call(new Intl.DateTimeFormat()) === '[object Intl.DateTimeFormat]' && d && !d.enumerable && d.value.name === 'resolvedOptions') ||
			ts.call(new Intl.DateTimeFormat()) + ' ' + (d && d.value.name);
	}, 'Intl objects and their methods');
	check(4, function () { var d = G(document, 'location'); return (d && d.enumerable && !!d.get) || 'not enumerable'; },
		'document.location enumerates');
	check(5, function () {
		var f = document.createElement('iframe'), i = document.createElement('img'), dv = document.createElement('div');
		return (G(HTMLIFrameElement.prototype, 'contentWindow') && !('contentWindow' in dv) &&
			ts.call(f) === '[object HTMLIFrameElement]' && ts.call(i) === '[object HTMLImageElement]' && f instanceof HTMLIFrameElement) ||
			ts.call(f) + ' ' + ts.call(i) + ' div has contentWindow ' + ('contentWindow' in dv);
	}, 'iframe and img are their interfaces; contentWindow is HTMLIFrameElement\'s');
	check(6, function () {
		var got = [ts.call(getComputedStyle(document.body)), ts.call(document.body.style), ts.call(localStorage)].join(' ');
		return got === '[object CSSStyleDeclaration] [object CSSStyleDeclaration] [object Storage]' || got;
	}, 'styles are CSSStyleDeclarations, localStorage a Storage');
	check(7, function () {
		var f = document.createElement('iframe'); document.body.appendChild(f);
		localStorage.setItem('vbdesc', '1'); var ls = localStorage.getItem('vbdesc'); localStorage.removeItem('vbdesc');
		return (/^rgb/.test(getComputedStyle(document.body).color) && ls === '1' && typeof f.contentWindow === 'object' &&
			self === window && innerWidth > 0 && typeof new Intl.NumberFormat('en-US').format(1) === 'string') || 'something stopped working';
	}, 'and all of it still works');
})();
</script>
</body>
</html>
