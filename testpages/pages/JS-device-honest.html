<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS device surface (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">DEVICE: 0/6 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<script>
/* patches 271-272: what navigator and screen report about the device.
 * The screen is the Vita's 960x544 (it said 1024x768), pixelDepth 24,
 * orientation landscape-primary (lock() is NotSupportedError); no plugins (empty
 * PluginArray / MimeTypeArray, as pdfViewerEnabled is false); the
 * Permissions API answers with PermissionStatus objects and rejects an
 * unknown name; clipboard writes reject when nothing is copied;
 * getBattery() gives one BatteryManager. Chromium-verified (Chromium at a
 * 960x544 viewport reports the same screen; its permission states and
 * battery values are its own, so those are checked by type). */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'DEVICE: ' + k + '/' + N + ' passed';
		document.title = 'JS device surface (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	function later(n, p, text) {
		Promise.resolve().then(p).then(function (r) { t(n, r === true, text + (r === true ? '' : ': ' + r)); },
			function (e) { t(n, false, text + ': ' + e); });
	}
	check(1, function () {
		return (screen.width === 960 && screen.height === 544 && screen.availWidth === 960 && screen.availHeight === 544 &&
			screen.colorDepth === 24 && screen.pixelDepth === 24) ||
			[screen.width, screen.height, screen.availWidth, screen.availHeight, screen.colorDepth, screen.pixelDepth].join();
	}, 'screen: 960x544, 24-bit');
	later(2, function () {
		var o = screen.orientation;
		if (!(o instanceof ScreenOrientation) || o.type !== 'landscape-primary' || o.angle !== 0) return 'orientation ' + (o && o.type);
		/* this browser cannot turn the screen: NotSupportedError; headless
		 * desktop Chromium lets the lock succeed, Chrome on a phone rejects
		 * it outside fullscreen -- so: it settles */
		return o.lock('portrait').then(function () { return true; }, function (e) { return e instanceof DOMException || e.name; });
	}, 'screen.orientation: landscape-primary, angle 0, lock() settles');
	check(3, function () {
		var p = navigator.plugins, m = navigator.mimeTypes;
		return (p instanceof PluginArray && p.length === 0 && p.item(0) === null && p.namedItem('x') === null &&
			m instanceof MimeTypeArray && m.length === 0 && navigator.pdfViewerEnabled === false) ||
			'plugins ' + (p && p.length) + ' mimeTypes ' + (m && m.length) + ' pdf ' + navigator.pdfViewerEnabled;
	}, 'no plugins, no mime types');
	later(4, function () {
		return navigator.permissions.query({ name: 'geolocation' }).then(function (s) {
			if (!(s instanceof PermissionStatus) || s.name !== 'geolocation' || ['granted', 'denied', 'prompt'].indexOf(s.state) < 0)
				return 'got ' + Object.prototype.toString.call(s) + ' ' + s.state;
			return navigator.permissions.query({ name: 'no-such-permission' }).then(function () { return 'unknown name resolved'; },
				function (e) { return e instanceof TypeError || e.name; });
		});
	}, 'permissions.query: PermissionStatus; an unknown name is a TypeError');
	later(5, function () {
		if (!navigator.clipboard) return true;
		return navigator.clipboard.writeText('x').then(function () { return 'writeText resolved'; },
			function (e) { return e.name === 'NotAllowedError' || e.name; });
	}, 'clipboard.writeText rejects when nothing is copied');
	(function () {
		if (typeof navigator.getBattery !== 'function') { t(6, false, 'getBattery(): not a function'); return; }
		var p1 = navigator.getBattery();
		Promise.all([p1, navigator.getBattery()]).then(function (b) {
			var x = b[0], ok = x === b[1] && x instanceof BatteryManager && typeof x.charging === 'boolean' &&
				x.level >= 0 && x.level <= 1 && typeof x.chargingTime === 'number' && typeof x.dischargingTime === 'number' &&
				x.onlevelchange === null && typeof x.addEventListener === 'function';
			/* the values read, for comparing with the device's own indicator */
			t(6, ok, 'getBattery(): one BatteryManager (level ' + x.level + ', charging ' + x.charging +
				', dischargingTime ' + x.dischargingTime + ')');
		}, function (e) { t(6, false, 'getBattery(): ' + e); });
	})();
})();
</script>
</body>
</html>
