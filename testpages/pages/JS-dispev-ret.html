<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS document.dispatchEvent return value (script not run)</title>
<!-- document.dispatchEvent's return value (patch 302).
     dispatchEvent returns false when a cancelable event is
     cancelled (preventDefault in any listener on the path), and
     true otherwise -- the same contract the element path (the
     native libdom dispatch) already honours. The document shim's
     page-direct path returned true unconditionally, so a page
     could not observe its own cancellation through the document.
     1: cancelable, document listener cancels: false.
     2: cancelable, listener does not cancel: true.
     3: cancelable, no listener at all: true.
     4: NOT cancelable, listener calls preventDefault: true
        (preventDefault is a no-op on a non-cancelable event).
     5: cancelable, a window bubble listener cancels: false --
        cancellation in the window step counts too.
     6: cancelable, listener stops propagation without
        cancelling: true (stopPropagation is not cancellation). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">DISPRET: script did not run</p>
<p id="r1" class="wait">1 cancelled at document: waiting</p>
<p id="r2" class="wait">2 cancelable, not cancelled: waiting</p>
<p id="r3" class="wait">3 cancelable, no listener: waiting</p>
<p id="r4" class="wait">4 non-cancelable, preventDefault attempt: waiting</p>
<p id="r5" class="wait">5 cancelled at window bubble: waiting</p>
<p id="r6" class="wait">6 stopPropagation only: waiting</p>
<script>
(function () {
	var N = 6, done = {};
	function pass(n, ok, text) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + text;
		if (!ok) return;
		done[n] = true;
		p.className = 'pass';
	}
	function render() {
		var n = 0, i;
		for (i = 1; i <= N; i++) if (done[i]) n++;
		var s = document.getElementById('sum');
		s.textContent = 'DISPRET: ' + n + '/' + N + ' passed';
		if (n === N) s.className = 'pass';
		document.title = 'DISPRET ' + n;
	}
	function ev(type, cancelable) {
		return new Event(type, { bubbles: true, cancelable: cancelable });
	}
	/* 1: cancelled by a document listener */
	document.addEventListener('ret1', function (e) { e.preventDefault(); });
	var e1 = ev('ret1', true);
	pass(1, document.dispatchEvent(e1) === false && e1.defaultPrevented === true,
		'cancelled at document: returns false');
	/* 2: cancelable, listener observes only */
	document.addEventListener('ret2', function (e) { /* no cancel */ });
	pass(2, document.dispatchEvent(ev('ret2', true)) === true,
		'cancelable, not cancelled: returns true');
	/* 3: cancelable, nobody listening */
	pass(3, document.dispatchEvent(ev('ret3', true)) === true,
		'cancelable, no listener: returns true');
	/* 4: non-cancelable: preventDefault must not stick */
	var e4 = ev('ret4', false);
	document.addEventListener('ret4', function (e) { e.preventDefault(); });
	pass(4, document.dispatchEvent(e4) === true && e4.defaultPrevented === false,
		'non-cancelable, preventDefault attempt: returns true');
	/* 5: cancelled by a window listener on the bubble step */
	window.addEventListener('ret5', function (e) { e.preventDefault(); });
	pass(5, document.dispatchEvent(ev('ret5', true)) === false,
		'cancelled at window bubble: returns false');
	/* 6: stopPropagation is not cancellation */
	document.addEventListener('ret6', function (e) { e.stopPropagation(); });
	pass(6, document.dispatchEvent(ev('ret6', true)) === true,
		'stopPropagation only: returns true');
	render();
})();
</script>
</body>
</html>
