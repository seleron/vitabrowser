<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS document shape (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">DOCSHAPE: 0/6 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<script>
/* patch 278: document's only own property is location; its members are
 * Document.prototype's (it had 136 own, the engine's internals among them);
 * scratch documents and the page's readiness still work. Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'DOCSHAPE: ' + k + '/' + N + ' passed';
		document.title = 'JS document shape (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	check(1, function () {
		var k = Reflect.ownKeys(document).map(String);
		return (k.length === 1 && k[0] === 'location') || k.length + ' own: ' + k.slice(0, 12).join(' ');
	}, 'document\'s only own property is location');
	check(2, function () {
		var t = Object.getOwnPropertyDescriptor(Document.prototype, 'title'), r = Object.getOwnPropertyDescriptor(Document.prototype, 'readyState');
		return (t && t.get && t.get.name === 'get title' && t.set && r && r.get && !r.set) ||
			'title ' + (t ? t.get && t.get.name : 'none') + ', readyState ' + (r ? (r.set ? 'settable' : 'getter') : 'none');
	}, 'title and readyState are Document.prototype\'s accessors');
	check(3, function () {
		var was = document.title, el = document.createElement('div'), hit = 0;
		document.title = 'vb doc shape'; var ok1 = document.title === 'vb doc shape'; document.title = was;
		el.id = 'vbdoc'; document.body.appendChild(el);
		document.addEventListener('vbdoc', function () { hit++; }); document.dispatchEvent(new Event('vbdoc'));
		return (ok1 && typeof document.readyState === 'string' && document.getElementById('vbdoc') === el &&
			document.documentElement.tagName === 'HTML' && document.head && hit === 1 && document.nodeType === 9) || 'something stopped working';
	}, 'the document still works');
	check(4, function () {
		var sd = document.implementation.createHTMLDocument('scratch');
		var p = sd.createElement('p'); p.textContent = 'z'; sd.body.appendChild(p);
		return (sd.title === 'scratch' && sd.getElementsByTagName('p')[0] === p && p.parentNode === sd.body) || 'scratch document: ' + sd.title;
	}, 'a createHTMLDocument document works');
	check(5, function () {
		var pd = new DOMParser().parseFromString('<p class=a>pp</p>', 'text/html');
		return (pd.querySelector('p.a') && pd.querySelector('p.a').textContent === 'pp') || 'parsed document lost its p';
	}, 'a DOMParser document works');
	addEventListener('load', function () {
		t(6, document.readyState === 'complete', 'readyState at load: ' + document.readyState);
	});
})();
</script>
</body>
</html>
