<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS DOM stall (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#res { position: fixed; top: 0; left: 0; right: 0; background: #fff; }
#big p { margin: 2px 0; }
/* patch 188: the use-after-free probe. A span whose only child is a
 * comment is :empty to libcss (comments don't count) but not to the DOM;
 * clearing its text must rebuild locally without running the old
 * detached box's _after (which planted a style-borrowing INLINE_END). */
span:empty { display: none; }
</style>
<script>
(function () {
	var S = { maxgap: 0, ticks: 0, on: false }, N = 8, k = 0, last = (self.performance ? performance.now() : Date.now());
	(function tick() {
		var now = (self.performance ? performance.now() : Date.now()), g = now - last;
		last = now;
		if (S.on) { S.ticks++; if (g > S.maxgap) S.maxgap = g; }
		setTimeout(tick, 0);
	})();
	function $(id) { return document.getElementById(id); }
	function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }); return s.length ? s[s.length >> 1] : 0; }
	var res = [];
	function t(n, ok, text) {
		res.push([n, ok, text]);
	}
	function show() {
		var i, r, p;
		for (i = 0; i < res.length; i++) {
			r = res[i]; p = $('r' + r[0]);
			p.textContent = r[0] + ' ' + r[2] + (r[1] ? '' : ' FAIL');
			if (r[1]) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'DOMSTALL: ' + k + '/' + N + ' passed';
		document.title = 'JS DOM stall (' + k + '/' + N + ')';
	}
	document.addEventListener('DOMContentLoaded', function () {
		var h = [], i;
		for (i = 0; i < 5000; i++)
			h.push('<p id="p' + i + '">Paragraph ' + i + ' with <b>some</b> ' +
				'inline <i>text</i> that <span>wraps</span> in the layout, ' +
				'<a href="#">a link</a> and more words to fill it.</p>');
		$('big').innerHTML = h.join('');
	});
	/* each step: start measuring, mutate, wait for the rebuild (debounced
	 * 0.4 s after the last change), check, stop measuring */
	var BLOCKS_BOUNDED = true;
	var steps = [
		['same-length text', true, function () {
			$('p2500').firstChild.nodeValue = 'Paragraph 2500 WITH';
		}, function () {
			return $('p2500').textContent.indexOf('WITH') >= 0;
		}],
		['longer text (wraps)', true, function () {
			$('p2501').textContent = new Array(40).join('longer words ');
		}, function () {
			return $('p2501').getBoundingClientRect().height > 40 &&
				$('p2502').getBoundingClientRect().top >=
				$('p2501').getBoundingClientRect().bottom - 1;
		}],
		['innerHTML with inline markup', true, function () {
			$('p2504').innerHTML = 'new <b>bold</b> and <a href="#x">link</a>';
		}, function () {
			return $('p2504').querySelector('b') !== null &&
				$('p2504').getBoundingClientRect().height > 10;
		}],
		/* blocks (BLOCKS_BOUNDED: false while measuring the full rebuild) */
		['inserted paragraph', BLOCKS_BOUNDED, function () {
			var p = document.createElement('p');
			p.id = 'added';
			p.textContent = 'an added paragraph';
			$('p2502').parentNode.insertBefore(p, $('p2503'));
		}, function () {
			var a = $('added').getBoundingClientRect();
			return a.height > 10 &&
				$('p2503').getBoundingClientRect().top >= a.bottom - 1;
		}],
		['appended at the end', BLOCKS_BOUNDED, function () {
			var p = document.createElement('p');
			p.id = 'appended';
			p.textContent = 'appended after paragraph 4999';
			$('big').appendChild(p);
		}, function () {
			var a = $('appended').getBoundingClientRect();
			return a.height > 10 &&
				a.top >= $('p4999').getBoundingClientRect().bottom - 1;
		}],
		['removed paragraph', BLOCKS_BOUNDED, function () {
			var p = $('p2600');
			p.parentNode.removeChild(p);
		}, function () {
			return !$('p2600') &&
				$('p2601').getBoundingClientRect().top >=
				$('p2599').getBoundingClientRect().bottom - 1;
		}],
		/* patch 188: span:empty{display:none} + comment child. Before the
		 * fix, textContent="" ran the OLD detached span box's _after
		 * (its backlink was still live while the new build made no box),
		 * planting an INLINE_END borrowing the old style into the live
		 * tree -- a use-after-free once the old boxes were freed. Now the
		 * span must simply vanish (no box) and the paragraph survive. */
		['empty span with comment child', true, function () {
			$('emptyspan').textContent = '';
		}, function () {
			var r = $('emptyspan').getBoundingClientRect();
			return r.width === 0 && r.height === 0 &&
				$('emptyprobe').getBoundingClientRect().height > 10;
		}]
	];
	/* the changed stretches still stack: no overlaps */
	function stack(ids) {
		var i, prev = null, r, el;
		for (i = 0; i < ids.length; i++) {
			el = $(ids[i]);
			if (!el) return 'missing ' + ids[i];
			r = el.getBoundingClientRect();
			if (prev && r.top < prev.bottom - 1) return 'overlap at ' + ids[i];
			prev = r;
		}
		return 'ok';
	}
	function ordered() {
		var a = [], b = [], c = [], i, r;
		for (i = 2495; i <= 2510; i++) {
			a.push('p' + i);
			if (i === 2502) a.push('added');
		}
		for (i = 2595; i <= 2605; i++) if (i !== 2600) b.push('p' + i);
		for (i = 4990; i <= 4999; i++) c.push('p' + i);
		c.push('appended');
		r = stack(a);
		if (r === 'ok') r = stack(b);
		if (r === 'ok') r = stack(c);
		return r;
	}
	var gaps = [];
	function run(i) {
		if (i >= steps.length) {
			/* bounded: a full rebuild costs ~250 ms a step here, a local one
			 * ~25 ms; the host adds a 60-100 ms hiccup to a step now and then
			 * (the step's own work stays 3-12 ms in the engine log), so: median
			 * under 60 ms and no step at a full rebuild's 200 ms */
			var worst = Math.round(Math.max.apply(null, gaps)), med = Math.round(median(gaps)), o = ordered();
			t(8, o === 'ok' && med < 60 && worst < 200, 'bounded changes: median gap ' +
				med + ' ms, longest ' + worst + ' ms; paragraphs stack: ' + o);
			show();
			return;
		}
		S.maxgap = 0; S.ticks = 0; S.on = true;
		steps[i][2]();
		setTimeout(function () {
			/* the check reads geometry, which forces a rebuild still
			 * pending: keep measuring through it and one more tick */
			var ok = steps[i][3]();
			setTimeout(function () {
				S.on = false;
				if (steps[i][1]) gaps.push(S.maxgap);
				t(i + 1, ok, steps[i][0] + ': longest gap ' +
					Math.round(S.maxgap) + ' ms');
				setTimeout(function () { run(i + 1); }, 100);
			}, 50);
		}, 600);
	}
	var started = false, lastH = -1;
	function settled() {
		var sh = document.body.scrollHeight;
		if (sh < 100000 || sh !== lastH) {
			lastH = sh;
			setTimeout(settled, 100);
			return;
		}
		/* 1 s after the page stops growing: the load's last full layout
		 * must not land in step 1's measuring window */
		setTimeout(function () { run(0); }, 1000);
	}
	window.addEventListener('load', function () {
		if (started) return;
		started = true;
		setTimeout(settled, 100);
	});
})();
</script>
</head>
<body>
<!-- Roadmap WS-C, script-driven DOM changes (patch 165). A script changes
     one paragraph of 5000; each change used to rebuild the whole box tree
     and lay the page out again (~0.26 s here on the host, several seconds
     on the Vita). Now a change inside a block of inline content rebuilds
     only that block's boxes and lays out only its lines
     (html_reconvert_local), moving what follows.
     1: a text node's data changed (same length): shown.
     2: textContent made longer: the paragraph wraps taller and the next
        one moves below it.
     3: innerHTML with inline markup (<b>, <a>): built.
     4: a new paragraph inserted: laid out between its neighbours (still
        the full rebuild; its gap is reported, not bounded).
     5: a paragraph appended at the end: laid out after paragraph 4999.
     6: a paragraph removed: the neighbours close ranks.
     7 (patch 188): span:empty{display:none} whose only child is a comment:
        textContent="" must clear the span (no box) without crashing -- the
        old detached box's backlink used to run _after and plant a
        style-borrowing INLINE_END into the live tree (use-after-free).
     8: the changes stalled the main loop a median < 60 ms and none for
        a full rebuild's 200 ms (sim: ~23 ms; 257-1496 ms with the full
        rebuild; the host adds a 60-100 ms hiccup to a step now and then,
        outside the step's own 3-12 ms of work), and paragraphs
        2495-2510 plus the new one stack without overlapping.
     The results are position: fixed so the autotest's dumps show them,
     and no step leaves the page idle for a second (the autotest would
     take it as settled and move on): each change is measured for 0.6 s
     (the rebuild runs ~0.4 s after it, debounced). -->
<div id="res">
<p id="sum" class="wait">DOMSTALL: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p><p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
</div>
<div id="big"></div>
<!-- patch 188 probe: static so the textContent="" step below is a single
     text edit (one element, one kind) offered to html_reconvert_local -->
<p id="emptyprobe">Probe <span id="emptyspan"><!--c-->a</span> tail.</p>
</body>
</html>
