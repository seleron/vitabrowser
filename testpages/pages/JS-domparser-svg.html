<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS domparser svg</title>
<style>
/* Patch 418. DOMParser handed back the <html> it parses into as the
 * documentElement of every document, an image/svg+xml one too: claude
 * appended that <html> (holding its spinner's <svg>) into the page, and
 * every such insert took the full rebuild. The svg document's element is
 * the <svg> now (a text/html one keeps <html>); inserted between blocks
 * it is a replaced leaf (417), placed locally. Row for row as
 * CSS-domparser-svg-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
</style>
</head>
<body>
<p id="res">DOMPARSER: pending</p>
<div id="w"><div id="b1">Block one.</div><div id="b2">Block two.</div></div>
<script>
(function () {
	var r = [], ok = 0;
	var svgDoc = new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" viewBox="0 0 40 20"><rect width="40" height="20" fill="#3a6"/></svg>', 'image/svg+xml');
	var de = svgDoc.documentElement;
	if (de && String(de.nodeName).toLowerCase() === 'svg') ok++; else r.push('svg docEl=' + (de && de.nodeName));
	var hd = new DOMParser().parseFromString('<p>x</p>', 'text/html').documentElement;
	if (hd && String(hd.nodeName).toUpperCase() === 'HTML') ok++; else r.push('html docEl=' + (hd && hd.nodeName));
	window.addEventListener('load', function () {
		setTimeout(function () {
			var w = document.getElementById('w');
			w.insertBefore(de, document.getElementById('b2'));
			if (de.parentNode === w) ok++; else r.push('not inserted');
			document.getElementById('res').textContent = 'DOMPARSER: ' + ok + '/3 passed' + (r.length ? ' (' + r.join(', ') + ')' : '');
		}, 500);
	});
})();
</script>
</body>
</html>
