<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS element instanceof (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
iframe { width: 200px; height: 30px; }
</style>
</head>
<body>
<div id="sum">INSTOF: 0/6 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<iframe id="pf"></iframe><img id="pi" alt="">
<script>
/* patch 247: <iframe> and <img> elements failed instanceof
 * HTMLIFrameElement / HTMLImageElement (their wrappers are built on
 * HTMLElement.prototype, and the constructors were empty stubs). hCaptcha
 * sends to a frame with
 *     e instanceof HTMLIFrameElement ? e.contentWindow.postMessage(m, o)
 *                                    : e.postMessage(m, o)
 * so it called postMessage on the element, swallowed the TypeError, and
 * claude.ai's sign-in captcha never heard back. Chromium-verified.
 * (new Image() is still a stand-in object, not an element: a known gap.) */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'INSTOF: ' + k + '/' + N + ' passed';
		document.title = 'JS element instanceof (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	check(1, function () {
		return (document.createElement('iframe') instanceof HTMLIFrameElement &&
			$('pf') instanceof HTMLIFrameElement) || 'no';
	}, 'a made and a parsed <iframe> are HTMLIFrameElements');
	check(2, function () {
		return (document.createElement('img') instanceof HTMLImageElement &&
			$('pi') instanceof HTMLImageElement) || 'no';
	}, 'a made and a parsed <img> are HTMLImageElements');
	check(3, function () {
		return ($('pf') instanceof HTMLElement && $('pf') instanceof Element &&
			$('pi') instanceof HTMLElement) || 'no';
	}, 'they are still HTMLElements');
	check(4, function () {
		var div = document.createElement('div');
		return (!(div instanceof HTMLIFrameElement) && !(div instanceof HTMLImageElement) &&
			!($('pf') instanceof HTMLImageElement) &&
			!(document.createTextNode('x') instanceof HTMLIFrameElement) &&
			!(null instanceof HTMLIFrameElement) &&
			!({ tagName: 'IFRAME', localName: 'iframe', nodeType: 1 } instanceof HTMLIFrameElement)) ||
			'a false positive';
	}, 'nothing else is one');
	check(5, function () {
		var F = function () {};
		F.prototype = Object.create(HTMLIFrameElement.prototype);
		Object.setPrototypeOf(F, HTMLIFrameElement);
		return !($('pf') instanceof F) || 'a plain iframe is an instance of a subclass';
	}, 'a subclass is not matched by tag');
	check(6, function () {
		/* hCaptcha's send */
		var e = $('pf'), m = JSON.stringify({ source: 'hcaptcha', label: 'x' });
		if (e instanceof HTMLIFrameElement) e.contentWindow.postMessage(m, '*');
		else e.postMessage(m, '*');
		return true;
	}, 'hCaptcha\'s send to a frame does not throw');
})();
</script>
</body>
</html>
