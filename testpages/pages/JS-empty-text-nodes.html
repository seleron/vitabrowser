<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Empty text nodes render nothing (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 13px; margin: 0; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.c { border-top: 1px solid #000; margin-bottom: 20px; }
.b { height: 10px; background: #69c; }
</style>
</head>
<body>
<div id="sum">EMPTYTXT353: 0/7 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<p id="r7" class="wait">7 pending</p>
<div class="c" id="c1"><div class="b" id="b1"></div></div>
<div class="c" id="c2"><div class="b" id="b2"></div></div>
<div class="c" id="c3"><div id="d3"></div><div class="b" id="b3"></div></div>
<div class="c" id="c4"><x-tab id="t4"><div class="b" id="b4"></div></x-tab></div>
<div class="c" id="f1"></div>
<div class="c" id="f2"></div>
<div class="c" id="f3"><span id="s3"></span></div>
<script>
/* Patch 353 (m.youtube.com): an empty text node became a text box with a
 * full line, a ~15px blank line wherever one sat. Frameworks insert them
 * as markers (YouTube has one before and after most components), and the
 * page drew ~75px too low. Browsers render nothing for them. Nodes created
 * empty and filled later still render. Chromium-verified. */
(function () {
	var k = 0, N = 7;
	function $(id) { return document.getElementById(id); }
	function off(i) { return Math.round($('b' + i).getBoundingClientRect().top -
		$('c' + i).getBoundingClientRect().top - 1); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'EMPTYTXT353: ' + k + '/' + N + ' passed';
		document.title = 'Empty text nodes (' + k + '/' + N + ')';
	}
	var e = function () { return document.createTextNode(''); };
	$('c1').insertBefore(e(), $('c1').firstChild);
	$('c2').insertBefore(e(), $('c2').firstChild); $('c2').appendChild(e());
	$('d3').appendChild(e());
	$('t4').insertBefore(e(), $('t4').firstChild);
	var f1 = e(), f2 = e(), f3 = e();
	$('f1').appendChild(f1); $('f2').appendChild(f2); $('s3').appendChild(f3);
	function h(id) { return Math.round($(id).getBoundingClientRect().height); }
	window.addEventListener('load', function () {
		t(1, off(1) === 0, 'empty node before a block (' + off(1) + ')');
		t(2, off(2) === 0 && h('c2') === 11, 'empty nodes around a block (' + off(2) +
			', H' + h('c2') + ')');
		t(3, off(3) === 0, 'a div holding only an empty node (' + off(3) + ')');
		t(4, off(4) === 0, 'inside an inline custom element (' + off(4) + ')');
		f1.data = 'one'; f2.appendData('two'); f3.nodeValue = 'three';
		setTimeout(function () {
			t(5, h('f1') > 10 && $('f1').textContent === 'one', 'filled later: data (H' + h('f1') + ')');
			t(6, h('f2') > 10 && $('f2').textContent === 'two', 'filled later: appendData (H' + h('f2') + ')');
			t(7, h('f3') > 10 && $('f3').textContent === 'three', 'filled later: nodeValue (H' + h('f3') + ')');
		}, 300);
	});
})();
</script>
</body>
</html>
