<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS event order (script not run)</title>
<!-- DOM event dispatch order (WS-B1, docs/roadmap.md): capture listeners
     from the window down, then the target's listeners, then bubble
     listeners back up; eventPhase 1/2/3; one Event object seen by every
     listener (preventDefault in one is defaultPrevented in the next);
     stopPropagation stops the walk; a non-bubbling event skips the bubble
     phase. Found replaying claude.ai: a document listener registered
     WITHOUT capture ran in the capture phase, before the target.
     1: synthetic bubbling event: order and phases.
     2: preventDefault in the target is seen by the bubbling listeners.
     3: stopPropagation at the target stops the bubble phase.
     4: a non-bubbling event: capture + target only.
     5: the same order for a click dispatched by .click(). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">EVORDER: script did not run</p>
<div id="outer"><div id="inner"><span id="t">target</span></div></div>
<p id="r1" class="wait">1 order: waiting</p>
<p id="r2" class="wait">2 shared defaultPrevented: waiting</p>
<p id="r3" class="wait">3 stopPropagation: waiting</p>
<p id="r4" class="wait">4 non-bubbling: waiting</p>
<p id="r5" class="wait">5 click order: waiting</p>
<script>
(function () {
	var N = 5, done = {};
	function pass(n, ok, text) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + text;
		if (!ok) return;
		done[n] = true;
		p.className = 'pass';
		var k = 0, i;
		for (i = 1; i <= N; i++) if (done[i]) k++;
		document.getElementById('sum').textContent = 'EVORDER: ' + k + '/' + N + ' passed';
		document.title = 'JS event order (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'EVORDER: 0/' + N + ' passed';
	var t = document.getElementById('t'), inner = document.getElementById('inner');
	var log = [];
	function rec(name) { return function (e) { log.push(name + e.eventPhase); }; }
	function listen(type, stop, prevent) {
		window.addEventListener(type, rec('wc'), true);
		document.addEventListener(type, rec('dc'), true);
		document.addEventListener(type, rec('db'));
		inner.addEventListener(type, rec('ic'), true);
		inner.addEventListener(type, rec('ib'));
		t.addEventListener(type, function (e) {
			log.push('t' + e.eventPhase);
			if (prevent) e.preventDefault();
			if (stop) e.stopPropagation();
		});
		window.addEventListener(type, rec('wb'));
	}
	function fire(type, bubbles) {
		var e = document.createEvent('Event');
		e.initEvent(type, bubbles, true);
		log = [];
		t.dispatchEvent(e);
		return log.join(' ');
	}
	listen('x1');
	var want = 'wc1 dc1 ic1 t2 ib3 db3 wb3', got = fire('x1', true);
	pass(1, got === want, 'order: ' + got + (got === want ? '' : ' (want ' + want + ')'));

	listen('x2', false, true);
	var seen = null;
	document.addEventListener('x2', function (e) { seen = e.defaultPrevented; });
	fire('x2', true);
	pass(2, seen === true, 'shared defaultPrevented: bubbling listener saw ' + seen);

	listen('x3', true);
	got = fire('x3', true);
	want = 'wc1 dc1 ic1 t2';
	pass(3, got === want, 'stopPropagation: ' + got + (got === want ? '' : ' (want ' + want + ')'));

	listen('x4');
	got = fire('x4', false);
	want = 'wc1 dc1 ic1 t2';
	pass(4, got === want, 'non-bubbling: ' + got + (got === want ? '' : ' (want ' + want + ')'));

	listen('click');
	log = [];
	t.click();
	got = log.join(' ');
	want = 'wc1 dc1 ic1 t2 ib3 db3 wb3';
	pass(5, got === want, 'click order: ' + got + (got === want ? '' : ' (want ' + want + ')'));
})();
</script>
</body>
</html>
