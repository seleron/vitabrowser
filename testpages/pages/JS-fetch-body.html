<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS fetch body</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 0; padding: 1px 6px; font-size: 11px; line-height: 1.3; }
.wait { background: #fcc; }
.pass { background: #cfc; }
.fail { background: #f66; }
#sum { font-size: 16px; font-weight: bold; margin: 2px 0; }
</style>
</head>
<body>
<p id="sum" class="wait">JS fetch body: script did not run</p>
<div id="rows"></div>
<script>
/* Fetch/XHR request body types (Patch 140): URLSearchParams serializes to
 * application/x-www-form-urlencoded; FormData (text fields) to multipart.
 * The /echo endpoint returns the raw body, and the request's Content-Type
 * in X-Echo-Content-Type.
 * Patch 256: binary bodies -- typed arrays, ArrayBuffer, DataView, Blob --
 * go as their exact bytes (hCaptcha's getcaptcha: msgpack, NULs and all),
 * with no Content-Type unless they have one; XHR responseType "arraybuffer",
 * "blob" and "json".
 * Patch 257: FormData with files -- a Blob is stored as a File and its bytes
 * go in the multipart body (they went as nothing); names escaped, text
 * values UTF-8 with CRLF line breaks.
 * Patch 258: Response.formData() reads multipart/form-data bodies (it
 * read url-encoded ones only), as Chromium does -- checks 18-22.
 * Patch 259: Request has a body to read (text, json, formData, ...), and
 * Chromium's constructor rules -- checks 23-30. */
var passed = 0, total = 0, failedNames = [];
function t(name, cond) {
  total++;
  var p = document.createElement('p');
  p.className = cond ? 'pass' : 'fail';
  p.textContent = total + ' ' + name + ': ' + (cond ? 'PASS' : 'FAIL');
  document.getElementById('rows').appendChild(p);
  if (cond) passed++; else failedNames.push(name);
}
function sum() {
  var s = document.getElementById('sum');
  s.className = passed === total ? 'pass' : 'fail';
  s.textContent = 'JS fetch body: ' + passed + '/' + total + ' passed' +
    (failedNames.length ? ' FAILS: ' + failedNames.join('; ') : '');
}

var base = location.href.replace(/\/[^\/]*$/, '/');
var echoUrl = base + 'echo';

function post(url, body, headers) {
  return fetch(url, { method: 'POST', body: body, headers: headers || {} })
    .then(function (r) { return r.text().then(function (t) {
      return { status: r.status, body: t };
    }); });
}

/* 1: URLSearchParams via fetch */
var usp = new URLSearchParams();
usp.append('a', '1');
usp.append('b', 'hello world');
post(echoUrl, usp).then(function (res) {
  t('1 URLSearchParams body arrives', res.body === 'a=1&b=hello+world');
  /* 2: URLSearchParams via XHR */
  var xhr = new XMLHttpRequest();
  xhr.open('POST', echoUrl, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    t('2 XHR URLSearchParams body', xhr.responseText === 'a=1&b=hello+world');
    /* 3: FormData text fields via fetch */
    var fd = new FormData();
    fd.append('name', 'test');
    fd.append('value', '123');
    post(echoUrl, fd).then(function (res3) {
      t('3 FormData multipart contains fields',
        res3.body.indexOf('name="name"') >= 0 &&
        res3.body.indexOf('test') >= 0 &&
        res3.body.indexOf('name="value"') >= 0);
      /* 4: string body still works */
      post(echoUrl, 'raw string body').then(function (res4) {
        t('4 string body unchanged', res4.body === 'raw string body');
        binary();
      });
    });
  };
  xhr.send(usp);
}).catch(function (e) {
  t('fetch failed: ' + (e && e.message), false);
  sum();
});

/* every byte value, NULs first, and a high tail */
var all = new Uint8Array(300);
for (var i = 0; i < all.length; i++) all[i] = i % 256;
function same(ab, want) {
  if (!ab || ab.byteLength !== want.length) return false;
  var u = new Uint8Array(ab);
  for (var i = 0; i < want.length; i++) if (u[i] !== want[i]) return false;
  return true;
}
function xhr(body, type, headers, done) {
  var x = new XMLHttpRequest();
  x.open('POST', echoUrl, true);
  if (type) x.responseType = type;
  for (var k in headers || {}) x.setRequestHeader(k, headers[k]);
  x.onload = function () { done(x); };
  x.onerror = function () { done(x); };
  x.send(body);
}
function binary() {
  /* 5-6: a Uint8Array, back as an ArrayBuffer; no Content-Type */
  xhr(all, 'arraybuffer', null, function (x) {
    t('5 XHR Uint8Array body, arraybuffer response',
      x.response instanceof ArrayBuffer && same(x.response, all));
    t('6 no Content-Type for bytes',
      x.getResponseHeader('X-Echo-Content-Type') === '');
    /* 7: an ArrayBuffer body with its own type (hCaptcha's shape) */
    xhr(all.buffer, 'arraybuffer',
        { 'Content-Type': 'application/octet-stream' }, function (x) {
      t('7 XHR ArrayBuffer body keeps its Content-Type',
        same(x.response, all) &&
        x.getResponseHeader('X-Echo-Content-Type') === 'application/octet-stream');
      /* 8: a DataView sends only its window */
      xhr(new DataView(all.buffer, 10, 20), 'arraybuffer', null, function (x) {
        t('8 XHR DataView body is its window',
          same(x.response, all.subarray(10, 30)));
        /* 9: a typed Blob, back as a Blob */
        var b = new Blob([all], { type: 'application/x-test' });
        xhr(b, 'blob', null, function (x) {
          var r = x.response;
          var ok = r instanceof Blob && r.size === all.length &&
            x.getResponseHeader('X-Echo-Content-Type') === 'application/x-test';
          (ok ? r.arrayBuffer() : Promise.resolve(null)).then(function (ab) {
            t('9 XHR Blob body and blob response', ok && same(ab, all));
            /* 10: responseType json */
            xhr('{"a":[1,2],"b":"x"}', 'json', null, function (x) {
              var j = x.response;
              t('10 XHR responseType json',
                j !== null && typeof j === 'object' && j.a[1] === 2 && j.b === 'x');
              fetchBinary();
            });
          });
        });
      });
    });
  });
}
function fetchBinary() {
  /* 11: fetch with a Uint8Array body */
  fetch(echoUrl, { method: 'POST', body: all }).then(function (r) {
    var ct = r.headers.get('X-Echo-Content-Type');
    return r.arrayBuffer().then(function (ab) {
      t('11 fetch Uint8Array body', same(ab, all) && ct === '');
      /* 12: fetch with a Blob body */
      return fetch(echoUrl, { method: 'POST',
        body: new Blob([all.subarray(0, 64)], { type: 'application/x-test' }) });
    });
  }).then(function (r) {
    var ct = r.headers.get('X-Echo-Content-Type');
    return r.arrayBuffer().then(function (ab) {
      t('12 fetch Blob body', same(ab, all.subarray(0, 64)) && ct === 'application/x-test');
      formFiles();
    });
  }).catch(function (e) {
    t('binary fetch failed: ' + (e && e.message), false);
    sum();
  });
}

/* the bytes of a multipart body as a latin-1 string (one char per byte) */
function latin1(ab) {
  var u = new Uint8Array(ab), s = '';
  for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return s;
}
function part(body, name) {
  /* the content of the part whose Content-Disposition names `name` */
  var at = body.indexOf('name="' + name + '"');
  if (at < 0) return null;
  var start = body.indexOf('\r\n\r\n', at) + 4;
  var end = body.indexOf('\r\n--', start);
  return { head: body.slice(at, start), data: body.slice(start, end) };
}
var allLatin1 = latin1(all.buffer);
function formFiles() {
  /* 13: XHR, a FormData with a binary Blob under a filename */
  var fd = new FormData();
  fd.append('note', 'hi');
  fd.append('file', new Blob([all], { type: 'application/x-test' }), 'a.bin');
  xhr(fd, 'arraybuffer', null, function (x) {
    var ct = x.getResponseHeader('X-Echo-Content-Type') || '';
    var b = x.response ? latin1(x.response) : '', p = part(b, 'file');
    t('13 XHR FormData file bytes',
      ct.indexOf('multipart/form-data; boundary=') === 0 && p !== null &&
      p.head.indexOf('filename="a.bin"') >= 0 &&
      p.head.indexOf('Content-Type: application/x-test') >= 0 &&
      p.data === allLatin1 && part(b, 'note').data === 'hi');
    /* 14: fetch, a File keeps its own name and type */
    var fd2 = new FormData();
    fd2.append('doc', new File([all.subarray(0, 50)], 'b.dat', { type: 'image/png' }));
    fetch(echoUrl, { method: 'POST', body: fd2 }).then(function (r) {
      return r.arrayBuffer();
    }).then(function (ab) {
      var p = part(latin1(ab), 'doc');
      t('14 fetch FormData File bytes', p !== null &&
        p.head.indexOf('filename="b.dat"') >= 0 &&
        p.head.indexOf('Content-Type: image/png') >= 0 &&
        p.data === latin1(all.buffer.slice(0, 50)));
      /* 15-16: what FormData stores */
      var fd3 = new FormData();
      fd3.append('b', new Blob(['xyz']));
      fd3.append('o', { a: 1 });
      fd3.append('n', 5);
      var g = fd3.get('b');
      t('15 a Blob is stored as a File named "blob"',
        g instanceof Blob && g.name === 'blob' && g.size === 3);
      t('16 other values are stored as strings',
        fd3.get('o') === '[object Object]' && fd3.get('n') === '5');
      /* 17: text as UTF-8 with CRLF breaks; a name with a quote escaped */
      var fd4 = new FormData();
      fd4.append('t', 'caf\u00e9\nline2');
      fd4.append('q"x', 'v');
      return fetch(echoUrl, { method: 'POST', body: fd4 });
    }).then(function (r) {
      return r.arrayBuffer();
    }).then(function (ab) {
      var b = latin1(ab), p = part(b, 't');
      t('17 text is UTF-8 with CRLF, names escaped',
        p !== null && p.data === 'caf\u00c3\u00a9\r\nline2' &&
        b.indexOf('name="q%22x"') >= 0);
      return readForms();
    }).then(function () {
      sum();
    }).catch(function (e) {
      t('form files failed: ' + (e && e.message), false);
      sum();
    });
  });
}

function fdOf(body, ct) {
  return new Response(body, { headers: { 'content-type': ct } }).formData();
}
function rejects(p) {
  return p.then(function () { return false; },
    function (e) { return e instanceof TypeError; });
}
function readForms() {
  /* 18: a FormData through a Response and back */
  var fd = new FormData();
  fd.append('t', 'hi\nthere');
  fd.append('f', new Blob([all], { type: 'application/x-test' }), 'k.bin');
  return new Response(fd).formData().then(function (got) {
    var f = got.get('f');
    return (f instanceof Blob ? f.arrayBuffer() : Promise.resolve(null)).then(function (ab) {
      t('18 formData() reads a multipart body back',
        got.get('t') === 'hi\r\nthere' && f !== null && f.name === 'k.bin' &&
        f.type === 'application/x-test' && same(ab, all));
    });
  }).then(function () {
    /* 19: a quoted boundary, preamble and epilogue, lower-case headers, a
     * file part with no type, an empty filename, a text part's type */
    var B = 'XyZ', P = function (h, d) { return '--' + B + '\r\n' + h + '\r\n\r\n' + d + '\r\n'; };
    var body = 'preamble\r\n' +
      P('content-disposition: form-data; name="a"\r\ncontent-type: text/html', 'one') +
      P('Content-Disposition: form-data; name="f"; filename="x.txt"', 'filedata') +
      P('Content-Disposition: form-data; name="e"; filename=""', '') +
      P('Content-Disposition: form-data; name="q%22x"', 'z') +
      '--' + B + '--\r\nepilogue';
    return fdOf(body, 'multipart/form-data; boundary="' + B + '"');
  }).then(function (got) {
    var f = got.get('f'), e = got.get('e');
    t('19 multipart parts as Chromium reads them',
      got.get('a') === 'one' && f instanceof Blob && f.name === 'x.txt' &&
      f.type === 'text/plain' && f.size === 8 && e instanceof Blob &&
      e.name === '' && e.size === 0 && got.get('q%22x') === 'z');
    /* 20: UTF-8 names and values */
    var B = 'b0', txt = '--' + B + '\r\nContent-Disposition: form-data; name="caf\u00e9"\r\n\r\n' +
      '\u00e9t\u00e9\r\n--' + B + '--';
    return fdOf(new TextEncoder().encode(txt), 'multipart/form-data; boundary=' + B);
  }).then(function (got) {
    t('20 UTF-8 names and values', got.get('caf\u00e9') === '\u00e9t\u00e9');
    /* 21: malformed bodies and a missing boundary reject with TypeError */
    var B = 'XyZ', part = '--' + B + '\r\nContent-Disposition: form-data; name="a"\r\n\r\nx\r\n';
    return Promise.all([
      rejects(fdOf(part, 'multipart/form-data; boundary=' + B)),
      rejects(fdOf('garbage', 'multipart/form-data; boundary=' + B)),
      rejects(fdOf(part + '--' + B + '--', 'multipart/form-data')),
      rejects(fdOf('--' + B + '\r\nContent-Disposition: attachment; name="a"\r\n\r\nx\r\n--' + B + '--',
        'multipart/form-data; boundary=' + B)),
      rejects(fdOf('a=1', 'text/plain'))
    ]);
  }).then(function (r) {
    t('21 malformed multipart rejects', r.join() === 'true,true,true,true,true');
    /* 22: url-encoded still */
    return fdOf('a=1&b=two+words', 'application/x-www-form-urlencoded');
  }).then(function (got) {
    t('22 url-encoded formData()', got.get('a') === '1' && got.get('b') === 'two words');
    return requests();
  });
}
function throwsType(f) {
  try { f(); return false; } catch (e) { return e instanceof TypeError; }
}
function requests() {
  var P = function (body, h) { return new Request(base + 'x', { method: 'POST', body: body, headers: h }); };
  /* 23: URL, method, no body for GET / HEAD */
  var u = new Request('x?y#z').url;
  t('23 Request URL and method',
    u === base + 'x?y#z' &&
    new Request('/', { method: 'post' }).method === 'POST' &&
    new Request('/', { method: 'patch' }).method === 'patch' &&
    new Request('/', { method: 'Custom' }).method === 'Custom' &&
    throwsType(function () { new Request('/', { body: 'x' }); }) &&
    throwsType(function () { new Request('/', { method: 'HEAD', body: 'x' }); }));
  /* 24: body and the type it implies */
  var fd = new FormData(); fd.append('a', '1');
  var none = new Request('/');
  t('24 Request body and Content-Type',
    none.body === null && none.bodyUsed === false &&
    P('x').body instanceof ReadableStream &&
    P('x').headers.get('content-type') === 'text/plain;charset=UTF-8' &&
    P(fd).headers.get('content-type').indexOf('multipart/form-data; boundary=') === 0 &&
    P(new URLSearchParams('a=1')).headers.get('content-type') ===
      'application/x-www-form-urlencoded;charset=UTF-8' &&
    P(new Uint8Array(2)).headers.get('content-type') === null);
  /* 25: the readers */
  return Promise.all([
    P('{"a":[1]}').json(),
    P(new Uint8Array([1, 2, 3])).arrayBuffer(),
    P('hey', { 'content-type': 'x/y' }).blob(),
    new Request('/').text()
  ]).then(function (r) {
    t('25 Request json / arrayBuffer / blob / text',
      r[0].a[0] === 1 && r[1].byteLength === 3 && r[2].type === 'x/y' &&
      r[2].size === 3 && r[3] === '');
    /* 26: formData, multipart and url-encoded */
    var f = new FormData();
    f.append('k', 'v');
    f.append('b', new Blob(['xyz'], { type: 'a/b' }), 'n.bin');
    return Promise.all([P(f).formData(), P(new URLSearchParams('a=1&b=2')).formData()]);
  }).then(function (r) {
    var b = r[0].get('b');
    t('26 Request formData()', r[0].get('k') === 'v' && b instanceof Blob &&
      b.name === 'n.bin' && b.type === 'a/b' && b.size === 3 && r[1].get('b') === '2');
    /* 27: new Request(req) takes req's body */
    var r1 = P('{"a":1}'), r2 = new Request(r1);
    var a = P('1'), over = new Request(a, { body: '2' });
    var ok = r1.bodyUsed === true && r2.method === 'POST' && a.bodyUsed === true &&
      throwsType(function () { new Request(r1); });
    return Promise.all([r2.text(), over.text()]).then(function (x) {
      t('27 new Request(req) takes the body', ok && x[0] === '{"a":1}' && x[1] === '2');
    });
  }).then(function () {
    /* 28: clone, and a body read once */
    var r = P('abc'), c = r.clone();
    return Promise.all([r.text(), c.text()]).then(function (x) {
      var used = throwsType(function () { r.clone(); });
      return r.text().then(function () { return false; }, function (e) {
        return e instanceof TypeError;
      }).then(function (again) {
        t('28 Request clone, body read once', x[0] === 'abc' && x[1] === 'abc' && used && again);
      });
    });
  }).then(function () {
    /* 29: fetch(request) sends the request's body */
    var r = new Request(echoUrl, { method: 'POST', body: all,
      headers: { 'Content-Type': 'application/octet-stream' } });
    return fetch(r).then(function (res) {
      var ct = res.headers.get('X-Echo-Content-Type');
      return res.arrayBuffer().then(function (ab) {
        var used = r.bodyUsed;
        return fetch(r).then(function () { return false; }, function (e) {
          return e instanceof TypeError;
        }).then(function (rej) {
          t('29 fetch(request) sends its body, once',
            same(ab, all) && ct === 'application/octet-stream' && used && rej);
        });
      });
    });
  }).then(function () {
    /* 30: the rest, as Chromium has them */
    var r = new Request('/');
    t('30 Request defaults',
      [r.credentials, r.mode, r.cache, r.redirect, r.referrer, r.destination,
       r.keepalive, r.integrity].join(',') === 'same-origin,cors,default,follow,about:client,,false,' &&
      r.signal instanceof AbortSignal && Object.keys(r).length === 0);
  });
}
</script>
</body>
</html>
