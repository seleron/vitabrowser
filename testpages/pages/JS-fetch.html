<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS fetch</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">JS fetch: script did not run</p>
<p id="where" class="wait">origin: unknown</p>
<p id="r1" class="wait">1 fetch() + json(): waiting</p>
<p id="r2" class="wait">2 XMLHttpRequest GET: waiting</p>
<p id="r3" class="wait">3 async/await fetch: waiting</p>
<p id="r4" class="wait">4 response header / status: waiting</p>
<p id="r5" class="wait">5 missing file is not ok: waiting</p>
<script>
/* Requests only relative URLs, so the same page tests the file: fetcher
 * when opened from app0:, and curl (http, https with mbedTLS) when served
 * by the simulator's local servers (tools/vita-sim/httpd.py). Each row
 * starts as "waiting" and only a real response turns it PASS. */
var passed = 0, total = 5;
function pass(n, what, detail) {
  var p = document.getElementById('r' + n);
  if (!p || p.className === 'pass') return;
  p.textContent = n + ' ' + what + ': PASS' + (detail ? ' (' + detail + ')' : '');
  p.className = 'pass';
  passed++;
  var s = document.getElementById('sum');
  s.textContent = 'JS fetch: ' + passed + '/' + total + ' passed';
  s.className = passed === total ? 'pass' : 'wait';
  console.log('JS-fetch row ' + n + ' passed ' + (detail || ''));
}
function fail(n, what, why) {
  var p = document.getElementById('r' + n);
  if (p && p.className !== 'pass') p.textContent = n + ' ' + what + ': FAIL ' + why;
  console.log('JS-fetch row ' + n + ' failed: ' + why);
}
var w = document.getElementById('where');
w.textContent = 'origin: ' + location.protocol;
w.className = 'pass';

fetch('fetch-data.json').then(function (r) { return r.json(); })
  .then(function (d) { if (d.msg === 'hello from the server' && d.n === 42) pass(1, 'fetch() + json()'); else fail(1, 'fetch() + json()', 'bad body'); })
  .catch(function (e) { fail(1, 'fetch() + json()', String(e)); });

var x = new XMLHttpRequest();
x.open('GET', 'fetch-data.json');
x.onload = function () {
  try {
    var d = JSON.parse(x.responseText);
    if (d.n === 42) pass(2, 'XMLHttpRequest GET', 'status ' + x.status); else fail(2, 'XMLHttpRequest GET', 'bad body');
  } catch (e) { fail(2, 'XMLHttpRequest GET', String(e)); }
};
x.onerror = function () { fail(2, 'XMLHttpRequest GET', 'onerror'); };
x.send();

(async () => {
  try {
    const r = await fetch('fetch-data.json');
    const t = await r.text();
    if (t.indexOf('"n":42') >= 0) pass(3, 'async/await fetch', t.length + ' bytes');
    else fail(3, 'async/await fetch', 'bad text');
  } catch (e) { fail(3, 'async/await fetch', String(e)); }
})();

fetch('fetch-data.json').then(function (r) {
  var ct = r.headers && r.headers.get ? (r.headers.get('content-type') || '') : '';
  if (r.ok && (r.status === 200 || location.protocol === 'file:'))
    pass(4, 'response header / status', 'status ' + r.status + (ct ? ', ' + ct : ''));
  else fail(4, 'response header / status', 'status ' + r.status);
}).catch(function (e) { fail(4, 'response header / status', String(e)); });

fetch('no-such-file.json').then(function (r) {
  if (!r.ok) pass(5, 'missing file is not ok', 'status ' + r.status);
  else fail(5, 'missing file is not ok', 'ok was true');
}).catch(function (e) { pass(5, 'missing file is not ok', 'rejected'); });
</script>
</body>
</html>
