<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS flex leaf</title>
<style>
/* Patch 503. A leaf element (an <iframe>, an <img>) inserted into a
 * block-level flex box rebuilt the whole box: stackoverflow inserts
 * <iframe>s into its flex <body>, ~2,900 boxes each time. It is now
 * placed as its own implied flex item -- an anonymous block around a line
 * holding it, as normalisation makes in a full build. After its steps
 * (250 ms apart) JS-flex-leaf.html must render row for row as
 * CSS-flex-leaf-ref.html, the same steps run while the page parses.
 * Steps: an <img> between items; an <iframe> between items; an <iframe>
 * appended at the end; an <img> appended at the end; two <img>s side by
 * side in one step (one shared item: the box built again whole); an
 * <input> appended (not a late element: the box built again whole); an
 * <img> inserted after whitespace, and one before whitespace. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.f { display: flex; margin: 4px 10px; background: #eef; align-items: center; }
.f > div { border: 1px solid #000; padding: 2px 6px; margin-right: 4px; }
iframe { width: 60px; height: 18px; border: 1px solid #c00; }
</style>
</head>
<body>
<div id="a" class="f"><div>a1</div><div>a2</div></div>
<div id="b" class="f"><div>b1</div><div>b2</div></div>
<div id="c" class="f"><div>c1</div><div>c2</div></div>
<div id="d" class="f"><div>d1</div></div>
<div id="e" class="f"><div>e1</div><div>e2</div></div>
<div id="g" class="f"><div>g1</div></div>
<div id="w" class="f">
  <div>w1</div>
  <div>w2</div>
  <div>w3</div>
</div>
<p>After the flex boxes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function img() { var i = document.createElement('img'); i.src = 'opimg-20.png'; i.width = 20; i.height = 20; return i; }
	function frame() { var f = document.createElement('iframe'); f.src = 'about:blank'; return f; }
	function kids(id) { return $(id).getElementsByTagName('div'); }
	var ops = [
		function () { $('a').insertBefore(img(), kids('a')[1]); },
		function () { $('b').insertBefore(frame(), kids('b')[1]); },
		function () { $('c').appendChild(frame()); },
		function () { $('d').appendChild(img()); },
		function () { $('e').insertBefore(img(), kids('e')[1]); $('e').insertBefore(img(), kids('e')[1]); },
		function () { var x = document.createElement('input'); x.size = 6; $('g').appendChild(x); },
		function () { $('w').insertBefore(img(), kids('w')[1]); },
		function () { var w3 = kids('w')[2]; $('w').insertBefore(img(), w3.previousSibling); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 250); } })(); });
})();
</script>
</body>
</html>
