<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS flex own</title>
<style>
/* Patch 438. Three changes that declined into the full rebuild:
 * "nearest box is not a block" for the child list of an inline-block
 * <button> (wpnews) and for text or innerHTML set on a flex box itself
 * (youtube's <main> / <c-wiz>), and "a flex or grid box's child list
 * changed in elements with a box". The flex box is built again whole
 * (372's container rebuild); the inline-block's change is its line's, and
 * the block holding that line is built again whole (434). Steps (each
 * flushed alone by a layout read): a <span> into the inline-block button,
 * innerHTML on the flex <main>, a boxed <div> appended to a flex row, a
 * flex row's text replaced. Row for row as CSS-flex-own-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.ib { display: inline-block; padding: 2px 8px; }
main, .row { display: flex; margin: 4px 10px; }
.row > div, main > div { margin: 0 6px 0 0; padding: 2px 6px; background: #dde; }
</style>
</head>
<body>
<p>Before <button id="btn" class="ib"><span>Menu</span></button> after.</p>
<main id="m"><div>one</div><div>two</div></main>
<div class="row" id="r"><div>a</div><div>b</div></div>
<div class="row" id="t">plain flex text</div>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var s = document.createElement('span'); s.textContent = ' open'; $('btn').appendChild(s); },
		function () { $('m').innerHTML = '<div>three</div><div>four</div><div>five</div>'; },
		function () { var d = document.createElement('div'); d.textContent = 'c'; $('r').appendChild(d); },
		function () { $('t').textContent = 'flex text, replaced'; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { for (k = 0; k < ops.length; k++) { ops[k](); void document.body.offsetHeight; } }, 300); });
})();
</script>
</body>
</html>
