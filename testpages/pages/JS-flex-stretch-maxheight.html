<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS flex stretch max-height (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#res { position: fixed; top: 0; left: 0; right: 0; background: #fff; }
/* patch 194: a stretched nested flex/grid item with max-height must keep
 * the max-height clamp; the stretch restoration must not override it. */
.outer { display: flex; height: 200px; border: 1px solid black; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="res">
<div id="sum">STRMAX194: 0/4 passed</div>
<div id="r1" class="wait">1</div>
<div id="r2" class="wait">2</div>
<div id="r3" class="wait">3</div>
<div id="r4" class="wait">4</div>
</div>

<!-- 1: nested flex item with max-height smaller than the stretched size -->
<div class="outer"><div id="item1" style="display: flex; max-height: 50px;"><span>one</span></div></div>
<!-- 2: nested grid item with max-height smaller than the stretched size -->
<div class="outer"><div id="item2" style="display: grid; max-height: 60px;"><span>two</span></div></div>
<!-- 3: nested flex item with NO max-height — stretch restoration still applies -->
<div class="outer"><div id="item3" style="display: flex;"><span>three</span></div></div>
<!-- 4: nested flex item with max-height LARGER than stretched size — stretch wins -->
<div class="outer" style="height: 120px;"><div id="item4" style="display: flex; max-height: 500px;"><span>four</span></div></div>

<script>
(function () {
	var N = 4, k = 0, res = [];
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) { res.push([n, ok, text]); }
	function h(id) { return $(id).getBoundingClientRect().height; }
	function show() {
		var i, r, p;
		for (i = 0; i < res.length; i++) {
			r = res[i]; p = $('r' + r[0]);
			p.textContent = r[0] + ' ' + r[2] + (r[1] ? '' : ' FAIL');
			if (r[1]) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'STRMAX194: ' + k + '/' + N + ' passed';
		document.title = 'JS flex stretch max-height (' + k + '/' + N + ')';
	}
	function run() {
		/* 1: 200px row, nested flex max-height 50px -> clamped to ~50 */
		var h1 = h('item1');
		t(1, h1 >= 48 && h1 <= 52, 'flex max-height clamp h=' + h1);
		/* 2: 200px row, nested grid max-height 60px -> clamped to ~60 */
		var h2 = h('item2');
		t(2, h2 >= 58 && h2 <= 62, 'grid max-height clamp h=' + h2);
		/* 3: 200px row, nested flex no max-height -> stretched to ~200 */
		var h3 = h('item3');
		t(3, h3 >= 195 && h3 <= 205, 'flex stretch kept h=' + h3);
		/* 4: 120px row, nested flex max-height 500px -> stretched to ~120 */
		var h4 = h('item4');
		t(4, h4 >= 115 && h4 <= 125, 'large max-height stretch h=' + h4);
		show();
	}
	if (document.readyState === 'complete') run();
	else window.addEventListener('load', run);
})();
</script>
</body>
</html>
