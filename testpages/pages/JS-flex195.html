<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS flex195 (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#res { position: fixed; top: 0; left: 0; right: 0; background: #fff; }
/* patch 195: patch 183's oversized-item centering must apply only to
 * single-line flex containers, not multi-line (wrapped) ones. */
.single { display: flex; align-items: center; height: 48px; border: 1px solid black; margin-bottom: 8px; }
.multi { display: flex; flex-wrap: wrap; align-items: center; width: 200px; border: 1px solid black; margin-bottom: 8px; }
.item { background: #ddf; }
</style>
</head>
<body>
<div id="res">
<div id="sum">FLEX195: 0/4 passed</div>
<div id="r1" class="wait">1</div>
<div id="r2" class="wait">2</div>
<div id="r3" class="wait">3</div>
<div id="r4" class="wait">4</div>
</div>

<!-- 1: single-line, oversized centered item (183 case) - 64px item in 48px row -->
<div class="single"><div id="s1" class="item" style="height: 64px; width: 50px;">tall</div></div>
<!-- 2: single-line, normal centered item -->
<div class="single"><div id="s2" class="item" style="height: 20px; width: 50px;">ok</div></div>
<!-- 3: multi-line wrap, items that wrap to 2 lines -->
<div class="multi"><div id="m1" class="item" style="height: 30px; width: 120px;">a</div><div id="m2" class="item" style="height: 30px; width: 120px;">b</div></div>
<!-- 4: multi-line wrap with oversized item in first line -->
<div class="multi"><div id="m3" class="item" style="height: 60px; width: 120px;">tall</div><div id="m4" class="item" style="height: 20px; width: 120px;">c</div></div>

<script>
(function () {
	var N = 4, k = 0, res = [];
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) { res.push([n, ok, text]); }
	function r(id) { return $(id).getBoundingClientRect(); }
	function show() {
		var i, rr, p;
		for (i = 0; i < res.length; i++) {
			rr = res[i]; p = $('r' + rr[0]);
			p.textContent = rr[0] + ' ' + rr[2] + (rr[1] ? '' : ' FAIL');
			if (rr[1]) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'FLEX195: ' + k + '/' + N + ' passed';
		document.title = 'JS flex195 (' + k + '/' + N + ')';
	}
	function run() {
		/* 1: 64px item centered in 48px single-line row ->
		 * free space = 48-64 = -16, item top at -8 relative to row.
		 * Row is first .single div; get its top. */
		var row1 = $('s1').parentNode.getBoundingClientRect();
		var b1 = r('s1');
		var off1 = b1.top - row1.top;
		/* 183: item centered with -8 offset (tolerance for borders) */
		t(1, off1 >= -12 && off1 <= -4, 'single oversized centered off=' + off1.toFixed(1));
		/* 2: 20px item centered in 48px row -> top at (48-20)/2 = 14 */
		var row2 = $('s2').parentNode.getBoundingClientRect();
		var b2 = r('s2');
		var off2 = b2.top - row2.top;
		t(2, off2 >= 10 && off2 <= 18, 'single normal centered off=' + off2.toFixed(1));
		/* 3: multi-line wrap - two 120px items in 200px container ->
		 * must wrap to 2 lines, both items laid out (not collapsed) */
		var b3a = r('m1'), b3b = r('m2');
		t(3, b3b.top > b3a.top + 10, 'multi-line wraps m1.top=' + b3a.top.toFixed(0) + ' m2.top=' + b3b.top.toFixed(0));
		/* 4: multi-line with 60px tall item in first line, 20px in second.
		 * The 183 container-cross substitution must NOT apply: each
		 * line uses its own cross size. Just verify sane layout. */
		var b4a = r('m3'), b4b = r('m4');
		var h4a = b4a.height, h4b = b4b.height;
		t(4, h4a >= 55 && h4a <= 65 && h4b >= 15 && h4b <= 25 && b4b.top > b4a.top,
		  'multi-line heights ok h1=' + h4a.toFixed(0) + ' h2=' + h4b.toFixed(0));
		show();
	}
	if (document.readyState === 'complete') run();
	else window.addEventListener('load', run);
})();
</script>
</body>
</html>
