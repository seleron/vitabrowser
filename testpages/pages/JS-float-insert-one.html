<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JS float insert one</title>
<style>
/* Patch 365: one float a script inserts between two blocks (in a div
 * holding only blocks). Before, its box was built into an inline
 * container at the end of the div and drew below Block E; now it sits
 * between A and B, B and C wrapping beside it, exactly as
 * CSS-float-insert-one-ref.html (the gate compares the snapshots). */
body { margin: 0; padding-top: 40px; font-family: sans-serif; font-size: 16px; }
p { margin: 4px 10px; }
.f { float: left; width: 60px; height: 40px; margin: 4px 8px 4px 10px; background: #0a0; }
</style></head><body>
<div id="w">
<p id="a">Block A first paragraph of text that is long enough to wrap around a float maybe.</p>
<p id="b">Block B second paragraph of text that is long enough to wrap around a float maybe.</p>
<p id="c">Block C third paragraph.</p>
<p id="d">Block D fourth paragraph.</p>
<p id="e">Block E fifth paragraph.</p>
</div>
<script>
window.addEventListener('load', function () {
	setTimeout(function () {
		var f = document.createElement('div');
		f.className = 'f';
		document.getElementById('w').insertBefore(f, document.getElementById('b'));
	}, 300);
});
</script>
</body></html>
