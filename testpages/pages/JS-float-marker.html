<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS float marker</title>
<style>
/* Patch 420. A block restyled whole (376) declined when it held a float
 * or a list marker: rte's float columns, google's and archwiki's list
 * items. A marker's number is worked out at layout; the ancestors' float
 * lists are emptied before the old boxes go and the page is laid out
 * whole. Here: a block of floats gains a class (floats re-placed), a list
 * item of a numbered list and a bulleted one gain classes, and a list
 * gains a class (its items renumbered at layout). Row for row as
 * CSS-float-marker-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, ol, ul { margin: 4px 10px; }
.fl { float: left; width: 80px; height: 30px; background: #cde; margin: 2px; }
.wide .fl { width: 120px; }
.big { font-size: 18px; }
.sq { list-style-type: square; }
</style>
</head>
<body>
<div id="cols"><div>Floats:</div><div class="fl">one</div><div class="fl">two</div><div class="fl">three</div><div style="clear:both">after</div></div>
<ol id="ol"><li>First</li><li id="li2">Second</li><li>Third</li></ol>
<ul id="ul"><li>Bullet one</li><li id="li5">Bullet two</li></ul>
<div>The last block.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('cols').className = 'wide'; },
		function () { $('li2').className = 'big'; },
		function () { $('li5').className = 'big'; },
		function () { $('ul').className = 'sq'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
