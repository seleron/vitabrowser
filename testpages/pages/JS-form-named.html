<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form named access (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">FORMNAMED: 0/7 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<form id="f" name="myform">
<input name="q" id="qid" value="query">
<input type="radio" name="r" value="1"><input type="radio" name="r" value="2" checked>
<fieldset name="fs"><select name="s"><option>x</option></select></fieldset>
<textarea id="tid"></textarea>
<input type="image" name="img" alt="image button">
<img name="logo" alt="">
</form>
<input name="outside" form="f">
<img name="docimg" alt="">
<script>
/* patch 288: named access, as most older pages script forms --
 * form.elements (an HTMLFormControlsCollection: namedItem, by name and
 * id, a RadioNodeList for a radio group, live, the same object), a form
 * by name and index and its length, document.forms by name,
 * document.myform. Chromium-verified. */
(function () {
	var k = 0, N = 7, d = document;
	function $(id) { return d.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FORMNAMED: ' + k + '/' + N + ' passed';
		d.title = 'JS form named access (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var f = $('f');
	check(1, function () {
		var e = f.elements, names = Array.prototype.map.call(e, function (x) { return x.name || x.id; }).join(',');
		if (!(e instanceof HTMLFormControlsCollection) || e !== f.elements) return 'type / identity';
		return names === 'q,r,r,fs,s,tid,outside' && e.length === 7 ? true : names + ' ' + e.length;
	}, 'elements: the form\'s controls (form="f" too, image buttons not), one object');
	check(2, function () {
		var e = f.elements;
		return e.namedItem('q') === $('qid') && e.namedItem('qid') === $('qid') && e.q === $('qid') &&
			e['tid'] === $('tid') && e.outside && e.outside.name === 'outside' &&
			e.namedItem('nope') === null && e.nope === undefined && e.item(0) === $('qid') && e[0] === $('qid') ? true : 'lookups';
	}, 'namedItem, by name and id, item, index');
	check(3, function () {
		var r = f.elements.namedItem('r');
		if (!(r instanceof RadioNodeList) || r.length !== 2 || r.value !== '2') return 'group ' + r;
		r.value = '1';
		if (!r[0].checked || r[1].checked || r.value !== '1') return 'value= ' + r.value;
		r[1].checked = true;
		if (r[0].checked || r.value !== '2') return 'checked= leaves two checked';
		return f.elements.r instanceof RadioNodeList ? true : 'elements.r';
	}, 'a radio group is a RadioNodeList with a value; one checked at a time');
	check(4, function () {
		var n = d.createElement('input'); n.name = 'added'; f.appendChild(n);
		var ok = f.elements.length === 8 && f.elements.added === n;
		n.remove();
		return ok && f.elements.length === 7 ? true : 'not live';
	}, 'elements is live');
	check(5, function () {
		return f.q === $('qid') && f[0] === $('qid') && f.length === 7 && f.r instanceof RadioNodeList &&
			f.logo && f.logo.nodeName === 'IMG' && f.nope === undefined ? true : 'form access';
	}, 'a form by name and index, its length, its images by name');
	check(6, function () {
		return d.forms instanceof HTMLCollection && d.forms.myform === f && d.forms.namedItem('f') === f &&
			d.forms[0] === f && d.forms.length === 1 ? true : 'forms';
	}, 'document.forms by name, id and index');
	check(7, function () {
		return d.myform === f && d.docimg && d.docimg.nodeName === 'IMG' && d.nosuchname === undefined ? true :
			'document ' + d.myform + ' ' + d.docimg;
	}, 'document.myform, document.<image name>');
})();
</script>
</body>
</html>
