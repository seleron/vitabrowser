<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form named shadowing, prototype chain (script not run)</title>
<!-- Patch 305: patch 297 made a form's named controls shadow the
     form's own interface ([LegacyOverrideBuiltIns]), but members
     inherited from further up the chain -- HTMLElement, Element
     and Node members such as id, title, children, focus, tagName,
     nodeType -- still answered with the form's own values, so a
     control named "id" did not shadow. Browsers shadow the whole
     chain. Pinned against Firefox before fixing (2026-10-19):
     every one of those members reads as the control, by name and
     by id; a form without collisions reads its own values; and a
     write to a shadowed accessor (form.id = ...) still reaches
     the built-in setter -- the attribute changes -- while reads
     keep returning the control. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">FSHADOW2: 0/10 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<p id="r9" class="wait">9 waiting</p>
<p id="r10" class="wait">10 waiting</p>
<form id="theform" title="FORMTITLE">
  <input name="id" id="c-id">
  <input name="title" id="c-title">
  <input name="children" id="c-children">
  <input name="focus" id="c-focus">
  <input name="tagName" id="c-tagname">
  <input name="nodeType" id="c-nodetype">
  <input name="className" id="c-classname">
  <input id="dir">
</form>
<form id="plain" title="PT">
  <input name="a" id="c-a">
</form>
<script>
(function () {
	var k = 0, N = 10;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FSHADOW2: ' + k + '/' + N + ' passed';
		document.title = 'JS form named shadowing, chain (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var f1 = $('theform'), f2 = $('plain');
	check(1, function () {
		return f1.id === $('c-id') || String(f1.id);
	}, 'a control named id shadows the form id reflection');
	check(2, function () {
		return f1.title === $('c-title') || String(f1.title);
	}, 'a control named title shadows the title reflection');
	check(3, function () {
		return f1.children === $('c-children') || String(f1.children);
	}, 'a control named children shadows the child list');
	check(4, function () {
		return f1.focus === $('c-focus') || typeof f1.focus;
	}, 'a control named focus shadows the method');
	check(5, function () {
		return f1.tagName === $('c-tagname') || String(f1.tagName);
	}, 'a control named tagName shadows the tag name');
	check(6, function () {
		return f1.nodeType === $('c-nodetype') || String(f1.nodeType);
	}, 'a control named nodeType shadows the node type');
	check(7, function () {
		return f1.dir === $('dir') || String(f1.dir);
	}, 'a control with id dir shadows by id too');
	check(8, function () {
		return f1.className === $('c-classname') || String(f1.className);
	}, 'a control named className shadows the class reflection');
	check(9, function () {
		return (f2.id === 'plain' && f2.title === 'PT' &&
			f2.tagName === 'FORM' && f2.nodeType === 1 &&
			typeof f2.focus === 'function') ||
			[f2.id, f2.title, f2.tagName, f2.nodeType,
			 typeof f2.focus].join('/');
	}, 'a form without collisions keeps every built-in');
	check(10, function () {
		f1.id = 'changed';
		return (f1.getAttribute('id') === 'changed' &&
			f1.id === $('c-id')) ||
			f1.getAttribute('id') + '/' + String(f1.id);
	}, 'a write to a shadowed accessor still reaches the built-in');
})();
</script>
</body>
</html>
