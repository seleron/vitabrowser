<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form named shadowing (script not run)</title>
<!-- Patch 297: a form's named controls shadow its built-ins, as
     [LegacyOverrideBuiltIns] does in browsers -- an input named
     "submit" makes form.submit the input, not the method. Patch
     288's named access only saw names HTMLFormElement.prototype
     does not have, so controls named after built-ins (submit,
     reset, action, length are the classic accidents) never
     shadowed. The checks: the method, another method, an IDL
     attribute and the length accessor all read as the control;
     a form without collisions keeps its method, its count and
     its action; a write to a shadowed name does not stick. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">FORMSHADOW: 0/6 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<form id="f1">
  <input name="submit" id="c-submit">
  <input name="reset" id="c-reset">
  <input name="action" id="c-action">
  <input name="length" id="c-length">
  <input name="q" id="c-q">
</form>
<form id="f2" action="/x">
  <input name="a" id="c-a">
  <input name="b" id="c-b">
</form>
<script>
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FORMSHADOW: ' + k + '/' + N + ' passed';
		document.title = 'JS form named shadowing (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var f1 = $('f1'), f2 = $('f2');
	check(1, function () {
		return f1.submit === $('c-submit') || typeof f1.submit;
	}, 'a control named submit shadows the method');
	check(2, function () {
		return (f1.reset === $('c-reset') && f1.action === $('c-action')) ||
			typeof f1.reset + '/' + typeof f1.action;
	}, 'reset and the action attribute are shadowed too');
	check(3, function () {
		return f1.length === $('c-length') || String(f1.length);
	}, 'a control named length shadows the count');
	check(4, function () {
		return (typeof f2.submit === 'function' && f2.length === 2) ||
			typeof f2.submit + '/' + f2.length;
	}, 'a form without collisions keeps its method and count');
	check(5, function () {
		return (typeof f2.action === 'string' && f2.action.indexOf('/x') >= 0) ||
			String(f2.action);
	}, 'and its action still reflects the attribute');
	check(6, function () {
		f1.submit = 42;
		var after = f1.submit === $('c-submit');
		delete f1.submit;
		return (after && f1.submit === $('c-submit')) || String(f1.submit);
	}, 'a write to a shadowed name does not stick');
})();
</script>
</body>
</html>
