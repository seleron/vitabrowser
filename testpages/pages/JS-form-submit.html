<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form submit (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
</style>
</head>
<body>
<p id="state">The script never ran.</p>
<script>
/* Patch 263: a script submits a form. form.submit(), requestSubmit() and
 * a submit button's click() did nothing -- click() fired the click event
 * only, and the other two went through it. Cloudflare's challenge ends by
 * clicking a hidden submit button in a form it made; Stack Overflow never
 * cleared. Three checks run first and their result travels in the form
 * that is then submitted the way Cloudflare does it: the gate's /echo
 * answers with the request body, "res=passed3of3&ev=fired&k=v+1" when
 * all is well (the submit event's listener fills "ev"). Chromium-verified. */
(function () {
	var ok = 0;
	function mk(action) {
		var f = document.createElement('form');
		f.setAttribute('action', action);
		f.setAttribute('method', 'POST');
		f.setAttribute('enctype', 'application/x-www-form-urlencoded');
		document.body.appendChild(f);
		return f;
	}
	function btn(f, type) {
		var b = document.createElement('button');
		b.setAttribute('type', type);
		b.setAttribute('style', 'display:none');
		f.appendChild(b);
		return b;
	}
	/* 1: requestSubmit fires submit with its submitter (cancelled here) */
	var f1 = mk('nowhere-1'), b1 = btn(f1, 'submit'), got1 = null;
	f1.addEventListener('submit', function (e) { got1 = e.submitter; e.preventDefault(); });
	f1.requestSubmit(b1);
	if (got1 === b1) ok++;
	/* 2: a cancelled click on a submit button submits nothing */
	var f2 = mk('nowhere-2'), b2 = btn(f2, 'submit'), sub2 = 0;
	f2.addEventListener('submit', function (e) { sub2++; e.preventDefault(); });
	b2.addEventListener('click', function (e) { e.preventDefault(); });
	b2.click();
	if (sub2 === 0) ok++;
	/* 3: click() on a type=button button submits nothing */
	var f3 = mk('nowhere-3'), b3 = btn(f3, 'button'), sub3 = 0;
	f3.addEventListener('submit', function (e) { sub3++; e.preventDefault(); });
	b3.click();
	if (sub3 === 0) ok++;
	/* the real one: hidden fields, a hidden submit button, click() */
	var f = mk('echo');
	function field(name, value) {
		var i = document.createElement('input');
		i.setAttribute('type', 'hidden');
		i.setAttribute('name', name);
		i.setAttribute('value', value);
		f.appendChild(i);
		return i;
	}
	field('res', ok === 3 ? 'passed3of3' : 'failed' + ok + 'of3');
	var ev = field('ev', 'not-fired');
	field('k', 'v 1');
	f.addEventListener('submit', function () { ev.setAttribute('value', 'fired'); ev.value = 'fired'; });
	var b = btn(f, 'submit');
	document.getElementById('state').textContent = 'Submitting (' + ok + '/3 before)...';
	b.click();
})();
</script>
</body>
</html>
