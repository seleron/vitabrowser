<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form submitters</title>
</head>
<body>
<!-- Patch 283: which button a script's submission sends. ?img: requestSubmit
 with an image button -- "pic.x" and "pic.y" at 0, 0 (the submission was
 abandoned: no click coordinates); ?imgnoname: a nameless one -- "x", "y";
 ?nosub: requestSubmit() -- no button (the first submit button was sent);
 ?submit: form.submit() -- no button; ?button: requestSubmit(second) --
 that button only; ?values (patch 287): values a script set -- a
 textarea's and a select's -- are what is sent. The gate server answers
 FORMCHECK <case> ok <digest>. -->
<form id="f" method="post" enctype="multipart/form-data">
<input type="hidden" name="k" value="v">
<input type="submit" name="first" value="1">
<input type="image" name="pic" alt="pic">
<button type="submit" name="second" value="2">second</button>
</form>
<form id="v" method="post" enctype="multipart/form-data">
<textarea name="ta">text</textarea>
<select name="one"><option>a</option><option>b</option></select>
<select name="many" multiple><option>m1</option><option selected>m2</option><option>m3</option></select>
<select name="two"><option selected>x</option><option selected>y</option></select>
</form>
<form id="g" method="post" enctype="multipart/form-data">
<input type="hidden" name="k" value="v">
<input type="image" alt="nameless">
</form>
<script>
(function () {
	var c = location.search.slice(1) || 'nosub';
	var f = document.getElementById(c === 'imgnoname' ? 'g' : c === 'values' ? 'v' : 'f');
	f.setAttribute('action', 'form-check?case=' + c);
	if (c === 'img') f.requestSubmit(f.querySelector('input[type=image]'));
	else if (c === 'imgnoname') f.requestSubmit(f.querySelector('input[type=image]'));
	else if (c === 'submit') f.submit();
	else if (c === 'button') f.requestSubmit(f.querySelector('button'));
	else if (c === 'values') {
		var made = document.createElement('textarea');
		made.name = 'made'; made.value = 'made\nvalue'; f.appendChild(made);
		f.querySelector('textarea').value = 'set by script';
		f.querySelector('[name=one]').value = 'b';
		f.querySelector('[name=many]').options[2].selected = true;
		f.submit();
	}
	else f.requestSubmit();
})();
</script>
</body>
</html>
