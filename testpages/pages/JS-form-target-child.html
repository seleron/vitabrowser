<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>form target child</title></head>
<body><p>Loaded in a frame.</p>
<!-- JS-form-target.html's link target: tells the page above where it landed -->
<script>try { if (parent !== window) parent.postMessage('TARGETED' + location.search, '*'); } catch (e) {}</script>
</body></html>
