<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form target (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; padding-top: 160px; }
#sum { font-size: 20px; font-weight: bold; }
.big { position: absolute; left: 10px; width: 300px; height: 40px; font-size: 18px; }
#send { top: 30px; }
#lnk { top: 100px; display: block; background: #ddd; text-align: center; line-height: 40px; }
iframe { width: 300px; height: 40px; }
</style>
</head>
<body>
<div id="sum">FORMTARGET: 0/5 passed</div>
<p id="got">nothing yet</p>
<iframe name="nosrc"></iframe>
<iframe name="blank" src="about:blank"></iframe>
<iframe name="hidden" style="display:none"></iframe>
<form id="f1" action="form-check?case=nosrc" method="post" target="nosrc"></form>
<form id="f2" action="form-check?case=blank" method="post" target="blank"></form>
<form id="f3" action="form-check?case=hidden" method="post" target="hidden"></form>
<form id="f4" action="form-check?case=made" method="post" target="made"></form>
<form id="f5" action="form-check?case=later" method="post" target="later"></form>
<form id="tf" action="form-check?case=tapped" method="post" target="nosrc">
<button class="big" id="send" type="submit">Send into the frame</button>
</form>
<a class="big" id="lnk" href="JS-form-target-child.html?link" target="hidden">Link into the hidden frame</a>
<iframe name="later"></iframe>
<script>
/* patch 289: a form (or link) whose target names an iframe loads its
 * result in that iframe, not over the page: an iframe without src, one
 * declared after the form, a display:none one, one a script made -- each
 * a browsing context with that name, as in browsers. Only an iframe with
 * a src had a window here; for the others the result replaced the whole
 * page. The gate server's /form-check page tells this page (postMessage)
 * that it arrived. Plain: five forms submitted by script. ?tap: a Send
 * button and a link to tap (the gate's scriptless-forms section).
 * Chromium-verified. */
(function () {
	var d = document, got = {}, tap = location.search === '?tap', want = tap ? ['tapped', 'link'] : ['nosrc', 'blank', 'hidden', 'made', 'later'];
	if (tap) d.getElementById('sum').textContent = 'FORMTARGET tap: waiting';
	var mf = d.createElement('iframe'); mf.name = 'made'; d.body.appendChild(mf);
	addEventListener('message', function (e) {
		var m = String(e.data), c = /^FORMCHECK (\S+) ok /.exec(m);
		if (c) got[c[1]] = 1;
		if (m === 'TARGETED?link') got.link = 1;
		var k = want.filter(function (w) { return got[w]; });
		d.getElementById('got').textContent = 'arrived in frames: ' + k.join(', ');
		if (tap) {
			d.getElementById('sum').textContent = 'FORMTARGET tap: ' + k.join(',');
			d.title = 'FORMTARGET tap ' + k.join(',');
		} else {
			d.getElementById('sum').textContent = 'FORMTARGET: ' + k.length + '/' + want.length + ' passed';
			d.title = 'JS form target (' + k.length + '/' + want.length + ')';
		}
	});
	if (tap) return;
	addEventListener('load', function () {
		var i = 1;
		(function next() {
			if (i > 5) return;
			d.getElementById('f' + i).submit();
			i++;
			setTimeout(next, 400);
		})();
	});
})();
</script>
</body>
</html>
