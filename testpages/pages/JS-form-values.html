<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form values (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">FORMVAL: 0/8 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<form id="f">
<textarea id="ta" name="ta">default text</textarea>
<select id="one" name="one"><option>a</option><option value="bv" selected>b</option><option>c</option></select>
<select id="none"><option disabled>d</option><option>e</option></select>
<select id="two"><option selected>x</option><option selected>y</option></select>
<select id="many" multiple><option>m1</option><option selected>m2</option><option>m3</option></select>
<input type="checkbox" id="cb"><input type="radio" id="rd"><input type="checkbox" id="cbv" value="yes">
</form>
<script>
/* patch 287: form controls' values as browsers have them -- a textarea's
 * value is its text until one is set (and setting it leaves the text
 * alone); a select has options, selectedIndex, value, selectedOptions,
 * length, type, add/remove/item/namedItem, and its selection is HTML's
 * (the last option marked in a drop-down, else its first enabled one);
 * an option's value falls back to its text; a checkbox reads "on";
 * elements that are not controls have no value. Chromium-verified. */
(function () {
	var k = 0, N = 8, d = document;
	function $(id) { return d.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'FORMVAL: ' + k + '/' + N + ' passed';
		d.title = 'JS form values (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	function J(v) { return JSON.stringify(v); }
	check(1, function () {
		var ta = $('ta');
		if (ta.value !== 'default text' || ta.defaultValue !== 'default text') return 'read ' + J(ta.value) + ' ' + J(ta.defaultValue);
		ta.textContent = 'changed text';
		if (ta.value !== 'changed text') return 'text not followed: ' + J(ta.value);
		ta.value = 'a\r\nb\rc';
		if (ta.value !== 'a\nb\nc' || ta.textLength !== 5) return 'set ' + J(ta.value) + ' ' + ta.textLength;
		if (ta.textContent !== 'changed text' || ta.defaultValue !== 'changed text' || ta.hasAttribute('value')) return 'the text changed: ' + J(ta.textContent);
		ta.textContent = 'later';
		return ta.value === 'a\nb\nc' ? true : 'a set value followed the text: ' + J(ta.value);
	}, 'textarea value, defaultValue, textLength');
	check(2, function () {
		var s = $('one');
		if (s.value !== 'bv' || s.selectedIndex !== 1 || s.type !== 'select-one' || s.length !== 3) return J([s.value, s.selectedIndex, s.type, s.length]);
		s.selectedIndex = 2;
		if (s.value !== 'c' || !s.options[2].selected || s.options[1].selected) return 'selectedIndex= ' + J([s.value, s.options[2].selected, s.options[1].selected]);
		s.value = 'a';
		if (s.selectedIndex !== 0) return 'value= ' + s.selectedIndex;
		s.value = 'nothing';
		return s.selectedIndex === -1 && s.value === '' ? true : 'no match ' + J([s.selectedIndex, s.value]);
	}, 'select value, selectedIndex, type, length');
	check(3, function () {
		var a = $('none'), b = $('two');
		return a.selectedIndex === 1 && a.value === 'e' && b.selectedIndex === 1 && b.value === 'y' &&
			!b.options[0].selected ? true : J([a.selectedIndex, a.value, b.selectedIndex, b.value, b.options[0].selected]);
	}, 'a drop-down selects its last marked option, or its first enabled one');
	check(4, function () {
		var m = $('many');
		if (m.type !== 'select-multiple' || m.selectedIndex !== 1 || m.selectedOptions.length !== 1) return J([m.type, m.selectedIndex, m.selectedOptions.length]);
		m.options[2].selected = true;
		if (m.selectedOptions.length !== 2 || !m.options[1].selected) return 'both ' + m.selectedOptions.length;
		m.options[1].selected = false;
		return m.selectedOptions.length === 1 && m.selectedOptions[0].text === 'm3' && m.value === 'm3' ? true : 'off ' + m.value;
	}, 'select multiple: selected, selectedOptions');
	check(5, function () {
		var s = $('one'), o = s.options;
		if (!(o instanceof HTMLOptionsCollection) || o !== s.options || o.length !== 3 || o[0] !== o.item(0) || o[0].text !== 'a') return 'collection';
		var n = d.createElement('option'); n.id = 'nid'; n.textContent = 'new';
		s.add(n, 0);
		if (s.options[0] !== n || s.namedItem('nid') !== n || o.length !== 4 || n.index !== 0) return 'add ' + o.length;
		s.remove(0);
		if (o.length !== 3 || n.parentNode) return 'remove ' + o.length;
		s.length = 2;
		return o.length === 2 && s.options[1].value === 'bv' ? true : 'length= ' + o.length;
	}, 'options collection: [i], item, namedItem, add, remove, length');
	check(6, function () {
		var o = d.createElement('option');
		o.textContent = '  two   words ';
		if (o.value !== 'two words' || o.text !== 'two words' || o.label !== 'two words' || o.index !== 0 || o.form !== null) return J([o.value, o.text, o.label, o.index]);
		o.value = 'v'; o.label = 'L';
		if (o.value !== 'v' || o.label !== 'L' || o.getAttribute('value') !== 'v') return 'set';
		o.defaultSelected = true;
		return o.selected === true && o.hasAttribute('selected') && $('one').options[0].form === $('f') ? true : 'selected/form';
	}, 'option value, text, label, index, form, defaultSelected');
	check(7, function () {
		return $('cb').value === 'on' && $('rd').value === 'on' && $('cbv').value === 'yes' ? true : J([$('cb').value, $('rd').value, $('cbv').value]);
	}, 'a checkbox or radio without a value reads "on"');
	check(8, function () {
		var div = d.createElement('div'), li = d.createElement('li'), bt = d.createElement('button'), out = d.createElement('output');
		li.setAttribute('value', '3'); bt.setAttribute('value', 'b'); out.textContent = 'o';
		return div.value === undefined && !('value' in div) && d.createElement('span').value === undefined &&
			li.value === 3 && bt.value === 'b' && out.value === 'o' ? true : J([div.value, 'value' in div, li.value, bt.value, out.value]);
	}, 'elements that are not controls have no value; li, button, output');
})();
</script>
</body>
</html>
