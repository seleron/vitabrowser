<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS form walk cost (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<form name="f1" id="f1"><input name="q"><input name="firstChild" value="shadow"><button>Go</button></form>
<form id="f2"><input name="email"><select name="s"><option>a</option></select></form>
<form id="f3"><textarea name="t"></textarea></form>
<div id="bulk"></div>
<!-- 7000 px spacer: the bottom dump's 7 s window covers the legs (see
 * JS-style-absorb.html). -->
<div style="height: 7000px"></div>
<div id="sum">FORMWALK: 0/3 passed</div>
<p id="r1">1 waiting (the script never ran)</p>
<p id="r2">2 waiting</p>
<p id="r3">3 waiting</p>
<script>
/* Patch 322: patch 305 wraps every Node / Element / HTMLElement member
 * for forms, and each read on a form (firstChild, nodeType,
 * getAttribute, ...) ran the whole named-control search: a full-document
 * JS walk plus owner walks per control and per <img>. Any DOM walk that
 * passed a form paid it per read -- theguardian.com spent ~130 s of CPU
 * in one timer. Leg 1 runs an attribute-selector query (the polyfill's
 * JS walk, which reads those members on every element, forms included)
 * 20 times over ~2000 elements and 3 forms with 300 named images; before
 * 322 the 20 queries took ~3.7 s in the simulator, after it ~0.3 s;
 * the 1500 ms bound fails the old cost on its own. Legs 2-3
 * keep 288/297/305's semantics: a control named firstChild still shadows
 * the form's member, and the document's named access still answers. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		$('r' + n).textContent = n + ' ' + text + (ok ? ' ok' : ' FAIL');
		if (!ok) return;
		k++;
		$('sum').textContent = 'FORMWALK: ' + k + '/' + N + ' passed';
		document.title = 'JS form walk cost (' + k + '/' + N + ')';
	}
	var steps = [
		function () {
			var b = $('bulk'), h = [];
			for (var i = 0; i < 1700; i++)
				h.push(i % 6 === 0 ? '<img name="im' + i + '" alt="">' :
					'<span data-k="' + (i % 7) + '"></span>');
			b.innerHTML = h.join('');
		},
		function () {
			/* performance.now: the monotonic clock (WSL's wall clock
			 * steps +2.2 s every ~34 s, which Date.now would read) */
			var t0 = performance.now(), n = 0;
			for (var r = 0; r < 20; r++)
				n = document.querySelectorAll('[data-k="3"]').length;
			var ms = Math.round(performance.now() - t0);
			t(1, n > 0 && ms < 1500, 'attribute query x20 with forms present: ' + ms + ' ms, ' + n + ' hits');
			var f = $('f1'), fc = f.firstChild;
			t(2, fc && fc.nodeName === 'INPUT' && fc.value === 'shadow',
				'control named firstChild shadows (' + (fc && fc.nodeName) + ')');
			t(3, document.f1 === f && document.noSuchNameVb322 === undefined,
				'document named access (' + (document.f1 === f) + ')');
		}
	];
	var i = 0;
	function next() {
		steps[i++]();
		if (i < steps.length) setTimeout(next, 1200);
	}
	window.addEventListener('load', function () { setTimeout(next, 600); });
})();
</script>
</body>
</html>
