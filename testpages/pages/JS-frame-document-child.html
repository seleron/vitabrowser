<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>XDOC2 child one (parsed title)</title></head>
<body><p id="kid">the first XDOC2 child frame</p>
<script>
/* JS-frame-document.html's first child (patch 304, item 7 stage 1).
 * Its script changes the document's title -- the parent must read the
 * NEW title through the handle, which proves the read crosses into
 * this realm's real document and is not a load-time copy. It reports
 * its own scalar state to the parent on request and after load, and
 * navigates itself to the second child when the parent asks (the
 * lifetime check's navigation). */
document.title = 'XDOC2 child one';
function state() {
	parent.postMessage({ xdoc2: 'state', iam: 'one',
		title: document.title, href: location.href,
		readyState: document.readyState }, '*');
}
window.addEventListener('message', function (e) {
	if (e.data === 'state?') state();
	if (e.data === 'navigate') location.href = 'JS-frame-document-child2.html';
});
window.addEventListener('load', function () {
	state();
	setTimeout(state, 400);
});
state();
</script>
</body></html>
