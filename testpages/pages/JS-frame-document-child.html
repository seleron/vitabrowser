<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>XDOC2 child one (parsed title)</title></head>
<body><p id="kid">the first XDOC2 child frame</p>
<script>
/* JS-frame-document.html's first child (patch 304, item 7 stage 1;
 * stage-2 content added by patch 306). Its script changes the
 * document's title -- the parent must read the NEW title through
 * the handle, which proves the read crosses into this realm's real
 * document and is not a load-time copy. It reports its own scalar
 * state to the parent on request and after load, and navigates
 * itself to the second child when the parent asks (the lifetime
 * check's navigation).
 * Stage 2 (patch 306): at load it creates two more <p> elements --
 * one carrying id "late" -- AFTER the parsed tree exists, then
 * reports stage2:true with its own <p> count. The parent's query
 * checks key on that flag, so they can only run once the created
 * elements are really in this document: getElementById('late')
 * finding one proves the parent's queries reach the LIVE tree,
 * not a snapshot. */
document.title = 'XDOC2 child one';
function state() {
	parent.postMessage({ xdoc2: 'state', iam: 'one',
		title: document.title, href: location.href,
		readyState: document.readyState,
		stage2: !!document.getElementById('late'),
		pcount: document.querySelectorAll('p').length }, '*');
}
window.addEventListener('message', function (e) {
	if (e.data === 'state?') state();
	if (e.data === 'navigate') location.href = 'JS-frame-document-child2.html';
});
window.addEventListener('load', function () {
	var late = document.createElement('p');
	late.id = 'late';
	late.textContent = 'created after load';
	document.body.appendChild(late);
	var more = document.createElement('p');
	more.className = 'latep';
	more.textContent = 'also created after load';
	document.body.appendChild(more);
	state();
	setTimeout(state, 400);
});
state();
</script>
</body></html>
