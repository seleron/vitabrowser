<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>XDOC2 child two (parsed title)</title></head>
<body><p id="kid">the second XDOC2 child frame</p>
<script>
/* JS-frame-document.html's second child (patch 304): the frame is
 * navigated here for the lifetime check. The document handle the
 * parent holds must rebind to THIS page's scalars, while the node
 * handles it took from the first child go inert. */
document.title = 'XDOC2 child two';
function state() {
	parent.postMessage({ xdoc2: 'state', iam: 'two',
		title: document.title, href: location.href,
		readyState: document.readyState }, '*');
}
window.addEventListener('message', function (e) {
	if (e.data === 'state?') state();
});
window.addEventListener('load', function () {
	state();
	setTimeout(state, 400);
});
state();
</script>
</body></html>
