<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS frame document handle (script not run)</title>
<!-- Patch 304 (item 7, stage 1; design: docs/phase-0/19): a parsed
     same-origin iframe's contentWindow.document / contentDocument is
     the frame's REAL document, reached through a marshalled handle --
     patch 143's shim document answered in its place until now.
     Patch 306 adds stage 2: queries on the handle (checks 7-8).
     Patch 307 adds stage 3: node reads/writes (checks 9-10).
     The checks, from doc 19's gate spec:
       1. scalars cross: the parent reads URL / title / readyState
          through the handle, equal to the child's own values -- the
          title the child's SCRIPT set, not the parsed one;
       2. identity: contentDocument === contentWindow.document, and
          stable across reads;
       3. roots: documentElement is the HTML element (tagName,
          nodeType), body / head non-null, identical across reads;
       4. lifetime: the frame navigates (same-origin, second page);
          the document handle rebinds to the new page's scalars and
          the pre-navigation node handles go inert (reads undefined,
          no crash). Rebinding and inertness are doc 19's specified
          handle semantics: a browser's captured Document reference
          stays with the old page instead (the new page is reached
          by re-reading contentWindow.document), and a browser
          keeps a detached node readable. Reference check (Firefox):
          checks 1-3 and 6 pass, and the frame does navigate --
          fresh reads there show the second page's title/URL;
       5. the frame element is removed: the held document handle
          answers as a null document (scalars undefined, roots null);
       6. a cross-origin parsed frame's contentDocument stays null
          (patch 294).
       7. stage 2 queries (patch 306): on the first child --
          getElementById finds the element the child created AFTER
          load (live tree, not a snapshot) and the parsed one, and
          answers null for a missing id; querySelector returns the
          first match and null for no match; querySelectorAll('p')
          and getElementsByTagName('p') count exactly the child's
          own <p> count, created ones included. A real browser
          passes this check too (its frame document IS the real
          document); it is the stage-2 surface itself under test.
       8. stage 2 lifetime (patch 306): after the navigation, a
          node handle a query returned goes inert like a root
          handle; fresh queries answer the SECOND child's tree
          (its single <p id="kid">); after the frame's removal,
          queries on the held handle answer empty -- getElementById
          and querySelector null, the list queries length 0 --
          never a throw, never a stale node. Handle semantics as
          in check 4: a browser's captured document keeps answering
          for its old page, so this check is sim-only by design.
       9. stage 3 reads/writes (patch 307): the parent traverses
          through handles (parentNode / firstChild / childNodes),
          sets textContent and an attribute on the child's #kid
          handle, sets innerHTML on the child's #box handle,
          removes a child and moves the box through appendChild /
          removeChild with same-document handles -- and the
          CHILD's own script then reports the written state from
          its own reads (its text, its attribute, its child
          count), which is what proves the writes landed in the
          child's real DOM and not in a copy. A real browser
          passes this check too.
      10. stage 3 discipline (patch 307): appendChild with a node
          of the PARENT's own document -- not a handle of the
          child's -- is dropped (a browser would adopt the real
          node; the handle surface takes handles only, doc 19);
          and after the navigation, writes on the now-inert #kid
          handle are dropped without throwing, while its stage 3
          reads answer undefined. Sim-only, like checks 4/5/8.
     One interval drives the whole flow from script start and writes
     progress as it observes it, like the other timed gate pages: a
     timer created after the frame's removal did not reliably run
     again in this engine, and a quiet page is dumped by the
     autotest before its later legs finish.
     Over the gate server only (NET-js-frame-document): the
     cross-origin child comes from the server's https port. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
iframe { width: 300px; height: 40px; }
</style>
</head>
<body>
<div id="sum">XDOC2: 0/10 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<p id="r9" class="wait">9 waiting</p>
<p id="r10" class="wait">10 waiting</p>
<iframe id="so" src="JS-frame-document-child.html"></iframe>
<script>
document.write('<iframe id="xo" src="https://127.0.0.1:' +
	(Number(location.port || 80) + 1) +
	'/JS-xorigin-frame-child.html"><\/iframe>');
</script>
<script>
(function () {
	var k = 0, N = 10, latest = null, phase = 0, docH = null,
		oldBody = null, oldDE = null, ticks = 0, goneTries = 0,
		qHandle = null, q8nav = null, kidH = null, q10a = null,
		s9a = null, latestObs = null, obsTries = 0,
		expected2 = new URL('JS-frame-document-child2.html',
			location.href).href;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		if (!p || p.className === 'pass') return;
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'XDOC2: ' + k + '/' + N + ' passed';
		document.title = 'JS frame document handle (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	function fail(n, text) { t(n, false, text); }
	/* like check(), but the verdict is returned (true or the
	 * reason) instead of recorded -- for checks whose second leg
	 * completes later (9's child confirmation) */
	function attempt(f) {
		try { var r = f(); return r === true ? true : 'failed: ' + r; }
		catch (e) { return 'threw: ' + e; }
	}

	window.addEventListener('message', function (e) {
		var d = e.data || {};
		if (d.xdoc2 === 'state') latest = d;
		if (d.xdoc2 === 'obs') latestObs = d;
	});

	function phaseOne() {
		var so = $('so'), d = null;
		try { d = so.contentWindow.document; } catch (e) { /* */ }
		docH = d;
		check(1, function () {
			if (!d) return 'no document';
			if (d.title !== latest.title)
				return 'title ' + d.title + ' != child ' + latest.title;
			if (latest.title !== 'XDOC2 child one')
				return 'child title not the script-set one: ' + latest.title;
			if (d.URL !== latest.href)
				return 'URL ' + d.URL + ' != child ' + latest.href;
			if (d.readyState !== latest.readyState)
				return 'readyState ' + d.readyState + ' != child ' + latest.readyState;
			return true;
		}, 'scalars cross: URL/title/readyState are the child\'s own');
		check(2, function () {
			if (!d) return 'no document';
			if (so.contentDocument !== d) return 'contentDocument !== contentWindow.document';
			if (so.contentDocument !== so.contentDocument) return 'contentDocument not stable';
			return true;
		}, 'one document, identical across accessors and reads');
		check(3, function () {
			if (!d) return 'no document';
			var de = d.documentElement;
			if (!de) return 'no documentElement';
			if (de.tagName !== 'HTML') return 'documentElement tagName ' + de.tagName;
			if (de.nodeType !== 1) return 'documentElement nodeType ' + de.nodeType;
			if (d.documentElement !== de) return 'documentElement not identical';
			if (!d.body) return 'no body';
			if (d.body !== d.body) return 'body not identical across reads';
			if (!d.head || d.head.tagName !== 'HEAD') return 'no head';
			oldBody = d.body; oldDE = de;
			return true;
		}, 'roots: documentElement/body/head as node handles');
		check(6, function () {
			var xd = $('xo').contentDocument;
			return xd === null || typeof xd;
		}, 'a cross-origin frame\'s contentDocument stays null');
		check(7, function () {
			if (!d) return 'no document';
			if (typeof d.getElementById !== 'function')
				return 'no getElementById on the handle';
			var late = d.getElementById('late');
			if (!late) return 'getElementById(late) found nothing';
			if (late.tagName !== 'P')
				return 'late tagName ' + late.tagName;
			if (late.nodeType !== 1)
				return 'late nodeType ' + late.nodeType;
			var kid = d.getElementById('kid');
			if (!kid || kid.tagName !== 'P')
				return 'getElementById(kid) wrong: ' + (kid && kid.tagName);
			if (d.getElementById('no-such-id') !== null)
				return 'getElementById(missing) not null';
			var first = d.querySelector('p');
			if (!first || first.tagName !== 'P')
				return 'querySelector(p) wrong: ' + (first && first.tagName);
			if (!d.querySelector('#kid'))
				return 'querySelector(#kid) found nothing';
			if (d.querySelector('.no-such-class') !== null)
				return 'querySelector(no match) not null';
			var all = d.querySelectorAll('p');
			if (!all || all.length !== latest.pcount)
				return 'querySelectorAll(p) length ' +
					(all && all.length) + ' != child ' + latest.pcount;
			if (!all[0] || all[0].tagName !== 'P')
				return 'querySelectorAll(p)[0] not a P handle';
			var byTag = d.getElementsByTagName('p');
			if (!byTag || byTag.length !== latest.pcount)
				return 'getElementsByTagName(p) length ' +
					(byTag && byTag.length) + ' != child ' + latest.pcount;
			if (d.getElementsByTagName('*').length < latest.pcount)
				return 'getElementsByTagName(*) too short';
			qHandle = late;
			return true;
		}, 'stage 2 queries reach the child\'s live tree');
		/* stage 3, first leg (patch 307): writes and read-backs
		 * through node handles; the child's own confirmation
		 * completes check 9 in the driver's next phase */
		s9a = attempt(function () {
			if (!d) return 'no document';
			kidH = d.getElementById('kid');
			if (!kidH) return 'no kid handle';
			if (typeof kidH.textContent !== 'string')
				return 'no textContent on the handle';
			/* traversal on the parsed tree, before any write */
			if (!kidH.parentNode || kidH.parentNode.tagName !== 'BODY')
				return 'kid parentNode ' + (kidH.parentNode && kidH.parentNode.tagName);
			if (!kidH.firstChild || kidH.firstChild.nodeType !== 3)
				return 'kid firstChild not its text node';
			if (!kidH.childNodes || kidH.childNodes.length !== 1)
				return 'kid childNodes length ' + (kidH.childNodes && kidH.childNodes.length);
			if (!d.body.firstChild || d.body.firstChild.tagName !== 'P')
				return 'body firstChild not the parsed P';
			/* textContent write + parent-side read-back */
			kidH.textContent = 'parent was here';
			if (kidH.textContent !== 'parent was here')
				return 'textContent read-back: ' + kidH.textContent;
			/* attribute write + read-back; a miss answers null */
			kidH.setAttribute('data-from', 'parent');
			if (kidH.getAttribute('data-from') !== 'parent')
				return 'getAttribute read-back: ' + kidH.getAttribute('data-from');
			if (kidH.getAttribute('data-absent') !== null)
				return 'getAttribute(absent) not null';
			/* innerHTML write on the container + read-backs */
			var boxH = d.getElementById('box');
			if (!boxH) return 'no box handle';
			boxH.innerHTML = '<span>a</span><span>b</span>';
			if (!boxH.childNodes || boxH.childNodes.length !== 2)
				return 'box childNodes after innerHTML: ' + (boxH.childNodes && boxH.childNodes.length);
			if (boxH.innerHTML !== '<span>a</span><span>b</span>')
				return 'box innerHTML read-back: ' + boxH.innerHTML;
			if (!boxH.firstChild || boxH.firstChild.tagName !== 'SPAN')
				return 'box firstChild not a SPAN handle';
			/* removeChild takes a handle of the same document */
			var sp = boxH.firstChild;
			if (boxH.removeChild(sp) !== sp)
				return 'removeChild did not return the removed handle';
			if (boxH.childNodes.length !== 1)
				return 'box childNodes after removeChild: ' + boxH.childNodes.length;
			/* appendChild moves a same-document handle */
			if (d.body.appendChild(boxH) !== boxH)
				return 'appendChild did not return the moved handle';
			return true;
		});
		if (s9a !== true) t(9, false, 'stage 3 writes: ' + s9a);
		/* the frame navigates only once the child has confirmed
		 * the writes from its own reads (driver, phase 1) */
		phase = 1;
	}

	function phaseTwo(u) {
		check(4, function () {
			if (u !== expected2)
				return 'handle URL after navigation: ' + u;
			var tb = oldBody && oldBody.tagName;
			if (tb !== undefined) return 'old body handle not inert: tagName ' + tb;
			var td = oldDE && oldDE.nodeType;
			if (td !== undefined) return 'old documentElement handle not inert: nodeType ' + td;
			var tq = qHandle && qHandle.tagName;
			if (tq !== undefined) return 'pre-navigation query handle not inert: tagName ' + tq;
			return true;
		}, 'lifetime: handle rebinds, pre-navigation node handles inert');
		/* check 8, first leg: fresh queries answer the second
		 * child's tree (one <p id="kid">, no #late) */
		try {
			var nk = docH.getElementById('kid');
			if (!nk || nk.tagName !== 'P')
				q8nav = 'fresh getElementById(kid) on child two: ' +
					(nk && nk.tagName);
			else if (docH.getElementById('late') !== null)
				q8nav = 'getElementById(late) answered on child two';
			else if (docH.querySelectorAll('p').length !== 1)
				q8nav = 'fresh querySelectorAll(p) on child two: ' +
					docH.querySelectorAll('p').length;
			else if (docH.getElementsByTagName('p').length !== 1)
				q8nav = 'fresh getElementsByTagName(p) on child two';
			else q8nav = true;
		} catch (e) { q8nav = 'fresh queries threw: ' + e; }
		/* check 10, second leg: writes on the now-inert kid
		 * handle are dropped without throwing; its stage 3
		 * reads answer undefined */
		try {
			var it = kidH && kidH.textContent;
			var ig = kidH && kidH.getAttribute('data-from');
			if (kidH) {
				kidH.textContent = 'too late';
				kidH.setAttribute('data-late', 'x');
				kidH.appendChild(kidH);
			}
			t(10, q10a === true && it === undefined && ig === undefined,
				'stage 3 discipline: foreign nodes dropped, inert handles fail closed');
		} catch (e) {
			t(10, false, 'stage 3 discipline: an inert write threw: ' + e);
		}
		var so2 = $('so');
		try { so2.parentNode.removeChild(so2); } catch (e) { /* */ }
		phase = 3;
	}

	/* check 10, first leg: appendChild with a node of the
	 * PARENT's own document -- not a handle of the child's -- is
	 * dropped. It runs only once check 9 is settled, because a
	 * browser ADOPTS the node instead, which would change the
	 * box's child count check 9's confirmation reads. */
	function foreignLeg() {
		try {
			var boxH2 = docH && docH.getElementById('box');
			if (!boxH2) { q10a = false; return; }
			var before = boxH2.childNodes.length;
			var fr = document.createElement('i');
			q10a = boxH2.appendChild(fr) === undefined &&
				boxH2.childNodes.length === before;
		} catch (e) { q10a = false; }
	}

	/* check 8, second leg (after removal): queries on the held
	 * handle answer empty -- singles null, lists length 0 */
	function finishEight() {
		if (q8nav !== true) {
			t(8, false, 'stage 2 lifetime: ' + q8nav);
			return;
		}
		try {
			if (docH.getElementById('kid') !== null)
				return t(8, false, 'stage 2 lifetime: removed frame getElementById not null');
			if (docH.querySelector('p') !== null)
				return t(8, false, 'stage 2 lifetime: removed frame querySelector not null');
			if (docH.querySelectorAll('p').length !== 0)
				return t(8, false, 'stage 2 lifetime: removed frame querySelectorAll not empty');
			if (docH.getElementsByTagName('p').length !== 0)
				return t(8, false, 'stage 2 lifetime: removed frame getElementsByTagName not empty');
		} catch (e) {
			return t(8, false, 'stage 2 lifetime: removed frame queries threw: ' + e);
		}
		t(8, true, 'stage 2 lifetime: query handles inert, queries rebind, removed frame answers empty');
	}

	/* the one driver */
	var driver = setInterval(function () {
		ticks++;
		if (phase === 0) {
			if (latest && latest.iam === 'one' &&
					latest.readyState === 'complete' &&
					latest.stage2 === true) {
				phaseOne();
			} else if (ticks % 4 === 0) {
				$('r1').textContent = '1 waiting: child ' +
					(latest ? latest.iam + '/' + latest.readyState
						: 'silent') + ' (' + ticks + ')';
			}
		} else if (phase === 1) {
			/* stage 3 confirmation: the child's own reads must
			 * show the written state before the frame navigates */
			obsTries++;
			var seen = latestObs && s9a === true &&
				latestObs.kidText === 'parent was here' &&
				latestObs.dataFrom === 'parent' &&
				latestObs.boxKids === 1;
			if (seen) {
				t(9, true, 'stage 3 writes land in the child\'s tree, confirmed by the child');
				foreignLeg();
				try { $('so').src = 'JS-frame-document-child2.html'; } catch (e) { /* */ }
				phase = 2;
			} else if (obsTries >= 40) {
				if (s9a === true)
					fail(9, 'child never observed the writes: kid="' +
						(latestObs && latestObs.kidText) + '" dataFrom=' +
						(latestObs && latestObs.dataFrom) + ' boxKids=' +
						(latestObs && latestObs.boxKids));
				foreignLeg();
				try { $('so').src = 'JS-frame-document-child2.html'; } catch (e) { /* */ }
				phase = 2;
			} else if (obsTries % 4 === 0 && s9a === true) {
				$('r9').textContent = '9 waiting: child sees kid="' +
					(latestObs && latestObs.kidText) + '" boxKids=' +
					(latestObs && latestObs.boxKids) + ' (' + obsTries + ')';
			}
		} else if (phase === 2) {
			var tt = null, uu = null, rs = null;
			try {
				tt = docH && docH.title;
				uu = docH && docH.URL;
				rs = docH && docH.readyState;
			} catch (e) { /* */ }
			if (tt === 'XDOC2 child two' && rs === 'complete') {
				phaseTwo(uu);
			} else {
				$('r4').textContent = '4 waiting: title=' + tt +
					' readyState=' + rs + ' (' + ticks + ')';
				/* if the src set did not navigate the frame,
				 * ask the child to navigate itself */
				if (ticks % 12 === 0) {
					try { $('so').contentWindow.postMessage('navigate', '*'); } catch (e) { /* */ }
				}
			}
		} else if (phase === 3) {
			goneTries++;
			var gone = false;
			try {
				gone = docH && docH.URL === undefined &&
					docH.title === undefined &&
					docH.documentElement === null;
			} catch (e) { /* */ }
			if (gone) {
				t(5, true, 'removed frame: the held handle answers as a null document');
				finishEight();
				phase = 4;
				clearInterval(driver);
			} else if (goneTries >= 24) {
				fail(5, 'removed frame: handle still answers URL ' +
					(docH && docH.URL));
				t(8, false, 'stage 2 lifetime: frame never went null');
				phase = 4;
				clearInterval(driver);
			} else {
				$('r5').textContent = '5 waiting: URL=' +
					(docH && docH.URL) + ' (' + goneTries + ')';
			}
		}
	}, 250);

	/* deadline: whatever never ran is a failure with its reason */
	setTimeout(function () {
		if (phase === 0) {
			fail(1, 'child state never completed: ' +
				(latest ? latest.iam + '/' + latest.readyState : 'no message'));
			fail(2, 'not reached'); fail(3, 'not reached');
			fail(4, 'not reached'); fail(5, 'not reached');
			fail(7, 'not reached'); fail(8, 'not reached');
			fail(9, 'not reached'); fail(10, 'not reached');
		} else if (phase === 1) {
			if (s9a === true)
				fail(9, 'child never observed the writes: kid="' +
					(latestObs && latestObs.kidText) + '" boxKids=' +
					(latestObs && latestObs.boxKids));
			fail(4, 'not reached'); fail(5, 'not reached');
			fail(8, 'not reached'); fail(10, 'not reached');
		} else if (phase === 2) {
			fail(4, 'handle never rebound to the second page: title ' +
				(docH && docH.title) + ' readyState ' +
				(docH && docH.readyState));
			fail(5, 'not reached');
			if ($('r8').className !== 'pass')
				fail(8, 'stage 2 lifetime: not reached');
			if ($('r10').className !== 'pass')
				fail(10, 'stage 3 discipline: not reached');
		} else if (phase === 3) {
			fail(5, 'removed frame: handle still answers URL ' +
				(docH && docH.URL));
			if ($('r8').className !== 'pass')
				fail(8, 'stage 2 lifetime: removal leg not reached');
			if ($('r10').className !== 'pass')
				fail(10, 'stage 3 discipline: not reached');
		}
		if (k < N && $('r6').className !== 'pass' &&
				$('r6').textContent.match(/waiting/))
			fail(6, 'cross-origin check not reached');
		clearInterval(driver);
	}, 30000);
})();
</script>
</body>
</html>
