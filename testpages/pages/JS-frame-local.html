<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS script-made frames and timer chains (script not run)</title>
<!-- Patches 141 + 143, over http (a same-origin src needs an origin).
     The engine loads the frames it parses, never one a script makes:
     Google's sign-in waits for the load event of a hidden same-origin
     iframe and runs its BotGuard VM with contentWindow.eval (hardware
     run 22: "Next" sent no token and hung).
     1: a script-made about:blank frame fires onload.
     2: a script-made same-origin frame fires addEventListener('load').
     3: its contentWindow.eval runs code and returns a working function.
     4: its document is not the page's (writing into it is harmless).
     5: a script-made cross-origin frame gets no made-up document: it
        fires load once its fetch ends (also when it fails -- Chromium
        shows an error page; patch 267 loads one made during the page's
        load, which this is), and its window is not the page's and does
        not hand out its document.
     6: a 300-link setTimeout(fn, 1) chain takes under 1.5 s (patch 141:
        it was one link per frame, ~5 s). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">FRAMELOCAL: script did not run</p>
<p id="r1" class="wait">1 about:blank onload: waiting</p>
<p id="r2" class="wait">2 same-origin load: waiting</p>
<p id="r3" class="wait">3 contentWindow.eval: waiting</p>
<p id="r4" class="wait">4 separate document: waiting</p>
<p id="r5" class="wait">5 cross-origin: waiting</p>
<p id="r6" class="wait">6 timer chain: waiting</p>
<script>
(function () {
	var done = {}, N = 6;
	function pass(n, text) {
		if (done[n]) return;
		done[n] = true;
		var p = document.getElementById('r' + n);
		p.textContent = text;
		p.className = 'pass';
		var k = 0, i;
		for (i = 1; i <= N; i++) if (done[i]) k++;
		document.getElementById('sum').textContent = 'FRAMELOCAL: ' + k + '/' + N + ' passed';
		document.title = 'JS script-made frames (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'FRAMELOCAL: 0/' + N + ' passed';

	var a = document.createElement('iframe');
	a.style.display = 'none';
	a.onload = function () { pass(1, '1 about:blank onload'); };
	document.body.appendChild(a);

	var b = document.createElement('iframe');
	b.style.display = 'none';
	b.addEventListener('load', function () {
		var w = b.contentWindow, f;
		pass(2, '2 same-origin load');
		try {
			f = w.eval('(function (x) { return x * 7; })');
			if (typeof f === 'function' && f(6) === 42)
				pass(3, '3 contentWindow.eval (6*7 = ' + f(6) + ')');
		} catch (e) { /* stays waiting */ }
		try {
			if (w.document !== document && b.contentDocument !== document)
				pass(4, '4 separate document');
		} catch (e) { /* */ }
	});
	b.src = 'L1-layout-basics.html';
	document.body.appendChild(b);

	var c = document.createElement('iframe');
	c.style.display = 'none';
	c.addEventListener('load', function () {
		var shut = false;
		try { shut = c.contentWindow.document === undefined; }
		catch (e) { shut = true; }
		if (c.contentWindow !== window && shut)
			pass(5, '5 cross-origin: loaded, document out of reach');
		else
			document.getElementById('r5').textContent =
				'5 cross-origin: its document is reachable';
	});
	c.src = 'https://example.invalid/';
	document.body.appendChild(c);

	var links = 0, t0 = (self.performance ? performance.now() : Date.now());
	(function step() {
		if (++links < 300) { setTimeout(step, 1); return; }
		var ms = (self.performance ? performance.now() : Date.now()) - t0;
		if (ms < 1500) pass(6, '6 timer chain: 300 links in ' + ms + ' ms');
		else document.getElementById('r6').textContent = '6 timer chain: 300 links in ' + ms + ' ms (too slow)';
	})();
})();
</script>
</body>
</html>
