<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS frame contentDocument origins (script not run)</title>
<!-- Patch 294: a parsed iframe whose src is cross-origin answered
     contentDocument with patch 143's shim document, where browsers
     give null -- so a script could read and write a fake DOM for a
     document it has no right to see, and the standard cross-origin
     test (contentDocument === null) took the wrong path. The checks:
     a same-origin parsed frame keeps its (shim) document; a
     cross-origin parsed frame's contentDocument is null; a frame
     with no src keeps its document; the cross-origin frame's
     contentWindow (the postMessage surface) is not blocked. Over
     the gate server only (NET-js-frame-xdoc): the cross-origin
     child comes from the server's https port, like JS-xorigin-frame. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
iframe { width: 300px; height: 40px; }
</style>
</head>
<body>
<div id="sum">XDOC: 0/4 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<iframe id="so" src="JS-xorigin-frame-child.html"></iframe>
<script>
/* the cross-origin frame must be PARSED, not script-made, and its
 * origin is the gate server's https port (JS-xorigin-frame's shape) */
document.write('<iframe id="xo" src="https://127.0.0.1:' +
	(Number(location.port || 80) + 1) +
	'/JS-xorigin-frame-child.html"><\/iframe>');
</script>
<iframe id="blank"></iframe>
<script>
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'XDOC: ' + k + '/' + N + ' passed';
		document.title = 'JS frame contentDocument origins (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	window.addEventListener('load', function () {
		setTimeout(function () {
			check(1, function () {
				var d = $('so').contentDocument;
				return (d && typeof d === 'object') || String(d);
			}, 'a same-origin parsed frame keeps its document');
			check(2, function () {
				var d = $('xo').contentDocument;
				return d === null || typeof d;
			}, 'a cross-origin parsed frame\'s contentDocument is null');
			check(3, function () {
				var d = $('blank').contentDocument;
				return (d && typeof d === 'object') || String(d);
			}, 'a frame with no src keeps its document');
			check(4, function () {
				var w = $('xo').contentWindow;
				return (w && typeof w.postMessage === 'function') ||
					String(w && typeof w.postMessage);
			}, 'its contentWindow (postMessage) is not blocked');
		}, 400);
	});
})();
</script>
</body>
</html>
