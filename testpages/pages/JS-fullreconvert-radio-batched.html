<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS full reconvert radio batched</title>
<style>
/* Unit 393 (doc 10, 368 entry), faithful original trigger: the removal of a
 * radio group member and a .value write on a separate node land in one JS
 * batch, so the batch takes the FULL rebuild and the removal is processed
 * by the reconvert (not the local path). Then the gate taps the surviving
 * radio r3; form_radio_set must not read the removed control's freed box.
 * Companion of JS-fullreconvert-radio.html (removal in its own batch). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
table { border-collapse: collapse; margin: 4px 10px; }
td { border: 1px solid #000; padding: 2px 4px; }
</style>
</head>
<body>
<form id="f" action="#">
<input type="text" id="t" name="t">
<table><tr><td id="cell">
<input type="radio" name="g" id="r1" checked> <label for="r1">a</label>
<input type="radio" name="g" id="r2"> <label for="r2">b</label>
<input type="radio" name="g" id="r3"> <label for="r3">c</label>
</td></tr></table>
</form>
<p id="out">init</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	window.addEventListener('load', function () {
		/* one synchronous block: removal + value write = one batch,
		 * full rebuild. */
		$('r1').parentNode.removeChild($('r1'));
		$('t').value = 'x';
		setTimeout(function () {
			var r = $('r3').getBoundingClientRect();
			document.title = 'POS ' +
				Math.round(r.x + r.width / 2) + ' ' +
				Math.round(r.y + r.height / 2) +
				' els=' + $('f').elements.length;
			$('out').textContent = 'elements=' + $('f').elements.length;
		}, 300);
	});
})();
</script>
</body>
</html>
