<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS full reconvert radio</title>
<style>
/* Unit 393 (doc 10, 368 entry). A full reconvert after a radio of a group
 * was removed: selecting a surviving group member must not read the freed
 * control->box of the removed one. Steps: r1 removed, then a class change
 * on the cell's own box (369 declines a table holding controls, so this is
 * the full rebuild), then the title carries r3's tap point. The gate taps
 * r3 (VITA_SIM_SCRIPT) after the page has run; the settled frame must
 * match CSS-fullreconvert-radio-ref.html row for row. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
table { border-collapse: collapse; margin: 4px 10px; }
td { border: 1px solid #000; padding: 2px 4px; }
.hl { background: #ff0; font-weight: bold; }
</style>
</head>
<body>
<form id="f" action="#">
<table><tr><td id="cell">
<input type="radio" name="g" id="r1" checked> <label for="r1">a</label>
<input type="radio" name="g" id="r2"> <label for="r2">b</label>
<input type="radio" name="g" id="r3"> <label for="r3">c</label>
</td></tr></table>
</form>
<p id="out">init</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	window.addEventListener('load', function () {
		/* 1: remove a group member (the local path, 368). */
		$('r1').parentNode.removeChild($('r1'));
		setTimeout(function () {
			/* 2: full reconvert (369 declines the table restyle: it
			 * holds controls). */
			$('cell').className = 'hl';
			setTimeout(function () {
				var r = $('r3').getBoundingClientRect();
				document.title = 'POS ' +
					Math.round(r.x + r.width / 2) + ' ' +
					Math.round(r.y + r.height / 2) +
					' els=' + $('f').elements.length;
				$('out').textContent = 'elements=' + $('f').elements.length;
			}, 300);
		}, 300);
	});
})();
</script>
</body>
</html>
