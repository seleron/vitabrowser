<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS gen empty sib</title>
<style>
/* Patch 373, the declines. A sibling rule whose left compound has
 * :empty can see a block go empty or stop being empty, and counter() in
 * generated content is numbered by the whole page's build: both keep the
 * full rebuild. After its steps this page must render row for row as
 * CSS-gen-empty-sib-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; counter-reset: item; }
p, div { margin: 4px 10px; }
.slot:empty + p { color: #00c; }
h3 { font-size: 14px; margin: 4px 10px; }
h3::before { counter-increment: item; content: counter(item) ". "; }
</style>
</head>
<body>
<div id="e1" class="slot"></div>
<p>Blue while the slot before it is empty.</p>
<h3 id="h1">First heading</h3>
<h3 id="h2">Second heading</h3>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('e1').textContent = 'The slot is filled.'; },
		function () { $('h2').textContent = 'Second heading, renamed by a script'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 250); } })(); });
})();
</script>
</body>
</html>
