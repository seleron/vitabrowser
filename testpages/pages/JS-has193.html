<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS :has() gaps (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#res { position: fixed; top: 0; left: 0; right: 0; background: #fff; }
/* patch 193: :has() with a sibling-lead multi-part relative selector must
 * match descendants of the following sibling(s), not just the sibling
 * itself; element.querySelectorAll(':scope') must include the element. */
</style>
</head>
<body>
<div id="res">
<div id="sum">HAS193: 0/6 passed</div>
<div id="r1" class="wait">1</div>
<div id="r2" class="wait">2</div>
<div id="r3" class="wait">3</div>
<div id="r4" class="wait">4</div>
<div id="r5" class="wait">5</div>
<div id="r6" class="wait">6</div>
</div>

<!-- 1-2: sibling-lead multi-part :has() -->
<div id="anchor1"></div>
<div class="foo"><span class="bar" id="bar1">x</span></div>

<div id="anchor2"></div>
<div class="other">y</div>
<div class="foo"><span class="bar" id="bar2">z</span></div>

<!-- 4: single-part :has(+) still works -->
<div id="anchor4"></div>
<div class="solo" id="solo4">w</div>

<!-- 5: nested :has() -->
<div id="nest5"><div class="outer"><span class="inner"><b id="deep5">q</b></span></div></div>

<!-- 6: :has() with pseudo-class -->
<div id="anchor6"><span class="first6">a</span><span>b</span></div>

<script>
(function () {
	var N = 6, k = 0, res = [];
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) { res.push([n, ok, text]); }
	function show() {
		var i, r, p;
		for (i = 0; i < res.length; i++) {
			r = res[i]; p = $('r' + r[0]);
			p.textContent = r[0] + ' ' + r[2] + (r[1] ? '' : ' FAIL');
			if (r[1]) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'HAS193: ' + k + '/' + N + ' passed';
		document.title = 'JS :has() gaps (' + k + '/' + N + ')';
	}

	function run() {
		var a1 = $('anchor1'), a2 = $('anchor2'), a4 = $('anchor4');
		/* 1: :has(+ .foo .bar) — .bar is a DESCENDANT of the adjacent
		 * .foo sibling, not the sibling itself (patch 193 fix). */
		t(1, a1.matches(':has(+ .foo .bar)'), ':has(+ .foo .bar) descendant');
		/* 2: :has(~ .foo .bar) — .bar inside a later .foo sibling. */
		t(2, a2.matches(':has(~ .foo .bar)'), ':has(~ .foo .bar) descendant');
		/* 3: element.querySelectorAll(':scope') includes the element. */
		var scopeEl = $('nest5');
		var q = scopeEl.querySelectorAll(':scope');
		t(3, q.length === 1 && q[0] === scopeEl, 'querySelectorAll(:scope)');
		/* 4: single-part :has(+ .solo) still matches (no regression). */
		t(4, a4.matches(':has(+ .solo)'), ':has(+ .solo) single-part');
		/* 5: nested :has() — div containing div.outer:has(span.inner). */
		t(5, $('nest5').matches(':has(div:has(span))'), 'nested :has()');
		/* 6: :has() with pseudo-class — has a first-child span. */
		t(6, $('anchor6').matches(':has(span:first-child)'), ':has(span:first-child)');
		show();
	}
	if (document.readyState === 'complete') run();
	else window.addEventListener('load', run);
})();
</script>
</body>
</html>
