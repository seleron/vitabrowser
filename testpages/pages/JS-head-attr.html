<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS head attr</title>
<style>
/* Patch 383. A child-list change on <head> (a <script>, <meta>, <link>
 * or <style> inserted, moved or removed) walked to <html> and declined
 * into a full rebuild ("no inserted or removed block found"), on youtube,
 * bbc and claude page after page; so did an attribute that no sheet
 * reads on a block of blocks (claude's <body>). Both now need no
 * rebuild: <head> renders nothing, and a sheet that arrives marks for
 * itself; an attribute with no effect but through CSS (data-*, aria-*,
 * role...) on a block changes nothing patch 310's gate has not ruled
 * out. After its steps (600 ms apart) JS-head-attr.html must render row
 * for row as CSS-head-attr-ref.html, the same steps run while the page
 * parses: the <style> appended to <head> still turns the paragraph red.
 * Each step also writes a visible step count: the no-ops repaint nothing,
 * and the page must not settle before its last step.
 * (An <ol>'s start set by script does not renumber it with a full rebuild
 * either -- pre-existing; so not tested here.) */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div, ol { margin: 4px 10px; }
</style>
<script id="rm383">window.vb383r = 1;</script>
</head>
<body>
<div id="blocks"><div>A block of blocks, given an aria-label.</div><div>Its second block.</div></div>
<p id="target">This paragraph turns red when a style arrives in the head.</p>
<p id="tick">step 0</p>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var s = document.createElement('script'); s.text = 'window.vb383a = 1;'; document.head.appendChild(s); },
		function () { var m = document.createElement('meta'); m.name = 'vb383'; m.content = 'x'; document.head.insertBefore(m, document.head.firstChild); },
		function () { var h = document.head, s = h.querySelector('#rm383'); if (s) h.removeChild(s); },
		function () { var st = document.createElement('style'); st.textContent = '#target { color: #c00; }'; document.head.appendChild(st); },
		function () { document.body.setAttribute('data-state', 'ready'); },
		function () { $('blocks').setAttribute('aria-label', 'blocks'); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); $('tick').textContent = 'step ' + k; setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
