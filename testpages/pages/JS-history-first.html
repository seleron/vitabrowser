<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS history first</title>
<script>
/* A window's first page joins its session history only when it is ready,
 * and a script can read history.length while it still parses -- the
 * engine dereferenced the empty history (m.youtube.com, SIGSEGV; patch
 * 231). tools/run-vita-sim.sh starts a simulator ON this page, so it is
 * that window's first. Chromium: 1. */
var n = history.length;
document.title = 'HISTFIRST ' + n;
</script>
</head>
<body>
<p>history.length while the first page parses: <span id="v"></span></p>
<script>document.getElementById('v').textContent = String(n);</script>
</body>
</html>
