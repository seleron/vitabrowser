<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS history</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
.fail { background: #f66; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">JS history: script did not run</p>
<div id="rows"></div>
<script>
/* History API Phase B (Patch 136): pushState/replaceState keep a real
 * same-document session stack; back()/forward()/go() walk it with
 * popstate; history.length/state are joint with the native history;
 * location reflects the shown URL; cross-origin pushState throws
 * SecurityError. All synchronous: pushState never navigates. */
var passed = 0, total = 0;
var pops = [];
function t(name, cond) {
  total++;
  var p = document.createElement('p');
  p.className = cond ? 'pass' : 'fail';
  p.textContent = (cond ? 'PASS ' : 'FAIL ') + name;
  document.getElementById('rows').appendChild(p);
  if (cond) passed++;
}
function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
window.addEventListener('popstate', function(e) { pops.push(e.state); });

var L0 = history.length;
t('1 initial state is null', history.state === null);
t('2 initial length >= 1', L0 >= 1);

history.pushState({n:1}, '', 'hist-a');
t('3 pushState state {n:1}', eq(history.state, {n:1}));
t('4 pushState length +1', history.length === L0 + 1);
t('5 location shows pushed URL', location.pathname.slice(-6) === 'hist-a');

history.pushState({n:2}, '', 'hist-b');
t('6 second pushState state {n:2}', eq(history.state, {n:2}));
t('7 second pushState length +2', history.length === L0 + 2);

var p0 = pops.length;
history.back();
t('8 back fires one popstate', pops.length === p0 + 1);
t('9 back popstate state {n:1}', eq(pops[pops.length-1], {n:1}));
t('10 back history.state {n:1}', eq(history.state, {n:1}));
t('11 back location shows hist-a', location.pathname.slice(-6) === 'hist-a');

history.back();
t('12 back popstate state null', pops[pops.length-1] === null);
t('13 back history.state null', history.state === null);
t('14 traversal does not change length', history.length === L0 + 2);

history.forward();
t('15 forward popstate state {n:1}', eq(pops[pops.length-1], {n:1}));
t('16 forward history.state {n:1}', eq(history.state, {n:1}));

/* Pushing after going back drops the forward entries. */
history.pushState({n:3}, '', 'hist-c');
t('17 push after back truncates forward', history.length === L0 + 2);
t('18 push after back state {n:3}', eq(history.state, {n:3}));
var p1 = pops.length;
history.forward();
t('19 forward past end fires no popstate', pops.length === p1);
t('20 forward past end keeps state', eq(history.state, {n:3}));

history.replaceState({n:4}, '', 'hist-d');
t('21 replaceState state {n:4}', eq(history.state, {n:4}));
t('22 replaceState keeps length', history.length === L0 + 2);
t('23 replaceState location shows hist-d', location.pathname.slice(-6) === 'hist-d');
history.back();
t('24 back after replace lands on {n:1}', eq(history.state, {n:1}));

var threw = null;
try { history.pushState({n:9}, '', 'http://example.com/x'); }
catch (e) { threw = e && e.name; }
t('25 cross-origin pushState throws SecurityError', threw === 'SecurityError');
t('26 failed pushState keeps state', eq(history.state, {n:1}));

history.go(-1);
t('27 go(-1) popstate state null', pops[pops.length-1] === null);
t('28 go(-1) history.state null', history.state === null);
history.go(2);
t('29 go(2) lands on {n:4}', eq(history.state, {n:4}));
t('30 go(2) fires two popstates', pops.length === p1 + 4);

var sum = document.getElementById('sum');
sum.className = (passed === total) ? 'pass' : 'fail';
sum.textContent = 'JS history: ' + passed + '/' + total + ' passed';
</script>
</body>
</html>
