<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS id sib</title>
<style>
/* Patch 472. An id change on an element with a box declined ("#id
 * selectors are not scanned", rte and claude 2.7 a load). An #id rule
 * reaches the element, its subtree and -- through a sibling rule -- its
 * later siblings. Here a sibling rule watches an id (#on + p turns the
 * next paragraph blue): the parent is built again whole (445). (A page
 * whose sheet names no id in a sibling rule re-selects the element alone:
 * JS-attr-restyle.) Row for row as CSS-id-sib-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
#on { background: #cfc; }
#on + p { color: #00c; }
</style>
</head>
<body>
<div id="wrap">
<div id="d">A div that gains the id "on" (green).</div>
<p>The paragraph after it (blue once the div is #on).</p>
</div>
<script>
(function () {
	function op() { document.getElementById('d').id = 'on'; }
	window.addEventListener('load', function () { setTimeout(op, 500); });
})();
</script>
</body>
</html>
