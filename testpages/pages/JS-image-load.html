<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS image load (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
img { vertical-align: top; }
</style>
<script>
/* patch 250: no <img> fired load or error, complete / naturalWidth did not
 * exist, inline onload / onerror attributes (and <body onload>) never
 * ran, and new Image() was a stand-in object that never loaded. Every
 * check settles from an event; nothing waits on a timer. Chromium-
 * verified. */
var k = 0, N = 11, seen = {}, leaked = 0;
function $(id) { return document.getElementById(id); }
function t(n, ok, text) {
	if (seen[n]) return;
	seen[n] = 1;
	var p = $('r' + n);
	p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
	if (!ok) return;
	p.className = 'pass';
	k++;
	$('sum').textContent = 'IMGLOAD: ' + k + '/' + N + ' passed';
	document.title = 'JS image load (' + k + '/' + N + ')';
}
function bodyLoad() { t(10, true, '<body onload> runs as the window\'s load handler'); }
/* an element's load never reaches window, even capturing (DOM: a
 * Document's parent is its Window unless the event is load); web-vitals
 * re-adds such a listener from inside it, which doubled per image */
window.addEventListener('load', function (e) {
	if (e && e.target && e.target.nodeType === 1) leaked++;
}, true);
</script>
</head>
<body onload="bodyLoad()">
<div id="sum">IMGLOAD: 0/11 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<p id="r9" class="wait">9 waiting</p>
<p id="r10" class="wait">10 waiting</p>
<p id="r11" class="wait">11 waiting</p>
<img id="a" src="lazyimg-01.png" alt="" onload="t(1, true, 'an <img onload> attribute runs')">
<img id="b" src="missing-image-250.png" alt="" onerror="t(3, true, 'a broken image\'s onerror attribute runs')">
<img id="c" alt="">
<script>
(function () {
	var a = $('a');
	a.addEventListener('load', function () {
		t(2, true, 'addEventListener(\'load\') on an <img> runs');
	});
	window.addEventListener('load', function () {
		t(4, a.complete === true && a.naturalWidth === 120 && a.naturalHeight === 80 && a.width === 120,
			'at window load: complete ' + a.complete + ', natural ' + a.naturalWidth + 'x' + a.naturalHeight +
			', width ' + a.width);
		t(9, $('c').complete === true, 'an <img> with no src is complete');
		t(11, leaked === 0, 'element load events do not reach a capturing window listener (' + leaked + ')');
		a.decode().then(function () { t(8, true, 'decode() resolves for a loaded image'); },
			function (e) { t(8, false, 'decode() rejected: ' + e); });
		var im = new Image();
		t(5, im.nodeType === 1 && im.tagName === 'IMG' && im instanceof Image &&
			im instanceof HTMLImageElement && im.complete === true,
			'new Image() is an <img> element');
		im.onload = function () {
			t(6, im.naturalWidth === 120 && im.complete === true && /^https?:\/\/.*\/lazyimg-02\.png$/.test(im.src),
				'new Image() loads off the page: ' + im.naturalWidth + ', ' + im.src);
		};
		im.onerror = function () { t(6, false, 'new Image() failed to load'); };
		im.src = 'lazyimg-02.png';
		var bad = new Image();
		bad.onerror = function () { t(7, true, 'a detached broken image fires error'); };
		bad.onload = function () { t(7, false, 'a broken image fired load'); };
		bad.src = 'missing-image-250b.png';
	});
})();
</script>
</body>
</html>
