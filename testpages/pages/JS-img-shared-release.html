<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS img shared release</title>
<style>
/* Patch 478. Two <img> share one slow URL (/slow/: served after 1 s); 300
 * ms after parsing, while the shared fetch is still pending, the first
 * <img> is removed. Its handle is released with its retrieval pending:
 * hlcache aborted it first, and aborting a shared llcache object
 * snapshots a full copy of its data for this handle -- released at once,
 * yet resident (youtube: its logo SVG copied 5-7 times a load). Now the
 * handle just leaves; the fetch goes on for the second <img>, which
 * still loads. The URL is this page's own (?shared478): another gate page
 * fetching the same /slow/ image would find it fresh in llcache (CSS-late-
 * link relies on its image arriving late). Row for row as CSS-img-shared-release-ref.html (the one
 * image). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
img { display: block; margin: 4px 10px; }
</style>
</head>
<body>
<p>The second image, still loaded after the first is removed:</p>
<img id="a" src="/slow/lazyimg-01.png?shared478" width="64" height="64" alt="">
<img id="b" src="/slow/lazyimg-01.png?shared478" width="64" height="64" alt="">
<script>
setTimeout(function () { var a = document.getElementById('a'); a.parentNode.removeChild(a); }, 300);
</script>
</body>
</html>
