<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS import.meta (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
<script type="module">
/* patch 238 (+ quickjs patch 06): import.meta.url is the module's URL --
 * an external module's own, an inline module's its document's. It was an
 * empty object, and bundlers that find their chunks from it threw
 * (github.com's rspack runtime: "Automatic publicPath is not supported in
 * this browser", seven modules dead). Chromium-verified. */
import { url, isString } from './JS-import-meta-mod.js';
var k = 0, N = 4;
function $(id) { return document.getElementById(id); }
function t(n, ok, text) {
	var p = $('r' + n);
	p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
	if (!ok) return;
	p.className = 'pass';
	k++;
	$('sum').textContent = 'IMPORTMETA: ' + k + '/' + N + ' passed';
	document.title = 'JS import.meta (' + k + '/' + N + ')';
}
var here = String(location.href).replace(/#.*$/, '');
t(1, typeof import.meta.url === 'string' && import.meta.url === here,
	'inline module: ' + import.meta.url);
t(2, isString && url === new URL('JS-import-meta-mod.js', here).href,
	'external module: ' + String(url).replace(/^.*\//, ''));
/* the rspack runtime's own test and what it derives from it */
var c = import.meta.url, pub = String(c).replace(/#.*$/, '').replace(/\?.*$/, '').replace(/\/[^\/]+$/, '/');
t(3, 'string' == typeof c && here.indexOf(pub) === 0,
	'publicPath from it: ' + pub.replace(/^.*:\/\/[^\/]*/, ''));
t(4, Object.getPrototypeOf(import.meta) === null,
	'import.meta has no prototype');
</script>
</head>
<body>
<div id="sum">IMPORTMETA: 0/4 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
</body>
</html>
