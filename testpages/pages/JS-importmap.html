<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS import maps (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
<script type="importmap">
{
  "imports": {
    "vb-lib": "./JS-importmap-lib.js",
    "vb-pkg/": "./"
  },
  "scopes": {
    "./JS-importmap-scoped.js": { "vb-lib": "./JS-importmap-lib2.js" }
  }
}
</script>
<script type="module">
/* patch 239: <script type="importmap"> resolves bare specifiers -- exact
 * keys, "prefix/" keys, and scopes (a module inside a scope sees that
 * scope's rules first). It was skipped as an unsupported script type, so
 * github.com's chunks, which import "react" and co. through its map,
 * failed to load ("Loading chunk ... failed after 3 retries").
 * Chromium-verified. */
import { who } from 'vb-lib';
import { who as pkg } from 'vb-pkg/JS-importmap-b.js';
import { scopedWho } from './JS-importmap-scoped.js';
var k = 0, N = 4;
function $(id) { return document.getElementById(id); }
function t(n, ok, text) {
	var p = $('r' + n);
	p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
	if (!ok) return;
	p.className = 'pass';
	k++;
	$('sum').textContent = 'IMPORTMAP: ' + k + '/' + N + ' passed';
	document.title = 'JS import maps (' + k + '/' + N + ')';
}
t(1, who === 'lib', 'bare specifier: ' + who);
t(2, pkg === 'pkg-b', 'prefix rule: ' + pkg);
t(3, scopedWho === 'lib2' && who === 'lib', 'scope: ' + scopedWho);
import('vb-lib').then(function (m) {
	t(4, m.who === 'lib', 'dynamic import(): ' + m.who);
}, function (e) { t(4, false, 'dynamic import(): ' + e); });
</script>
</head>
<body>
<div id="sum">IMPORTMAP: 0/4 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
</body>
</html>
