<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS innerHTML leading (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">IHLEAD: 0/6 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<script>
/* patch 488: innerHTML keeps what comes before the first element. The
 * engine parsed innerHTML markup as a document, and in "before html" the
 * parser dropped leading whitespace and set leading comments aside, so a
 * template beginning with lit's <?lit$N$> part markers lost them: its parts
 * landed on the wrong nodes, classMap() threw, and old.reddit.com's text
 * inputs rendered no <input>. Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'IHLEAD: ' + k + '/' + N + ' passed';
		document.title = 'JS innerHTML leading (' + k + '/' + N + ')';
	}
	function kinds(list) {
		return [].map.call(list, function (n) {
			return n.nodeType === 1 ? n.localName : n.nodeType === 8 ? '#c(' + n.data + ')' : '#t(' + n.data.replace(/\s/g, '_') + ')';
		}).join(' ');
	}
	var d = document.createElement('div');
	d.innerHTML = ' lead <b>x</b>';
	t(1, kinds(d.childNodes) === '#t(_lead_) b', 'leading text is kept: ' + kinds(d.childNodes));
	d.innerHTML = '<!--a--><i>y</i>';
	t(2, kinds(d.childNodes) === '#c(a) i', 'a leading comment is kept: ' + kinds(d.childNodes));
	var tp = document.createElement('template');
	tp.innerHTML = ' <?lit$1$> <?lit$2$> <span>x</span> ';
	t(3, kinds(tp.content.childNodes) === '#t(_) #c(?lit$1$) #t(_) #c(?lit$2$) #t(_) span #t(_)',
		'a template beginning with part markers keeps them: ' + kinds(tp.content.childNodes));
	d.innerHTML = 'only text';
	t(4, kinds(d.childNodes) === '#t(only_text)', 'text alone: ' + kinds(d.childNodes));
	d.innerHTML = '<style>.q{}</style><p>z</p>';
	t(5, kinds(d.childNodes) === 'style p', 'a leading <style> stays in place: ' + kinds(d.childNodes));
	d.innerHTML = '';
	t(6, d.childNodes.length === 0 && !d.querySelector('vb-frag-start'), 'empty markup leaves nothing behind');
})();
</script>
</body>
</html>
