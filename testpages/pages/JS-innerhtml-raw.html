<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS innerHTML raw text (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
<script type="text/template" id="tpl"><# if ( a < b ) { #><p class="x">{{ data.x }} & y</p><# } #></script>
<style id="sty">a > b { color: #123 }</style>
<script>
/* patch 233: a raw-text element's OWN innerHTML is its text, unescaped
 * (HTML serialization: children of script, style, xmp, iframe, noembed,
 * noframes, plaintext and -- scripting enabled -- noscript are appended
 * literally). We escaped it when the element itself was read, so
 * wp.template / _.template / Handlebars templates kept in
 * <script type="text/template"> came back as "&lt;# if ... #&gt;": the
 * template's evaluate blocks never matched and their source showed on the
 * page (make.wordpress.org/core: o2's widgets and posts). Text inside
 * <textarea> / <title> stays escaped, as in browsers. Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'IHRAW: ' + k + '/' + N + ' passed';
		document.title = 'JS innerHTML raw text (' + k + '/' + N + ')';
	}
	function run() {
		var tpl = $('tpl').innerHTML, m;
		t(1, tpl === '<# if ( a < b ) { #><p class="x">{{ data.x }} & y</p><# } #>',
			'script innerHTML raw (' + tpl.slice(0, 18) + ')');
		/* the underscore / wp.template evaluate pattern finds its blocks */
		m = tpl.match(/<#([\s\S]+?)#>/g);
		t(2, m !== null && m.length === 2, 'template blocks found: ' +
			(m ? m.length : 0));
		t(3, $('sty').innerHTML === 'a > b { color: #123 }',
			'style innerHTML raw (' + $('sty').innerHTML.slice(0, 8) + ')');
		var x = $('xmp').innerHTML;
		t(4, x === '1 < 2 & 3', 'xmp innerHTML raw (' + x + ')');
		var ta = $('ta').innerHTML;
		t(5, ta === 'a &lt; b &amp; c', 'textarea stays escaped (' + ta + ')');
		var d = $('d').innerHTML;
		t(6, d === '<script>if (1 < 2) {}<\/script><b>&lt;&amp;</b>',
			'a parent still serializes its script raw, text escaped (' +
			d.length + ')');
	}
	/* at load, not 100 ms later: layout is complete at load in both
	 * engines, and the timer raced the simulator's dump on a busy gate
	 * (2026-10-11) */
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">IHRAW: 0/6 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<xmp id="xmp">1 < 2 & 3</xmp>
<textarea id="ta">a < b & c</textarea>
<div id="d" style="display:none"><script>if (1 < 2) {}</script><b>&lt;&amp;</b></div>
</body>
</html>
