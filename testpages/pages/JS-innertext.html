<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS innerText (rendered text)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p.r { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.gone { display: none; }
#cases { font-size: 10px; }
</style>
</head>
<body>
<!-- Patch 168 (vita_polyfill.js): innerText was textContent, so <style>
     and <script> text, hidden elements and display:none subtrees came
     with it, and nothing marked a line. google.com keeps its <style>
     blocks in <body>: its body.innerText was 30 KB of CSS (the scorecard
     reads visible text this way; so do pages).
     Each case's expected string is what Chromium gives.
     1: <style>/<script> text is left out.
     2: [hidden] and inline display:none are left out.
     3: block boxes start lines; <br> breaks one.
     4: paragraphs are set off by a blank line.
     5: white space collapses and is trimmed.
     6: <pre> keeps its white space.
     7: table cells are tab-separated, rows are lines.
     8: display:none from a stylesheet rule is left out. -->
<p id="sum" class="r wait">INNERTEXT: script did not run</p>
<p id="r1" class="r wait">1 waiting</p><p id="r2" class="r wait">2 waiting</p>
<p id="r3" class="r wait">3 waiting</p><p id="r4" class="r wait">4 waiting</p>
<p id="r5" class="r wait">5 waiting</p><p id="r6" class="r wait">6 waiting</p>
<p id="r7" class="r wait">7 waiting</p><p id="r8" class="r wait">8 waiting</p>
<div id="cases">
<div id="c1">Hello <b>world</b><style>.x { color: red }</style><script>var zz = 1;</script></div>
<div id="c2">one<span hidden>two</span><span style="display:none">three</span> four</div>
<div id="c3"><div>a</div><div>b</div>c<br>d</div>
<div id="c4"><p>x</p><p>y</p></div>
<div id="c5">   lots   of
   space   </div>
<pre id="c6">a  b
 c</pre>
<table id="c7"><tr><td>1</td><td>2</td></tr><tr><td>3</td><td>4</td></tr></table>
<div id="c8">vis<span class="gone">not</span></div>
</div>
<script>
var want = [null, 'Hello world', 'one four', 'a\nb\nc\nd', 'x\n\ny', 'lots of space',
	'a  b\n c', '1\t2\n3\t4', 'vis'];
var N = 8, res = [];
window.addEventListener('load', function () {
	var n, got = [];
	for (n = 1; n <= N; n++) {
		try { got[n] = document.getElementById('c' + n).innerText; }
		catch (e) { got[n] = 'threw ' + e; }
	}
	var k = 0;
	for (n = 1; n <= N; n++) {
		var ok = got[n] === want[n], p = document.getElementById('r' + n);
		p.textContent = n + ' ' + JSON.stringify(got[n]) + (ok ? '' : ' FAIL (want ' + JSON.stringify(want[n]) + ')');
		if (ok) { p.className = 'r pass'; k++; }
	}
	document.getElementById('sum').textContent = 'INNERTEXT: ' + k + '/' + N + ' passed';
});
</script>
</body></html>
