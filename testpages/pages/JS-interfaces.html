<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS interface objects (script not run)</title>
<!-- The DOM's interface objects shaped as the spec's (roadmap WS-B3).
     Sites and their polyfills read and patch these prototypes; missing
     ones threw "cannot read property 'prototype' of undefined" (BBC,
     Guardian, Reddit, MDN), and URL-shaped objects stringified to
     "[object Object]" so new URL(location) threw (Wikipedia, ArchWiki,
     Python docs, MDN).
     1: document instanceof Document and HTMLDocument.
     2: Node.prototype.appendChild works with .call on an element.
     3: Element.prototype.matches works with .call.
     4: [Element, CharacterData, DocumentType, Document].prototype exist.
     5: String(location) is its href; new URL(location) works.
     6: String(<a href>) is its href.
     7: document.baseURI and document.URL are the page's URL.
     8: localStorage instanceof Storage; location instanceof Location. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">IFACES: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p><p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p><p id="r8" class="wait">8 waiting</p>
<script>
(function () {
	var N = 8, k = 0;
	function t(n, name, f) {
		var ok = false, why = '';
		try { ok = f(); } catch (e) { why = ' threw ' + e; }
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + name + (ok ? '' : ' FAIL' + why);
		if (!ok) return;
		p.className = 'pass';
		k++;
		document.getElementById('sum').textContent = 'IFACES: ' + k + '/' + N + ' passed';
		document.title = 'JS interface objects (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'IFACES: 0/' + N + ' passed';
	var div = document.createElement('div'), span = document.createElement('span');
	t(1, 'document instanceof Document/HTMLDocument', function () {
		return document instanceof Document && document instanceof HTMLDocument; });
	t(2, 'Node.prototype.appendChild.call', function () {
		Node.prototype.appendChild.call(div, span); return span.parentNode === div; });
	t(3, 'Element.prototype.matches.call', function () {
		return Element.prototype.matches.call(div, 'div') === true; });
	t(4, 'interface prototypes exist', function () {
		return [Element, CharacterData, DocumentType, Document].every(function (F) {
			return typeof F === 'function' && typeof F.prototype === 'object'; }); });
	t(5, 'String(location), new URL(location)', function () {
		return String(location) === location.href && new URL(location).href === location.href; });
	t(6, 'String(<a href>)', function () {
		var a = document.createElement('a'); a.href = 'https://example.com/x';
		return String(a) === a.href && a.href.indexOf('https://example.com/x') === 0; });
	t(7, 'document.baseURI, document.URL', function () {
		return document.baseURI === location.href && document.URL === location.href; });
	t(8, 'Storage, Location instances', function () {
		return localStorage instanceof Storage && location instanceof Location; });
})();
</script>
</body>
</html>
