<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS late append</title>
<style>
/* Patch 378. Scripts append elements with no box (a <script>, to <body>
 * or to <html>, whose <head> read as a new element) and ad or tracker
 * <iframe>s and pixel <img>s at the end of <body>; each took the full
 * box-tree rebuild ("new element is not a plain block, list item or
 * block of blocks"). A child-list change that adds or removes no element
 * with a box is answered with no rebuild; an <iframe> or <img> appended
 * at the end is built alone, the page laid out whole. An <iframe>
 * inserted before a block still takes the full rebuild. After its steps
 * (600 ms apart) JS-late-append.html must render row for row as
 * CSS-late-append-ref.html, the same steps run while the page parses.
 * The frames are named with no src (patch 289: a record and a window that
 * load nothing): a script-made same-origin frame is not loaded as a parsed
 * one is (patch 143), the same with or without this patch. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
iframe { width: 120px; height: 30px; border: 2px solid #000; }
</style>
</head>
<body>
<p id="p1">First paragraph.</p>
<div id="b1">A block.</div>
<p id="p2">Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var s = document.createElement('script'); s.text = 'window.vb378a = 1;'; document.body.appendChild(s); },
		function () { var s = document.createElement('script'); s.text = 'window.vb378b = 1;'; document.documentElement.appendChild(s); },
		function () { var f = document.createElement('iframe'); f.name = 'late1'; document.body.appendChild(f); },
		function () { var i = document.createElement('img'); i.src = 'opimg-20.png'; i.width = 20; i.height = 20; document.body.appendChild(i); },
		function () { var f = document.createElement('iframe'); f.name = 'late2'; document.body.insertBefore(f, $('b1')); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
