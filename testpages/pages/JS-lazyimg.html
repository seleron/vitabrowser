<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS lazy images below the fold (script not run)</title>
<!-- Roadmap WS-C item 2: lazy sub-resources. fixes738 made box_image
     DEFER every image past the page's 10-image eager budget into a queue
     drained by macsurf_lazyimg_viewport_changed() -- but that hook was
     dead code (nothing called it), so images 11+ of any page sat queued
     and were never fetched, on screen or below it. Patch 162 wires the
     drain into the Vita frontend after every frame. This page proves the
     viewport gating against httpd's /fetch-count.
     16 images (lazyimg-01..16.png, all the same 120x80 file served from
     16 paths) under a 2000 px spacer, each rendered 80 px tall, so the
     deferred ones (11-16) start ~2930 px down and the viewport (544 px)
     + drain margin (600 px) at scroll 0 only reaches y~1144.
     The autotest settles the page at the TOP, dumps, then (long page)
     scrolls to the BOTTOM and settles again before moving on; the gate
     reads the BOTTOM dump's plot, so every check must be written to the
     DOM before that bottom settle. Sequence, with scroll guards on each
     sample (window.scrollY is in content px):
     1: at the top (scrollY < 100), images 1-10 (the eager budget) are
        fetched exactly once and images 11-16 (below the fold) have NOT
        been fetched.
     2: at the bottom (scrollY > 2000, the autotest's long-page scroll),
        images 11-16 are each fetched exactly once (the drain ran on the
        bottom's repaint).
     3: after scrolling back to the top, nothing is fetched again: all
        16 counts are still exactly 1.
     4: after scrolling the 11-16 band into view once more (scrollTo
        0,2400) and back to the top, the total across the 16 files is
        16 GETs: every image fetched exactly once over the whole session. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#spacer { height: 2000px; }
img { display: block; width: 120px; height: 80px; }
</style>
<script>
(function () {
	var N = 4, k = 0;
	var IMG = [];
	var i;
	for (i = 1; i <= 16; i++)
		IMG.push('/lazyimg-' + (i < 10 ? '0' : '') + i + '.png');
	function t(n, ok, text) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		document.getElementById('sum').textContent =
			'LAZYIMG: ' + k + '/' + N + ' passed';
		document.title = 'JS lazy images below the fold (' + k + '/' + N + ')';
	}
	function fail(n) { return function (e) { t(n, false, 'rejected: ' + e); }; }
	function counts() {
		return fetch('/fetch-count?prefix=/lazyimg-').then(function (r) {
			return r.json();
		});
	}
	function got(c, i) { return c[IMG[i - 1]] || 0; }
	document.addEventListener('DOMContentLoaded', function () {
		document.getElementById('sum').textContent =
			'LAZYIMG: 0/' + N + ' passed';
		/* sample 1: at the top, after the eager fetches. The autotest
		 * settles the page at the top ~1 s after load and only THEN
		 * scrolls the long page to the bottom, so a 1.2 s sample is
		 * safely before the bottom scroll. */
		setTimeout(function () {
			counts().then(function (c) {
				var eagerOk = true, lazyOk = true;
				var i;
				var sy = (window.scrollY || 0);
				for (i = 1; i <= 10; i++)
					if (got(c, i) !== 1) eagerOk = false;
				for (i = 11; i <= 16; i++)
					if (got(c, i) !== 0) lazyOk = false;
				t(1, sy < 100 && eagerOk && lazyOk,
					'at top (scrollY=' + sy + '): 1-10 fetched once, ' +
					'11-16 (below fold) not fetched (11=' + got(c, 11) +
					' 16=' + got(c, 16) + ')');
				/* sample 2: the autotest's long-page bottom scroll has
				 * happened by now (it settles the top ~1 s after load,
				 * dumps, then scrolls the ~3000 px page to the bottom);
				 * the drain fetched 11-16 on that bottom's repaint. */
				setTimeout(function () {
					counts().then(function (c) {
						var ok = true;
						var i, s = '', sy2 = (window.scrollY || 0);
						for (i = 11; i <= 16; i++) {
							if (got(c, i) !== 1) ok = false;
							s += i + '=' + got(c, i) + ' ';
						}
						t(2, sy2 > 2000 && ok,
							'at bottom (scrollY=' + sy2 + '): 11-16 ' +
							'fetched once by the drain: ' + s);
						/* scroll back to the top: nothing may refetch */
						window.scrollTo(0, 0);
						setTimeout(function () {
							counts().then(function (c) {
								var ok = true, i;
								for (i = 1; i <= 16; i++)
									if (got(c, i) !== 1) ok = false;
								t(3, ok, 'after scroll to top: all 16 ' +
									'still exactly 1');
								/* scroll the 11-16 band into view once
								 * more, then back: fetch nothing new */
								window.scrollTo(0, 2400);
								window.scrollTo(0, 0);
								setTimeout(function () {
									counts().then(function (c) {
										var total = 0, i;
										for (i = 1; i <= 16; i++)
											total += got(c, i);
										t(4, total === 16,
											'total GETs after re-scroll: ' +
											total + ' (16)');
									}).catch(fail(4));
								}, 1200);
							}).catch(fail(3));
						}, 1200);
					}).catch(fail(2));
				}, 2500);
			}).catch(fail(1));
		}, 1200);
	});
})();
</script>
</head>
<body>
<p id="sum" class="wait">LAZYIMG: script did not run</p>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<div id="spacer"></div>
<img src="/lazyimg-01.png"><img src="/lazyimg-02.png">
<img src="/lazyimg-03.png"><img src="/lazyimg-04.png">
<img src="/lazyimg-05.png"><img src="/lazyimg-06.png">
<img src="/lazyimg-07.png"><img src="/lazyimg-08.png">
<img src="/lazyimg-09.png"><img src="/lazyimg-10.png">
<img src="/lazyimg-11.png"><img src="/lazyimg-12.png">
<img src="/lazyimg-13.png"><img src="/lazyimg-14.png">
<img src="/lazyimg-15.png"><img src="/lazyimg-16.png">
</body>
</html>
