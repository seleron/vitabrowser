<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS leaf insert</title>
<style>
/* Patch 407. A leaf element -- an <img>, an <iframe>, a form control --
 * inserted BETWEEN blocks used to rebuild the page ("new element is not a
 * plain block": claude, google, rte, guardian insert images, iframes and
 * text fields so). Now it is built alone and given a line of its own after
 * its earlier block. After its steps (400 ms apart) JS-leaf-insert.html
 * must render row for row as CSS-leaf-insert-ref.html, the same steps run
 * while the page parses. Local: an image, a text field, a text area, a
 * button, a select and an iframe each inserted between two blocks; a
 * display:block image (the block placement). Full: an image inserted next
 * to inline text (it must join that line). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div.b { margin: 3px 10px; padding: 2px; background: #eef; }
img { border: 2px solid #c00; }
img.blk { display: block; }
iframe { width: 80px; height: 20px; border: 2px solid #000; }
</style>
</head>
<body>
<div id="c">
<div class="b" id="b1">Block one.</div>
<div class="b" id="b2">Block two.</div>
<div class="b" id="b3">Block three.</div>
<div class="b" id="b4">Block four.</div>
<div class="b" id="b5">Block five.</div>
<div class="b" id="b6">Block six.</div>
<div class="b" id="b7">Block seven.</div>
<div class="b" id="b8">Block eight.</div>
</div>
<div id="t" class="b">Inline text <span id="ts">and a span</span> in one line.</div>
<script>
(function () {
	var PX = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAE0lEQVR4nGPQqDhBEmIY1UALDQCJj7QBup2ubwAAAABJRU5ErkJggg==';
	function $(id) { return document.getElementById(id); }
	function before(el, id) { $('c').insertBefore(el, $(id)); }
	function mk(tag, props) { var e = document.createElement(tag); for (var k in props) e[k] = props[k]; return e; }
	var ops = [
		function () { before(mk('img', { src: PX, alt: 'i' }), 'b2'); },
		function () { before(mk('input', { type: 'text', value: 'typed' }), 'b3'); },
		function () { var t = mk('textarea', { rows: 2, cols: 12 }); t.textContent = 'area'; before(t, 'b4'); },
		function () { var b = mk('button', {}); b.textContent = 'Press'; before(b, 'b5'); },
		function () { var s = mk('select', {}); s.innerHTML = '<option>one</option><option selected>two</option>'; before(s, 'b6'); },
		function () { before(mk('iframe', { name: 'li' }), 'b7'); },
		function () { before(mk('img', { src: PX, alt: 'k', className: 'blk' }), 'b8'); },
		function () { $('t').insertBefore(mk('img', { src: PX, alt: 'n' }), $('ts')); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 400); } })(); });
})();
</script>
</body>
</html>
