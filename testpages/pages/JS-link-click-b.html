<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS link click destination (script not run)</title>
<!-- Patch 292: the destination of JS-link-click.html's links. Loaded
     in the named frame it leaves a localStorage marker; loaded as the
     top page (the ?from=self navigation) it reads page A's record and
     reports the LINKCLICK summary:
       1 the script-clicked link navigated this window here;
       2 A marked that the navigation came from its script click;
       3 a link without href, clicked, did not navigate;
       4 a click whose listener prevents the default did not navigate;
       5 a link with target=<frame name> loaded this page in the frame. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">LINKCLICK B: script did not run</p>
<p id="r1" class="wait">1 navigated here: waiting</p>
<p id="r2" class="wait">2 by script click: waiting</p>
<p id="r3" class="wait">3 no-href stayed: waiting</p>
<p id="r4" class="wait">4 preventDefault stayed: waiting</p>
<p id="r5" class="wait">5 frame target: waiting</p>
<script>
(function () {
	var q = String(location.search || '');
	if (q.indexOf('from=frame') >= 0) {
		try { localStorage.setItem('lc-frame', 'frame'); } catch (e) { /* */ }
		try { parent.postMessage('lc-frame', '*'); } catch (e) { /* */ }
		document.getElementById('sum').textContent = 'LINKCLICK B: in the frame';
		return;
	}
	if (q.indexOf('from=self') < 0) {
		document.getElementById('sum').textContent = 'LINKCLICK B: loaded directly';
		return;
	}
	var a = {};
	try { a = JSON.parse(localStorage.getItem('lc-a') || '{}'); } catch (e) { /* */ }
	var clicked = 0;
	try { clicked = localStorage.getItem('lc-clicked') === '1' ? 1 : 0; } catch (e) { /* */ }
	var checks = [
		[1, 1, 'navigated here'],
		[2, clicked, 'by script click'],
		[3, a.nohref ? 1 : 0, 'no-href stayed'],
		[4, a.prevented ? 1 : 0, 'preventDefault stayed'],
		[5, a.frame ? 1 : 0, 'frame target']
	];
	var k = 0, i, p;
	for (i = 0; i < checks.length; i++) {
		p = document.getElementById('r' + checks[i][0]);
		p.textContent = checks[i][0] + ' ' + checks[i][2] + ': ' + (checks[i][1] ? 'ok' : 'FAILED');
		if (checks[i][1]) { k++; p.className = 'pass'; }
	}
	document.getElementById('sum').textContent = 'LINKCLICK: ' + k + '/5 passed';
	document.title = 'JS link click (' + k + '/5)';
})();
</script>
</body>
</html>
