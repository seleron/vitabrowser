<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS link click (script not run)</title>
<!-- Patch 292: a script's a.click() follows the link, as a real click
     does (before, click() activated submit buttons only, so a script
     clicking a link went nowhere). This page (A) runs the clicks that
     must NOT navigate (no href; a click listener that prevents the
     default) and one that must load the destination inside a named
     frame, records the results in localStorage, then clicks the link
     that navigates this window to JS-link-click-b.html, which reads
     the record and reports the LINKCLICK summary. Over the gate
     server only (NET-js-link-click): localStorage is per origin. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
#sum { font-size: 20px; font-weight: bold; }
a { display: block; margin: 4px 0; }
iframe { width: 320px; height: 60px; }
</style>
</head>
<body>
<p id="sum" class="wait">LINKCLICK: script did not run</p>
<a id="nohref">link without href</a>
<a id="prevented" href="JS-link-click-b.html?from=prevented">prevented link</a>
<a id="framelink" href="JS-link-click-b.html?from=frame" target="lcframe">link into the frame</a>
<a id="gonav" href="JS-link-click-b.html?from=self">link that navigates</a>
<iframe name="lcframe"></iframe>
<script>
(function () {
	var store = window.localStorage, res = { nohref: 0, prevented: 0, frame: 0 };
	try { store.removeItem('lc-a'); store.removeItem('lc-frame'); store.removeItem('lc-clicked'); } catch (e) { /* */ }
	document.getElementById('sum').textContent = 'LINKCLICK: page A working';
	window.addEventListener('load', function () {
		setTimeout(function () {
			/* All the clicks in one task: a navigation a click starts
			   is deferred by the engine, so if either dud click (no
			   href; default prevented) had navigated this window,
			   this script would be gone before it could write the
			   record page B reads -- B then fails those checks. */
			document.getElementById('nohref').click();
			var p = document.getElementById('prevented');
			p.addEventListener('click', function (e) { e.preventDefault(); });
			p.click();
			document.getElementById('framelink').click();
			var t0 = Date.now(), done = false;
			function finish() {
				if (done) return;
				done = true;
				res.nohref = 1; res.prevented = 1;
				try {
					store.setItem('lc-a', JSON.stringify(res));
					store.setItem('lc-clicked', '1');
				} catch (e) { /* */ }
				document.getElementById('gonav').click();
			}
			/* B in the frame reports by postMessage (the FORMTARGET
			   pattern); the timer is only a fallback so a frame that
			   never reports fails its check instead of hanging. */
			window.addEventListener('message', function (e) {
				if (e.data === 'lc-frame') { res.frame = 1; finish(); }
			});
			(function poll() {
				if (done) return;
				var f = null;
				try { f = store.getItem('lc-frame'); } catch (e) { /* */ }
				if (f === 'frame') { res.frame = 1; finish(); return; }
				if (Date.now() - t0 > 1500) { finish(); return; }
				setTimeout(poll, 100);
			})();
		}, 100);
	});
})();
</script>
</body>
</html>
