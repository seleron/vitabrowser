<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS list nested stall (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#res { position: fixed; top: 0; left: 0; right: 0; background: #fff; }
#big p { margin: 2px 0; }
#list li, #ol li { margin: 2px 0; }
div.card { margin: 12px 0; }
div.card p { margin: 8px 0; }
</style>
<script>
(function () {
	var S = { maxgap: 0, ticks: 0, on: false }, N = 7, k = 0;
	function now() { return self.performance ? performance.now() : Date.now(); }
	var last = now();
	(function tick() {
		var t = now(), g = t - last;
		last = t;
		if (S.on) { S.ticks++; if (g > S.maxgap) S.maxgap = g; }
		setTimeout(tick, 0);
	})();
	function $(id) { return document.getElementById(id); }
	function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }); return s.length ? s[s.length >> 1] : 0; }
	var res = [];
	function t(n, ok, text) { res.push([n, ok, text]); }
	function show() {
		var i, r, p;
		for (i = 0; i < res.length; i++) {
			r = res[i]; p = $('r' + r[0]);
			p.textContent = r[0] + ' ' + r[2] + (r[1] ? '' : ' FAIL');
			if (r[1]) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'LISTNEST: ' + k + '/' + N + ' passed';
		document.title = 'JS list nested stall (' + k + '/' + N + ')';
	}
	document.addEventListener('DOMContentLoaded', function () {
		var h = [], i;
		for (i = 0; i < 2500; i++)
			h.push('<p id="p' + i + '">Paragraph ' + i + ' with <b>some</b> ' +
				'inline <i>text</i> that <span id="s' + i + '">wraps</span> in the layout, ' +
				'<a href="#">a link</a> and more words to fill it.</p>');
		$('big').innerHTML = h.join('');
		h = [];
		for (i = 0; i < 2500; i++) h.push('<li id="l' + i + '">List item ' + i + ' with <b>bold</b> words</li>');
		$('list').innerHTML = h.join('');
		h = [];
		for (i = 0; i < 30; i++) h.push('<li id="o' + i + '">Numbered item ' + i + '</li>');
		$('ol').innerHTML = h.join('');
	});
	function colour(el) { return String(getComputedStyle(el).color).replace(/\s+/g, ''); }
	function li(id, text) { var e = document.createElement('li'); e.id = id; e.textContent = text; return e; }
	function below(a, b) { return $(b).getBoundingClientRect().top >= $(a).getBoundingClientRect().bottom - 1; }
	/* [name, bounded?, change, check] */
	var steps = [
		['list item appended', true, function () { $('list').appendChild(li('lnew', 'appended list item')); },
			function () { return $('lnew').getBoundingClientRect().height > 10 && below('l2499', 'lnew'); }],
		['list item inserted', true, function () { $('list').insertBefore(li('lmid', 'inserted list item'), $('l1250')); },
			function () { return below('l1249', 'lmid') && below('lmid', 'l1250'); }],
		['list item removed', true, function () { $('list').removeChild($('l1300')); },
			function () { return !$('l1300') && below('l1299', 'l1301') && $('l1301').getBoundingClientRect().top < $('l1299').getBoundingClientRect().bottom + 12; }],
		['numbered item inserted', true, function () { $('ol').insertBefore(li('onew', 'inserted numbered item'), $('o10')); },
			function () { return below('o9', 'onew') && below('onew', 'o10'); }],
		['nested block inserted', true, function () {
			var d = document.createElement('div');
			d.className = 'card'; d.id = 'card';
			d.innerHTML = '<p id="c1">first paragraph of a card</p><p id="c2">second paragraph of a card</p>';
			$('big').insertBefore(d, $('p1250'));
		}, function () { return below('p1249', 'c1') && below('c1', 'c2') && below('c2', 'p1250'); }],
		['nested block removed', true, function () { $('big').removeChild($('card')); },
			function () { return !$('card') && below('p1249', 'p1250') && $('p1250').getBoundingClientRect().top < $('p1249').getBoundingClientRect().bottom + 6; }]
	];
	function stack(from, to) {
		var i, prev = null, r;
		for (i = from; i <= to; i++) {
			if (!$('p' + i)) continue;
			r = $('p' + i).getBoundingClientRect();
			if (prev && r.top < prev.bottom - 1) return 'overlap at p' + i;
			prev = r;
		}
		return 'ok';
	}
	var gaps = [];
	function run(i) {
		if (i >= steps.length) {
			/* no full rebuild: that costs 179-189 ms a step here, building the
			 * subtree alone and one layout ~46 ms */
			var worst = Math.round(Math.max.apply(null, gaps)), med = Math.round(median(gaps)), o = stack(1240, 1260);
			t(7, o === 'ok' && med < 100 && worst < 170, 'no full rebuilds: median gap ' +
				med + ' ms, longest ' + worst + ' ms; paragraphs stack: ' + o);
			show();
			return;
		}
		S.maxgap = 0; S.ticks = 0; S.on = true;
		steps[i][2]();
		setTimeout(function () {
			var ok = steps[i][3]();
			setTimeout(function () {
				S.on = false;
				if (steps[i][1]) gaps.push(S.maxgap);
				t(i + 1, ok, steps[i][0] + ': longest gap ' + Math.round(S.maxgap) + ' ms');
				setTimeout(function () { run(i + 1); }, 100);
			}, 50);
		}, 600);
	}
	var started = false, lastH = -1;
	function settled() {
		var sh = document.body.scrollHeight;
		if (sh < 100000 || sh !== lastH) {
			lastH = sh;
			setTimeout(settled, 100);
			return;
		}
		/* 1 s after the page stops growing: the load's last full layout
		 * must not land in step 1's measuring window */
		setTimeout(function () { run(0); }, 1000);
	}
	window.addEventListener('load', function () {
		if (started) return;
		started = true;
		setTimeout(settled, 100);
	});
})();
</script>
</head>
<body>
<!-- Roadmap WS-C, lists and nested blocks (patch 176). A script adds or
     removes a list item, or a block holding other blocks (a "card" div of
     paragraphs), among thousands. Both took the full box-tree rebuild
     (~0.3 s here, seconds on the Vita). Now only the new (or removed)
     subtree is built, and the page is laid out once: a list's markers are
     numbered by the layout, and margins collapse through the nested
     block exactly as a full layout does.
     1-3: a list item appended, inserted, removed (2500-item list).
     4: an item inserted into a numbered list: those after it move down.
     5: a div of two paragraphs inserted among 2500 paragraphs.
     6: the div removed again.
     7: no step took the full rebuild: median gap < 100 ms and none at
        170 ms (sim: 179-189 ms with the full rebuild, 45-46 ms now: the
        layout is ~30 ms of it). -->
<div id="res">
<p id="sum" class="wait">LISTNEST: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p><p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
</div>
<div style="height: 240px"></div>
<div id="big"></div>
<ul id="list"></ul>
<ol id="ol"></ol>
</body></html>
