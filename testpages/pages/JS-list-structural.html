<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS list structural (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#res { position: fixed; top: 0; left: 0; right: 0; background: #fff; }
/* patch 192: structural selectors and CSS counters. Inserting or removing a
 * list item shifts every following sibling's :nth-child index and counter
 * values; the local block path must decline so the full reconversion
 * recascades them (stale styles / stale ::before counter text otherwise).
 * Removing a list item must also free its marker box (no leak). */
#zebra li:nth-child(odd) { background: #dddddd; }
#zebra li:nth-child(even) { background: #ffffff; }
#counted { counter-reset: item; }
#counted li { counter-increment: item; }
#counted li::before { content: counter(item) ". "; }
#zebra li, #counted li, #plain li { margin: 2px 0; }
</style>
<script>
(function () {
	var N = 6, k = 0, res = [];
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) { res.push([n, ok, text]); }
	function show() {
		var i, r, p;
		for (i = 0; i < res.length; i++) {
			r = res[i]; p = $('r' + r[0]);
			p.textContent = r[0] + ' ' + r[2] + (r[1] ? '' : ' FAIL');
			if (r[1]) { p.className = 'pass'; k++; }
		}
		$('sum').textContent = 'LISTSTRUCT: ' + k + '/' + N + ' passed';
		document.title = 'JS list structural (' + k + '/' + N + ')';
	}
	function bg(el) { return String(getComputedStyle(el).backgroundColor).replace(/\s+/g, ''); }
	function below(a, b) { return $(b).getBoundingClientRect().top >= $(a).getBoundingClientRect().bottom - 1; }
	function li(id, text) { var e = document.createElement('li'); e.id = id; e.textContent = text; return e; }

	/* Fast: the autotest page budget on the sim is ~1s. Run the steps
	 * back-to-back with short settles; the engine's reconvert is fast
	 * on this tiny page. */
	function run() {
		var z = $('zebra'), c = $('counted'), p = $('plain');
		/* 1: insert at the head of the zebra list; the old first item
		 * is now second and must recascade to the even style */
		z.insertBefore(li('z0', 'zero'), $('z1'));
		setTimeout(function () {
			t(1, bg($('z1')) === 'rgb(255,255,255)',
				'insert: z1 recascaded to even (bg ' + bg($('z1')) + ')');
			/* 2: remove it again; z1 must be odd again */
			z.removeChild($('z0'));
			setTimeout(function () {
				t(2, bg($('z1')) === 'rgb(221,221,221)',
					'remove: z1 recascaded to odd (bg ' + bg($('z1')) + ')');
				/* 3: insert into the counter list; items stack */
				c.insertBefore(li('c0', 'zero'), $('c1'));
				setTimeout(function () {
					t(3, below('c0', 'c1') && below('c1', 'c2'),
						'counter insert: items stack');
					/* 4: remove from the counter list */
					c.removeChild($('c0'));
					setTimeout(function () {
						t(4, below('c1', 'c2') && !$('c0'),
							'counter remove: items stack, c0 gone');
						/* 5: remove from the plain list; the
						 * marker box must be freed (engine log) */
						p.removeChild($('p2'));
						setTimeout(function () {
							t(5, !$('p2') && below('p1', 'p3'),
								'plain remove: p2 gone, siblings stack');
							/* 6: final geometry intact */
							t(6, below('z1', 'z2') && below('z2', 'z3') &&
								below('c1', 'c2') && below('p1', 'p3'),
								'final geometry intact');
							show();
						}, 80);
					}, 80);
				}, 80);
			}, 80);
		}, 80);
	}
	if (document.readyState === 'loading')
		document.addEventListener('DOMContentLoaded', function () { setTimeout(run, 30); });
	else
		setTimeout(run, 30);
})();
</script>
</head>
<body>
<!-- Roadmap: patch 192 follow-up to patch 176. Inserting/removing a list
     item must recascade following siblings' :nth-child styles and CSS
     counter text (the local path declines to a full reconversion), and a
     removed item's marker box must be freed.
     1: zebra insert recascades old first item to even.
     2: zebra remove restores odd.
     3-4: counter list insert/remove keep geometry (decline path).
     5: plain list remove frees the marker (engine log) and stacks.
     6: final geometry intact. -->
<div id="res"><div id="sum">LISTSTRUCT: running</div>
<div id="r1" class="wait">r1</div><div id="r2" class="wait">r2</div>
<div id="r3" class="wait">r3</div><div id="r4" class="wait">r4</div>
<div id="r5" class="wait">r5</div><div id="r6" class="wait">r6</div></div>
<ol id="zebra"><li id="z1">one</li><li id="z2">two</li><li id="z3">three</li></ol>
<ol id="counted"><li id="c1">alpha</li><li id="c2">beta</li></ol>
<ul id="plain"><li id="p1">a</li><li id="p2">b</li><li id="p3">c</li></ul>
</body>
</html>
