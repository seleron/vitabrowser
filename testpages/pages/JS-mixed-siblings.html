<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS mixed siblings</title>
<style>
/* Patch 377. A block inserted into or removed from a parent whose
 * children are not all blocks took the full box-tree rebuild ("parent
 * holds more than blocks"): youtube's <body> holds a flex <div> and a
 * line of inline content (a hidden <iframe>), guardian's a line of
 * <gu-island>s. Flex, grid and table siblings are now tracked like
 * blocks, inline content among the blocks is left as it is, and the page
 * is laid out whole; a <script> in the parent is skipped. Still the full
 * rebuild: a block that would split a line of inline content, a removal
 * that would join two, an inline element removed. Last, a display:flex
 * <div> inserted: its new box is normalised as a flex (box_normalise_block
 * asserted on it). After its steps (600 ms
 * apart) JS-mixed-siblings.html must render row for row as
 * CSS-mixed-siblings-ref.html, the same steps run while the page
 * parses. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.fx { display: flex; }
.fx div { border: 1px solid #000; padding: 2px 4px; margin: 0; }
span { color: #036; }
</style>
</head>
<body>
<div id="b1">First block.</div>
<div id="fx" class="fx"><div>flex one</div><div>flex two</div></div>
<div id="b2">A block, removed.</div>
<span id="s1">inline one</span> <span id="s2">inline two</span>
<div id="b3">A block between two lines, removed (full rebuild).</div>
<span id="s3">inline three</span>
<div id="b4">Last block.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var p = document.createElement('p'); p.textContent = 'A paragraph appended to the body.'; document.body.appendChild(p); },
		function () { var d = document.createElement('div'); d.textContent = 'A block inserted before the flex.'; document.body.insertBefore(d, $('fx')); },
		function () { $('b2').parentNode.removeChild($('b2')); },
		function () { $('fx').parentNode.removeChild($('fx')); },
		function () { var d = document.createElement('div'); d.textContent = 'A block between two spans of one line.'; document.body.insertBefore(d, $('s2')); },
		function () { $('b3').parentNode.removeChild($('b3')); },
		function () { $('s3').parentNode.removeChild($('s3')); },
		function () { var d = document.createElement('div'); d.textContent = 'A block inserted before the last.'; document.body.insertBefore(d, $('b4')); },
		function () { var d = document.createElement('div'); d.className = 'fx'; d.innerHTML = '<div>a new flex</div><div>its item</div>'; document.body.insertBefore(d, $('b4')); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
