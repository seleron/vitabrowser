<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MODELIV child</title></head>
<body><p id="kid">observed by its own realm</p>
<span id="mv">moved by the parent</span>
<script>
/* JS-mo-delivery.html's frame (patch 317, doc 21). This realm observes
 * its own #kid; the PARENT writes to #kid through its frame-document
 * handles (patch 307). Before patch 317 such a write queued no record
 * here -- queueing meant running this realm's JS from the parent's turn.
 * Reports what this realm's observer received, every 300 ms. */
var got = { attr: null, added: 0, calls: 0 };
new MutationObserver(function (ms) {
	got.calls++;
	for (var i = 0; i < ms.length; i++) {
		if (ms[i].type === 'attributes') got.attr = ms[i].attributeName;
		if (ms[i].type === 'childList') got.added += ms[i].addedNodes.length;
	}
}).observe(document.getElementById('kid'), { attributes: true, childList: true });
setInterval(function () {
	parent.postMessage({ modeliv: 'child', attr: got.attr, added: got.added,
		calls: got.calls }, '*');
}, 300);
</script>
</body></html>
