<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS import() without freezing (script not run)</title>
<!-- Roadmap WS-C1 (patches/quickjs/03 + netsurf patch 159): a dynamic
     import() of a module graph (9 modules, 3 levels) loads between
     event-loop passes instead of inside one job. Before, the whole graph
     was fetched and compiled synchronously (claude.ai: ~54 s frozen on the
     Vita, hardware run 22).
     1: the import() resolves with the right value (2+2+3 + 4+5+12 = 28).
     2: timers ran while it loaded (the loop was not blocked): setTimeout
        callbacks between the import() call and its resolution > 0 (a
        synchronous load resolves before any of them can run).
     3: a second import() of the same root resolves to the same module.
     4: an import() of a missing module rejects (not left pending). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">MODASYNC: script did not run</p>
<p id="r1" class="wait">1 waiting</p><p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p><p id="r4" class="wait">4 waiting</p>
<script>
(function () {
	var N = 4, k = 0, ticks = 0, done = false, first = null;
	function t(n, ok, text) {
		var p = document.getElementById('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		document.getElementById('sum').textContent = 'MODASYNC: ' + k + '/' + N + ' passed';
		document.title = 'JS import() without freezing (' + k + '/' + N + ')';
	}
	document.getElementById('sum').textContent = 'MODASYNC: 0/' + N + ' passed';
	(function tick() { if (!done) { ticks++; setTimeout(tick, 0); } })();
	var p1 = import('./js-modasync-root.js');
	var p2 = import('./js-modasync-root.js');
	p1.then(function (m) {
		done = true;
		first = m;
		t(1, m.total === 28, 'import() value: ' + m.total);
		t(2, ticks > 1, 'timers while loading: ' + ticks);
		return p2.then(function (m2) { t(3, m2 === first, 'same module twice'); });
	}, function (e) { done = true; t(1, false, 'import() rejected: ' + e); });
	import('./js-modasync-missing.js').then(function () {
		t(4, false, 'missing module resolved');
	}, function (e) { t(4, true, 'missing module rejects'); });
})();
</script>
</body>
</html>
