<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS mutation observer</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 0; padding: 1px 6px; font-size: 11px; line-height: 1.3; }
.wait { background: #fcc; }
.pass { background: #cfc; }
.fail { background: #f66; }
#sum { font-size: 16px; font-weight: bold; margin: 2px 0; }
</style>
</head>
<body>
<p id="sum" class="wait">JS mutation: script did not run</p>
<div id="rows"></div>
<div id="target"></div>
<script>
/* MutationObserver audit: records are queued by native append/remove/insert
 * and delivered by a zero-delay task after the mutating script returns. */
var passed = 0, total = 0, failedNames = [];
function t(name, cond) {
  total++;
  var p = document.createElement('p');
  p.className = cond ? 'pass' : 'fail';
  p.textContent = total + ' ' + name + ': ' + (cond ? 'PASS' : 'FAIL');
  document.getElementById('rows').appendChild(p);
  if (cond) passed++; else failedNames.push(name);
}
function sum() {
  var s = document.getElementById('sum');
  s.className = passed === total ? 'pass' : 'fail';
  s.textContent = 'JS mutation: ' + passed + '/' + total + ' passed' +
    (failedNames.length ? ' FAILS: ' + failedNames.join('; ') : '');
}

var records = [];
var target = document.getElementById('target');
var obs = new MutationObserver(function (ms) {
  for (var i = 0; i < ms.length; i++) records.push(ms[i]);
});
t('1 MutationObserver constructs', typeof obs.observe === 'function');
obs.observe(target, { childList: true });
t('2 observe() accepts target', true);

var d1 = document.createElement('div');
d1.id = 'm1';
d1.textContent = 'one';
target.appendChild(d1);

var d2 = document.createElement('div');
d2.id = 'm2';
target.appendChild(d2);
target.removeChild(d1);

/* Delivery is async (zero-delay task): poll until records arrive or timeout. */
var tries = 0;
var timer = setInterval(function () {
  tries++;
  if (records.length >= 3 || tries > 50) {
    clearInterval(timer);
    finish();
  }
}, 100);

function finish() {
  t('3 callback fired with records', records.length >= 3);
  var sawAdd = false, sawRemove = false;
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    if (r.type === 'childList' && r.addedNodes && r.addedNodes.length > 0)
      sawAdd = true;
    if (r.type === 'childList' && r.removedNodes && r.removedNodes.length > 0)
      sawRemove = true;
  }
  t('4 records include addedNodes', sawAdd);
  t('5 records include removedNodes', sawRemove);

  /* disconnect() stops delivery */
  var before = records.length;
  obs.disconnect();
  var d3 = document.createElement('div');
  target.appendChild(d3);
  setTimeout(function () {
    t('6 disconnect() stops callbacks', records.length === before);
    t('7 takeRecords exists', typeof obs.takeRecords === 'function');
    sum();
  }, 300);
}
</script>
</body>
</html>
