<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS NaN constants (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
<script>
/* quickjs patch 05: the engine's non-finite constants -- NaN, Infinity,
 * Number.NaN, Number.POSITIVE_INFINITY / NEGATIVE_INFINITY -- are what
 * they name. They were all 0 (a C89 port's flattened union), so
 * isNaN(NaN) was false and Infinity sentinels compared as 0.
 * Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'NANCONST: ' + k + '/' + N + ' passed';
		document.title = 'JS NaN constants (' + k + '/' + N + ')';
	}
	function run() {
		var nan = NaN;
		t(1, nan !== nan && isNaN(NaN) && !isFinite(NaN) && String(NaN) === 'NaN',
			'NaN is NaN (' + String(NaN) + ', ' + isNaN(NaN) + ')');
		t(2, Number.isNaN(Number.NaN) && String(Number.NaN) === 'NaN',
			'Number.NaN (' + String(Number.NaN) + ')');
		t(3, Infinity > 1e308 && 1 / Infinity === 0 && -Infinity < -1e308 &&
			String(Infinity) === 'Infinity',
			'Infinity (' + String(Infinity) + ', ' + String(-Infinity) + ')');
		t(4, Number.POSITIVE_INFINITY === 1 / 0 &&
			Number.NEGATIVE_INFINITY === -1 / 0 &&
			Math.min() === Infinity && Math.max.apply(null, [1, 2]) === 2,
			'Number infinities (' + Number.POSITIVE_INFINITY + ', ' +
			Number.NEGATIVE_INFINITY + ')');
	}
	window.addEventListener('load', function () { setTimeout(run, 100); });
})();
</script>
</head>
<body>
<div id="sum">NANCONST: 0/4 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
</body>
</html>
