<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS node names (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
#host { display: none; }
</style>
</head>
<body>
<div id="sum">NODENAME: 0/8 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<div id="host"><svg width="10" height="10"><foreignObject></foreignObject><linearGradient></linearGradient><path d="M0 0"></path></svg><math><mi>x</mi></math><my-rather-long-custom-element-name-x1></my-rather-long-custom-element-name-x1></div>
<script>
/* patch 249: an HTML element's nodeName is its tagName, upper case (it
 * was the lower-case name, so `el.nodeName === 'A'` was never true), and
 * an SVG / MathML element keeps its name's case ("svg", "foreignObject")
 * with its real namespace (namespaceURI was guessed from ten tag names);
 * names were cut at 31 characters. Chromium-verified. */
(function () {
	var k = 0, N = 8, SVG = 'http://www.w3.org/2000/svg', XH = 'http://www.w3.org/1999/xhtml',
		MML = 'http://www.w3.org/1998/Math/MathML';
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'NODENAME: ' + k + '/' + N + ' passed';
		document.title = 'JS node names (' + k + '/' + N + ')';
	}
	function d(e) { return e.nodeName + '|' + e.tagName + '|' + e.localName + '|' + e.namespaceURI; }
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var host = $('host'), svg = host.firstChild, math = svg.nextSibling, ce = math.nextSibling;
	check(1, function () {
		var a = document.createElement('a'), div = $('sum');
		return (a.nodeName === 'A' && a.nodeName === a.tagName && div.nodeName === 'DIV' &&
			a.localName === 'a') || d(a) + ' ' + d(div);
	}, 'an HTML element\'s nodeName is its upper-case tagName');
	check(2, function () {
		return d(svg) === 'svg|svg|svg|' + SVG || d(svg);
	}, 'a parsed <svg> keeps its case and namespace');
	check(3, function () {
		var fo = svg.firstChild, lg = fo.nextSibling, path = lg.nextSibling;
		return (d(fo) === 'foreignObject|foreignObject|foreignObject|' + SVG &&
			lg.nodeName === 'linearGradient' && path.nodeName === 'path') ||
			d(fo) + ' ' + lg.nodeName + ' ' + path.nodeName;
	}, 'SVG\'s camel-case names (foreignObject, linearGradient)');
	check(4, function () {
		var g = document.createElementNS(SVG, 'radialGradient'), c = document.createElementNS(SVG, 'circle');
		return (d(g) === 'radialGradient|radialGradient|radialGradient|' + SVG &&
			c.nodeName === 'circle') || d(g) + ' ' + c.nodeName;
	}, 'createElementNS(SVG, ...) keeps the case');
	check(5, function () {
		var s = document.createElement('svg');
		return d(s) === 'SVG|SVG|svg|' + XH || d(s);
	}, 'createElement(\'svg\') is an HTML element, as in browsers');
	check(6, function () {
		var mi = math.firstChild;
		return (d(math) === 'math|math|math|' + MML && mi.nodeName === 'mi') || d(math) + ' ' + mi.nodeName;
	}, 'MathML too');
	check(7, function () {
		return (ce.nodeName === 'MY-RATHER-LONG-CUSTOM-ELEMENT-NAME-X1' &&
			ce.localName === 'my-rather-long-custom-element-name-x1') || ce.nodeName;
	}, 'a 37-character custom element name is whole');
	check(8, function () {
		var c = document.createComment('x'), f = document.createDocumentFragment();
		return (document.createTextNode('x').nodeName === '#text' && c.nodeName === '#comment' &&
			f.nodeName === '#document-fragment' && document.nodeName === '#document') ||
			[c.nodeName, f.nodeName, document.nodeName].join();
	}, 'text, comment, fragment and document names are unchanged');
})();
</script>
</body>
</html>
