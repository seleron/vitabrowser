<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS node shape (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">NODESHAPE: 0/6 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<script>
/* patch 279: element, text, comment and fragment nodes have no own
 * properties (a used element carried tagName, nodeName, nodeType, __ptr and
 * its listener, handler, style, classList and dataset caches); tagName,
 * nodeName, nodeType are the prototypes' getters. Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'NODESHAPE: ' + k + '/' + N + ' passed';
		document.title = 'JS node shape (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var e = document.createElement('div'), hits = 0, clicks = 0;
	document.body.appendChild(e);
	e.addEventListener('vbnode', function () { hits++; });
	e.onclick = function () { clicks++; };
	e.style.color = 'red'; e.classList.add('vb'); e.dataset.vb = '1';
	check(1, function () {
		var k = Reflect.ownKeys(e).map(String);
		return k.length === 0 || 'own: ' + k.join(' ');
	}, 'an element in use has no own properties');
	check(2, function () {
		var f = document.createDocumentFragment(); f.appendChild(document.createElement('b'));
		var bad = [document.createTextNode('t'), document.createComment('c'), f].filter(function (n) { return Reflect.ownKeys(n).length; })
			.map(function (n) { return n.nodeName + ':' + Reflect.ownKeys(n).map(String).join(','); });
		return bad.length === 0 || bad.join(' ');
	}, 'text, comment and fragment nodes have none either');
	check(3, function () {
		var svg = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient'), f = document.createDocumentFragment();
		var got = [e.tagName, e.nodeName, e.nodeType, svg.tagName, document.createTextNode('').nodeName, document.createTextNode('').nodeType,
			document.createComment('').nodeName, f.nodeName, f.nodeType, document.nodeName, document.nodeType].join(' ');
		return got === 'DIV DIV 1 linearGradient #text 3 #comment #document-fragment 11 #document 9' || got;
	}, 'tagName, nodeName and nodeType');
	check(4, function () {
		var t = Object.getOwnPropertyDescriptor(Element.prototype, 'tagName'), n = Object.getOwnPropertyDescriptor(Node.prototype, 'nodeName'),
			y = Object.getOwnPropertyDescriptor(Node.prototype, 'nodeType');
		return (t && t.get && t.get.name === 'get tagName' && n && n.get && n.get.name === 'get nodeName' && y && y.get && !y.set) || 'not the prototypes\' getters';
	}, 'they are Element.prototype\'s and Node.prototype\'s getters');
	check(5, function () {
		e.dispatchEvent(new Event('vbnode')); e.click();
		return (hits === 1 && clicks === 1) || 'listener ' + hits + ', onclick ' + clicks;
	}, 'listeners and handlers still fire');
	check(6, function () {
		return (e.style === e.style && e.classList === e.classList && e.dataset === e.dataset && e.style.color === 'red' &&
			e.classList.contains('vb') && e.dataset.vb === '1' && f6()) || 'style / classList / dataset changed';
		function f6() { var fr = document.createDocumentFragment(); fr.appendChild(document.createTextNode('ab')); return fr.textContent === 'ab'; }
	}, 'style, classList, dataset and a fragment\'s textContent still work');
})();
</script>
</body>
</html>
