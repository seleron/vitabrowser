<!DOCTYPE html>
<!--
 * Patch 386: <object> and <embed> survive a full rebuild. Three steps
 * 600 ms apart, each a full rebuild (a sibling rule watches #a): #a .on,
 * the second object's block removed, #a back to no class. Before 386 the
 * full reconvert's relink retired the new tree's own <object>/<embed>
 * entries along with the old tree's, and every one drew blank after the
 * first step. The reference is STATIC -- the final state with no script,
 * since a parse-time script would take the same full rebuild.
-->
<html><head><meta charset="utf-8"><title>JS object rebuild</title><style>
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.on + p { color: #c00; }
.flex { display: flex; gap: 8px; }
</style></head><body>
<p id="a">A paragraph whose class a sibling rule watches.</p>
<p>Red while the paragraph before it is .on (it ends without).</p>
<div class="flex"><object data="lazyimg-01.png" type="image/png" width="60" height="60"></object><span>object in a flex</span></div>
<div id="gone"><object data="lazyimg-02.png" type="image/png" width="60" height="60"></object> object removed by the script</div>
<div><object data="lazyimg-01.png" type="image/png" width="60" height="60"></object> object in a block</div>
<div><embed src="lazyimg-01.png" type="image/png" width="60" height="60"> embed in a block</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('a').className = 'on'; },
		function () { var g = $('gone'); g.parentNode.removeChild(g); },
		function () { $('a').className = ''; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); }, 800); });
})();
</script></body></html>
