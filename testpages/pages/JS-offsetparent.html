<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS offsetParent (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 8px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
#rel { position: relative; margin-top: 10px; padding: 5px; border: 3px solid #888; }
#in { margin-top: 7px; }
#deep { margin-top: 11px; }
#fx { position: fixed; bottom: 0; right: 0; }
</style>
<script>
/* patch 234: offsetParent and offsetTop/Left as CSSOM View defines them.
 * offsetParent was always <body> -- body's own included -- so the classic
 *   do { top += el.offsetTop; } while (el = el.offsetParent);
 * never ended (make.wordpress.org: jquery.sonar burned the 8 s script
 * budget and o2 never rendered its posts); and offsetTop counted from the
 * parent box, so the sum was wrong where it did end. Now: null for body,
 * html, position:fixed, unrendered and detached elements; else the nearest
 * positioned ancestor, a td/th/table for a static element, or body; and
 * offsetTop counts from that ancestor's padding edge (from the page for
 * body). Checks compare against the engine's own getBoundingClientRect,
 * so they hold under any layout. Chromium-verified. */
(function () {
	var k = 0, N = 8;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'OFFPARENT: ' + k + '/' + N + ' passed';
		document.title = 'JS offsetParent (' + k + '/' + N + ')';
	}
	function top(e) { return e.getBoundingClientRect().top + (window.scrollY || 0); }
	function name(e) { return e === null ? 'null' : e === undefined ? 'undefined' : (e.id || e.tagName); }
	function run() {
		var b = document.body, d = document.documentElement;
		t(1, b.offsetParent === null && d.offsetParent === null,
			'body / html: ' + name(b.offsetParent) + ' / ' + name(d.offsetParent));
		var deep = $('deep');
		t(2, deep.offsetParent === b && Math.abs(deep.offsetTop - top(deep)) <= 1,
			'static in static: ' + name(deep.offsetParent) + ', top ' +
			deep.offsetTop + ' vs ' + Math.round(top(deep)));
		var inn = $('in'), rel = $('rel');
		var want = top(inn) - (top(rel) + rel.clientTop);
		t(3, inn.offsetParent === rel && Math.abs(inn.offsetTop - want) <= 1,
			'in a positioned box: ' + name(inn.offsetParent) + ', top ' +
			inn.offsetTop + ' vs ' + Math.round(want));
		t(4, $('fx').offsetParent === null, 'fixed: ' + name($('fx').offsetParent));
		t(5, $('sp').offsetParent === $('cell'),
			'static in a cell: ' + name($('sp').offsetParent));
		var det = document.createElement('div');
		t(6, det.offsetParent === null && $('hs').offsetParent === null,
			'detached / display:none: ' + name(det.offsetParent) + ' / ' +
			name($('hs').offsetParent));
		var e = inn, s = 0, steps = 0;
		do { s += e.offsetTop; steps++; } while ((e = e.offsetParent) && steps < 50);
		/* the sum leaves out each offsetParent's border (browsers too) */
		var want7 = top(inn) - rel.clientTop;
		t(7, steps === 3 && Math.abs(s - want7) <= 1,
			'the offsetParent loop: ' + steps + ' steps, ' + s + ' vs ' +
			Math.round(want7));
		t(8, b.offsetTop === 0 && b.offsetLeft === 0,
			'body offsetTop/Left: ' + b.offsetTop + ' / ' + b.offsetLeft);
	}
	window.addEventListener('load', function () { setTimeout(run, 100); });
})();
</script>
</head>
<body>
<div id="sum">OFFPARENT: 0/8 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<div id="rel"><div id="in">inner</div></div>
<div id="outer"><div id="deep">deep</div></div>
<table><tr><td id="cell"><span id="sp">in a cell</span></td></tr></table>
<div id="hid" style="display:none"><span id="hs">hidden</span></div>
<div id="fx">fixed</div>
</body>
</html>
