<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS only child</title>
<style>
/* Patch 504. A structural rule with :only-child / :only-of-type counted
 * as able to flip for every child in the change's range, however many
 * children the parent had: stackoverflow's ".ProseMirror.s-prose
 * div:only-child" hit all 30 children of its <body> on each <iframe> it
 * inserted. A child's :only-* match can flip only when the count was 1
 * before or is 1 after; with two or more children now and two or more
 * that existed before (known by their boxes), nothing can flip. After its
 * steps (250 ms apart) JS-only-child.html must render row for row as
 * CSS-only-child-ref.html, the same steps run while the page parses.
 * Steps: one child, a sibling inserted (it loses :only-child); two, one
 * removed (the other gains it); three, one inserted (no flip); one child
 * with a new <script> and a new <div> in one step (it loses it -- a new
 * <script> has no box, so it does not count as an earlier child); a <p>
 * among <div>s, a <div> inserted (p:only-of-type unchanged), then a
 * second <p> (both lose it). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.box { margin: 4px 10px; background: #eef; padding: 2px; }
.box > div { border: 1px solid #000; padding: 2px 6px; margin: 2px; }
.box > div:only-child { background: #fc8; border-width: 3px; }
.box > p:only-of-type { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<div id="a" class="box"><div>a1 only</div></div>
<div id="b" class="box"><div>b1</div><div id="b2">b2</div></div>
<div id="c" class="box"><div>c1</div><div>c2</div><div>c3</div></div>
<div id="d" class="box"><div>d1 only</div></div>
<div id="e" class="box"><div>e1</div><p>e-p only of type</p><div>e2</div></div>
<p>After the boxes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function el(tag, text) { var d = document.createElement(tag); if (text) d.textContent = text; return d; }
	var ops = [
		function () { $('a').appendChild(el('div', 'a2')); },
		function () { $('b').removeChild($('b2')); },
		function () { $('c').insertBefore(el('div', 'c1.5'), $('c').children[1]); },
		function () { var s = el('script'); s.text = 'void 0;'; $('d').appendChild(s); $('d').appendChild(el('div', 'd2')); },
		function () { $('e').insertBefore(el('div', 'e1.5'), $('e').children[1]); },
		function () { $('e').appendChild(el('p', 'e-p2')); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 250); } })(); });
})();
</script>
</body>
</html>
