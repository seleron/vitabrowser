<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS PerformanceObserver (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
<script>
/* patch 240: a PerformanceObserver callback gets an entry list
 * (getEntries / getEntriesByType / getEntriesByName), whatever it holds;
 * ours passed a bare array and github.com's interaction tracker threw
 * "not a function" on e.getEntries(). Checked after 600 ms so a browser
 * that delivers nothing (no buffered "event" entries) passes check 2
 * without a callback. Chromium-verified. */
(function () {
	var k = 0, N = 2, got = null, threw = null;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'PERFOBS: ' + k + '/' + N + ' passed';
		document.title = 'JS PerformanceObserver (' + k + '/' + N + ')';
	}
	window.addEventListener('load', function () {
	try {
		var o = new PerformanceObserver(function (list) {
			try { got = [list.getEntries().length, list.getEntriesByType('event').length,
				list.getEntriesByName('x').length]; } catch (e) { threw = String(e); }
		});
		o.observe({ type: 'event', buffered: true, durationThreshold: 0 });
		t(1, typeof o.disconnect === 'function' && typeof o.takeRecords === 'function',
			'observe / disconnect / takeRecords');
	} catch (e) { t(1, false, 'threw ' + e); }
	setTimeout(function () {
		t(2, threw === null, 'a callback can call getEntries(): ' +
			(threw || (got ? 'list of ' + got[0] : 'no callback')));
	}, 600);
	});
})();
</script>
</head>
<body>
<div id="sum">PERFOBS: 0/2 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
</body>
</html>
