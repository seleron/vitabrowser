<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS popup (script not run)</title>
<!-- Patch 127: window.open opens a real window (its own realm, shown over
     this one) and the two talk through postMessage, as a sign-in popup
     does. 1: window.open returns a window. 2: the popup's
     opener.postMessage arrives with event.source === that window.
     3: a message to the popup is answered (round trip). 4: the popup
     closes itself; w.closed turns true and this page is shown again. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">POPUP: script did not run</p>
<p id="r1" class="wait">1 window.open returns a window: waiting</p>
<p id="r2" class="wait">2 message from the popup, source is that window: waiting</p>
<p id="r3" class="wait">3 message to the popup answered: waiting</p>
<p id="r4" class="wait">4 popup closed itself (closed true): waiting</p>
<script>
(function () {
	var done = {}, w = null;
	function pass(n, text) {
		if (done[n]) return;
		done[n] = true;
		var p = document.getElementById('r' + n);
		p.textContent = text;
		p.className = 'pass';
		var k = 0, i;
		for (i = 1; i <= 4; i++) if (done[i]) k++;
		document.getElementById('sum').textContent = 'POPUP: ' + k + '/4 passed';
		document.title = 'JS popup (' + k + '/4)';
		console.log('POPUP ' + n + ' ' + text);
	}
	document.getElementById('sum').textContent = 'POPUP: 0/4 passed';
	window.addEventListener('message', function (e) {
		var d = e.data;
		if (d && d.hello === 'from-popup') {
			if (e.source === w) pass(2, '2 message from the popup, source is that window');
			w.postMessage({ ping: 1 }, '*');
		} else if (d && d.pong === 2) {
			pass(3, '3 message to the popup answered: pong ' + d.pong);
			var t = setInterval(function () {
				if (w.closed) { clearInterval(t); pass(4, '4 popup closed itself (closed true)'); }
			}, 100);
		}
	});
	setTimeout(function () {
		w = window.open('js-popup-child.html', 'signin', 'width=500,height=600');
		if (w && typeof w.postMessage === 'function' && w.closed === false)
			pass(1, '1 window.open returns a window');
	}, 50);
})();
</script>
</body>
</html>
