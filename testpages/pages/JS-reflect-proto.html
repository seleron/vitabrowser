<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS reflect proto</title>
<style>
/* Patch 426. Reflect.get(Node.prototype, 'parentElement', el) -- an
 * accessor read through the standard prototype, as claude's sign-in
 * bundle reads fifteen of them -- answered undefined: Node.prototype had
 * no accessor, and the bundle's ancestor walk (t !== null) spun one
 * microtask forever before first layout. Each read here must equal the
 * direct one, and the walk must end. Then a microtask that loops forever
 * must be stopped (the job deadline) and the page go on. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 6px 10px; }
</style>
</head>
<body>
<div id="a"><section id="b"><p id="c">A paragraph three levels down. <span id="s">span</span></p></section></div>
<p id="res">REFLECTPROTO: pending</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ok = 0, n = 0, bad = [];
	function eq(P, prop, o) {
		n++;
		var a, b;
		try { a = Reflect.get(P, prop, o); b = o[prop]; } catch (e) { bad.push(prop + ' threw'); return; }
		if (a === b || (a && b && typeof a === 'object' && a.length === b.length && a[0] === b[0])) ok++;
		else bad.push(prop);
	}
	var c = $('c'), s = $('s');
	['parentElement', 'parentNode', 'nextSibling', 'previousSibling', 'childNodes', 'firstChild',
	 'lastChild', 'ownerDocument', 'nodeType', 'nodeName', 'textContent', 'isConnected'].forEach(function (p) { eq(Node.prototype, p, c); });
	['localName', 'children', 'tagName', 'id', 'className', 'firstElementChild', 'nextElementSibling'].forEach(function (p) { eq(Element.prototype, p, c); });
	eq(HTMLElement.prototype, 'style', c);
	['defaultView', 'documentElement', 'body', 'head'].forEach(function (p) { eq(Document.prototype, p, document); });
	/* claude's walk: Oe = e => Reflect.get(Node.prototype, "parentElement", e) */
	n++;
	var steps = 0, t;
	for (t = Reflect.get(Node.prototype, 'parentElement', s); t !== null && steps < 50; t = Reflect.get(Node.prototype, 'parentElement', t)) steps++;
	if (t === null && steps === 5) ok++; else bad.push('walk ' + steps + ' ' + t);
	$('res').textContent = 'REFLECTPROTO: ' + ok + '/' + n + ' passed' + (bad.length ? ' (' + bad.join(', ') + ')' : '');
	/* the job deadline: one microtask that never ends */
	window.addEventListener('load', function () {
		setTimeout(function () { queueMicrotask(function () { for (;;) {} }); }, 300);
	});
})();
</script>
</body>
</html>
