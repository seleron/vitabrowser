<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS remove controls</title>
<style>
/* Patch 368. A script removing a block that holds a form control took
 * the full box-tree rebuild ("removed block holds objects or controls":
 * 88-93 ms on a 2500-paragraph page). The block is now unlinked like any
 * other; its controls go with its boxes (form_free_control also takes each
 * out of its form, as form.elements does in a browser), after the focus
 * and an open select's menu are let go of them (18 ms). After its eight
 * steps (250 ms apart) this page must render row for row as
 * CSS-remove-controls-ref.html, the same steps run while the page parses,
 * and the two must agree on form.elements and the typed value. Steps: an
 * input given a value, its block removed; a select's block removed; the
 * input's block put back (its value kept); a textarea's block removed; a
 * block with a control outside any form removed; a class change on a
 * table cell's own box (still the full rebuild); a radio group's block
 * removed; the cell's class moved to the next cell. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 3px 10px; }
table { border-collapse: collapse; margin: 4px 10px; }
td { border: 1px solid #000; padding: 2px 4px; }
.hl { background: #ff0; font-weight: bold; padding: 6px 12px; border: 3px solid #f00; }
</style>
</head>
<body>
<form id="f" action="#"><div id="w">
<p id="pa">A <input id="ia" value="a"></p>
<p id="pb">B <select id="sb"><option>x</option><option selected>y</option></select></p>
<p id="pc">C <textarea id="tc" rows="2" cols="10">tc</textarea></p>
<p id="pd">D <input type="radio" name="r" id="r1" checked> <input type="radio" name="r" id="r2"></p>
<p id="pe">E plain</p>
</div></form>
<div id="w2"><p id="po">orphan <input id="io" value="o"></p><p>after the orphan</p></div>
<table><tr><td id="tdc">cell</td><td>other cell</td></tr><tr><td>row 2</td><td>more</td></tr></table>
<p id="end">The end.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var pa;
	var ops = [
		function () { $('ia').value = 'typed'; pa = $('pa'); $('w').removeChild(pa); },
		function () { $('w').removeChild($('pb')); },
		function () { $('w').insertBefore(pa, $('pe')); },
		function () { $('w').removeChild($('pc')); },
		function () { $('w2').removeChild($('po')); },
		function () { $('tdc').className = 'hl'; },
		function () { $('w').removeChild($('pd')); },
		function () { $('tdc').className = ''; $('tdc').nextSibling.className = 'hl'; }
	], k = 0;
	function report() {
		console.log('VBRC elements=' + $('f').elements.length + ' ia=' + $('ia').value +
			' iaform=' + ($('ia').form ? $('ia').form.id : 'none'));
	}
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 250); } else setTimeout(report, 300); })(); });
})();
</script>
</body>
</html>
