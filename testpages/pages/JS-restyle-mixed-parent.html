<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS restyle mixed parent</title>
<style>
/* Patch 460. A class change on a plain block whose parent holds more than
 * blocks -- loose inline text, a list marker -- declined ("restyled
 * block's parent holds more than blocks": 2.0 a load), as the local
 * placement needs block siblings. The block is built again whole where it
 * is now (376's way), the page laid out whole. Steps (each flushed alone
 * by a layout read): a class on a <p> between runs of loose text; a class
 * on a <p> inside a list item. Row for row as
 * CSS-restyle-mixed-parent-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p, ul { margin: 4px 10px; }
.hot { background: #ff0; font-weight: bold; padding: 4px; }
</style>
</head>
<body>
<div>Loose text before, <p id="a">a paragraph that gains .hot,</p> loose text after.</div>
<ul><li>An item: <p id="b">a paragraph in a list item that gains .hot.</p></li><li>Another item.</li></ul>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('a').className = 'hot'; },
		function () { $('b').className = 'hot'; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { for (k = 0; k < ops.length; k++) { ops[k](); void document.body.offsetHeight; } }, 300); });
})();
</script>
</body>
</html>
