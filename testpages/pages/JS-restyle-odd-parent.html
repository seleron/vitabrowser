<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS restyle odd parent</title>
<style>
/* Patch 470. A class change on a block whose parent box is not a block
 * declined ("restyled block's parent is not a block") into the full
 * rebuild. Now: a block in a table cell is built again whole where it is
 * (wikipedia's <div> in a <td>); a floated block (its box in an anonymous
 * float box: wikipedia's <button>, rte's <div>) and a block in an
 * inline-block (rte's <app-video-basic>) have the nearest block above
 * built again whole; a text change in a floated block that is not plain
 * (a ::before: 434's whole-block rebuild meets the float box, as for
 * wikipedia's <button>) too. Row for row as CSS-restyle-odd-parent-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
table { margin: 4px 10px; border-collapse: collapse; }
td { border: 1px solid #888; padding: 2px; }
.cellblk { padding: 2px 4px; }
.fl { float: left; width: 120px; padding: 2px; margin: 4px 10px; background: #eef; }
.ib { display: inline-block; border: 1px solid #888; }
.ibblk { padding: 2px 4px; }
.on { background: #cfc; font-weight: bold; }
.clear { clear: both; }
.fr { float: right; width: 140px; padding: 2px; margin: 4px 10px; background: #fee; }
.fr::before { content: "> "; color: #c00; }
</style>
</head>
<body>
<table><tr><td><div id="a" class="cellblk">A block in a table cell.</div></td><td>Another cell.</td></tr></table>
<div id="b" class="fl">A floated block.</div>
<div class="fr">A float with <span id="t">generated content</span> before its text.</div>
<p>Text beside the float, long enough to wrap around it on the left side of the page.</p>
<p class="clear">Before the inline-block: <span class="ib"><span id="c" class="ibblk" style="display:block">A block in an inline-block.</span></span> after it.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('a').className = 'cellblk on'; },
		function () { $('b').className = 'fl on'; },
		function () { $('c').className = 'ibblk on'; },
		function () { $('t').textContent = 'its text changed'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
