<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS root noop</title>
<style>
/* Patch 419. A class or attribute change on <html> has no parent box:
 * every one took the full rebuild. When the whole document re-cascades
 * to the styles its boxes already hold, nothing is rebuilt: js-ready
 * (named by a rule that matches nothing here) and data-theme="light" (a
 * rule for "dark" only). The dark class restyles the body: the full
 * rebuild. Row for row as CSS-root-noop-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div { margin: 4px 10px; }
.js-ready .later-widget { color: #c00; }
[data-theme="dark"] body { color: #ccc; }
.dark body { background: #eee; }
</style>
</head>
<body>
<div>A block.</div>
<div>Another block.</div>
<script>
(function () {
	var R = document.documentElement;
	var ops = [
		function () { R.className = 'js-ready'; },
		function () { R.setAttribute('data-theme', 'light'); },
		function () { R.className = 'js-ready dark'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
