<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS root struct</title>
<style>
/* Patch 466. A child-list change on <html> itself -- an element with no
 * box inserted before <head> (wpblog's batch: at the root's first place)
 * -- that a structural rule can see: head:first-child + body .box loses
 * its green, :first-child + body .tail its blue. The rule's + after the
 * structural compound reaches past the one sibling 405 restyles alone, so
 * 404 rebuilt the parent's subtree; the root's box has no parent, so it
 * took the full rebuild. Now the whole-document walk re-cascades against
 * the DOM as it is and restyles what changed. Then, in the same batch,
 * the template's id is set (#tt + head + body .box2 turns pink): an id
 * on an element with no box, answered by the same walk. Row for row as
 * CSS-root-struct-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
head:first-child + body .box { background: #cfc; }
template + head + body .tail { color: #00c; }
#tt + head + body .box2 { background: #fcc; }
</style>
</head>
<body>
<div class="box">A box, green while head is html's first child.</div>
<p>Some text between.</p>
<p class="tail">A paragraph, blue once a template precedes head.</p>
<div class="box2">A box, pink once the template has id tt.</div>
<script>
(function () {
	function op() {
		var t = document.createElement('template');
		document.documentElement.insertBefore(t, document.head);
		t.setAttribute('id', 'tt');
	}
	window.addEventListener('load', function () { setTimeout(op, 500); });
})();
</script>
</body>
</html>
