<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS scratch documents (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">SCRATCHDOC: 0/6 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<div id="out"></div>
<script>
/* patch 246: DOMPurify captures document.getElementsByTagName once and
 * calls it on its scratch document -- getElementsByTagName.call(parsed,
 * 'body')[0] -- to find what it sanitized. Ours answered for the page's
 * document whatever `this` was, so sanitize() returned the page's own body;
 * React put it back, the next sanitize doubled it, and sourcepoint's
 * consent frame ran its heap out at 48 MB (the Guardian's page went
 * blank). Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SCRATCHDOC: ' + k + '/' + N + ' passed';
		document.title = 'JS scratch documents (' + k + '/' + N + ')';
	}
	var gebtn = document.getElementsByTagName, qs = document.querySelector;
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	/* DOMPurify's shape: parse, find the body with the captured method,
	 * return its markup */
	function sanitize(html) {
		var doc = new DOMParser().parseFromString('<remove></remove>' + html, 'text/html');
		var body = gebtn.call(doc, 'body')[0];
		if (!body) return '';
		var r = body.firstChild;
		/* DOMPurify lowercases names itself */
		if (r && String(r.nodeName).toLowerCase() === 'remove') body.removeChild(r);
		return body.innerHTML;
	}
	check(1, function () {
		var d = new DOMParser().parseFromString('<p>parsed</p>', 'text/html');
		var b = gebtn.call(d, 'body')[0];
		return b !== document.body && b && b.innerHTML === '<p>parsed</p>' || (b === document.body ? 'the page body' : String(b && b.innerHTML));
	}, 'a captured getElementsByTagName finds a parsed document\'s body');
	check(2, function () {
		var d = document.implementation.createHTMLDocument('');
		d.body.innerHTML = '<i>scratch</i>';
		var b = gebtn.call(d, 'body')[0];
		return b === d.body || (b === document.body ? 'the page body' : String(b));
	}, 'and createHTMLDocument\'s');
	check(3, function () {
		var d = new DOMParser().parseFromString('<p>x</p>', 'text/html');
		return (d.getElementsByTagName('html').length === 1 &&
			d.getElementsByTagName('body').length === 1) ||
			d.getElementsByTagName('html').length + '/' + d.getElementsByTagName('body').length;
	}, 'a parsed document finds its html and body by tag');
	check(4, function () {
		var d = new DOMParser().parseFromString('<p id="q">mine</p>', 'text/html');
		var p = qs.call(d, 'p');
		return (p && p.textContent === 'mine') || String(p && p.textContent);
	}, 'a captured querySelector looks in the parsed document');
	check(5, function () {
		var html = '<p>notice <b>text</b></p>', lens = [], i, s;
		for (i = 0; i < 5; i++) {
			s = sanitize(html);
			$('out').innerHTML += s;
			lens.push(s.length);
		}
		return lens.join() === [1, 2, 3, 4, 5].map(function () { return html.length; }).join() ||
			lens.join();
	}, 'a repeated sanitize does not grow (it doubled)');
	check(6, function () {
		return (gebtn.call(document, 'body')[0] === document.body &&
			document.getElementsByTagName('p').length >= 6) || 'no';
	}, 'the page\'s own document still answers');
})();
</script>
</body>
</html>
