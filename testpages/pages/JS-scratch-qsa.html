<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS scratch document queries (script not run)</title>
<!-- Patch 293: a document from createHTMLDocument wore stub
     querySelector / querySelectorAll answering null / [] forever, so
     nothing a script appended to its scratch document could be found
     again (found on the way in patch 279). The checks: the fresh
     document finds its own head and body; a node appended AFTER
     creation is found by class, id and descendant selector; a second
     append is counted too (the answer is live, not a snapshot); a
     DOMParser document answers the same way. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">SCRATCHQSA: 0/6 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<script>
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SCRATCHQSA: ' + k + '/' + N + ' passed';
		document.title = 'JS scratch document queries (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var d = document.implementation.createHTMLDocument('');
	var late = d.createElement('div');
	late.className = 'late';
	var inner = d.createElement('span');
	inner.id = 'late2';
	late.appendChild(inner);
	d.body.appendChild(late);
	check(1, function () {
		return (d.querySelector('body') === d.body &&
			d.querySelector('head') === d.head) ||
			String(d.querySelector('body')) + '/' + String(d.querySelector('head'));
	}, 'a fresh scratch document finds its own head and body');
	check(2, function () {
		var all = d.querySelectorAll('*');
		return all.length >= 4 || all.length;
	}, 'querySelectorAll(*) sees html, head, body and the append');
	check(3, function () {
		return (d.querySelector('.late') === late &&
			d.querySelectorAll('.late').length === 1) ||
			d.querySelectorAll('.late').length;
	}, 'a node appended after creation is found by class');
	check(4, function () {
		return (d.querySelector('#late2') === inner &&
			d.querySelector('.late span') === inner) ||
			String(d.querySelector('#late2'));
	}, 'a deeper append is found by id and descendant selector');
	check(5, function () {
		var more = d.createElement('em');
		more.className = 'late';
		d.body.appendChild(more);
		return (d.querySelectorAll('.late').length === 2 &&
			d.getElementsByTagName('em').length === 1) ||
			d.querySelectorAll('.late').length + '/' +
			d.getElementsByTagName('em').length;
	}, 'a second append is counted too (live, not a snapshot)');
	check(6, function () {
		var p = new DOMParser().parseFromString(
			'<p class="pd">parsed</p>', 'text/html');
		var hit = p.querySelector('.pd');
		return (hit && hit.textContent === 'parsed') ||
			String(hit && hit.textContent);
	}, 'a DOMParser document answers querySelector too');
})();
</script>
</body>
</html>
