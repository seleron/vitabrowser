<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS script load events (script not run)</title>
<!-- Patch 128: a <script> that script inserts while the page is still
     parsing is async (never parser-blocking) and fires load / error --
     module loaders (Google's, YouTube's, webpack chunks) wait on them.
     1: onload. 2: addEventListener('load'). 3: onerror for a missing
     file. 4: async = false still loads and fires. -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<p id="sum" class="wait">SCRIPTLOAD: script did not run</p>
<p id="r1" class="wait">1 onload: waiting</p>
<p id="r2" class="wait">2 addEventListener load: waiting</p>
<p id="r3" class="wait">3 onerror for a missing script: waiting</p>
<p id="r4" class="wait">4 async=false loads: waiting</p>
<script>
(function () {
	var done = {};
	function pass(n, text) {
		if (done[n]) return;
		done[n] = true;
		var p = document.getElementById('r' + n);
		p.textContent = text;
		p.className = 'pass';
		var k = 0, i;
		for (i = 1; i <= 4; i++) if (done[i]) k++;
		document.getElementById('sum').textContent = 'SCRIPTLOAD: ' + k + '/4 passed';
		document.title = 'JS script load events (' + k + '/4)';
	}
	document.getElementById('sum').textContent = 'SCRIPTLOAD: 0/4 passed';
	var s = document.createElement('script');
	s.src = 'js-scriptload-dep.js';
	s.onload = function () { if (window.__slran >= 1) pass(1, '1 onload (script ran first)'); };
	document.head.appendChild(s);
	var s2 = document.createElement('script');
	s2.src = 'js-scriptload-dep.js';
	s2.addEventListener('load', function () { pass(2, '2 addEventListener load'); });
	document.head.appendChild(s2);
	var s3 = document.createElement('script');
	s3.src = 'js-scriptload-missing.js';
	s3.onerror = function () { pass(3, '3 onerror for a missing script'); };
	document.head.appendChild(s3);
	var s4 = document.createElement('script');
	s4.async = false;
	s4.src = 'js-scriptload-dep.js';
	s4.onload = function () { pass(4, '4 async=false loads'); };
	document.head.appendChild(s4);
})();
</script>
</body>
</html>
