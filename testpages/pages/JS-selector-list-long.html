<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS long selector lists (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">LONGLIST: 0/4 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<y-last id="parsed-last">parsed before define</y-last>
<z-k id="k1"></z-k><z-c id="c1"></z-c><z-k id="k2"></z-k>
<script>
/* patch 242: a selector list longer than 8 alternatives matches all of
 * them. The native matcher keeps 8 (a fixed stack array) and dropped the
 * rest silently, so the custom-element upgrade sweep -- one
 * querySelectorAll of every defined name, 75 on github.com -- never found
 * <react-app>, and github's file list never rendered. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'LONGLIST: ' + k + '/' + N + ' passed';
		document.title = 'JS long selector lists (' + k + '/' + N + ')';
	}
	var filler = [];
	for (var i = 0; i < 11; i++) filler.push('no-such-' + String.fromCharCode(97 + i));
	var sel = filler.concat(['z-k', 'z-c']).join(',');
	var all = document.querySelectorAll(sel);
	t(1, all.length === 3, '13 alternatives, matches past the 8th: ' + all.length);
	t(2, all.length === 3 && all[0].id === 'k1' && all[1].id === 'c1' && all[2].id === 'k2',
		'in document order: ' + Array.prototype.map.call(all, function (e) { return e.id; }).join(','));
	var one = document.querySelector(filler.concat(['z-c', 'z-k']).join(','));
	t(3, one !== null && one.id === 'k1', 'querySelector: the first in document order: ' + (one && one.id));
	/* the upgrade sweep: many names defined, the parsed element's last */
	for (var j = 0; j < 9; j++) customElements.define('y-filler-' + j, class extends HTMLElement {});
	class YLast extends HTMLElement { constructor() { super(); this.made = true; } }
	customElements.define('y-last', YLast);
	var p = $('parsed-last');
	t(4, p instanceof YLast && p.made === true, 'a parsed element of the 10th definition is upgraded');
})();
</script>
</body>
</html>
