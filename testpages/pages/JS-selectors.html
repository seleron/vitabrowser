<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS selectors (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 14px; margin: 10px; }
#res p { margin: 1px 0; padding: 1px 6px; font-size: 11px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
#t { display: none; }
</style>
</head>
<body>
<!-- Patch 178 (vita_polyfill.js): the selector engine behind matches(),
     closest(), querySelector() and querySelectorAll(). matches() was a
     regex over tag/#id/.class/[attr] that skipped every ':' part -- so
     :root, :hover, :first-child, ::before matched EVERY element -- and knew
     no combinators (body > div matched nothing); the native
     querySelectorAll found nothing for :root, :first-child, :nth-child()
     and :is(). Each case below is [selector, element or null]: the page
     records el.matches(sel) and document.querySelectorAll(sel).length (or
     the thrown error's name), and compares the whole list with what
     Chromium gives for the same document (the expected list is Chromium's
     output, pasted). -->
<div id="res">
<p id="sum" class="wait">SELECTORS: script did not run</p>
<p id="fails">-</p>
</div>
<div id="t">
  <ul id="list" class="menu">
    <li id="i1" class="item first">one</li>
    <li id="i2" class="item" data-x="a b">two</li>
    <li id="i3" class="item sel" lang="en-GB"><a id="lnk" href="#x">three</a></li>
    <li id="i4" class="item">four <span id="sp">s</span></li>
    <li id="i5" class="last"></li>
  </ul>
  <form id="f"><input id="in1" type="checkbox" checked><input id="in2" type="text" disabled placeholder="p"><input id="in3" type="text" required value="v">
    <select id="sel1"><option id="op1">a</option><option id="op2" selected>b</option></select></form>
  <p id="pa">para <b id="bb">bold</b></p><p id="pb"></p><p id="pc"> </p>
  <section id="sec"><h2 id="h2">h</h2><p id="sp1">x</p><div id="dv">d</div><p id="sp2">y</p></section>
</div>
<script>
var CASES = [
	[':root', 'i1'], [':root', 'HTML'], ['::before', 'i1'], ['::view-transition-old(sb)', 'i1'],
	[':hover', 'i1'], [':not(.item)', 'i5'], [':not(.item)', 'i1'], ['.nope', 'i1'],
	[':first-child', 'i1'], [':first-child', 'i2'], ['li:last-child', 'i5'], [':nth-child(2)', 'i2'],
	['ul > li', 'i3'], ['body > div', 't'], [':is(.sel, .first)', 'i1'], [':where(.nope)', 'i1'],
	['html', 'HTML'], ['*', 'i1'],
	[':nth-child(odd)', 'i3'], [':nth-child(2n)', 'i3'], [':nth-child(-n+2)', 'i2'], [':nth-last-child(1)', 'i5'],
	[':nth-child(2 of .item)', 'i2'], [':only-child', 'lnk'], [':first-of-type', 'sp1'], [':last-of-type', 'sp2'],
	['p:nth-of-type(2)', 'sp2'], [':only-of-type', 'dv'], ['li + li', 'i2'], ['li ~ .last', 'i5'],
	['#i1 + #i3', 'i3'], ['h2 ~ div', 'dv'], ['.menu .item a', 'lnk'], ['ul li > a[href^="#"]', 'lnk'],
	['[data-x~="b"]', 'i2'], ['[data-x|="a"]', 'i2'], ['[data-x*=" b"]', 'i2'], ['[data-x$=B i]', 'i2'],
	['[lang|=en]', 'i3'], [':lang(en)', 'lnk'], [':empty', 'pb'], [':empty', 'pc'],
	['li:empty', 'i5'], [':checked', 'in1'], [':checked', 'op2'], [':disabled', 'in2'],
	[':enabled', 'in3'], [':required', 'in3'], [':optional', 'in2'], [':placeholder-shown', 'in2'],
	[':any-link', 'lnk'], [':link', 'lnk'], [':has(> a)', 'i3'], ['li:has(span)', 'i4'],
	['ul:has(.sel)', 'list'], [':not(li, p)', 'dv'], ['section :not(p)', 'dv'], [':scope', 'i1'],
	['LI.ITEM', 'i1'], ['li.item.sel', 'i3'], ['#i3.sel[lang]', 'i3'], ['*|li', 'i1'],
	['li:focus', 'i1'], [':focus-within', 'i1'], [':target', 'i1'], [':defined', 'i1'],
	['a:visited', 'lnk'], ['li::after', 'i1'], [':before', 'i1'],
	['li:nth-child(', 'i1'], ['..x', 'i1'], [':bogus-pseudo', 'i1'], ['li >', 'i1'], ['', 'i1'],
	['li[data-x], p:empty', 'i2'], ['link[rel~=stylesheet],style', 'i1']
];
var QSA_SCOPED = [
	['list', ':scope > li'], ['list', 'li:first-child'], ['list', 'div li'], ['sec', 'p'],
	['sec', ':scope > :nth-child(2)'], ['list', ':is(.first, .last)'], ['f', ':checked'],
	['t', 'p:empty, li[data-x]']
];
function el(id) { return id === 'HTML' ? document.documentElement : document.getElementById(id); }
function run() {
	var out = [], i, s, e, m, q;
	for (i = 0; i < CASES.length; i++) {
		s = CASES[i][0]; e = el(CASES[i][1]);
		try { m = e.matches(s); } catch (x) { m = 'E:' + x.name; }
		try { q = document.querySelectorAll(s).length; } catch (x) { q = 'E:' + x.name; }
		out.push(s + ' @' + CASES[i][1] + ' -> ' + m + ' / ' + q);
	}
	for (i = 0; i < QSA_SCOPED.length; i++) {
		var root = el(QSA_SCOPED[i][0]), r;
		try {
			var nl = root.querySelectorAll(QSA_SCOPED[i][1]), ids = [];
			for (var k = 0; k < nl.length; k++) ids.push(nl[k].id);
			var one = root.querySelector(QSA_SCOPED[i][1]);
			r = ids.join(',') + ' first=' + (one ? one.id : 'null');
		} catch (x) { r = 'E:' + x.name; }
		out.push(QSA_SCOPED[i][0] + '.qsa(' + QSA_SCOPED[i][1] + ') -> ' + r);
	}
	var c = el('bb').closest('p, section'), c2 = el('lnk').closest('ul > li:nth-child(3)'), c3 = el('sp').closest(':root');
	out.push('closest -> ' + (c && c.id) + ' ' + (c2 && c2.id) + ' ' + (c3 && c3.tagName));
	return out;
}
/* Chromium's output for run() on this page (2026-09-30), pasted */
var WANT = [
	":root @i1 -> false / 1",
	":root @HTML -> true / 1",
	"::before @i1 -> false / 0",
	"::view-transition-old(sb) @i1 -> false / 0",
	":hover @i1 -> false / 0",
	":not(.item) @i5 -> true / 31",
	":not(.item) @i1 -> false / 31",
	".nope @i1 -> false / 0",
	":first-child @i1 -> true / 13",
	":first-child @i2 -> false / 13",
	"li:last-child @i5 -> true / 1",
	":nth-child(2) @i2 -> true / 9",
	"ul > li @i3 -> true / 5",
	"body > div @t -> true / 2",
	":is(.sel, .first) @i1 -> true / 2",
	":where(.nope) @i1 -> false / 0",
	"html @HTML -> true / 1",
	"* @i1 -> true / 35",
	":nth-child(odd) @i3 -> true / 21",
	":nth-child(2n) @i3 -> false / 14",
	":nth-child(-n+2) @i2 -> true / 22",
	":nth-last-child(1) @i5 -> true / 13",
	":nth-child(2 of .item) @i2 -> true / 1",
	":only-child @lnk -> true / 4",
	":first-of-type @sp1 -> true / 23",
	":last-of-type @sp2 -> true / 23",
	"p:nth-of-type(2) @sp2 -> true / 3",
	":only-of-type @dv -> true / 16",
	"li + li @i2 -> true / 4",
	"li ~ .last @i5 -> true / 1",
	"#i1 + #i3 @i3 -> false / 0",
	"h2 ~ div @dv -> true / 1",
	".menu .item a @lnk -> true / 1",
	"ul li > a[href^=\"#\"] @lnk -> true / 1",
	"[data-x~=\"b\"] @i2 -> true / 1",
	"[data-x|=\"a\"] @i2 -> false / 0",
	"[data-x*=\" b\"] @i2 -> true / 1",
	"[data-x$=B i] @i2 -> true / 1",
	"[lang|=en] @i3 -> true / 1",
	":lang(en) @lnk -> true / 2",
	":empty @pb -> true / 6",
	":empty @pc -> false / 6",
	"li:empty @i5 -> true / 1",
	":checked @in1 -> true / 2",
	":checked @op2 -> true / 2",
	":disabled @in2 -> true / 1",
	":enabled @in3 -> true / 5",
	":required @in3 -> true / 1",
	":optional @in2 -> true / 3",
	":placeholder-shown @in2 -> true / 1",
	":any-link @lnk -> true / 1",
	":link @lnk -> true / 1",
	":has(> a) @i3 -> true / 1",
	"li:has(span) @i4 -> true / 1",
	"ul:has(.sel) @list -> true / 1",
	":not(li, p) @dv -> true / 23",
	"section :not(p) @dv -> true / 2",
	":scope @i1 -> true / 1",
	"LI.ITEM @i1 -> false / 0",
	"li.item.sel @i3 -> true / 1",
	"#i3.sel[lang] @i3 -> true / 1",
	"*|li @i1 -> true / 5",
	"li:focus @i1 -> false / 0",
	":focus-within @i1 -> false / 0",
	":target @i1 -> false / 0",
	":defined @i1 -> true / 35",
	"a:visited @lnk -> false / 0",
	"li::after @i1 -> false / 0",
	":before @i1 -> false / 0",
	"li:nth-child( @i1 -> E:SyntaxError / E:SyntaxError",
	"..x @i1 -> E:SyntaxError / E:SyntaxError",
	":bogus-pseudo @i1 -> E:SyntaxError / E:SyntaxError",
	"li > @i1 -> E:SyntaxError / E:SyntaxError",
	" @i1 -> E:SyntaxError / E:SyntaxError",
	"li[data-x], p:empty @i2 -> true / 2",
	"link[rel~=stylesheet],style @i1 -> false / 1",
	"list.qsa(:scope > li) -> i1,i2,i3,i4,i5 first=i1",
	"list.qsa(li:first-child) -> i1 first=i1",
	"list.qsa(div li) -> i1,i2,i3,i4,i5 first=i1",
	"sec.qsa(p) -> sp1,sp2 first=sp1",
	"sec.qsa(:scope > :nth-child(2)) -> sp1 first=sp1",
	"list.qsa(:is(.first, .last)) -> i1,i5 first=i1",
	"f.qsa(:checked) -> in1,op2 first=in1",
	"t.qsa(p:empty, li[data-x]) -> i2,pb first=i2",
	"closest -> pa i3 HTML"
];
window.addEventListener('load', function () {
	var got = run(), bad = [], n = 0;
	if (!WANT) { document.getElementById('sum').textContent = 'SELECTORS: no expected list'; return; }
	for (var i = 0; i < WANT.length; i++) {
		if (got[i] === WANT[i]) n++;
		else bad.push(got[i] + ' (want ' + String(WANT[i]).split(' -> ')[1] + ')');
	}
	document.getElementById('sum').textContent = 'SELECTORS: ' + n + '/' + WANT.length + ' passed';
	if (n === WANT.length) document.getElementById('sum').className = 'pass';
	document.getElementById('fails').textContent = bad.slice(0, 12).join(' | ') || 'all as in Chromium';
	document.title = 'JS selectors (' + n + '/' + WANT.length + ')';
});
</script>
</body></html>
