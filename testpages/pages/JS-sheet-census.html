<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS sheet census (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
.box { height: 10px; background: #36c; margin: 2px 0; }
</style>
<style id="s1">.b1 { width: 50px; }</style>
<style id="s2">.b2 { width: 50px; }</style>
<style id="s3">.b3 { width: 50px; }</style>
<style id="s4">.b4 { width: 50px; }</style>
</head>
<body>
<div id="sum">SHEETCENSUS: 0/3 passed</div>
<p id="r1" class="wait">1 waiting (the script never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<div class="box b1" id="b1"></div>
<div class="box b2" id="b2"></div>
<div class="box b3" id="b3"></div>
<div class="box b4" id="b4"></div>
<script>
/* Patch 316 (doc 23 stage 1): the sheet census. A sheet change reaches
 * the reconvert as a mark that names no node; the census attributes each
 * such batch to the stylesheet entries that marked it. Step 1 edits ONE
 * <style> (the gate expects a batch logged "LIFE SHEETCAUSE sheets=1");
 * step 2 edits TWO in the same task (a batch with sheets=2). The
 * Step 3 (patch 318) edits one <style> twice 150 ms apart (a
 * "LIFE SHEETID stale" batch: re-processed before its flush). The
 * restyle results are checked too, so a census that miscounts cannot
 * hide a re-cascade that never came. Reconverts are unchanged. */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SHEETCENSUS: ' + k + '/' + N + ' passed';
		document.title = 'JS sheet census (' + k + '/' + N + ')';
	}
	function w(id) { return Math.round($(id).getBoundingClientRect().width); }
	var steps = [
		function () { var s1 = $('s1'); s1.textContent = s1.textContent + ' .b1 { width: 77px; }'; },
		function () { t(1, w('b1') === 77, 'one <style> edited (' + w('b1') + ')');
			$('s2').textContent = '.b2 { width: 66px; }';
			$('s3').textContent = '.b3 { width: 66px; }'; },
		function () { t(2, w('b2') === 66 && w('b3') === 66,
			'two <style>s edited in one task (' + w('b2') + ',' + w('b3') + ')');
			/* patch 318: the same sheet edited again before the first
			 * edit's batch flushes -- the first mark's counter is stale
			 * at the flush; the final style must still be the second */
			$('s4').textContent = '.b4 { width: 60px; }';
			setTimeout(function () { $('s4').textContent = '.b4 { width: 88px; }'; }, 150); },
		function () { t(3, w('b4') === 88,
			'one <style> edited twice in quick succession (' + w('b4') + ')'); }
	];
	var i = 0;
	function next() {
		steps[i++]();
		if (i < steps.length) setTimeout(next, 1500);
	}
	window.addEventListener('load', function () { setTimeout(next, 600); });
})();
</script>
</body>
</html>
