<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS sheet noop</title>
<style>
/* Patch 415. A stylesheet that arrives after layout (CSS-in-JS, per-module
 * CSS) made a coarse batch and a full rebuild, though most such sheets
 * match nothing built yet. Now the batch's own marks are answered as
 * usual and the document is re-cascaded: a sheet whose rules match
 * nothing (.later-widget) restyles nothing; so does one arriving in the
 * same task as a paragraph's new text (the text answered locally, then
 * the re-cascade). A class change in the same task as the sheet that
 * styles it (.hl) declines: the class was checked while that sheet was
 * still pending (patch 414 skips it), and the re-cascade sees the block
 * restyled -- the full rebuild. A sheet that restyles the paragraphs (p)
 * takes the full rebuild. Row for row as
 * CSS-sheet-noop-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
</style>
</head>
<body>
<div id="a">A block that gains the hl class (yellow).</div>
<p id="t">A paragraph (blue at the end).</p>
<p>Another paragraph (blue at the end).</p>
<script>
(function () {
	function sheet(t) { var s = document.createElement('style'); s.textContent = t; document.head.appendChild(s); }
	var ops = [
		function () { sheet('.later-widget { color: #c00; border: 2px solid #c00; }'); },
		function () { document.getElementById('t').textContent = 'A paragraph with new text (blue at the end).'; sheet('.other-widget { color: #0c0; }'); },
		function () { document.getElementById('a').className = 'hl'; sheet('.hl { background: #ff0; }'); },
		function () { sheet('p { color: #00c; }'); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
