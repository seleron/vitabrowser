<html>
<head>
<meta charset="utf-8">
<title>JS sheet scope quirks (script not run)</title>
<!-- NO doctype on purpose: quirks mode, where class selectors match
 * case-insensitively (libdom: quirks_mode != NONE). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
.box { height: 10px; width: 50px; background: #36c; margin: 2px 0; }
li { height: 10px; width: 50px; background: #c63; }
</style>
<style id="q1">.p1 { width: 50px; }</style>
<style id="q2">.p2 { width: 50px; }</style>
<style id="q3">.p3 { width: 50px; }</style>
</head>
<body class="home">
<div class="box foo" id="q1b"></div>
<ul><li class="li2" id="q2b"></li></ul>
<div class="box" id="q3b"></div>
<!-- 7000 px spacer: the bottom dump's 7 s window covers the legs (see
 * JS-sheet-scope.html). -->
<div style="height: 7000px"></div>
<div id="sum">SHEETSCOPE-Q: 0/3 passed</div>
<p id="r1">1 waiting (the script never ran)</p>
<p id="r2">2 waiting</p>
<p id="r3">3 waiting</p>
<script>
/* Patch 321 (doc 23 B1): matcher parity and B.5's static admission.
 * The gate expects, in order:
 *   1 bounded changed=1 anchors=1 roots=1  .Foo anchors class="foo"
 *     (quirks: dom_element_has_class is case-insensitive; in no-quirks
 *     this would read roots=0)
 *   2 unbounded reason=admission           a root that is an <li>
 *   3 unbounded reason=admission           a root that is <body>
 * Each leg still asserts its restyle (census only, no behaviour change). */
(function () {
	var k = 0, N = 3;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		$('r' + n).textContent = n + ' ' + text + (ok ? ' ok' : ' FAIL');
		if (!ok) return;
		k++;
		$('sum').textContent = 'SHEETSCOPE-Q: ' + k + '/' + N + ' passed';
		document.title = 'JS sheet scope quirks (' + k + '/' + N + ')';
	}
	function w(id) { return Math.round($(id).getBoundingClientRect().width); }
	function l(id) { return Math.round($(id).getBoundingClientRect().left); }
	var steps = [
		function () { $('q1').textContent = '.p1 { width: 50px; }\n.Foo { width: 81px; }'; },
		function () { t(1, w('q1b') === 81, 'quirks .Foo matches class=foo (' + w('q1b') + ')');
			$('q2').textContent = '.p2 { width: 50px; }\n.li2 { width: 82px; }'; },
		function () { t(2, w('q2b') === 82, 'li root (' + w('q2b') + ')');
			$('q3').textContent = '.p3 { width: 50px; }\n.home { padding-left: 3px; }'; },
		function () { t(3, l('q3b') === 13, 'body root (left ' + l('q3b') + ')'); }
	];
	var i = 0;
	function next() {
		steps[i++]();
		if (i < steps.length) setTimeout(next, 1200);
	}
	window.addEventListener('load', function () { setTimeout(next, 600); });
})();
</script>
</body>
</html>
