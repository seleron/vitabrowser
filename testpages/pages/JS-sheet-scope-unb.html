<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS sheet scope unbounded (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
.box { height: 10px; width: 50px; background: #36c; margin: 2px 0; }
</style>
<style id="u1">.u1 { width: 50px; }</style>
<style id="u2">.u2 { width: 50px; }</style>
<style id="u3">.u3 { width: 50px; }</style>
<style id="u4">.u4 { width: 50px; }</style>
<style id="u5">body { margin: 10px; }</style>
</head>
<body>
<div class="box u1" id="u1b"></div>
<div class="box u2" id="u2b"></div>
<div class="box u3" id="u3b"></div>
<div class="box u4" id="u4b"></div>
<div class="box" id="u5b"></div>
<!-- 7000 px spacer: the bottom dump's 7 s window covers the legs (see
 * JS-sheet-scope.html). -->
<div style="height: 7000px"></div>
<div id="sum">SHEETSCOPE-UNB: 0/5 passed</div>
<p id="r1">1 waiting (the script never ran)</p>
<p id="r2">2 waiting</p>
<p id="r3">3 waiting</p>
<p id="r4">4 waiting</p>
<p id="r5">5 waiting</p>
<script>
/* Patch 321 (doc 23 B1): the unbounded causes, one <style> edit per leg.
 * The gate expects, in order:
 *   1 unbounded reason=at-rule     an @font-face added
 *   2 unbounded reason=counter     a counter-increment rule
 *   3 unbounded reason=nesting     a nested rule
 *   4 unbounded reason=at-rule     a statement @layer a, b;
 *   5 unbounded reason=unanchored  the global body{} rule itself edited
 * Each leg still asserts its restyle (census only, no behaviour change). */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		$('r' + n).textContent = n + ' ' + text + (ok ? ' ok' : ' FAIL');
		if (!ok) return;
		k++;
		$('sum').textContent = 'SHEETSCOPE-UNB: ' + k + '/' + N + ' passed';
		document.title = 'JS sheet scope unbounded (' + k + '/' + N + ')';
	}
	function w(id) { return Math.round($(id).getBoundingClientRect().width); }
	function l(id) { return Math.round($(id).getBoundingClientRect().left); }
	var steps = [
		function () { $('u1').textContent = '@font-face { font-family: "VbScope"; src: local("Arial"); }\n.u1 { width: 71px; }'; },
		function () { t(1, w('u1b') === 71, '@font-face added (' + w('u1b') + ')');
			$('u2').textContent = '.u2 { width: 72px; counter-increment: vbc; }'; },
		function () { t(2, w('u2b') === 72, 'counter-increment (' + w('u2b') + ')');
			$('u3').textContent = '.u3 { width: 73px; & span { color: red; } }'; },
		function () { t(3, w('u3b') === 73, 'nested rule (' + w('u3b') + ')');
			$('u4').textContent = '@layer a, b;\n.u4 { width: 74px; }'; },
		function () { t(4, w('u4b') === 74, 'statement @layer (' + w('u4b') + ')');
			$('u5').textContent = 'body { margin: 12px; }'; },
		function () { t(5, l('u5b') === 12, 'global body{} edited (left ' + l('u5b') + ')'); }
	];
	var i = 0;
	function next() {
		steps[i++]();
		if (i < steps.length) setTimeout(next, 1200);
	}
	window.addEventListener('load', function () { setTimeout(next, 600); });
})();
</script>
</body>
</html>
