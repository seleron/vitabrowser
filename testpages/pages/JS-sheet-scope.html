<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS sheet scope (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
.box { height: 10px; width: 50px; background: #36c; margin: 2px 0; }
</style>
<style id="s1">.a1 { width: 50px; }
.a2 { width: 50px; }
.a3 { width: 50px; }</style>
<style id="s2">.p2 { width: 50px; }</style>
<style id="s3">.p3 { width: 50px; }</style>
<style id="s4">.p4 { width: 50px; }
.r4 { width: 64px; }</style>
<style id="s5">body { color: #000; }
.p5 { width: 50px; }</style>
</head>
<body>
<div class="k1"><div class="box x" id="x1"></div><div class="box x"></div></div>
<div class="k1"><div class="box x"></div></div>
<input type="checkbox" id="cb" checked>
<div><div class="box y" id="y1"></div></div>
<div><div class="box y"></div></div>
<div><div class="box y3"></div><div class="box" id="a3"></div></div>
<div class="box r4" id="r4b"></div>
<div class="box p5" id="p5b"></div>
<!-- The 7000 px spacer makes the page taller than the screen, so the
 * autotest takes the BOTTOM dump, whose 7 s settle window covers the
 * legs (patch 320's gate fix; this engine's JS timers run ~450 ms late).
 * The status block lives below it, where the bottom dump sees it. -->
<div style="height: 7000px"></div>
<div id="sum">SHEETSCOPE: 0/5 passed</div>
<p id="r1">1 waiting (the script never ran)</p>
<p id="r2">2 waiting</p>
<p id="r3">3 waiting</p>
<p id="r4">4 waiting</p>
<p id="r5">5 waiting</p>
<script>
/* Patch 321 (doc 23 B1): the reach census. Each leg edits ONE <style>,
 * so its batch is single-identified and logs one LIFE SHEETREACH line;
 * the gate compares the page's lines, in order, against:
 *   1 bounded changed=1 anchors=1 roots=3  class-anchored insertRule
 *     append (.k1 .x anchors at .x, the subject: B.1's rightmost rule)
 *   2 bounded changed=1 anchors=1 roots=2  #cb:checked ~ div .y (.y)
 *   3 unbounded reason=unanchored          .y3 ~ div (sibling step
 *     right of the only anchor)
 *   4 bounded changed=1 anchors=1 roots=1  rule removed: the anchor
 *     comes from the old side
 *   5 bounded changed=2 anchors=1 roots=1  a global body{} rule left
 *     alone beside an edited rule (old + new of the edited one)
 * B1 is census only: every edit must still restyle as before, which
 * each leg asserts. Results are written with textContent only. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		$('r' + n).textContent = n + ' ' + text + (ok ? ' ok' : ' FAIL');
		if (!ok) return;
		k++;
		$('sum').textContent = 'SHEETSCOPE: ' + k + '/' + N + ' passed';
		document.title = 'JS sheet scope (' + k + '/' + N + ')';
	}
	function w(id) { return Math.round($(id).getBoundingClientRect().width); }
	var steps = [
		function () { var sh = $('s1').sheet;
			sh.insertRule('.k1 .x { width: 61px; }', sh.cssRules.length); },
		function () { t(1, w('x1') === 61, 'class-anchored append (' + w('x1') + ')');
			$('s2').textContent = '.p2 { width: 50px; }\n#cb:checked ~ div .y { width: 62px; }'; },
		function () { t(2, w('y1') === 62, 'anchored behind a sibling step (' + w('y1') + ')');
			$('s3').textContent = '.p3 { width: 50px; }\n.y3 ~ div { width: 63px; }'; },
		function () { t(3, w('a3') === 63, 'sibling step, unanchored (' + w('a3') + ')');
			$('s4').textContent = '.p4 { width: 50px; }'; },
		function () { t(4, w('r4b') === 50, 'anchored rule removed (' + w('r4b') + ')');
			$('s5').textContent = 'body { color: #000; }\n.p5 { width: 65px; }'; },
		function () { t(5, w('p5b') === 65, 'common body{} rule left alone (' + w('p5b') + ')'); }
	];
	var i = 0;
	function next() {
		steps[i++]();
		if (i < steps.length) setTimeout(next, 1200);
	}
	window.addEventListener('load', function () { setTimeout(next, 600); });
})();
</script>
</body>
</html>
