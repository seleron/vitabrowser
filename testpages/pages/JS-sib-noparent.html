<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS sib noparent</title>
<style>
/* Patch 469. An attribute a sibling rule can see ([aria-expanded="true"]
 * + .menu) on a <button> whose parent has no box (wpnews: an <li> in a
 * flex <ul>; here display: contents). 445 builds the parent again whole;
 * a parent with no box declined into the full rebuild. Now the nearest
 * flex, grid or block box above it (the flex <ul>) is built again whole:
 * the rule reaches only the parent's subtree, which that rebuild covers.
 * Row for row as CSS-sib-noparent-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
ul#nav { display: flex; list-style: none; margin: 4px 10px; padding: 0; }
ul#nav li { display: contents; }
ul#nav button { margin-right: 8px; }
.menu { display: none; background: #cfc; padding: 2px 6px; }
[aria-expanded="true"] + .menu { display: block; }
p { margin: 4px 10px; }
</style>
</head>
<body>
<ul id="nav">
<li><button id="b1" aria-expanded="false">Menu</button><span class="menu">The opened menu.</span></li>
<li><button>Other</button></li>
</ul>
<p>Text below the navigation.</p>
<script>
(function () {
	function op() { document.getElementById('b1').setAttribute('aria-expanded', 'true'); }
	window.addEventListener('load', function () { setTimeout(op, 500); });
})();
</script>
</body>
</html>
