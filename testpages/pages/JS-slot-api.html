<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS slot API (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">SLOTAPI: 0/8 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<p id="r7" class="wait">7 waiting</p>
<p id="r8" class="wait">8 waiting</p>
<div id="box"></div>
<script>
/* patch 486: slot assignment. A <slot> had no assignedNodes /
 * assignedElements and nothing had an assignedSlot, so lit's
 * @queryAssignedElements threw "not a function" (old.reddit.com's login
 * components). Chromium-verified. */
(function () {
	var k = 0, N = 8;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'SLOTAPI: ' + k + '/' + N + ' passed';
		document.title = 'JS slot API (' + k + '/' + N + ')';
	}
	function ids(l) { return [].map.call(l, function (n) { return n.nodeType === 1 ? (n.id || n.tagName) : '#text'; }).join(','); }
	try {
		var h = document.createElement('div');
		var sr = h.attachShadow({ mode: 'open' });
		sr.innerHTML = '<slot name="a" id="sa"></slot><slot id="sd"></slot>' +
			'<slot name="b" id="sb"><i id="fb">fallback</i></slot><slot name="a" id="sa2"></slot>';
		h.innerHTML = '<span id="x1" slot="a">x1</span>text<em id="x2">x2</em><span id="x3" slot="a">x3</span><b id="x4" slot="zzz">x4</b>';
		$('box').appendChild(h);
		var sa = sr.getElementById('sa'), sd = sr.getElementById('sd'), sb = sr.getElementById('sb');
		t(1, ids(sa.assignedNodes()) === 'x1,x3', 'a named slot gets its children, in order: ' + ids(sa.assignedNodes()));
		t(2, ids(sd.assignedNodes()) === '#text,x2', 'the default slot gets text and unnamed elements: ' + ids(sd.assignedNodes()));
		t(3, ids(sd.assignedElements()) === 'x2', 'assignedElements keeps the elements: ' + ids(sd.assignedElements()));
		t(4, sb.assignedNodes().length === 0 && ids(sb.assignedNodes({ flatten: true })) === 'fb',
			'an empty slot flattens to its fallback: ' + ids(sb.assignedNodes({ flatten: true })));
		t(5, sr.getElementById('sa2').assignedNodes().length === 0,
			'only the first slot of a name is assigned: ' + sr.getElementById('sa2').assignedNodes().length);
		var x1 = h.querySelector('#x1'), x4 = h.querySelector('#x4');
		t(6, x1.assignedSlot === sa && x4.assignedSlot === null,
			'assignedSlot: ' + (x1.assignedSlot && x1.assignedSlot.id) + ' / ' + x4.assignedSlot);
		/* a slot slotted into another component's slot: flatten follows it */
		var outer = document.createElement('div');
		var osr = outer.attachShadow({ mode: 'open' });
		var inner = document.createElement('div');
		var isr = inner.attachShadow({ mode: 'open' });
		isr.innerHTML = '<slot id="islot"></slot>';
		var pass = document.createElement('slot');
		inner.appendChild(pass);
		osr.appendChild(inner);
		outer.innerHTML = '<u id="deep">deep</u>';
		$('box').appendChild(outer);
		var fl = isr.getElementById('islot').assignedNodes({ flatten: true });
		t(7, ids(fl) === 'deep', 'flatten follows a slot assigned to a slot: ' + ids(fl));
		var loose = document.createElement('slot');
		t(8, loose.assignedNodes().length === 0 && typeof loose.assignedElements === 'function',
			'a slot outside any shadow tree has nothing assigned');
	} catch (e) {
		$('r' + (k + 1)).textContent += ' threw ' + e;
	}
})();
</script>
</body>
</html>
