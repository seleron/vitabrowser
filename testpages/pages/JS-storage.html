<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS storage</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 0; padding: 1px 6px; font-size: 11px; line-height: 1.3; }
.wait { background: #fcc; }
.pass { background: #cfc; }
.fail { background: #f66; }
#sum { font-size: 16px; font-weight: bold; margin: 2px 0; }
</style>
</head>
<body>
<p id="sum" class="wait">JS storage: script did not run</p>
<div id="rows"></div>
<script>
/* Web Storage audit: localStorage persists per origin (via __storageSave /
 * __storageLoad natives), sessionStorage is per-page in-memory. Values are
 * stored as strings. */
var passed = 0, total = 0, failedNames = [];
function t(name, cond) {
  total++;
  var p = document.createElement('p');
  p.id = 'r' + total;
  p.className = cond ? 'pass' : 'fail';
  p.textContent = total + ' ' + name + ': ' + (cond ? 'PASS' : 'FAIL');
  document.getElementById('rows').appendChild(p);
  if (cond) passed++; else failedNames.push(name);
}
function sum() {
  var s = document.getElementById('sum');
  s.className = passed === total ? 'pass' : 'fail';
  s.textContent = 'JS storage: ' + passed + '/' + total + ' passed' +
    (failedNames.length ? ' FAILS: ' + failedNames.join('; ') : '');
}

try {
  /* localStorage basics */
  localStorage.clear();
  t('1 localStorage starts empty after clear', localStorage.length === 0);
  localStorage.setItem('k1', 'v1');
  t('2 setItem/getItem round-trip', localStorage.getItem('k1') === 'v1');
  t('3 length reflects items', localStorage.length === 1);
  t('4 key(0) returns the key', localStorage.key(0) === 'k1');
  t('5 key(1) out of range is null', localStorage.key(1) === null);
  t('6 getItem missing key is null', localStorage.getItem('nope') === null);

  /* values coerce to strings */
  localStorage.setItem('num', 42);
  t('7 numbers stored as strings', localStorage.getItem('num') === '42' &&
    typeof localStorage.getItem('num') === 'string');

  /* overwrite */
  localStorage.setItem('k1', 'v2');
  t('8 setItem overwrites', localStorage.getItem('k1') === 'v2' &&
    localStorage.length === 2);

  /* removeItem */
  localStorage.removeItem('k1');
  t('9 removeItem deletes', localStorage.getItem('k1') === null &&
    localStorage.length === 1);

  /* clear */
  localStorage.clear();
  t('10 clear empties', localStorage.length === 0 &&
    localStorage.getItem('num') === null);

  /* sessionStorage: in-memory, per-page */
  t('11 sessionStorage exists', typeof sessionStorage !== 'undefined');
  sessionStorage.clear();
  sessionStorage.setItem('s1', 'sv1');
  t('12 sessionStorage round-trip', sessionStorage.getItem('s1') === 'sv1');
  t('13 sessionStorage independent of localStorage',
    localStorage.getItem('s1') === null);
  sessionStorage.removeItem('s1');
  t('14 sessionStorage removeItem', sessionStorage.getItem('s1') === null);

  /* localStorage does not see sessionStorage */
  t('15 storages are separate', localStorage.length === 0);
} catch (e) {
  t('exception: ' + (e && e.message), false);
}
sum();
</script>
</body>
</html>
