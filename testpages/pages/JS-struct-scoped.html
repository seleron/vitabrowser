<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS struct scoped</title>
<style>
/* Patch 379. Patch 192 declined every block insertion and removal --
 * and 378's no-op -- on any page whose CSS has a structural pseudo-class
 * or a counter anywhere (youtube: always). Only the parent's children move
 * index, so the check now asks whether a structural rule's compound can
 * match a child of THAT parent (an *-of-type one only for a moved
 * element's tag); counters decline only when the moved subtree counts.
 * After its steps (600 ms apart) JS-struct-scoped.html must render row
 * for row as CSS-struct-scoped-ref.html, the same steps run while the page
 * parses. Local: a block into a box no structural rule reaches; a
 * <script> appended to <body> (no rebuild); a <div> among paragraphs
 * styled by p:first-of-type. Full: an <li> into a striped list; a <p>
 * among those paragraphs; a counting heading removed; one inserted. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; counter-reset: sec; }
p, div, h3, ul { margin: 4px 10px; }
h3 { font-size: 15px; }
#zebra li:nth-child(odd) { background: #ddd; }
#ps p:first-of-type { color: #c00; }
.card:first-child { border: 2px solid #00c; }
#sec h3::before { counter-increment: sec; content: counter(sec) ". "; }
</style>
</head>
<body>
<div id="box"><div>A box no structural rule reaches.</div><div>Its second block.</div></div>
<ul id="zebra"><li id="z1">one</li><li>two</li><li>three</li></ul>
<div id="ps"><p id="pa">First paragraph, red (first of its type).</p><p>Second paragraph.</p></div>
<div id="sec"><h3 id="h1">Section</h3><h3 id="h2">Another section</h3><h3>A third</h3></div>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var d = document.createElement('div'); d.textContent = 'A block inserted into the box.'; $('box').appendChild(d); },
		function () { var s = document.createElement('script'); s.text = 'window.vb379 = 1;'; document.body.appendChild(s); },
		function () { var d = document.createElement('div'); d.textContent = 'A div among the paragraphs (not a p).'; $('ps').insertBefore(d, $('pa')); },
		function () { var l = document.createElement('li'); l.textContent = 'zero'; $('zebra').insertBefore(l, $('z1')); },
		function () { var p = document.createElement('p'); p.textContent = 'A paragraph inserted first.'; $('ps').insertBefore(p, $('pa')); },
		function () { $('h2').parentNode.removeChild($('h2')); },
		function () { var h = document.createElement('h3'); h.textContent = 'An inserted section'; $('sec').insertBefore(h, $('h1')); }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
