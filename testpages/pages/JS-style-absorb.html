<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS style absorb (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
.box { height: 10px; background: #36c; margin: 2px 0; }
</style>
<style id="s1">.b1 { width: 50px; }</style>
<style id="s2">.b2 { width: 50px; }</style>
<style id="s3">.b3 { width: 50px; }</style>
<style id="s4">.b4 { width: 50px; }</style>
</head>
<body>
<div class="box b1" id="b1"></div>
<div class="box b2" id="b2"></div>
<div class="box b3" id="b3"></div>
<div class="box b4" id="b4"></div>
<!-- Patch 320 gate fix: the tall spacer pushes the page past the screen
 * height so the autotest takes the BOTTOM dump, whose 7 s settle window
 * covers the 1500 ms legs. A screen-fitting page dumps at the top settle
 * (~700 ms after the first leg's repaint), before leg 2 runs -- and this
 * engine's JS timers run ~450 ms late, which made the top dump show the
 * initial state. The status block lives below the spacer, where the
 * bottom dump sees it (the boxes stay up top for the top dump). -->
<div style="height: 7000px"></div>
<div id="sum">STYLEABS: 0/4 passed</div>
<p id="mix">MIXED-BEFORE</p>
<p id="r1">1 waiting (the script never ran)</p>
<p id="r2">2 waiting</p>
<p id="r3">3 waiting</p>
<p id="r4">4 waiting</p>
<script>
/* Patch 320 (doc 23 B0): a script's edit of a <style>'s text leaves a
 * precise mark on the <style>; while the <style> has no box, that mark
 * is answered with no rebuild and only the sheet's own batch reconverts
 * (before 320 the mark's full reconvert ran first, against the old
 * sheet). Legs: textContent (1), CSSOM insertRule, which writes back as
 * the element's text (2), a text node's data (3) -- each must still
 * restyle. Leg 4 edits a <style> and a paragraph in the same task: the
 * absorbed mark must not cost the paragraph its repaint (the gate looks
 * for MIXED-AFTER in the dump). (A <style> made visible by a rule cannot
 * be a leg: box construction skips <style> by tag name, so this engine
 * never renders one, unlike Chromium.) Results are written with
 * textContent only: a class change on a block would add a full
 * reconvert of its own and blur the gate's count. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		$('r' + n).textContent = n + ' ' + text + (ok ? ' ok' : ' FAIL');
		if (!ok) return;
		k++;
		$('sum').textContent = 'STYLEABS: ' + k + '/' + N + ' passed';
		document.title = 'JS style absorb (' + k + '/' + N + ')';
	}
	function w(id) { return Math.round($(id).getBoundingClientRect().width); }
	var steps = [
		function () { $('s1').textContent = '.b1 { width: 77px; }'; },
		function () { t(1, w('b1') === 77, 'textContent (' + w('b1') + ')');
			$('s2').sheet.insertRule('.b2 { width: 66px; }', 1); },
		function () { t(2, w('b2') === 66, 'CSSOM insertRule (' + w('b2') + ')');
			$('s3').firstChild.data = '.b3 { width: 55px; }'; },
		function () { t(3, w('b3') === 55, 'text node data (' + w('b3') + ')');
			$('s4').textContent = '.b4 { width: 44px; }';
			$('mix').textContent = 'MIXED-AFTER'; },
		function () { t(4, w('b4') === 44 && w('mix') > 0,
			'a <style> and a paragraph in one task (' + w('b4') + ')'); }
	];
	var i = 0;
	function next() {
		steps[i++]();
		if (i < steps.length) setTimeout(next, 1500);
	}
	window.addEventListener('load', function () { setTimeout(next, 600); });
})();
</script>
</body>
</html>
