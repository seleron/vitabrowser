<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS style detach noop</title>
<style>
/* Patch 421. A <style> that leaves the DOM is pruned (unit 387) and the
 * change that found it took the full rebuild. When the whole document,
 * re-cascaded without the dead sheet, keeps its styles -- this page's
 * removed sheet styles .never-here, which matches nothing -- the change
 * goes on locally: the class change after the removal is restyled in
 * place, no full rebuild. Row for row as CSS-style-detach-noop-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
.hl { background: #ffd; }
</style>
<style id="sx">.never-here { color: #c00; border: 2px solid #c00; }</style>
</head>
<body>
<p id="t">A paragraph that gains a class after the sheet is removed.</p>
<p>Another paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var s = $('sx'); s.parentNode.removeChild(s); },
		function () { $('t').className = 'hl'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 600); } })(); });
})();
</script>
</body>
</html>
