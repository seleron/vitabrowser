<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS style detach</title>
<style>
/* Patch 388: the in-sim test 387's entry asked for -- a <style> that
 * leaves the DOM during the page's lifetime stops cascading. Two
 * sheets: #sA (parse-time, in the head) paints #b1 red; #sB is
 * inserted by the script and paints #b2 red. Each removal is a
 * <head> no-op (383), so the detached entry survives until the next
 * rebuild; the class toggle on #trig (a sibling rule watches #watch)
 * forces one, whose up-front prune must drop the detached sheet --
 * the local path declines ("detached stylesheet pruned") into the
 * full reconvert, which paints without it. The steps (600 ms apart)
 * check each box's colour before and after its sheet's removal: b1
 * red, b2 red, then b1 blue, b2 blue. A failed check leaves FAIL in
 * the tick line, and the settled frame stops matching
 * CSS-style-detach-ref.html row for row.
 * (The 387 walk counted every NULL-parent node as the document, so a
 * removed node's cut chain read as attached and nothing was ever
 * pruned; 388 ends the walk on the document's type, not on a NULL
 * parent alone.) */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.box { width: 120px; height: 60px; background: #00c; }
.on + p { color: #c00; }
</style>
<style id="sA">#b1 { background: #f00; }</style>
</head>
<body>
<div id="b1" class="box">b1: blue at rest, red while #sA lives</div>
<div id="b2" class="box">b2: blue at rest, red while #sB lives</div>
<p id="trig">A paragraph whose class a sibling rule watches.</p>
<p id="watch">Red while the paragraph before it is .on (it ends without).</p>
<p id="tick">step 0</p>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function bg(id) { return String(getComputedStyle($(id)).backgroundColor).replace(/\s+/g, ''); }
	var RED = 'rgb(255,0,0)', BLUE = 'rgb(0,0,204)';
	var ops = [
		function () { var ok = bg('b1') === RED; var s = document.createElement('style'); s.id = 'sB'; s.textContent = '#b2 { background: #f00; }'; document.head.appendChild(s); return ok; },
		function () { var ok = bg('b2') === RED; var a = $('sA'); if (a) a.parentNode.removeChild(a); return ok; },
		function () { $('trig').className = 'on'; return true; },
		function () { var ok = bg('b1') === BLUE; var b = $('sB'); if (b) b.parentNode.removeChild(b); return ok; },
		function () { $('trig').className = ''; return true; },
		function () { return bg('b2') === BLUE; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { (function next() { if (k < ops.length) { var ok = ops[k](); $('tick').textContent = 'step ' + (k + 1) + (ok ? '' : ' FAIL'); k++; if (k < ops.length) setTimeout(next, 600); } })(); }, 500); });
})();
</script>
</body>
</html>
