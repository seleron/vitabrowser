<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS style inplace</title>
<style>
/* Patch 511. A style attribute change was answered as a class change: the
 * element's box and its whole subtree built again (a flex <body>: the
 * page). When no sheet selects on [style] but in a selector's subject,
 * the new style builds the same box, the custom properties are as they
 * were, and what the children inherit and how each child styles is
 * unchanged, the box takes its new style in place. JS-style-inplace.html
 * runs six steps after load (250 ms apart); CSS-style-inplace-ref.html the
 * same at parse time; row for row alike. In place: a padding, a [style]
 * subject rule's background. Nothing: the same value again. Declined (the
 * old path): an inherited font weight, a custom property a child reads, a
 * border a child inherits. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
.f { display: flex; margin: 4px 10px; background: #eef; border: 1px solid #888; }
.f > div { margin: 2px; padding: 2px 6px; border: 1px solid #000; }
.k[style*=height] { background: #cfc; }
#g > div { width: var(--w, 20px); background: #fc8; }
#h > div { border-top: inherit; }
</style>
</head>
<body>
<div id="f" class="f"><div>f1</div><div>f2 <span>text</span></div></div>
<div id="k" class="f k"><div>k1</div><div>k2</div></div>
<div id="c" class="f"><div>c1</div><div>c2</div></div>
<div id="g" class="f"><div>g1</div><div>g2</div></div>
<div id="h" class="f"><div>h1</div><div>h2</div></div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('f').style.paddingLeft = '20px'; },
		function () { $('k').style.height = '40px'; },
		function () { $('f').style.paddingLeft = '20px'; },
		function () { $('c').style.fontWeight = 'bold'; },
		function () { $('g').style.setProperty('--w', '60px'); },
		function () { $('h').style.borderTop = '4px solid #00c'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 250); } })(); });
})();
</script>
</body>
</html>
