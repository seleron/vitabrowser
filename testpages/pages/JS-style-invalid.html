<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Inline style: invalid writes ignored, authored values read (snapshot)</title>
<style>
/* Patch 361. el.style dropped the old declaration and stored any value,
 * so a size measured before layout (undefined, fixes1087) and written
 * back -- `el.style.width = w + "px"` -- erased an authored width and the
 * block went full width; Chromium ignores the invalid value. And el.style
 * read only what a script had set, so an authored style="display:none"
 * read '' and the usual toggle hid it again. Rows (green when right):
 *   A 40-60: authored width:200px, then width = undefined + "px" and
 *            setProperty("width", NaN + "px") -> stays 200px wide
 *   B 60-80: authored display:none, toggled by reading style.display
 *            -> shown
 * Snapshot pixels (Chromium agrees): (150,50) green, (300,50) white,
 * (150,70) green */
body { margin: 0; padding-top: 40px; background: #fff; }
div { height: 20px; background: #0a0; }
</style>
</head>
<body>
<div id="a" style="width:200px"></div>
<div id="b" style="display:none;width:200px"></div>
<script>
var a = document.getElementById('a'), b = document.getElementById('b'), u;
a.style.width = u + 'px';
a.style.setProperty('width', NaN + 'px');
b.style.display = b.style.display === 'none' ? '' : 'none';
</script>
</body>
</html>
