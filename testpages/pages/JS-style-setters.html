<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>element.style setters for every supported property (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; width: 960px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
.f { display: flex; width: 400px; margin-bottom: 2px; }
.f > div { height: 4px; background: #69c; }
</style>
<script>
/* Patch 351: element.style defined setters only for a fixed list of
 * camelCase names (and, after 348/350, the grid ones). Any other
 * supported property -- `el.style.flexGrow = 1`, `el.style.textTransform =
 * 'uppercase'`, `el.style.letterSpacing = ...` -- became a plain JS
 * property that never reached the style attribute. The rest of
 * CSS.supports' list now has shared setters on CSSStyleDeclaration.prototype.
 * Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'STYLESET351: ' + k + '/' + N + ' passed';
		document.title = 'element.style setters (' + k + '/' + N + ')';
	}
	function run() {
		var w = function (id) { return Math.round($(id).getBoundingClientRect().width); };
		t(1, w('g1') === 300 && w('g2') === 100, 'flexGrow 3 / 1 (' + w('g1') + ', ' + w('g2') + ')');
		t(2, w('b1') === 120, 'flexBasis 120px (' + w('b1') + ')');
		t(3, $('tt').style.textTransform === 'uppercase' &&
			$('tt').getAttribute('style').indexOf('text-transform') >= 0,
			'textTransform reaches the style attribute (' + $('tt').getAttribute('style') + ')');
		t(4, w('ls') > w('ls0') + 20, 'letterSpacing widens text (' + w('ls') + ' vs ' + w('ls0') + ')');
		t(5, $('tt').style.flexGrow === '' && typeof $('tt').style.wordBreak === 'string',
			'unset properties read as empty strings');
		t(6, (function () { var e = $('tt'); e.style.textIndent = '7px';
			return e.style.textIndent === '7px'; })(), 'reads back what was set');
	}
	window.addEventListener('load', run);
})();
</script>
</head>
<body>
<div id="sum">STYLESET351: 0/6 passed</div>
<p id="r1" class="wait">1 pending</p>
<p id="r2" class="wait">2 pending</p>
<p id="r3" class="wait">3 pending</p>
<p id="r4" class="wait">4 pending</p>
<p id="r5" class="wait">5 pending</p>
<p id="r6" class="wait">6 pending</p>
<div class="f"><div id="g1"></div><div id="g2"></div></div>
<div class="f"><div id="b1"></div></div>
<span id="tt">abc</span>
<div><span id="ls0" style="white-space: nowrap">spacing test</span></div>
<div><span id="ls" style="white-space: nowrap">spacing test</span></div>
<script>
document.getElementById('g1').style.flexGrow = '3';
document.getElementById('g2').style.flexGrow = '1';
document.getElementById('b1').style.flexBasis = '120px';
document.getElementById('tt').style.textTransform = 'uppercase';
document.getElementById('ls').style.letterSpacing = '4px';
</script>
</body>
</html>
