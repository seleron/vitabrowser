<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS style sib local</title>
<style>
/* Patch 409. A sheet whose sibling rules patch 186's scan gives up on
 * (.q:hover + .q: a pseudo-class in a left compound) declined every style
 * attribute change on the page when the sheet could select on the attribute
 * at all -- or held a backslash anywhere (an escaped class name, as in every
 * minified sheet). Now only a + or ~ after a [style...] selector is a risk.
 * This page has an escaped class and a descendant [style] rule, no sibling
 * one: its style changes are taken locally, row for row as the parse-time
 * build (CSS-style-sib-local-ref.html). */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.q:hover + .q { color: #00c; }
.md\:flex { border-left: 4px solid #888; }
.box[style*="bold"] span { color: #060; }
.box { padding: 2px; background: #eef; }
</style>
</head>
<body>
<div class="q">Hover pair one.</div><div class="q">Hover pair two.</div>
<div class="md:flex">An escaped class name.</div>
<div class="box" id="bx">A box with <span>a span</span> (green once the box is bold).</div>
<div class="box" id="by">Another box.</div>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { $('bx').style.fontWeight = 'bold'; },
		function () { $('by').style.background = '#fe9'; },
		function () { $('by').style.paddingLeft = '20px'; }
	], k = 0;
	window.addEventListener('load', function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 500); } })(); });
})();
</script>
</body>
</html>
