<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS template text (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
</style>
</head>
<body>
<div id="sum">TPLTEXT: 0/4 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<div id="box">
<p>visible words</p>
<script type="text/template" id="t1"><# if ( a < b ) { #><p>leaktemplate {{ data.x }}</p><# } #></script>
<script type="text/x-handlebars-template" id="t2"><div>leakhandlebars {{name}}</div></script>
<script type="application/json" id="t3">{"leakjson": true}</script>
<template id="t4"><p>leaktemplateelement</p></template>
<noscript><p>leaknoscript</p></noscript>
<p>more visible words</p>
</div>
<script>
/* Task 3 / patch 233 follow-up: what a page keeps in non-rendered script
 * blocks (templates, JSON islands), <template> and <noscript> is not page
 * text -- innerText leaves it out and nothing of it is drawn, as in
 * Chromium. make.wordpress.org showed o2's template source because 233's
 * bug inserted the escaped template into the page; this page pins the
 * blocks themselves, and that a template rendered from them (via the
 * wp.template pattern) carries no template syntax. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'TPLTEXT: ' + k + '/' + N + ' passed';
		document.title = 'JS template text (' + k + '/' + N + ')';
	}
	window.addEventListener('load', function () { setTimeout(function () {
		var it = String($('box').innerText), bt = String(document.body.innerText);
		var leaks = ['leaktemplate', 'leakhandlebars', 'leakjson', 'leaktemplateelement', 'leaknoscript']
			.filter(function (w) { return bt.indexOf(w) >= 0; });
		t(1, leaks.length === 0, 'body innerText leaves the blocks out: ' + (leaks.join(',') || 'none'));
		t(2, it.indexOf('visible words') >= 0 && it.indexOf('more visible words') >= 0,
			'the visible text is there');
		var bl = [$('t1'), $('t2'), $('t3')];
		t(3, bl.every(function (e) { return !(e.offsetHeight > 0) &&
			getComputedStyle(e).display === 'none'; }),
			'the script blocks are not drawn: ' + bl.map(function (e) {
				return getComputedStyle(e).display; }).join('/'));
		/* wp.template: evaluate <# #>, interpolate {{ }} */
		var src = $('t1').innerHTML, out = '';
		var code = src.replace(/<#([\s\S]+?)#>/g, function (m, c) { return '\x01' + c + '\x01'; });
		var fn = new Function('data', 'var a=1,b=2,o="";' + code.split('\x01').map(function (part, i) {
			return i % 2 ? part : 'o+=' + JSON.stringify(part).replace(/\{\{\s*([\w.]+)\s*\}\}/g, '"+$1+"') + ';';
		}).join('') + 'return o;');
		out = fn({ x: 'OK' });
		var holder = document.createElement('div');
		holder.innerHTML = out;
		$('box').appendChild(holder);
		setTimeout(function () {
			var it2 = String($('box').innerText);
			t(4, it2.indexOf('leaktemplate OK') >= 0 && it2.indexOf('<#') < 0 && it2.indexOf('{{') < 0,
				'a rendered template has no template syntax: ' + (it2.indexOf('leaktemplate OK') >= 0 ? 'rendered' : 'missing'));
		}, 100);
	}, 100); });
})();
</script>
</body>
</html>
