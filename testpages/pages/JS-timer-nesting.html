<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS timer nesting (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">TIMERNEST: 0/4 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<script>
/* patch 281: HTML's timer nesting level -- a timer set from a timer task
 * more than five deep waits at least 4 ms; setInterval likewise; animation
 * frames are not timer tasks. Chromium-verified. */
(function () {
	var k = 0, N = 4;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'TIMERNEST: ' + k + '/' + N + ' passed';
		document.title = 'JS timer nesting (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	function now() { return performance.now(); }
	/* 1: setTimeout(0) chained ten deep -- links 2-6 unclamped (the first can
	 * wait for the page to finish loading), 7-10 at least 4 ms */
	(function () {
		var gaps = [], k = 0;
		(function link() { var a = now(); setTimeout(function () { gaps.push(now() - a); if (++k < 10) link(); else t(1,
			gaps.slice(1, 6).every(function (x) { return x < 4; }) && gaps.slice(6).every(function (x) { return x >= 3.5; }),
			'setTimeout(0) x10: ' + gaps.map(function (x) { return Math.round(x * 10) / 10; }).join(' ')); }, 0); })();
	})();
	/* 2: setInterval(0) -- the same from its sixth run */
	(function () {
		var gaps = [], last = now(), id = setInterval(function () { var n = now(); gaps.push(n - last); last = n;
			if (gaps.length === 10) { clearInterval(id); t(2, gaps.slice(6).every(function (x) { return x >= 3.5; }),
				'setInterval(0): ' + gaps.map(function (x) { return Math.round(x * 10) / 10; }).join(' ')); } }, 0);
	})();
	/* 3: animation frames are not timer tasks -- after ten frames a setTimeout(0) is not clamped */
	(function () {
		var n = 0;
		(function frame() { if (++n < 10) { requestAnimationFrame(frame); return; }
			var a = now(); setTimeout(function () { var g = now() - a; t(3, g < 4, 'setTimeout(0) from the 10th animation frame: ' + Math.round(g * 10) / 10 + ' ms'); }, 0); })();
	})();
	/* 4: a 4 ms timer at level 0 is not delayed past a frame or two */
	(function () {
		var a = now(); setTimeout(function () { var g = now() - a; t(4, g >= 3.5 && g < 60, 'setTimeout(4): ' + Math.round(g * 10) / 10 + ' ms'); }, 4);
	})();
})();
</script>
</body>
</html>
