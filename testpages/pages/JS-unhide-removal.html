<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS unhide removal</title>
<style>
/* Patch 462. A sheet removal after which an element that had no box would
 * get one (oldreddit: a <div> a removed sheet had hidden) declined ("an
 * element without a box would get one") into the full rebuild. Its parent
 * becomes a hit of the re-cascade: the parent's restyle builds its
 * subtree from the DOM, the new box with it. Step (flushed by a layout
 * read): the <style id="h"> hiding a <div> in a block and a <span> in a
 * paragraph removed. Row for row as CSS-unhide-removal-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
div, p { margin: 4px 10px; }
.box { background: #eef; padding: 4px; }
.shown { background: #efe; }
</style>
<style id="h">.x { display: none; }</style>
</head>
<body>
<div class="box"><p>A paragraph above.</p><div class="x shown">A div a removed sheet had hidden.</div><p>A paragraph below.</p></div>
<p>A line with <span class="x shown">a span that appears</span> in it.</p>
<p>Last paragraph.</p>
<script>
(function () {
	window.addEventListener('load', function () { setTimeout(function () { var h = document.getElementById('h'); h.parentNode.removeChild(h); void document.body.offsetHeight; }, 300); });
})();
</script>
</body>
</html>
