<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS window key order (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">WINORDER: 0/5 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<script>
/* patch 277: window's own properties are listed in a browser's order
 * (fingerprinters read the tail of Object.keys(window)), the engine's
 * helpers do not enumerate, and a page's globals still come last.
 * Chromium-verified. */
(function () {
	var k = 0, N = 5;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'WINORDER: ' + k + '/' + N + ' passed';
		document.title = 'JS window key order (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	/* names both Chromium and this engine have, in Chromium's order */
	var SAMPLE = ["window", "customElements", "top", "origin", "onchange", "ondragend", "ondrop", "onkeydown", "onmouseenter", "onmouseup", "onsubmit", "onpointerup", "onpointerleave", "onanimationstart", "onhashchange", "onpagehide", "onunhandledrejection", "localStorage", "btoa", "close", "getComputedStyle", "print", "requestIdleCallback", "setTimeout"];
	function inOrder(list) {
		var last = -1, bad = [];
		SAMPLE.forEach(function (k) { var i = list.indexOf(k); if (i < 0) return; if (i < last) bad.push(k); else last = i; });
		return bad;
	}
	check(1, function () {
		var bad = inOrder(Object.keys(window));
		return bad.length === 0 || 'out of order: ' + bad.join(' ');
	}, 'Object.keys(window) lists them in a browser\'s order');
	check(2, function () {
		var bad = inOrder(Object.getOwnPropertyNames(window));
		return bad.length === 0 || 'out of order: ' + bad.join(' ');
	}, 'so does Object.getOwnPropertyNames(window)');
	check(3, function () {
		var k = Object.keys(window), bad = ['DOMPurify', 'XF', 'HTML_Element', 'setImmediate', 'clearImmediate']
			.filter(function (n) { return k.indexOf(n) >= 0; });
		return bad.length === 0 || 'enumerable: ' + bad.join(' ');
	}, 'no engine helper enumerates');
	check(4, function () {
		var present = SAMPLE.filter(function (n) { return n in window; });
		return present.length === SAMPLE.length || 'missing: ' + SAMPLE.filter(function (n) { return !(n in window); }).join(' ');
	}, 'every one is still there');
	window.vbPageGlobal = 1;
	check(5, function () {
		var k = Object.keys(window);
		return k.indexOf('vbPageGlobal') > k.indexOf('setTimeout') || 'page global at ' + k.indexOf('vbPageGlobal');
	}, 'a page\'s own global comes after the browser\'s');
})();
</script>
</body>
</html>
