<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS window prototype (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="sum">WINPROTO: 0/6 passed</div>
<p id="r1" class="wait">1 waiting</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<p id="r4" class="wait">4 waiting</p>
<p id="r5" class="wait">5 waiting</p>
<p id="r6" class="wait">6 waiting</p>
<script>
/* patch 273: window is a Window. Object.prototype.toString(window) said
 * [object global] (QuickJS-ng's own @@toStringTag on its global) and
 * window's prototype was the bridge's census object. Chromium-verified. */
(function () {
	var k = 0, N = 6;
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) return;
		p.className = 'pass';
		k++;
		$('sum').textContent = 'WINPROTO: ' + k + '/' + N + ' passed';
		document.title = 'JS window prototype (' + k + '/' + N + ')';
	}
	function check(n, f, text) {
		try { var r = f(); t(n, r === true, text + (r === true ? '' : ': ' + r)); }
		catch (e) { t(n, false, text + ': ' + e); }
	}
	var ts = Object.prototype.toString;
	check(1, function () { var s = ts.call(window); return s === '[object Window]' || s; },
		'Object.prototype.toString(window) is [object Window]');
	check(2, function () { var s = Object.getOwnPropertySymbols(window).map(String); return s.length === 0 || s.join(' '); },
		'window has no own symbol properties');
	check(3, function () {
		return (Object.getPrototypeOf(window) === Window.prototype && ts.call(Window.prototype) === '[object Window]') ||
			ts.call(Object.getPrototypeOf(window));
	}, 'window\'s prototype is Window.prototype, tagged Window');
	check(4, function () {
		var n = Object.getPrototypeOf(Window.prototype);
		return (ts.call(n) === '[object WindowProperties]' && Object.getPrototypeOf(n) === EventTarget.prototype) || ts.call(n);
	}, 'then WindowProperties, then EventTarget.prototype');
	check(5, function () {
		return (Window.TEMPORARY === 0 && Window.PERSISTENT === 1 && window.TEMPORARY === 0 && window.PERSISTENT === 1) ||
			[Window.TEMPORARY, Window.PERSISTENT, window.TEMPORARY].join(',');
	}, 'Window.TEMPORARY / PERSISTENT');
	check(6, function () { return (String(window) === '[object Window]' && window instanceof Window && window instanceof EventTarget) || String(window); },
		'String(window), instanceof Window and EventTarget');
})();
</script>
</body>
</html>
