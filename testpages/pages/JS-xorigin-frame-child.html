<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cross-origin child</title></head>
<body><p>the cross-origin child frame</p>
<script>
/* JS-xorigin-frame.html's child, served from the other origin (the gate's
 * https port). It announces itself to its parent and answers a ping. */
window.addEventListener('message', function (e) {
	if (e.data === 'ping') parent.postMessage({ pong: true, origin: location.origin }, '*');
	if (e.data === 'size?') parent.postMessage({ size: innerWidth + 'x' + innerHeight, which: location.search }, '*');
});
parent.postMessage({ hello: 'child', origin: location.origin, which: location.search, hash: location.hash }, '*');
</script>
</body></html>
