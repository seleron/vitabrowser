<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS frame made during load (script not run)</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
.fail { background: #f88; }
#sum { font-size: 20px; font-weight: bold; }
p { margin: 2px 0; }
iframe { width: 300px; height: 40px; }
#box { display: none; }
</style>
</head>
<body>
<div id="sum">XEARLY: 0/3 passed</div>
<p id="r1" class="wait">1 waiting (the frame never ran)</p>
<p id="r2" class="wait">2 waiting</p>
<p id="r3" class="wait">3 waiting</p>
<canvas id="busy" width="40" height="8"></canvas>
<div id="box"></div>
<script>
/* Patch 267: a cross-origin iframe a script inserts while the page is
 * still loading, with no box (display:none, or inside a display:none
 * container), loads -- it was never fetched: patch 244 asks the window to
 * look for new frames only once the page is ready, and the window made
 * frames for the boxed ones alone. The Guardian's consent frame (its
 * container display:none until the frame says "show") appeared only when
 * the page's scripts happened to run after the load. A visible frame
 * made after the load (3) always loaded. The child comes from the gate's https port (a different
 * origin). Chromium-verified (with the test CA trusted). */
(function () {
	var k = 0, N = 3, port = Number(location.port || 80), x = 0;
	/* the page repaints (a canvas, no DOM change) until the checks are
	 * done, so a test harness waiting for it to go quiet waits */
	var cv = document.getElementById('busy'), g = cv.getContext && cv.getContext('2d');
	var busy = setInterval(function () {
		if (!g) return;
		g.fillStyle = (x++ % 2) ? '#36c' : '#c63';
		g.fillRect(0, 0, 40, 8);
	}, 100);
	setTimeout(function () { clearInterval(busy); }, 10000);
	var childOrigin = 'https://127.0.0.1:' + (port + 1);
	var child = childOrigin + '/JS-xorigin-frame-child.html';
	function $(id) { return document.getElementById(id); }
	function t(n, ok, text) {
		var p = $('r' + n);
		if (p.className !== 'wait') return;	/* each check once */
		p.textContent = n + ' ' + text + (ok ? '' : ' FAIL');
		if (!ok) { p.className = 'fail'; return; }
		p.className = 'pass';
		k++;
		$('sum').textContent = 'XEARLY: ' + k + '/' + N + ' passed';
		if (k === N) clearInterval(busy);
		document.title = 'JS frame made during load (' + k + '/' + N + ')';
	}
	window.addEventListener('message', function (e) {
		var d = e.data || {};
		if (d.hello !== 'child' || d.origin !== childOrigin) return;
		if (d.which === '?early-none') t(1, true, 'a display:none frame made during load loads');
		if (d.which === '?early-box') {
			$('box').style.display = 'block';
			t(2, true, 'a frame in a display:none container, made during load, loads');
		}
		if (d.which === '?late-shown') t(3, true, 'a visible frame made after the load loads');
	});
	var none = document.createElement('iframe');
	none.style.display = 'none';
	none.src = child + '?early-none';
	document.body.appendChild(none);
	var inbox = document.createElement('iframe');
	inbox.src = child + '?early-box';
	$('box').appendChild(inbox);
	/* the hidden frames have 3 s from the load to report; the control
	 * comes after that: any frame made later has the window look for new
	 * frames, and it would find them */
	window.addEventListener('load', function () {
		setTimeout(function () {
			t(1, false, 'a display:none frame made during load never loaded');
			t(2, false, 'a frame in a display:none container, made during load, never loaded');
			var shown = document.createElement('iframe');
			shown.src = child + '?late-shown';
			document.body.appendChild(shown);
		}, 3000);
	});
})();
</script>
<p>(the rest of the page)</p>
</body>
</html>
