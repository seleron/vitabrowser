<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS cross-realm frames (script not run)</title>
<!-- Patch 126: an iframe is its own JavaScript realm (own runtime); the
     two talk only through postMessage, carried between runtimes as JSON
     text. 1: the child's parent.postMessage reaches this window as an
     object. 2: this window's iframe.contentWindow.postMessage reaches the
     child, whose reply comes back (round trip). 3: a string arrives as a
     string. 4: event.source can answer (source.postMessage exists). -->
<style>
body { font-family: sans-serif; font-size: 16px; margin: 10px; }
p { margin: 3px 0; padding: 2px 6px; }
.wait { background: #fcc; }
.pass { background: #cfc; }
#sum { font-size: 20px; font-weight: bold; }
iframe { width: 300px; height: 60px; border: 1px solid #888; }
</style>
</head>
<body>
<p id="sum" class="wait">XREALM: script did not run</p>
<p id="r1" class="wait">1 child to parent (object): waiting</p>
<p id="r2" class="wait">2 parent to child and back (round trip): waiting</p>
<p id="r3" class="wait">3 a string stays a string: waiting</p>
<p id="r4" class="wait">4 event.source.postMessage: waiting</p>
<iframe name="kid" src="js-xrealm-child.html"></iframe>
<script>
(function () {
	var done = {};
	function pass(n, text) {
		if (done[n]) return;
		done[n] = true;
		var p = document.getElementById('r' + n);
		p.textContent = text;
		p.className = 'pass';
		var k = 0, i;
		for (i = 1; i <= 4; i++) if (done[i]) k++;
		document.getElementById('sum').textContent = 'XREALM: ' + k + '/4 passed';
		document.title = 'JS cross-realm frames (' + k + '/4)';
		console.log('XREALM ' + n + ' ' + text);
	}
	document.getElementById('sum').textContent = 'XREALM: 0/4 passed';
	window.addEventListener('message', function (e) {
		var d = e.data;
		if (d && typeof d === 'object' && d.hello === 'from-child') {
			pass(1, '1 child to parent (object): ' + JSON.stringify(d));
			if (e.source && typeof e.source.postMessage === 'function')
				pass(4, '4 event.source.postMessage: present');
			var kid = document.getElementsByTagName('iframe')[0];
			kid.contentWindow.postMessage({ ping: 7 }, '*');
			kid.contentWindow.postMessage('just text', '*');
		} else if (d && typeof d === 'object' && d.pong === 8) {
			pass(2, '2 parent to child and back (round trip): pong ' + d.pong);
		} else if (d && typeof d === 'object' && d.echoed === 'just text') {
			pass(3, '3 a string stays a string: ' + typeof d.echoed);
		}
	});
})();
</script>
</body>
</html>
