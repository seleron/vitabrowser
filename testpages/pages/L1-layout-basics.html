<!DOCTYPE html>
<!-- L1: block/inline/float basics. One probe card, per brief section 8 item 6.
     Numbered so a commit can say "fix float clearing -- L1 passes". -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>L1 layout basics</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; }
  .box { width: 200px; height: 60px; background: #ccc; }
  .float-left { float: left; width: 120px; height: 40px; background: #999; }
  .after-float { background: #eee; }
  table { border-collapse: collapse; }
  td { border: 1px solid #333; padding: 4px; }
</style>
</head>
<body>
<h1>L1 heading</h1>
<div class="box">block box 200x60</div>
<p>Inline text that should wrap at the viewport width and therefore exercise
the line breaker across more than one line of output.</p>
<div><span class="float-left">float</span>
<span class="after-float">text beside the float</span></div>
<table><tr><td>r1c1</td><td>r1c2</td></tr><tr><td>r2c1</td><td>r2c2</td></tr></table>
</body>
</html>
