<!DOCTYPE html>
<!-- L2: the CSS MacSurf's patch stack adds that upstream libcss lacks.
     Every rule here targets a property from docs/phase-0/05-capability-reaudit.md
     §1. Upstream should ignore most of them; the patched engine should not.
     A plot-stream diff between the two engines is the measurement. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>L2 MacSurf CSS additions</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; }

  /* border-radius + box-shadow: added by MacSurf */
  .rounded { width: 200px; height: 50px; background: #ccc;
             border-radius: 12px; box-shadow: 2px 2px 4px #333; }

  /* aspect-ratio + object-fit: added */
  .ratio { width: 120px; aspect-ratio: 2 / 1; background: #ddd; }

  /* min() / max() / clamp(): CSS_UNIT_MIN / MAX / CLAMP */
  .clamped { width: clamp(100px, 50%, 300px); height: 20px; background: #bbb; }
  .maxed   { width: max(150px, 20%);          height: 20px; background: #aaa; }

  /* transitions: all four properties added by MacSurf */
  .trans { width: 100px; height: 20px; background: #999;
           transition-property: width; transition-duration: 300ms;
           transition-delay: 50ms; transition-timing-function: ease-in; }

  /* text additions */
  .texty { width: 180px; text-overflow: ellipsis; overflow-wrap: break-word;
           word-break: break-all; tab-size: 4; hyphens: auto; }

  /* alignment additions */
  .aligned { justify-items: center; justify-self: end; row-gap: 8px; }

  /* background additions */
  .bg { width: 150px; height: 40px; background-size: cover;
        background-origin: border-box; background-clip: padding-box;
        background-blend-mode: multiply; }

  /* form/UI additions */
  .ui { appearance: none; accent-color: #06c; caret-color: #c00;
        pointer-events: none; }
</style>
</head>
<body>
<div class="rounded">rounded + shadow</div>
<div class="ratio">aspect-ratio</div>
<div class="clamped">clamp()</div>
<div class="maxed">max()</div>
<div class="trans">transition</div>
<p class="texty">Averylongunbrokenwordthatshouldexercisewordbreakandoverflowwrap behaviour.</p>
<div class="aligned">alignment</div>
<div class="bg">background</div>
<input class="ui" value="ui">
</body>
</html>
