<!DOCTYPE html>
<!-- L3: CSS Grid. Brief §8 item 3 records MacSurf's grid auto-placement bug --
     the naive `i % n_tracks` mapping mis-assigns content as soon as explicit
     grid-column/grid-row placement appears, and the fix needs a per-row
     occupancy map. These cards are built to expose exactly that: G3 and G4
     place items explicitly, out of document order, so a naive walker puts them
     in the wrong cells and the plot stream shows it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>L3 grid</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; }
  .g { display: grid; width: 600px; margin-bottom: 12px; }
  .g > div { background: #ddd; }

  /* G1: plain 3-track auto placement */
  .g1 { grid-template-columns: 100px 200px 150px; }

  /* G2: fr units and a row template */
  .g2 { grid-template-columns: 1fr 2fr 1fr; grid-template-rows: 40px 60px; }

  /* G3: explicit column placement out of document order (the occupancy-map case) */
  .g3 { grid-template-columns: repeat(4, 100px); }
  .g3 .a { grid-column: 3; }
  .g3 .b { grid-column: 1; }
  .g3 .c { grid-column: 4; }

  /* G4: explicit row AND column, plus a span */
  .g4 { grid-template-columns: repeat(3, 120px); grid-template-rows: 30px 30px 30px; }
  .g4 .x { grid-column: 2; grid-row: 3; }
  .g4 .y { grid-column: 1 / span 2; grid-row: 1; }

  /* G5: gap in both axes */
  .g5 { grid-template-columns: 80px 80px 80px; row-gap: 10px; column-gap: 20px; }

  /* G6: auto-flow column */
  .g6 { grid-template-rows: 30px 30px; grid-auto-flow: column; }
</style>
</head>
<body>
<div class="g g1"><div>G1a</div><div>G1b</div><div>G1c</div><div>G1d</div></div>
<div class="g g2"><div>G2a</div><div>G2b</div><div>G2c</div></div>
<div class="g g3"><div class="a">G3a</div><div class="b">G3b</div><div class="c">G3c</div><div>G3d</div></div>
<div class="g g4"><div class="x">G4x</div><div class="y">G4y</div><div>G4z</div></div>
<div class="g g5"><div>G5a</div><div>G5b</div><div>G5c</div><div>G5d</div></div>
<div class="g g6"><div>G6a</div><div>G6b</div><div>G6c</div><div>G6d</div></div>
</body>
</html>
