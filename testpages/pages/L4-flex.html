<!DOCTYPE html>
<!-- L4: flexbox. Brief §8 item 5 records that intrinsic sizing diverges from
     Chrome for flex/grid/table without explicit dimensions, so these cards
     deliberately omit widths in F3-F5 and let the algorithm decide. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>L4 flex</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; }
  .f { display: flex; width: 600px; margin-bottom: 12px; background: #eee; }
  .f > div { background: #ccc; }

  /* F1: fixed basis, no grow */
  .f1 > div { flex: 0 0 100px; }

  /* F2: grow from zero basis -- classic 1:2:1 split */
  .f2 .a { flex: 1 1 0; } .f2 .b { flex: 2 1 0; } .f2 .c { flex: 1 1 0; }

  /* F3: intrinsic sizing, no explicit width anywhere */
  .f3 > div { flex: 0 1 auto; }

  /* F4: shrink past basis -- overflow resolution */
  .f4 > div { flex: 0 1 300px; }

  /* F5: wrap onto a second line */
  .f5 { flex-wrap: wrap; }
  .f5 > div { flex: 0 0 250px; }

  /* F6: column direction with justify/align */
  .f6 { flex-direction: column; height: 120px;
        justify-content: space-between; align-items: flex-end; }
  .f6 > div { flex: 0 0 auto; }
</style>
</head>
<body>
<div class="f f1"><div>F1a</div><div>F1b</div><div>F1c</div></div>
<div class="f f2"><div class="a">F2a</div><div class="b">F2b</div><div class="c">F2c</div></div>
<div class="f f3"><div>F3 short</div><div>F3 a rather longer item</div><div>F3 mid</div></div>
<div class="f f4"><div>F4a</div><div>F4b</div><div>F4c</div></div>
<div class="f f5"><div>F5a</div><div>F5b</div><div>F5c</div></div>
<div class="f f6"><div>F6a</div><div>F6b</div><div>F6c</div></div>
</body>
</html>
