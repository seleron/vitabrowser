<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS link preload</title>
<style>
/* Unit 390: census for <link rel=preload as=stylesheet>. The rel
 * check in html_css_process_link (strcasestr(rel, "stylesheet"))
 * returns before any fetch: a preload never enters the stylesheet
 * list, so it never cascades and the 387/388/389 prune has nothing
 * to see. A real <link rel=stylesheet> with the same URL takes the
 * normal path: it cascades after the page is DONE and, once it
 * leaves, the prune drops it. Steps (500 ms apart): insert the
 * preload, settle well past the /slow/ fetch time, verify b1 stayed
 * blue (the preload did NOT cascade), insert the real stylesheet,
 * settle, verify b1 red, remove the real link + force the rebuild
 * whose up-front prune drops the sheet, verify b1 blue again. A
 * failed check leaves FAIL in the tick line and the settled frame
 * stops matching CSS-link-preload-ref. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p, div { margin: 4px 10px; }
.box { width: 120px; height: 60px; background: #00c; }
.on + p { color: #c00; }
</style>
</head>
<body>
<div id="b1" class="box">b1: blue at rest, red only while the real sheet lives</div>
<p id="trig">A paragraph whose class a sibling rule watches.</p>
<p id="watch">Red while the paragraph before it is .on (it ends without).</p>
<p id="sum">LINKPRELOAD: 0/3 passed</p>
<p id="tick">step 0</p>
<p>Last paragraph.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	function bg(id) { return String(getComputedStyle($(id)).backgroundColor).replace(/\s+/g, ''); }
	var RED = 'rgb(255,0,0)', BLUE = 'rgb(0,0,204)';
	var k = 0, N = 3;
	function link(rel, href) {
		var l = document.createElement('link');
		l.rel = rel;
		if (rel === 'preload')
			l.as = 'stylesheet';
		l.href = href;
		document.head.appendChild(l);
		return l;
	}
	function t(ok) {
		$('tick').textContent = 'step ' + (k + 1) + (ok ? '' : ' FAIL');
		if (ok) {
			k++;
			$('sum').textContent = 'LINKPRELOAD: ' + k + '/' + N + ' passed';
			document.title = 'JS link preload (' + k + '/' + N + ')';
		}
	}
	var lp, ls;
	/* Each op runs in order (500 ms apart); only ops with chk count
	 * toward the summary. A check failing leaves FAIL in the tick
	 * line and freezes the sum below 3/3. */
	var ops = [
		{ f: function () { lp = link('preload', '/slow/js-link-preload.css'); } },
		{ f: function () {} },
		{ f: function () {} },
		{ f: function () { return bg('b1') === BLUE; }, chk: 1 },
		{ f: function () { ls = link('stylesheet', '/slow/js-link-preload.css'); } },
		{ f: function () {} },
		{ f: function () {} },
		{ f: function () { return bg('b1') === RED; }, chk: 1 },
		{ f: function () { if (ls) ls.parentNode.removeChild(ls); $('trig').className = 'on'; } },
		{ f: function () {} },
		{ f: function () {} },
		{ f: function () { var ok = bg('b1') === BLUE; $('trig').className = ''; return ok; }, chk: 1 }
	];
	var m = 0;
	window.addEventListener('load', function () { setTimeout(function () { (function next() { if (m < ops.length) { var op = ops[m]; var ok = op.f(); if (op.chk) t(ok); $('tick').textContent = 'step ' + (m + 1); m++; if (m < ops.length) setTimeout(next, 500); } })(); }, 500); });
})();
</script>
</body>
</html>
