<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS removal loading</title>
<style>
/* Patch 453. A <style> removed while another sheet is still in flight
 * declined ("sheet removal: a sheet is still loading or changing") into
 * the full rebuild. The live selection context is refreshed only once
 * every sheet has settled, but the prune takes the settled sheet out of
 * it: it is the held cascade minus the removed sheet, what a full rebuild
 * would cascade now. When the tree held the context before the prune, the
 * removal is answered against the live context, its few changed elements
 * restyled in place. Steps (150 ms apart, inside the second the slow
 * sheet takes): a <link> to a slow sheet added (it stays, styling
 * nothing); the <style id="s1"> that colours two paragraphs removed, then
 * a layout read. Row for row as CSS-removal-loading-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
</style>
<style id="s1">
.r { color: #c00; background: #fee; }
.r + p { font-weight: bold; }
</style>
</head>
<body>
<p class="r" id="p1">A paragraph red while #s1 lives.</p>
<p>The paragraph after it (bold while #s1 lives).</p>
<p class="r">Another red paragraph.</p>
<script>
(function () {
	var ops = [
		function () { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/slow/gen-sheet-453.css'; document.head.appendChild(l); },
		function () { var s = document.getElementById('s1'); s.parentNode.removeChild(s); void document.body.offsetHeight; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 150); } })(); }, 300); });
})();
</script>
</body>
</html>
