<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS sheet gen</title>
<style>
/* Patch 443. A sheet change while another sheet is still in flight
 * declined ("a sheet is still loading or changing") into the full rebuild,
 * in a script's synchronous flush too (442 only waits in the timer flush).
 * But the selection context is refreshed only once every sheet has
 * settled, so that rebuild cascades the very context the boxes hold. When
 * nothing was pruned and the box tree holds the context's generation, the
 * change is answered with no rebuild; the slow sheet's own mark re-cascades
 * when it lands (google: a sheet done while another is in flight). Steps
 * (150 ms apart, inside the second the slow sheet takes): a <link> to a
 * slow sheet added (it stays), a <link> to a fast sheet added (it lands
 * while the slow one is in flight; then a layout read), a paragraph's
 * text changed. Neither sheet styles anything on the page. Row for row as
 * CSS-sheet-gen-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
</style>

</head>
<body>
<p id="p1">First paragraph.</p>
<p id="p2">Second paragraph, its text changes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/slow/gen-sheet-443.css'; document.head.appendChild(l); },
		function () { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/gen-fast-443.css'; document.head.appendChild(l); setTimeout(function () { void document.body.offsetHeight; }, 60); },
		function () { $('p2').textContent = 'Second paragraph, its text changed.'; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 150); } })(); }, 300); });
})();
</script>
</body>
</html>
