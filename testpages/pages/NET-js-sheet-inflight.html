<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS sheet inflight</title>
<style>
/* Patch 432. A sheet change is answered without a rebuild when every
 * element keeps its style (patch 421's walk) -- once the sheets have
 * settled. A sheet still in flight when its <link> left kept the slot it
 * was pruned from busy (unit 389 keeps its handle for the load callback):
 * the sheet change declined as "still loading" and took the full rebuild
 * (oldreddit's web components drop <style>s before their sheets exist).
 * A pruned entry is not in the cascade. Steps (150 ms apart, all inside the second the
 * sheet takes): a <link> to a slow sheet added, then removed; a <style>
 * that styles nothing removed from the body with a paragraph's text
 * changed -- the removal is answered by the walk (it restyles nothing),
 * the text locally. Row for row as CSS-sheet-inflight-ref.html. */
body { margin: 0; padding-top: 30px; font-family: sans-serif; font-size: 14px; background: #fff; }
p { margin: 4px 10px; }
</style>
</head>
<body>
<p id="p1">First paragraph.</p>
<style id="unused">.vb432-unused { color: #00f; }</style>
<p id="p2">Second paragraph, its text changes.</p>
<script>
(function () {
	function $(id) { return document.getElementById(id); }
	var ops = [
		function () { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/slow/inflight-sheet-432.css'; l.id = 'slowlink'; document.head.appendChild(l); },
		function () { var l = $('slowlink'); l.parentNode.removeChild(l); },
		function () { var s = $('unused'); s.parentNode.removeChild(s); $('p2').textContent = 'Second paragraph, its text changed.'; }
	], k = 0;
	window.addEventListener('load', function () { setTimeout(function () { (function next() { if (k < ops.length) { ops[k++](); setTimeout(next, 150); } })(); }, 300); });
})();
</script>
</body>
</html>
