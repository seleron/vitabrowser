<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NETSTALL</title>
<script>window.__nsT0 = Date.now();</script>
<!--
  Patch 299 proof page (manual / throwaway-bound runs; not in the
  gate's page list -- with the shipped 120 s no-progress bound this
  page needs ~130 s of wall time, far past the gate's settle budget).

  /stall-js accepts the connection and never sends a byte: the
  parser blocks on it until a client-side no-progress policy gives
  the fetch up. /drip-js then delivers a complete script at 2 B/s:
  slow, but progressing, so it must survive and run. The summary
  line reports both outcomes and the elapsed seconds -- the number
  that separates the policies: ~the bound with one, ~180 s (curl's
  low-speed floor) or never without one.
-->
<script src="/stall-js"></script>
<script src="/drip-js"></script>
</head>
<body>
<p id="sum">NETSTALL: script did not run</p>
<script>
document.getElementById('sum').textContent =
	'NETSTALL: converted drip=' + (window.__nsDrip ? 1 : 0) +
	' elapsed=' + Math.round((Date.now() - window.__nsT0) / 1000) + 's';
</script>
</body>
</html>
