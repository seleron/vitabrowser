<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PM animation probe</title>
<style>
body { margin: 10px; }
.r90  { width: 100px; height: 40px; background: red;
        -macsurf-transform: rotate(90deg); }
.op40 { width: 100px; height: 40px; background: blue;
        opacity: 0.4; }
.anim { width: 100px; height: 40px; background: green;
        -macsurf-animation-rotate: 0 90 4000;
        -macsurf-animation-opacity: 1.0 0.2 4000; }
</style>
</head>
<body>
<div class="r90">rot90</div>
<div class="op40">op40</div>
<div class="anim">anim</div>
</body>
</html>
