<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>gradient plotter probe</title>
<style>
  body { margin: 0; font-family: monospace; }
  .v { width: 200px; height: 160px; margin: 10px;
       -macsurf-gradient: linear-gradient(#ff0000, #0000ff); }
  .h { width: 200px; height: 160px; margin: 10px;
       -macsurf-gradient: linear-gradient(to right, #000000, #ffffff); }
  .r { width: 200px; height: 160px; margin: 10px;
       -macsurf-gradient: radial-gradient(#ffff00, #000000); }
  .lbl { margin: 10px; }
</style>
</head>
<body>
<div class="v"></div>
<div class="lbl">vertical</div>
<div class="h"></div>
<div class="lbl">horizontal</div>
<div class="r"></div>
<div class="lbl">radial</div>
</body>
</html>
