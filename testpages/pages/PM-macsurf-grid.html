<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MacSurf grid probe</title>
<style>
  body { margin: 0; font-family: monospace; }
  /* MacSurf proprietary grid: display:grid triggers layout_grid,
     -macsurf-grid:3 gives 3 equal-width columns (the V1 grammar). */
  .g { display: grid; -macsurf-grid: 3; width: 600px; height: 300px;
       border: 1px solid #000; }
  .g .c { height: 30px; border: 1px solid #888; }
</style>
</head>
<body>
<div class="g">
  <div class="c">C1</div>
  <div class="c">C2</div>
  <div class="c">C3</div>
  <div class="c">C4</div>
  <div class="c">C5</div>
  <div class="c">C6</div>
</div>
</body>
</html>
