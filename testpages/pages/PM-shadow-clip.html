<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PM shadow clip probe</title>
<style>
body { margin: 10px; }
/* 1: last child of a parent whose extent ends at the child: the shadow
   must survive the PARENT's clip (layout ink, patch 32 part A). */
.wrap { width: 200px; }
.last { width: 200px; height: 60px; background: red; box-shadow: 10px 10px; }
/* 2: the box's own overflow:hidden must not cut its own shadow
   (redraw clip widening, part B). */
.card { width: 200px; height: 60px; margin-top: 30px; background: green;
        overflow: hidden; box-shadow: 10px 10px; }
/* 3: negative control: a CSS clip rect clips the shadow too. */
.clipped { position: absolute; left: 300px; top: 10px; width: 200px;
           height: 60px; background: blue; box-shadow: 10px 10px;
           clip: rect(0px, 200px, 60px, 0px); }
</style>
</head>
<body>
<div class="wrap"><div class="last">last child</div></div>
<div class="card">overflow hidden</div>
<div class="clipped">clip rect</div>
</body>
</html>
