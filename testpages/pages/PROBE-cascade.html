<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>probe cascade</title>
<style>
body { font-family: sans-serif; margin: 0; }
.x { width: 10px; height: 10px; color: rgb(1, 1, 1); }
@layer base, theme;
@layer theme { #lay1 { color: rgb(0, 128, 0); } }
@layer base { #lay1 { color: rgb(255, 0, 0); } }
@layer { #lay2 { color: rgb(0, 128, 0); } }
@layer base { #lay3 { color: rgb(255, 0, 0); } }
#lay3 { color: rgb(0, 128, 0); }
.nest { color: rgb(255, 0, 0); & .in { color: rgb(0, 128, 0); } }
.nest2 { .in2 { color: rgb(0, 128, 0); } }
.nest3 { &.on { color: rgb(0, 128, 0); } }
@supports (display: grid) { #sup1 { color: rgb(0, 128, 0); } }
@supports not (display: frobnicate) { #sup2 { color: rgb(0, 128, 0); } }
@supports selector(:has(a)) { #sup3 { color: rgb(0, 128, 0); } }
@media (width >= 600px) { #mq1 { color: rgb(0, 128, 0); } }
@media (400px <= width <= 2000px) { #mq2 { color: rgb(0, 128, 0); } }
@media (hover: hover) { #mq3 { color: rgb(0, 128, 0); } }
@media (prefers-reduced-motion: no-preference) { #mq4 { color: rgb(0, 128, 0); } }
@media screen and (min-width: 37.5em) { #mq5 { color: rgb(0, 128, 0); } }
#col1 { color: rgb(0 128 0); }
#col2 { color: rgb(0 128 0 / 50%); }
#col3 { color: hsl(120deg 100% 25%); }
#col4 { color: #0808; }
:root { --g: rgb(0, 128, 0); }
#var1 { color: var(--missing, var(--g)); }
.cq { container-type: inline-size; width: 300px; }
@container (min-width: 200px) { #cq1 { color: rgb(0, 128, 0); } }
#imp { color: rgb(0, 128, 0) !important; }
#imp { color: rgb(255, 0, 0); }
#where :where(.w) { color: rgb(255, 0, 0); }
.w2 { color: rgb(0, 128, 0); }
</style>
</head>
<body>
<div class="x" id="lay1"></div><div class="x" id="lay2"></div><div class="x" id="lay3"></div>
<div class="nest x"><div class="in x" id="nest1"></div></div>
<div class="nest2"><div class="in2 x" id="nest2"></div></div>
<div class="nest3 on x" id="nest3"></div>
<div class="x" id="sup1"></div><div class="x" id="sup2"></div><div class="x" id="sup3"></div>
<div class="x" id="mq1"></div><div class="x" id="mq2"></div><div class="x" id="mq3"></div><div class="x" id="mq4"></div><div class="x" id="mq5"></div>
<div class="x" id="col1"></div><div class="x" id="col2"></div><div class="x" id="col3"></div><div class="x" id="col4"></div>
<div class="x" id="var1"></div>
<div class="cq"><div class="x" id="cq1"></div></div>
<div class="x" id="imp"></div>
<div id="where"><div class="x w w2" id="where1"></div></div>
<pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
	var ids = ['lay1','lay2','lay3','nest1','nest2','nest3','sup1','sup2','sup3','mq1','mq2','mq3','mq4','mq5','col1','col2','col3','col4','var1','cq1','imp','where1'];
	var lines = [];
	for (var i = 0; i < ids.length; i++)
		lines.push('C ' + ids[i] + ' ' + getComputedStyle(document.getElementById(ids[i])).color.replace(/ /g, ''));
	document.getElementById('out').textContent = lines.join('\n');
}, 300); });
</script>
</body>
</html>
