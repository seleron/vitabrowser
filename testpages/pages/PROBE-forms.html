<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe forms</title>
<style>body{font-family:sans-serif;font-size:16px;margin:0}</style></head>
<body>
<fieldset id="fs"><legend id="lg">Legend</legend><input id="in1"></fieldset>
<div><input id="t" type="text"> <input id="cb" type="checkbox"> <input id="rb" type="radio"></div>
<div><input id="rg" type="range"> <input id="col" type="color"> <input id="dt" type="date"></div>
<div><select id="sel"><option>One</option><option>Two longer</option></select> <textarea id="ta"></textarea></div>
<div><input id="sub" type="submit"> <input id="file" type="file"> <input id="num" type="number"></div>
<div><label id="lb"><input type="checkbox"> label</label></div>
<pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
 var ids=['fs','lg','in1','t','cb','rb','rg','col','dt','sel','ta','sub','file','num','lb'],L=[];
 for (var i=0;i<ids.length;i++){var r=document.getElementById(ids[i]).getBoundingClientRect();L.push('P '+ids[i]+' '+Math.round(r.left)+','+Math.round(r.top)+' '+Math.round(r.width)+'x'+Math.round(r.height));}
 document.getElementById('out').textContent=L.join('\n');
},300);});
</script></body></html>
