<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe ib space</title>
<style>body{font-family:sans-serif;font-size:16px;margin:0} .ib{display:inline-block} .ibb{display:inline-block;background:#ccf}</style></head>
<body>
<div><span class="ib" id="a1">aa</span> <span class="ib" id="a2">bb</span></div>
<div><span id="b1">aa</span> <span id="b2">bb</span></div>
<div><span class="ib" id="c1">aa</span>
<span class="ib" id="c2">bb</span></div>
<div>x <span class="ib" id="d1">aa</span> y</div>
<div><img id="e1" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10"> <img id="e2" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10"></div>
<ul style="list-style:none;padding:0"><li class="ib" id="f1">one</li> <li class="ib" id="f2">two</li></ul>
<div><button id="g1">ok</button> <button id="g2">no</button></div>
<pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
 function r(id){return document.getElementById(id).getBoundingClientRect();}
 var pr=[['a1','a2'],['b1','b2'],['c1','c2'],['e1','e2'],['f1','f2'],['g1','g2']], L=[];
 for (var i=0;i<pr.length;i++){var x=r(pr[i][0]),y=r(pr[i][1]);L.push('P '+pr[i][0]+' '+x.left+' '+x.right+' '+y.left+' '+y.right);}
 var d=r('d1'); L.push('P d1 left='+Math.round(d.left));
 document.getElementById('out').textContent=L.join('\n');
},300);});
</script></body></html>
