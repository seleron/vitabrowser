<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe input value</title></head>
<body><input id="i" type="range" value="30"><input id="j" type="text" value="hi"><pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
 var L=[], i=document.getElementById('i'), IP=HTMLInputElement.prototype;
 var own=Object.getOwnPropertyDescriptor(IP,'value');
 L.push('P own='+(!!own)+' p1='+(Object.getPrototypeOf(i)===IP));
 var p=Object.getPrototypeOf(IP), d=0, ds;
 while(p && !(ds=Object.getOwnPropertyDescriptor(p,'value'))){p=Object.getPrototypeOf(p);d++;}
 L.push('P found at '+d+' src='+String(ds&&ds.get).slice(0,80).replace(/\s+/g,' '));
 L.push('P inner=['+(ds&&ds.get.call(i))+'] attr=['+i.getAttribute('value')+'] v=['+i.value+']');
 var a=i.getAttribute('max'); L.push('P num='+((a===null||a==='')?NaN:+a)+' fin='+isFinite(NaN)+' mm='+Math.max(0,Math.min(100,30))+' str='+String(30)+' own2='+String(own&&own.get).slice(0,60).replace(/\s+/g,' '));
 document.getElementById('out').textContent=L.join('\n');
},300);});
</script></body></html>
