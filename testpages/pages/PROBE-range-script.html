<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe range script</title>
<style>body{margin:0} #s{position:absolute;left:100px;top:100px;width:300px;height:16px;margin:0} #out{position:absolute;top:200px}</style>
<script>
window.addEventListener('load', function () {
	setTimeout(function () {
		var s = document.getElementById('s'), err = '';
		try { s.value = 10; } catch (e) { err = String(e); }
		document.getElementById('out').textContent = 'P attr=' + s.getAttribute('value') + ' val=' + s.value + ' err=' + err;
	}, 200);
});
</script></head>
<body><input type="range" id="s" min="0" max="10" value="0"><pre id="out"></pre></body></html>
