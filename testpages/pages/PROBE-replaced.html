<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>probe replaced</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
div.row { margin: 2px 0; }
</style>
</head>
<body>
<div class="row"><input id="txt" type="text"></div>
<div class="row"><input id="txtsz" type="text" size="10"></div>
<div class="row"><input id="chk" type="checkbox"><input id="rad" type="radio"></div>
<div class="row"><input id="rng" type="range"></div>
<div class="row"><input id="num" type="number"></div>
<div class="row"><input id="dat" type="date"></div>
<div class="row"><input id="col" type="color"></div>
<div class="row"><input id="fil" type="file"></div>
<div class="row"><button id="btn">Button</button><input id="sub" type="submit" value="Submit"></div>
<div class="row"><select id="sel"><option>One option</option><option>Two</option></select></div>
<div class="row"><select id="selm" multiple><option>A</option><option>B</option><option>C</option></select></div>
<div class="row"><textarea id="ta"></textarea></div>
<div class="row"><progress id="prog" value="30" max="100"></progress></div>
<div class="row"><meter id="met" value="0.6"></meter></div>
<div class="row"><svg id="svg0"></svg></div>
<div class="row"><svg id="svgvb" viewBox="0 0 100 50" width="200"></svg></div>
<div class="row"><iframe id="ifr"></iframe></div>
<div class="row"><img id="imgnosrc" alt="alt text here"></div>
<div class="row"><img id="imgsz" width="120" height="60" alt="x"></div>
<div class="row"><fieldset id="fs"><legend id="lg">Legend</legend>content</fieldset></div>
<div class="row"><hr id="hr"></div>
<div class="row"><video id="vid"></video></div>
<div class="row"><canvas id="cnv"></canvas></div>
<pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
	var ids = ['txt','txtsz','chk','rad','rng','num','dat','col','fil','btn','sub','sel','selm','ta','prog','met','svg0','svgvb','ifr','imgnosrc','imgsz','fs','lg','hr','vid','cnv'];
	var lines = [];
	for (var i = 0; i < ids.length; i++) {
		var r = document.getElementById(ids[i]).getBoundingClientRect();
		lines.push('P ' + ids[i] + ' ' + Math.round(r.width) + ' ' + Math.round(r.height));
	}
	document.getElementById('out').textContent = lines.join('\n');
}, 400); });
</script>
</body>
</html>
