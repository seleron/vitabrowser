<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe review</title>
<style>
body{font-family:sans-serif;font-size:16px;margin:0}
.g{width:400px;font-size:0} .g>div{display:inline-block;width:25%;font-size:16px;height:10px;background:#ccf}
.p{width:400px;letter-spacing:-0.31em} .p>div{display:inline-block;width:25%;letter-spacing:normal;height:10px;background:#fcc}
.bs fieldset{padding:0;margin:0;border:0;min-width:0}
.bs legend{float:left;width:100%;padding:0;margin-bottom:.5rem;font-size:20px;line-height:inherit}
.fr{display:inline-block;letter-spacing:0.1em}
</style></head>
<body>
<div class="g" id="g"><div id="g1"></div> <div></div> <div></div> <div id="g4"></div></div>
<div class="p" id="p"><div id="p1"></div> <div></div> <div></div> <div id="p4"></div></div>
<div id="pre1">before</div>
<div class="bs"><fieldset id="bf"><legend id="bl">Title</legend><div id="bd">x</div></fieldset></div>
<div id="pre2">before</div>
<legend id="lo">Loose legend</legend>
<div><span class="fr" id="fr">abcdefghij</span></div><div><span style="display:inline-block" id="fr0">abcdefghij</span></div>
<pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
 function r(id){return document.getElementById(id).getBoundingClientRect();}
 var L=[];
 L.push('P fontsize0 rowtops '+Math.round(r('g1').top)+' '+Math.round(r('g4').top)+' g4.left '+Math.round(r('g4').left));
 L.push('P lsneg rowtops '+Math.round(r('p1').top)+' '+Math.round(r('p4').top)+' p4.left '+Math.round(r('p4').left));
 L.push('P bslegend top-prev '+Math.round(r('bl').top-r('pre1').bottom)+' fs top-prev '+Math.round(r('bf').top-r('pre1').bottom));
 L.push('P loose legend top-prev '+Math.round(r('lo').top-r('pre2').bottom));
 L.push('P frac ls 0.1em x10 = +'+(Math.round((r('fr').width-r('fr0').width)*10)/10));
 document.getElementById('out').textContent=L.join('\n');
},300);});
</script></body></html>
