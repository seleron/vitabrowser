<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>probe svg size</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
.icon { width: 24px; height: 24px; }
.w32 { width: 32px; }
.h40 { height: 40px; }
.em { width: 1.5em; height: 1.5em; }
</style>
</head>
<body>
<div><svg id="a" width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" fill="red"/></svg></div>
<div><svg id="b" viewBox="0 0 24 24" class="icon"><rect width="24" height="24"/></svg></div>
<div><svg id="c" viewBox="0 0 100 50" width="200"><rect width="100" height="50"/></svg></div>
<div><svg id="d" viewBox="0 0 100 50" class="w32"><rect width="100" height="50"/></svg></div>
<div><svg id="e" viewBox="0 0 100 50" class="h40"><rect width="100" height="50"/></svg></div>
<div><svg id="f" viewBox="0 0 10 10"><rect width="10" height="10"/></svg></div>
<div><svg id="g"><rect width="10" height="10"/></svg></div>
<div><svg id="h" width="50"><rect width="10" height="10"/></svg></div>
<div><svg id="i" viewBox="0 0 24 24" class="em"><path d="M0 0h24v24H0z"/></svg></div>
<div style="width:300px"><svg id="j" viewBox="0 0 16 9" style="width:100%"><rect width="16" height="9"/></svg></div>
<pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
	var ids = 'abcdefghij'.split(''), lines = [];
	for (var i = 0; i < ids.length; i++) {
		var r = document.getElementById(ids[i]).getBoundingClientRect();
		lines.push('P ' + ids[i] + ' ' + Math.round(r.width) + ' ' + Math.round(r.height));
	}
	document.getElementById('out').textContent = lines.join('\n');
}, 300); });
</script>
</body>
</html>
