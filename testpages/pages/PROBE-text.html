<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>probe text</title>
<style>
body { font-family: sans-serif; font-size: 16px; margin: 0; }
.w { width: 200px; }
#prew { white-space: pre-wrap; }
#prel { white-space: pre-line; }
#nowr { white-space: nowrap; }
#brk { white-space: break-spaces; }
#ind { text-indent: 40px; }
#ls { letter-spacing: 4px; display: inline-block; }
#ws { word-spacing: 20px; display: inline-block; }
#tt { text-transform: uppercase; display: inline-block; }
#fl::first-letter { font-size: 48px; float: left; }
#jus { text-align: justify; }
#rtl { direction: rtl; }
#tab { tab-size: 8; }
ol#rom { list-style-type: upper-roman; }
#q { display: inline-block; }
</style>
</head>
<body>
<div class="w" id="prew">a  b   c
d</div>
<div class="w" id="prel">a  b   c
d</div>
<div class="w" id="nowr">no wrap text that is longer than two hundred pixels</div>
<div class="w" id="brk">x          y</div>
<div class="w" id="ind">indented first line text wraps here</div>
<div><span id="ls">spacing</span></div>
<div><span id="ws">word spacing here</span></div>
<div><span id="tt">upper</span></div>
<div class="w" id="fl">First letter paragraph with enough words to wrap twice.</div>
<div class="w" id="rtl"><span id="rtls">rtl</span></div>
<pre id="tab">	tab</pre>
<ol id="rom"><li id="li1">one</li><li>two</li></ol>
<div><q id="q">quoted</q></div>
<div><span id="sup">x<sup>2</sup></span></div>
<pre id="out"></pre>
<script>
window.addEventListener('load', function () { setTimeout(function () {
	var ids = ['prew','prel','nowr','brk','ind','ls','ws','tt','fl','rtls','tab','li1','q','sup'], lines = [];
	for (var i = 0; i < ids.length; i++) {
		var r = document.getElementById(ids[i]).getBoundingClientRect();
		lines.push('P ' + ids[i] + ' ' + Math.round(r.left) + ' ' + Math.round(r.width) + ' ' + Math.round(r.height));
	}
	document.getElementById('out').textContent = lines.join('\n');
}, 300); });
</script>
</body>
</html>
