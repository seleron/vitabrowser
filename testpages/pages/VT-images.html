<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VT images</title>
<style>
body { margin: 10px; font-family: sans-serif; font-size: 14px; }
.cell { display: inline-block; margin: 0 10px 10px 0; vertical-align: top; }
.tiled { width: 300px; height: 64px; background: url(vt-tile.png) repeat; }
.tilex { width: 300px; height: 32px; background: url(vt-tile.png) repeat-x; background-color: #eee; }
.halves { position: relative; width: 240px; height: 80px; border: 1px solid #888; }
.blk { position: absolute; left: 0; top: 0; width: 120px; height: 80px; background: #000; }
.wht { position: absolute; left: 120px; top: 0; width: 120px; height: 80px; background: #fff; }
.over { position: absolute; left: 60px; top: 0; }
</style>
</head>
<body>
<div class="cell">PNG<br><img src="vt-img.png" width="120" height="80"></div>
<div class="cell">JPEG<br><img src="vt-img.jpg" width="120" height="80"></div>
<div class="cell">GIF<br><img src="vt-img.gif" width="120" height="80"></div>
<div class="cell">BMP<br><img src="vt-img.bmp" width="120" height="80"></div>
<div class="cell">PNG scaled x2<br><img src="vt-img.png" width="240" height="160"></div>
<br>
<div class="cell">repeat (16px tile)<div class="tiled"></div></div>
<div class="cell">repeat-x<div class="tilex"></div></div>
<br>
<div class="cell">50% red PNG spanning black|white: expect dark red | pink<div class="halves"><div class="blk"></div><div class="wht"></div><img class="over" src="vt-alpha.png" width="120" height="80"></div></div>
</body>
</html>
