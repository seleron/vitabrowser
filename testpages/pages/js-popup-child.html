<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>popup child</title></head>
<body>
<p>popup window</p>
<script>
window.addEventListener('message', function (e) {
	if (e.data && e.data.ping === 1) {
		window.opener.postMessage({ pong: 2 }, '*');
		setTimeout(function () { window.close(); }, 50);
	}
});
if (window.opener) window.opener.postMessage({ hello: 'from-popup' }, '*');
</script>
</body>
</html>
