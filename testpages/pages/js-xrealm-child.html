<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>xrealm child</title></head>
<body>
<p>child realm</p>
<script>
window.addEventListener('message', function (e) {
	if (e.data && typeof e.data === 'object' && e.data.ping === 7)
		parent.postMessage({ pong: e.data.ping + 1 }, '*');
	else if (typeof e.data === 'string')
		parent.postMessage({ echoed: e.data }, '*');
});
parent.postMessage({ hello: 'from-child' }, '*');
</script>
</body>
</html>
