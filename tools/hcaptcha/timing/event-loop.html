<!doctype html><html><head><title>loop</title></head><body><p id=o>wait</p><script>
var R = {}, t0 = performance.now(), raf = [], n = 0;
function done() { var s = JSON.stringify(R); document.getElementById('o').textContent = s; document.title = 'LOOP ' + s; console.log('LOOPRES ' + s); }
(function f(ts) { raf.push(ts); if (++n < 30) requestAnimationFrame(f); else { var d = []; for (var i = 1; i < raf.length; i++) d.push(Math.round((raf[i] - raf[i - 1]) * 10) / 10); d.sort(function (a, b) { return a - b; }); R.raf = { median: d[d.length >> 1], min: d[0], max: d[d.length - 1], firstTsVsNow: Math.round((performance.now() - raf[raf.length - 1]) * 10) / 10 }; next(); } })(t0);
function next() { var tm = [], k = 0; (function g() { var a = performance.now(); setTimeout(function () { tm.push(Math.round((performance.now() - a) * 10) / 10); if (++k < 10) g(); else { R.timeout0 = tm; next2(); } }, 0); })(); }
function next2() { var a = performance.now(); setTimeout(function () { R.timeout50 = Math.round((performance.now() - a) * 10) / 10; var b = performance.now(); Promise.resolve().then(function () { R.microtask = Math.round((performance.now() - b) * 100) / 100; var c = performance.now(); var mc = new MessageChannel(); mc.port1.onmessage = function () { R.message = Math.round((performance.now() - c) * 10) / 10; done(); }; mc.port2.postMessage(0); }); }, 50); }
</script></body></html>
